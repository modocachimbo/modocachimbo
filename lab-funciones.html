<script>
var f=MCfmt, son=MCLabComun('funcion');
var C={raiz:'#FF5C8A',vert:'#FFC800',cy:'#3AB4F0'};
/* Cada tipo: parámetros [nombre, mín, máx, paso, inicial], la función y lo que se calcula */
var T={
 lineal:{n:'Lineal',p:[['a',-5,5,.5,1],['b',-8,8,.5,2]],
  f:function(x,v){ return v.a*x+v.b; },
  form:function(v){ return 'f(x) = '+mono(v.a,'x',true)+cte(v.b); },
  datos:function(v){ var d=[];
    d.push(['Pendiente',f(v.a),null]); d.push(['Corte con y','(0; '+f(v.b)+')',C.cy]);
    d.push(['Raíz',v.a?'x = '+f(-v.b/v.a):(v.b?'No tiene':'Todos los x'),C.raiz]);
    d.push(['Ángulo con el eje x',f(Math.atan(v.a)*180/Math.PI)+'°',null]);
    d.push(['Dominio','ℝ',null]); d.push(['Rango',v.a?'ℝ':'{'+f(v.b)+'}',null]);
    d.push(['Comportamiento',v.a>0?'Crece':v.a<0?'Decrece':'Constante',null,1]); return d; },
  pts:function(v){ var p=[[0,v.b,C.cy]]; if(v.a) p.push([-v.b/v.a,0,C.raiz]); return p; },
  clave:['La pendiente es a = tg θ: si a > 0 la recta sube, si a < 0 baja.','Dos rectas son paralelas si tienen la misma pendiente, y perpendiculares si a₁·a₂ = −1.']},
 cuadratica:{n:'Cuadrática',p:[['a',-3,3,.25,1],['b',-6,6,.5,-2],['c',-8,8,.5,-3]],
  f:function(x,v){ return v.a*x*x+v.b*x+v.c; },
  form:function(v){ return 'f(x) = '+mono(v.a,'x²',true)+mono(v.b,'x')+cte(v.c); },
  datos:function(v){ if(!v.a) return [['Ojo','Con a = 0 ya no es cuadrática: es una recta.',null,1]];
    var h=-v.b/(2*v.a), k=v.a*h*h+v.b*h+v.c, D=v.b*v.b-4*v.a*v.c, d=[];
    d.push(['Vértice','('+f(h)+'; '+f(k)+')',C.vert]); d.push(['Discriminante Δ',f(D),null]);
    d.push(['Raíces',D>0?'x = '+f((-v.b-Math.sqrt(D))/(2*v.a))+' y '+f((-v.b+Math.sqrt(D))/(2*v.a)):D===0?'Una doble: x = '+f(h):'No corta al eje x',C.raiz]);
    d.push(['Corte con y','(0; '+f(v.c)+')',C.cy]); d.push(['Eje de simetría','x = '+f(h),null]);
    d.push(['Rango',v.a>0?'['+f(k)+'; +∞⟩':'⟨−∞; '+f(k)+']',null]);
    d.push(['Abre hacia',v.a>0?'Arriba: tiene mínimo '+f(k):'Abajo: tiene máximo '+f(k),null,1]); return d; },
  pts:function(v){ if(!v.a) return []; var h=-v.b/(2*v.a), k=v.a*h*h+v.b*h+v.c, D=v.b*v.b-4*v.a*v.c, p=[[h,k,C.vert,'V'],[0,v.c,C.cy]];
    if(D>0){ p.push([(-v.b-Math.sqrt(D))/(2*v.a),0,C.raiz]); p.push([(-v.b+Math.sqrt(D))/(2*v.a),0,C.raiz]); } else if(D===0) p.push([h,0,C.raiz]); return p; },
  guias:function(v,P){ if(!v.a) return ''; var h=-v.b/(2*v.a); return '<line class="guia" x1="'+P.X(h)+'" y1="0" x2="'+P.X(h)+'" y2="'+P.h+'"/>'; },
  clave:['Vértice: h = −b/2a y k = f(h). Si a > 0 la parábola abre hacia arriba y k es el valor mínimo.','Δ = b² − 4ac: Δ > 0 dos raíces reales, Δ = 0 una raíz doble, Δ < 0 no corta al eje x.','Suma de raíces = −b/a y producto = c/a.']},
 absoluto:{n:'Valor absoluto',p:[['a',-3,3,.5,1],['h',-6,6,.5,1],['k',-6,6,.5,-2]],
  f:function(x,v){ return v.a*Math.abs(x-v.h)+v.k; },
  form:function(v){ return 'f(x) = '+coef(v.a)+'|x '+(v.h<0?'+ '+f(-v.h):'− '+f(v.h))+'|'+cte(v.k); },
  datos:function(v){ var d=[], q=v.a?-v.k/v.a:null;
    d.push(['Vértice','('+f(v.h)+'; '+f(v.k)+')',C.vert]); d.push(['Corte con y','(0; '+f(this.f(0,v))+')',C.cy]);
    d.push(['Raíces',!v.a?(v.k?'No tiene':'Todos los x'):q>0?'x = '+f(v.h-q)+' y '+f(v.h+q):q===0?'x = '+f(v.h):'No corta al eje x',C.raiz]);
    d.push(['Rango',v.a>0?'['+f(v.k)+'; +∞⟩':v.a<0?'⟨−∞; '+f(v.k)+']':'{'+f(v.k)+'}',null]);
    d.push(['Dominio','ℝ',null]); d.push(['Forma',v.a>0?'V hacia arriba':v.a<0?'V hacia abajo':'Recta horizontal',null]); return d; },
  pts:function(v){ var p=[[v.h,v.k,C.vert,'V'],[0,this.f(0,v),C.cy]], q=v.a?-v.k/v.a:-1; if(q>0){ p.push([v.h-q,0,C.raiz]); p.push([v.h+q,0,C.raiz]); } else if(q===0) p.push([v.h,0,C.raiz]); return p; },
  clave:['f(x) = a|x − h| + k tiene vértice en (h; k). La gráfica es una V con pendientes a y −a.','|x| = x si x ≥ 0 y |x| = −x si x < 0. El valor absoluto nunca es negativo.']},
 raiz:{n:'Raíz cuadrada',p:[['a',-3,3,.5,1],['h',-6,6,.5,-2],['k',-6,6,.5,-1]],
  f:function(x,v){ return x<v.h?NaN:v.a*Math.sqrt(x-v.h)+v.k; },
  form:function(v){ return 'f(x) = '+coef(v.a)+'√(x '+(v.h<0?'+ '+f(-v.h):'− '+f(v.h))+')'+cte(v.k); },
  datos:function(v){ var d=[], q=v.a?-v.k/v.a:null, y0=this.f(0,v);
    d.push(['Punto inicial','('+f(v.h)+'; '+f(v.k)+')',C.vert]); d.push(['Dominio','['+f(v.h)+'; +∞⟩',null]);
    d.push(['Rango',v.a>0?'['+f(v.k)+'; +∞⟩':v.a<0?'⟨−∞; '+f(v.k)+']':'{'+f(v.k)+'}',null]);
    d.push(['Raíz',q!==null&&q>=0?'x = '+f(v.h+q*q):'No corta al eje x',C.raiz]);
    d.push(['Corte con y',isNaN(y0)?'No corta (0 no está en el dominio)':'(0; '+f(y0)+')',C.cy,1]); return d; },
  pts:function(v){ var p=[[v.h,v.k,C.vert]], q=v.a?-v.k/v.a:-1, y0=this.f(0,v); if(q>=0) p.push([v.h+q*q,0,C.raiz]); if(!isNaN(y0)) p.push([0,y0,C.cy]); return p; },
  clave:['Lo de adentro de la raíz no puede ser negativo: x − h ≥ 0, así que el dominio es [h; +∞⟩.','La gráfica empieza en (h; k) y solo va hacia la derecha.']},
 exponencial:{n:'Exponencial',p:[['a',-3,3,.5,1],['b',.25,4,.25,2],['k',-6,6,.5,0]],
  f:function(x,v){ return v.a*Math.pow(v.b,x)+v.k; },
  form:function(v){ return 'f(x) = '+coef(v.a)+'('+f(v.b)+')ˣ'+cte(v.k); },
  datos:function(v){ var d=[], q=v.a?-v.k/v.a:-1;
    d.push(['Asíntota','y = '+f(v.k),null]); d.push(['Corte con y','(0; '+f(v.a+v.k)+')',C.cy]);
    d.push(['Raíz',q>0&&v.b!==1?'x = '+f(Math.log(q)/Math.log(v.b)):'No corta al eje x',C.raiz]);
    d.push(['Rango',v.a>0?'⟨'+f(v.k)+'; +∞⟩':v.a<0?'⟨−∞; '+f(v.k)+'⟩':'{'+f(v.k)+'}',null]);
    d.push(['Base',v.b>1?'b > 1: crece':v.b<1?'0 < b < 1: decrece':'b = 1: es constante',null,1]); return d; },
  pts:function(v){ var p=[[0,v.a+v.k,C.cy]], q=v.a?-v.k/v.a:-1; if(q>0&&v.b!==1) p.push([Math.log(q)/Math.log(v.b),0,C.raiz]); return p; },
  guias:function(v,P){ return '<line class="guia" x1="0" y1="'+P.Y(v.k)+'" x2="'+P.w+'" y2="'+P.Y(v.k)+'"/>'; },
  clave:['En f(x) = bˣ la base cumple b > 0 y b ≠ 1. Siempre pasa por (0; 1).','Si b > 1 crece y si 0 < b < 1 decrece. Nunca toca su asíntota horizontal.']}
};
function coef(a){ return a===1?'':a===-1?'−':f(a); }
function mono(a,t,primero){ if(!a) return primero?'':''; var s=Math.abs(a)===1?t:f(Math.abs(a))+t; return primero?(a<0?'−'+s:s):(a<0?' − ':' + ')+s; }
function cte(c){ return c?(c<0?' − ':' + ')+f(Math.abs(c)):''; }

var tipo='cuadratica', V={};
function iniciales(){ V={}; T[tipo].p.forEach(function(p){ V[p[0]]=p[4]; }); }
function pintarTipos(){
  document.getElementById('tipos').innerHTML=Object.keys(T).map(function(k){ return '<button data-t="'+k+'" class="'+(k===tipo?'on':'')+'">'+T[k].n+'</button>'; }).join('');
  document.querySelectorAll('#tipos button').forEach(function(b){ b.onclick=function(){ tipo=b.dataset.t; iniciales(); son('tic'); pintarTipos(); pintarDesl(); P.centrar(); actualizar(); }; });
}
function pintarDesl(){
  document.getElementById('desl').innerHTML=T[tipo].p.map(function(p){ return '<label class="desl"><b>'+p[0]+'</b><input type="range" min="'+p[1]+'" max="'+p[2]+'" step="'+p[3]+'" value="'+V[p[0]]+'" data-k="'+p[0]+'"><output>'+f(V[p[0]])+'</output></label>'; }).join('');
  document.querySelectorAll('#desl input').forEach(function(i){ var ult=null;
    function pos(){ i.style.setProperty('--p',((i.value-i.min)/(i.max-i.min)*100)+'%'); }
    pos(); i.oninput=function(){ V[i.dataset.k]=parseFloat(i.value); i.nextElementSibling.textContent=f(V[i.dataset.k]); pos(); if(ult!==i.value){ ult=i.value; son('tic'); } actualizar(); }; });
}
function actualizar(){
  var t=T[tipo];
  document.getElementById('formula').textContent=OCULTA?'¿Cómo es su gráfica?':(META?'Tu curva: ':'')+t.form(V).replace(/= $/,'= 0');
  document.getElementById('datos').innerHTML=t.datos(V).map(function(d){ return '<div class="dato'+(d[3]?' ancho':'')+'"><small>'+(d[2]?'<i style="background:'+d[2]+'"></i>':'')+d[0]+'</small><b>'+d[1]+'</b></div>'; }).join('');
  document.getElementById('clave').innerHTML='<b><svg><use href="#i-rayo"/></svg>Cae en el examen</b>'+t.clave.map(function(c){ return '<p>'+c+'</p>'; }).join('');
  P.redibujar();
}
var P=MCPlano(document.getElementById('plano'),{r:8,alDibujar:function(P){
  if(!T[tipo]||OCULTA) return '';
  var t=T[tipo], s=t.guias?t.guias(V,P):'', lim=P.h*4;
  function trazo(VV){ var d='', pen=false; for(var px=0;px<=P.w;px+=1.5){ var x=P.ix(px), y=t.f(x,VV), py=P.Y(y);
    if(!isFinite(py)||py<-lim||py>lim){ pen=false; continue; }
    d+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1); pen=true; } return d; }
  /* Modo Reto: la curva meta punteada */
  if(META){ var dm=trazo(META.v); s+='<path d="'+dm+'" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="9 8" opacity=".8"/>'; }
  s+='<path class="curva" d="'+trazo(V)+'"/>';
  /* puntos y sus coordenadas: cada etiqueta busca un lado libre para no taparse con otra */
  var cajas=[], hechos=[];
  (t.pts(V)||[]).forEach(function(p){ if(!isFinite(p[0])||!isFinite(p[1])) return;
    if(hechos.some(function(h){ return Math.abs(h[0]-p[0])<1e-9&&Math.abs(h[1]-p[1])<1e-9; })) return; hechos.push(p);
    var X=P.X(p[0]), Y=P.Y(p[1]); s+='<circle class="pt" cx="'+X+'" cy="'+Y+'" r="6.5" fill="'+p[2]+'"/>'; });
  hechos.forEach(function(p){ var X=P.X(p[0]), Y=P.Y(p[1]), tx='('+f(p[0])+'; '+f(p[1])+')', w=tx.length*7.4+4, h=16;
    var op=[[10,-10,'start'],[10,22,'start'],[-10,-10,'end'],[-10,22,'end']], el=null;
    op.some(function(o){ var x0=o[2]==='start'?X+o[0]:X+o[0]-w, y0=Y+o[1]-13, b=[x0,y0,x0+w,y0+h];
      var choca=cajas.some(function(c){ return b[0]<c[2]&&b[2]>c[0]&&b[1]<c[3]&&b[3]>c[1]; })||hechos.some(function(q){ var qx=P.X(q[0]), qy=P.Y(q[1]); return qx>b[0]-7&&qx<b[2]+7&&qy>b[1]-7&&qy<b[3]+7; });
      if(!choca){ el=[o,b]; return true; } return false; });
    if(!el) return; cajas.push(el[1]);
    s+='<text class="ptx" x="'+(X+el[0][0])+'" y="'+(Y+el[0][1])+'" text-anchor="'+el[0][2]+'" fill="'+p[2]+'">'+tx+'</text>'; });
  return s; }});
document.getElementById('zMas').onclick=function(){ P.zoom(1.4); son('tic'); };
document.getElementById('zMenos').onclick=function(){ P.zoom(1/1.4); son('tic'); };
document.getElementById('zCen').onclick=function(){ P.centrar(); son('tic'); };
document.getElementById('reset').onclick=function(){ iniciales(); pintarDesl(); P.centrar(); actualizar(); son('cerrar'); };
var q=new URLSearchParams(location.search).get('t'); if(T[q]) tipo=q;
iniciales(); pintarTipos(); pintarDesl(); actualizar();
/* ============ MODO RETO (assets/lab-reto.js) ============ */
var META=null, OCULTA=false, AZ=MCAzar, cD=document.getElementById('cDesl'), cDsitio=cD.nextElementSibling;
function devolver(){ if(cD.parentNode!==cDsitio.parentNode) cDsitio.parentNode.insertBefore(cD,cDsitio); }
function ponerTipo(k,vals){ tipo=k; iniciales(); if(vals) Object.keys(vals).forEach(function(n){ V[n]=vals[n]; }); pintarTipos(); pintarDesl(); P.centrar(); actualizar(); }
function valorAzar(p){ var op=[]; for(var x=p[1];x<=p[2]+1e-9;x+=p[3]){ var r=Math.round(x*100)/100; if(Math.abs(r)<=4&&r!==0&&(p[3]>=.5||Math.round(r*2)===r*2)) op.push(r); } return AZ(op); }
var RT=MCReto({sim:'funcion',nombre:'Reto · Funciones',
  alEntrar:function(){},
  alSalir:function(){ META=null; OCULTA=false; devolver(); ponerTipo(tipo); },
  nueva:function(i,caja,R){
    META=null; OCULTA=false; devolver();
    if(i%2===0){ /* tapar la curva punteada */
      var k=AZ(['lineal','cuadratica','absoluto','raiz','exponencial','cuadratica']), mv={}, ini={};
      T[k].p.forEach(function(p){ ini[p[0]]=p[4]; });
      do { T[k].p.forEach(function(p){ mv[p[0]]=valorAzar(p); }); } while(T[k].p.every(function(p){ return mv[p[0]]===ini[p[0]]; }));
      META={tipo:k,v:mv}; ponerTipo(k);
      R.texto(caja,T[k].n,'Mueve '+T[k].p.map(function(p){ return '<em>'+p[0]+'</em>'; }).join(', ').replace(/, ([^,]*)$/,' y $1')+' hasta que tu curva tape la línea punteada.');
      caja.appendChild(cD);
      return { comprobar:function(){ var ok=T[k].p.every(function(p){ return Math.abs(V[p[0]]-mv[p[0]])<1e-9; });
          return { ok:ok, msg:(ok?'':'La meta era ')+T[k].form(mv) }; },
        mostrar:function(){ ponerTipo(k,mv); caja.appendChild(cD); } };
    }
    /* preguntas de opciones: la gráfica aparece al responder */
    var q=AZ(['vertice','raices','dominio','asintota']), r, vals, kk;
    if(q==='vertice'){ var a=AZ([1,-1,2]), h=AZ([-3,-2,-1,1,2,3]), kv=AZ([-4,-3,-1,1,2,4]); kk='cuadratica'; vals={a:a,b:-2*a*h,c:a*h*h+kv};
      r=R.opciones(caja,'¿Cuál es el vértice de <em>'+T.cuadratica.form(vals)+'</em>?',['('+f(h)+'; '+f(kv)+')','('+f(-h)+'; '+f(kv)+')','('+f(kv)+'; '+f(h)+')','('+f(h)+'; '+f(-kv)+')'],0,'h = −b/2a = '+f(h)+' y k = f('+f(h)+') = '+f(kv)+'.'); }
    else if(q==='raices'){ var r1=AZ([-4,-3,-2,-1]), r2=AZ([1,2,3,5]); kk='cuadratica'; vals={a:1,b:-(r1+r2),c:r1*r2};
      r=R.opciones(caja,'¿Dónde corta al eje x <em>'+T.cuadratica.form(vals)+'</em>?',['x = '+f(r1)+' y '+f(r2),'x = '+f(-r1)+' y '+f(-r2),'x = '+f(r1)+' y '+f(-r2),'No corta al eje x'],0,'Se factoriza: (x '+(r1<0?'+ '+f(-r1):'− '+f(r1))+')(x '+(r2<0?'+ '+f(-r2):'− '+f(r2))+') = 0.'); }
    else if(q==='dominio'){ var hh=AZ([-3,-2,2,3,4]), k2=AZ([-2,1,3]); kk='raiz'; vals={a:1,h:hh,k:k2};
      r=R.opciones(caja,'¿Cuál es el dominio de <em>'+T.raiz.form(vals)+'</em>?',['['+f(hh)+'; +∞⟩','⟨−∞; '+f(hh)+']','['+f(-hh)+'; +∞⟩','['+f(k2)+'; +∞⟩'],0,'Lo de adentro de la raíz no puede ser negativo: x '+(hh<0?'+ '+f(-hh):'− '+f(hh))+' ≥ 0.'); }
    else { var ka=AZ([-3,-2,-1,1,2,3]), bb=AZ([2,3,.5]); kk='exponencial'; vals={a:1,b:bb,k:ka};
      r=R.opciones(caja,'¿Cuál es la asíntota de <em>'+T.exponencial.form(vals)+'</em>?',['y = '+f(ka),'y = 0','x = '+f(ka),'y = '+f(-ka)],0,'bˣ nunca llega a 0, así que la curva se acerca a y = '+f(ka)+' sin tocarla.'); }
    OCULTA=true; ponerTipo(kk,vals);
    var c0=r.comprobar; r.comprobar=function(){ OCULTA=false; actualizar(); return c0(); }; return r;
  }});

</script>
