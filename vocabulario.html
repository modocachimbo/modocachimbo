<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Modo Cachimbo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="assets/app.js" defer></script>
<title>Vocabulario · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,600;1,700;1,800;1,900;1,1000&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
    --red: #E03C3C; --orange: #FF9F43;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px 16px 48px; }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  .backlink { display: flex; align-items: center; margin-bottom: 18px; }
  .backlink a.back { display: inline-flex; align-items: center; gap: 6px; color: #888; text-decoration: none; font-size: 13px; font-weight: 500; }
  .backlink a.back:hover { color: var(--accent); }
  .backlink svg { width: 14px; height: 14px; }
  .home-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); color: #888; text-decoration: none; margin-left: 10px; }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }

  .eyebrow { font-size: 11.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 6vw, 30px); margin-top: 6px; line-height: 1.2; text-wrap: balance; }
  .lead { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin-top: 8px; }

  .paso { margin-top: 26px; }
  .paso-ttl { font-size: 12px; font-weight: 700; color: #cfcfcf; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .paso-ttl .n { width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font: 800 11px Sora, sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid #2e2e2e; border-bottom-width: 4px; background: #161616; color: #e6e6e6; border-radius: 14px; padding: 9px 16px; font: 800 14px Nunito, 'Inter', sans-serif; cursor: pointer; transition: transform .08s ease; }
  .chip:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  .chip small { color: var(--text-faint); font-weight: 500; margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: #8fa300; color: #2b3300; }
  .chip.on small { color: rgba(14,14,14,.6); }
  .chip:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--text-faint); font-size: 12.5px; }

  .temas { display: flex; flex-direction: column; gap: 6px; }
  .tema { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; cursor: pointer; font-size: 13.5px; }
  .tema input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .tema .nm { flex: 1; min-width: 0; }
  .tema .ct { color: var(--text-faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tema.todo { border-color: rgba(198,224,0,.3); font-weight: 600; }

  /* Botones gruesos estilo Duolingo: se hunden al tocarlos */
  .btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px 16px; border-radius: 16px;
    border: 2px solid #2e2e2e; background: #1a1a1a; color: #e6e6e6; box-shadow: 0 5px 0 #2e2e2e;
    font: 900 15px Nunito, 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .7px; cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease; -webkit-tap-highlight-color: transparent; }
  .btn .ico { width: 19px; height: 19px; }
  .btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .btn.primary { background: var(--accent); color: #2b3300; border-color: var(--accent); box-shadow: 0 5px 0 #8fa300; }
  .btn:disabled { opacity: .35; cursor: default; transform: none; }
  .resumen { text-align: center; color: var(--text-dim); font-size: 12.5px; margin: 22px 0 10px; font-variant-numeric: tabular-nums; }

  /* Candado */
  .lock { margin-top: 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .lock h2 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .lock h2 .accent { color: var(--accent); }
  .lock p { color: #999; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
  .lock input { width: 100%; background: #141414; border: 2px solid #2e2e2e; border-radius: 14px; font-family: Nunito, 'Inter', sans-serif; font-size: 16px !important; font-weight: 800 !important; padding: 13px 14px; color: #f2f2f2; font-size: 14px; text-align: center; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px; }
  .lock input:focus { outline: none; border-color: var(--accent); }
  .lock-error { display: none; margin-top: 14px; font-size: 12.5px; color: #ff8a8a; background: rgba(224,60,60,0.08); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .lock-error.show { display: block; }
  .lock-whatsapp { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(37,211,102,0.1); color: #25D366; text-decoration: none; font-size: 13px; font-weight: 700; }
  .lock-whatsapp.show { display: flex; }

  /* Juego */
  .barra { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .track { flex: 1; height: 8px; background: #161616; border-radius: 100px; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; border-radius: 100px; transition: width .5s cubic-bezier(.34,1.56,.64,1);
    background: linear-gradient(90deg, #9fbf00, var(--accent) 60%, #e9ff6a); box-shadow: 0 0 14px rgba(198,224,0,.55); position: relative; overflow: hidden; }
  .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: brillo 2.4s ease-in-out infinite; }
  @keyframes brillo { 60%, 100% { transform: translateX(100%); } }
  .cuenta { font: 800 13px Sora, sans-serif; color: #e6e6e6; font-variant-numeric: tabular-nums; }
  .sonido { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid #2a2a2a; border-bottom-width: 4px; background: #161616; color: #e6e6e6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .sonido:active { transform: translateY(2px); border-bottom-width: 2px; }
  .sonido .ico { width: 18px; height: 18px; }
  .sonido.mudo { color: #6b6b6b; }
  .marcador { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font: 700 12px Sora, sans-serif; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 100px; }
  .pill.ok { color: var(--accent); background: rgba(198,224,0,.09); }
  .pill.rep { color: var(--orange); background: rgba(255,159,67,.09); }
  .pill.salta { animation: salta .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes salta { 40% { transform: scale(1.22); } }

  .escena { position: relative; perspective: 1200px; margin-top: 20px; padding-bottom: 34px; }
  /* Mazo: las tarjetas que faltan, asomando detrás */
  .mazo { position: absolute; left: 0; right: 0; top: 0; bottom: 34px; border-radius: 28px; background: linear-gradient(160deg, #1c1d17, #111); border: 1px solid #2c2d25; transition: transform .45s ease, opacity .45s ease; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .mazo.m1 { transform: translateY(12px) scale(.95) rotate(-1.5deg); opacity: .95; }
  .mazo.m2 { transform: translateY(24px) scale(.9) rotate(2deg); opacity: .6; }
  /* Sombra en el piso: se encoge cuando la tarjeta se levanta al girar */
  .piso { position: absolute; left: 10%; right: 10%; bottom: 14px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(198,224,0,.28), transparent); filter: blur(6px); z-index: 1; transition: transform .35s ease, opacity .35s ease; }
  .escena.alzada .piso { transform: scale(.65); opacity: .45; }
  .arrastre { position: relative; z-index: 2; touch-action: pan-y; will-change: transform; }
  .arrastre.entrar { animation: repartir .55s cubic-bezier(.22,1.3,.36,1); }
  @keyframes repartir { from { transform: translate(0, 30px) rotate(-3deg) scale(.9); opacity: 0; } 60% { opacity: 1; } }
  .flota { animation: flota 4s ease-in-out infinite; transform-style: preserve-3d; }
  @keyframes flota { 0%, 100% { transform: translateY(0) rotateX(0); } 50% { transform: translateY(-5px) rotateX(1.5deg); } }
  .escena.alzada .flota { animation-play-state: paused; }
  .carta { position: relative; min-height: 380px; cursor: pointer; transform-style: preserve-3d; -webkit-tap-highlight-color: transparent; transition: min-height .3s ease; }
  /* Giro: sube, voltea con un poco de rebote y vuelve a apoyarse */
  .carta.ida { animation: ida .8s cubic-bezier(.45,.05,.25,1) forwards; }
  .carta.vuelta { transform: rotateY(180deg); }
  .carta.regreso { animation: regreso .8s cubic-bezier(.45,.05,.25,1) forwards; }
  @keyframes ida { 0% { transform: rotateY(0) translateZ(0); } 45% { transform: rotateY(100deg) translateZ(70px) scale(1.04); } 75% { transform: rotateY(192deg) translateZ(20px); } 100% { transform: rotateY(180deg) translateZ(0); } }
  @keyframes regreso { 0% { transform: rotateY(180deg); } 45% { transform: rotateY(80deg) translateZ(70px) scale(1.04); } 75% { transform: rotateY(-12deg) translateZ(20px); } 100% { transform: rotateY(0); } }
  .cara { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; padding: 24px 24px 60px; display: flex; flex-direction: column; overflow: hidden; }
  .cara .cuerpo { flex: 1; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
  /* Preguntas largas: se deslizan dentro de la tarjeta, sin barra visible; un degradado abajo avisa que hay más */
  .cara .cuerpo { scrollbar-width: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .cara .cuerpo::-webkit-scrollbar { display: none; }
  .cara .cuerpo.mas { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 56px), transparent); }
  .cara .cuerpo.arriba { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32px); mask-image: linear-gradient(to bottom, transparent, #000 32px); }
  .cara .cuerpo.arriba.mas { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32px, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 32px, #000 calc(100% - 56px), transparent); }
  /* Reflejo de luz que cruza la tarjeta durante el giro */
  .cara::after { content: ''; position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%); transform: translateX(-120%); pointer-events: none; }
  .carta.ida .reverso::after, .carta.regreso .frente::after { animation: reflejo .8s ease .25s; }
  @keyframes reflejo { to { transform: translateX(120%); } }

  /* Estilo Duolingo: letra gruesa y redonda, tarjetas con borde inferior grueso */
  .carta, .acciones .btn, .pill, .cuenta, .combo, .fin, .fin h2, .fin .btn, .anillo .pct { font-family: 'Nunito', 'Inter', sans-serif; }
  .fin h2, .anillo .pct { font-weight: 900; }
  .frente { background: #ffffff; color: #3c3c3c; border: 2px solid #e5e5e5; border-bottom-width: 7px; }
  .frente .marca { position: absolute; right: 14px; top: 6px; font: 900 150px/1 Nunito, sans-serif; color: rgba(0,0,0,.04); pointer-events: none; }
  .reverso { transform: rotateY(180deg); color: #2b3300; padding-bottom: 28px;
    background: radial-gradient(90% 60% at 50% 40%, #e6ff5c, transparent 70%), #c6e000; border: 2px solid #b3cc00; border-bottom: 7px solid #8fa300; }
  .reverso::after { background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.6) 50%, transparent 62%); }

  .cara .tag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; font-weight: 800; position: relative; }
  .cara .tag .num { font: 900 12px Nunito, sans-serif; letter-spacing: 1px; border-radius: 12px; padding: 5px 11px; }
  .frente .tag { color: #afafaf; }
  .frente .tag .num { background: #f2fbd0; color: #6b7d00; border: 2px solid #dbef7a; }
  .cara .tag .prof { color: #8e4ff0; background: #f3ecff; border: 2px solid #ddccff; border-radius: 12px; padding: 3px 9px; }
  .reverso .tag { color: rgba(43,51,0,.6); }
  .reverso .tag .num { background: #2b3300; color: #e6ff5c; }
  .cara .txt { font-size: 19px; line-height: 1.55; margin: auto 0; position: relative; font-weight: 800; }
  .frente .txt { color: #3c3c3c; }
  .cara .katex { font-size: 1.08em; }
  .reverso .resp .katex { font-size: 1.3em; }
  .frente .q-graphic, .frente .mcq-img { background: transparent; border: 0; padding: 4px 0; }
  .frente .mcq-lec { background: #f7f7f7; border-left-color: #c6e000; }
  .frente .mcq-lec summary { color: #4b4b4b; }
  .frente .mcq-tabla table { font-weight: 800; }
  .frente .mcq-tabla th { color: #3c3c3c; background: #f2fbd0; }
  .frente .mcq-tabla th, .frente .mcq-tabla td { border: 2px solid #e5e5e5; }

  /* La respuesta aparece palabra por palabra */
  .reverso .txt.resp { font: 900 clamp(24px, 7vw, 32px)/1.3 Nunito, sans-serif; color: #2b3300; text-align: center; }
  .resp .w { display: inline-block; opacity: 0; transform: translateY(14px) scale(.9); }
  .carta.vuelta .resp .w, .carta.ida .resp .w { animation: palabra .5s cubic-bezier(.22,1.3,.36,1) forwards; animation-delay: calc(.42s + var(--i) * 60ms); }
  @keyframes palabra { to { opacity: 1; transform: none; } }
  .chek { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; background: #fff; color: #7a8f00; display: flex; align-items: center; justify-content: center; position: relative; transform: scale(0); box-shadow: 0 5px 0 #8fa300; }
  .chek svg { width: 30px; height: 30px; }
  .chek::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }
  .carta.vuelta .chek, .carta.ida .chek { animation: pop .55s cubic-bezier(.22,1.6,.36,1) .35s forwards; }
  .carta.vuelta .chek::before, .carta.ida .chek::before { animation: onda .9s ease-out .5s; }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes onda { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.9); } }

  .cara .pie { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .3px; }
  .frente .pie { color: #afafaf; text-transform: uppercase; }
  .frente .pie .dedo { display: inline-block; font-size: 18px; animation: toque 1.6s ease-in-out infinite; }
  @keyframes toque { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-5px) scale(1.05); } 55% { transform: translateY(1px) scale(.92); } }
  .ops { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .op { display: flex; gap: 10px; align-items: center; font-size: 16px; font-weight: 800; padding: 10px 12px; border-radius: 14px; border: 2px solid; border-bottom-width: 4px; }
  .op b { font: 900 13px Nunito, sans-serif; min-width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid; }
  .frente .op { background: #fff; color: #4b4b4b; border-color: #e5e5e5; }
  .frente .op b { color: #afafaf; border-color: #e5e5e5; }
  .reverso .op { background: rgba(255,255,255,.35); color: rgba(43,51,0,.55); border-color: rgba(0,0,0,.06); }
  .reverso .op b { color: rgba(43,51,0,.5); border-color: rgba(0,0,0,.1); }
  .reverso .op.si { background: #fff; color: #2b3300; border-color: #fff; border-bottom-color: #8fa300; }
  .reverso .op.si b { background: #c6e000; color: #2b3300; border-color: #8fa300; }
  .q-graphic { margin: 10px 0; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 10px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }

  .sello { position: absolute; top: 26px; z-index: 3; font: 800 17px Sora, sans-serif; letter-spacing: 1.5px; padding: 8px 14px; border-radius: 12px; border: 3px solid; opacity: 0; pointer-events: none; }
  .sello.si { left: 20px; color: var(--accent); border-color: var(--accent); background: rgba(10,12,4,.85); transform: rotate(-12deg); }
  .sello.no { right: 20px; color: var(--orange); border-color: var(--orange); background: rgba(14,9,4,.85); transform: rotate(12deg); }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .acciones .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: 16px; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; border: 0; transition: transform .08s ease, box-shadow .08s ease; }
  .btn.rep { color: #fff; background: #ff9600; box-shadow: 0 5px 0 #cc7800; }
  #btnSe { color: #2b3300; background: var(--accent); box-shadow: 0 5px 0 #8fa300; }
  .acciones .btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .acciones.aparece { animation: aparece .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); } }
  .voltear-hint { text-align: center; color: #6a6a6a; font-size: 12px; margin-top: 6px; min-height: 18px; }
  .voltear-hint b { color: #9a9a9a; }

  .combo { position: fixed; left: 50%; top: 22%; z-index: 50; transform: translate(-50%, 0); pointer-events: none;
    font: 800 22px Sora, sans-serif; color: #0e0e0e; background: var(--accent); padding: 10px 20px; border-radius: 100px; box-shadow: 0 14px 40px rgba(198,224,0,.45);
    animation: combo 1.2s cubic-bezier(.34,1.56,.64,1) forwards; white-space: nowrap; }
  @keyframes combo { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 75% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(.95); } }

  .fin { text-align: center; margin-top: 26px; background: radial-gradient(120% 60% at 50% 0%, rgba(198,224,0,.12), transparent 60%), var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 30px 22px; position: relative; overflow: hidden; }
  .ico { width: 1.1em; height: 1.1em; flex-shrink: 0; vertical-align: -.18em; }
  .acciones .btn .ico { width: 20px; height: 20px; }
  .cara .pie .dedo .ico { width: 22px; height: 22px; color: #c6e000; }
  .combo { display: inline-flex; align-items: center; gap: 8px; }
  .combo .ico { width: 24px; height: 24px; color: #ff6b00; }
  .fin .medalla { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: var(--accent); color: #2b3300; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #8fa300; animation: entrar .6s cubic-bezier(.34,1.56,.64,1); }
  .fin .medalla .ico { width: 38px; height: 38px; }
  /* Diana con flecha que se clava (pantalla final de 50% a 79%) */
  .fin .medalla.tiro { background: none; box-shadow: none; width: 104px; height: 104px; margin-top: -8px; animation: entrar .5s cubic-bezier(.34,1.56,.64,1); }
  .tiro svg { width: 104px; height: 104px; overflow: visible; }
  .tiro .vuelo { transform: translate(60px, -60px); opacity: 0; animation: vuela .3s cubic-bezier(.55,0,.9,.4) .6s forwards; }
  .tiro .vibra { transform-box: view-box; transform-origin: 56px 44px; animation: vibra .7s ease-out .9s; }
  .tiro .golpe { transform-box: view-box; transform-origin: 50px 50px; opacity: 0; animation: golpe .55s ease-out .9s; }
  .tiro .chispa { opacity: 0; animation: chispa .45s ease-out .9s; }
  .tiro .blanco { transform-box: view-box; transform-origin: 50px 50px; animation: sacude .35s ease-out .9s; }
  @keyframes vuela { from { opacity: 1; transform: translate(60px, -60px); } to { opacity: 1; transform: translate(0, 0); } }

(function () {
  const $ = id => document.getElementById(id);

  const CURSO = (params.get('curso') || '').replace(/[^a-z0-9-]/g, '');
  const DIAS = [0, 1, 2, 4, 8, 16];   // caja → días hasta volver a verla
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

  /* ---------- Sonidos (hechos con código, sin archivos de audio) ---------- */
  const Sonido = (function () {
    let ctx = null, salida = null, activo = true;
    try { activo = localStorage.getItem('mc_sonido') !== '0'; } catch (e) {}
    function audio() {
      if (!activo) return null;
      try {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
          // iPhone: que suene aunque el botón de silencio esté puesto

        const a = audio(); if (!a) return;
        try { const s = a.createBufferSource(); s.buffer = a.createBuffer(1, 1, 22050); s.connect(a.destination); s.start(0); } catch (e) {}
        if (a.state === 'running') ['pointerdown', 'touchend', 'keydown'].forEach(function (x) { document.removeEventListener(x, abrir, true); });
      }, true);

    // Una nota: frecuencia, cuándo empieza (s), cuánto dura, forma de onda, volumen y a qué frecuencia se desliza
    function nota(f, t, dur, tipo, vol, hasta) {
      const a = audio(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + (t || 0);
      o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t0);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      src.connect(fl); fl.connect(g); g.connect(salida); src.start(t0); src.stop(t0 + dur);
    }
    const DO = 523.25, MI = 659.25, SOL = 783.99, DO2 = 1046.5, MI2 = 1318.5, SOL2 = 1568;
    return {
      get activo() { return activo; },
      cambiar() { activo = !activo; try { localStorage.setItem('mc_sonido', activo ? '1' : '0'); } catch (e) {} if (activo) this.toque(); return activo; },
      // Una "burbuja" que sube para chips y botones
      toque() { nota(320, 0, 0.09, 'sine', 0.26, 1100); },
      marcar(on) { on ? (nota(380, 0, 0.07, 'sine', 0.24, 900), nota(600, 0.06, 0.09, 'sine', 0.24, 1400)) : nota(900, 0, 0.1, 'sine', 0.22, 350); },
      empezar() { soplo(0.25, 0.14, 600, 2600); [DO, MI, SOL].forEach((f, i) => nota(f * 2, 0.05 + i * 0.06, 0.12, 'triangle', 0.16)); },
      abrir() { nota(880, 0, 0.08, 'triangle', 0.18); [DO2, MI2, SOL2].forEach((f, i) => nota(f, 0.1 + i * 0.07, 0.22, 'sine', 0.16)); },
      error() { nota(220, 0, 0.12, 'square', 0.06); nota(185, 0.13, 0.18, 'square', 0.06); },
      voltear() { soplo(0.16, 0.22, 900, 3200); nota(420, 0.02, 0.09, 'sine', 0.05, 640); },
      bien() { nota(DO2, 0, 0.11, 'triangle', 0.22); nota(MI2, 0.09, 0.28, 'triangle', 0.24); nota(MI2 * 2, 0.09, 0.2, 'sine', 0.04); },
      repasar() { nota(392, 0, 0.12, 'sine', 0.16, 330); nota(294, 0.1, 0.22, 'sine', 0.13, 262); },
      racha(n) {

        notas.forEach((f, i) => nota(f, i * 0.07, 0.16, 'square', 0.06));
      },
      fin(pct) {

  })();
  function pintarBtnSonido() {

  const vibrar = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  function saltar(el) { el.classList.remove('salta'); void el.offsetWidth; el.classList.add('salta'); }

  /* ---------- Modo estudio ---------- */
  function cuentas() {
    return { todo: banco.length, sin: banco.filter(w => w.sin.length).length, ant: banco.filter(w => w.ant.length).length };
  }
  function delTab(tab) { return tab === 'todo' ? banco : banco.filter(w => w[tab].length); }
  function pintarTabs() {
    const n = cuentas();
    $('tabs').innerHTML = [['todo', 'Todo'], ['sin', 'Sinónimos'], ['ant', 'Antónimos']].filter(t => t[0] === 'todo' || n[t[0]])

    $('tabs').querySelectorAll('.vtab').forEach(b => b.addEventListener('click', () => {

    }));

  function pintarAvance() {

  function pintarFiltros() {
    const hayExamen = banco.some(w => w.examen.length);
    const fs = [['todas', 'Todas'], ['nuevas', 'Por aprender'], ['sabidas', 'Aprendidas']].concat(hayExamen ? [['examen', 'Salieron en examen']] : []);
    $('filtros').innerHTML = fs.map(f => `<button class="filtro ${f[0] === vista.filtro ? 'on' : ''}" type="button" data-f="${f[0]}">${f[1]}</button>`).join('');
    $('filtros').querySelectorAll('.filtro').forEach(b => b.addEventListener('click', () => { Sonido.toque(); vista.filtro = b.dataset.f; vista.limite = 60; pintarFiltros(); pintarLista(); }));
  }
  function visibles() {
    const q = norm(vista.busca);
    return delTab(vista.tab).filter(w => {
      if (vista.filtro === 'nuevas' && aprendida(w, vista.tab)) return false;
      if (vista.filtro === 'sabidas' && !aprendida(w, vista.tab)) return false;
      if (vista.filtro === 'examen' && !w.examen.length) return false;
      return !q || norm(w.palabra).includes(q) || w.sin.concat(w.ant).some(x => norm(x).includes(q));
    });

  const raizDe = p => { const n = norm(p); return n.length > 4 ? n.slice(0, -1) : n; };
  function resaltar(texto, palabra) {

      </button>

    const mas = $('btnVerMas'); if (mas) mas.addEventListener('click', () => { Sonido.toque(); vista.limite += 60; pintarLista(); });
  }
  $('lista').addEventListener('click', e => {
    const se = e.target.closest('[data-se]'), cab = e.target.closest('.fi-cab');
    if (se) {
      const w = lista[+se.dataset.se], ya = aprendida(w, vista.tab);
      claves(w, vista.tab).forEach(k => poner(k, ya ? 0 : Math.max(1, estado[k] ? estado[k][0] : 0)));
      ya ? Sonido.repasar() : Sonido.bien();
      vibrar(ya ? 8 : 15);
      pintarAvance(); repintar(+se.dataset.se);
      return;
    }
    if (cab) {
      const i = +cab.closest('.fi').dataset.i, w = lista[i];
      vista.abiertas.has(w.palabra) ? vista.abiertas.delete(w.palabra) : vista.abiertas.add(w.palabra);
      Sonido.toque(); repintar(i);
    }
  });
  function repintar(i) {
    const el = $('lista').querySelector(`.fi[data-i="${i}"]`); if (!el) return;
    el.outerHTML = fichaHtml(lista[i], i);
  }
  let tBusca = null;
  $('busca').addEventListener('input', e => { clearTimeout(tBusca); tBusca = setTimeout(() => { vista.busca = e.target.value; vista.limite = 60; pintarLista(); }, 120); });
  function abrirEstudio() {
    mostrar('estudio');
    $('titulo').textContent = 'Vocabulario';
    $('lead').textContent = 'Toca una palabra para ver su significado, sus sinónimos, antónimos y ejemplos.';
    pintarTabs(); pintarAvance(); pintarFiltros(); pintarLista();
  }

  /* ---------- Flashcards ---------- */
  function cartas(mazo) {
    const out = [];
    banco.forEach(w => ['sin', 'ant'].forEach(d => { if (w[d].length && (mazo === 'todo' || mazo === d)) out.push({ id: w.palabra + '#' + d, w, d }); }));
    return out;
  }
  function chipsDe(cont, lista, actual, alElegir) {
    cont.innerHTML = lista.map(x => `<button type="button" class="chip ${x[3] || ''} ${x[0] === actual ? 'on' : ''}" data-v="${esc(x[0])}">${esc(x[1])}${x[2] ? ` <small>${esc(x[2])}</small>` : ''}</button>`).join('');
    cont.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { Sonido.toque(); alElegir(b.dataset.v); }));
  }
  function abrirPreparar() {
    mostrar('preparar');
    $('titulo').textContent = 'Flashcards';
    $('lead').textContent = 'Ves la palabra, recuerdas sus sinónimos o antónimos y volteas la tarjeta. Las que fallas vuelven a salir.';
    const n = cuentas();
    const mazos = [['todo', 'Todo', String(n.sin + n.ant)]].concat(n.sin ? [['sin', 'Sinónimos', String(n.sin), 'c']] : [], n.ant ? [['ant', 'Antónimos', String(n.ant), 'm']] : []);
    if (!mazos.some(m => m[0] === prep.mazo)) prep.mazo = 'todo';
    const elegirMazo = v => { prep.mazo = v; chipsDe($('chMazo'), mazos, v, elegirMazo); pintarCant(); };
    elegirMazo(prep.mazo);
    window.scrollTo(0, 0);
  }
  function pintarCant() {
    const total = cartas(prep.mazo).length;
    const lista = [[10, '10'], [20, '20'], [0, 'Todas', String(total)]].filter(x => !x[0] || x[0] < total).map(x => [String(x[0]), x[1], x[2]]);
    if (prep.cant && prep.cant >= total) prep.cant = 0;
    const elegir = v => { prep.cant = +v; chipsDe($('chCant'), lista, v, elegir); resumen(); };
    elegir(String(prep.cant));
  }
  function resumen() {
    const c = cartas(prep.mazo), n = prep.cant ? Math.min(prep.cant, c.length) : c.length;
    const rep = c.filter(x => estado[x.id] && toca(x.id)).length, nuevas = c.filter(x => !estado[x.id]).length;
    $('resumen').textContent = `${n} tarjetas` + (rep ? ` · ${rep} te tocan repasar hoy` : '') + (nuevas ? ` · ${nuevas} nuevas` : '');
  }
  $('btnFlash').addEventListener('click', () => { Sonido.empezar(); abrirPreparar(); });
  $('btnVolverEst').addEventListener('click', () => { Sonido.toque(); abrirEstudio(); });
  $('btnEmpezar').addEventListener('click', () => { Sonido.empezar(); empezar(cartas(prep.mazo), prep.cant); });

  let cola = [], pos = 0, sabidas = 0, falladas = [], vistas = 0, total = 0;
  const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function empezar(cs, cant) {
    // Primero las que toca repasar, luego las nuevas (las fáciles antes) y al final las que ya domina
    const grupo = c => { const e = estado[c.id]; return !e ? 1 : toca(c.id) ? 0 : 2; };
    const orden = [0, 1, 2].flatMap(g => { const x = barajar(cs.filter(c => grupo(c) === g)); return g === 1 ? x.sort((a, b) => a.w.nivel - b.w.nivel) : x; });
    cola = cant ? orden.slice(0, cant) : orden;
    if (!cola.length) { aviso('No hay tarjetas para repasar.'); return; }
    pos = 0; sabidas = 0; falladas = []; vistas = 0; total = cola.length; racha = 0;
    mostrar('juego'); window.scrollTo(0, 0); pintarCarta();
  }
  const CHEK = '<div class="chek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
  function frenteHtml(c) {
    const w = c.w, nom = MAZOS[c.d][0];
    return `<div class="tag"><span class="num ${c.d}">${nom.toUpperCase()}</span>${w.tipo ? `<span>${esc(w.tipo)}</span>` : ''}</div>
      <div class="cuerpo"><div class="txt"><div class="vpal">${esc(w.palabra)}</div>
      <div class="vpreg">${c.d === 'sin' ? '¿Qué palabras significan lo mismo?' : '¿Qué palabras significan lo contrario?'}</div></div></div>
      <div class="pie"><span class="dedo">${ICO.toque}</span> Toca para ver la respuesta</div><div class="marca">${c.d === 'sin' ? '=' : '≠'}</div>`;
  }
  function reversoHtml(c) {
    const w = c.w;
    return `<div class="tag"><span class="num">${MAZOS[c.d][0].toUpperCase()}</span></div>
      <div class="cuerpo"><div class="txt">${CHEK}<div class="rpal">${esc(w.palabra)}</div>
      <div class="rchs">${w[c.d].map((x, i) => `<span style="--i:${i}">${esc(x)}</span>`).join('')}</div>
      ${w.def ? `<div class="rdef">${esc(w.def)}</div>` : ''}
      ${w.ej.length ? `<div class="rej">${esc(w.ej[0])}</div>` : ''}</div></div>`;
  }
  function pintarCarta() {
    const c = cola[pos];
    $('carta').classList.remove('ida', 'regreso'); volteada = false;
    $('caraF').innerHTML = frenteHtml(c); $('caraR').innerHTML = reversoHtml(c);
    $('caraR').classList.remove('sin', 'ant'); $('caraR').classList.add(c.d);
    $('caraF').scrollTop = 0; $('caraR').scrollTop = 0;
    ajustar($('caraF'));
    $('acciones').hidden = true; $('hint').hidden = false;
    $('hint').innerHTML = '';
    $('cuenta').textContent = Math.min(vistas + 1, total) + ' / ' + total;
    $('fill').style.width = (vistas / total * 100) + '%';
    $('mOk').innerHTML = ICO.si + sabidas + ' me la sé';
    $('mRep').innerHTML = ICO.rep + falladas.length + ' por repasar';
    const quedan = cola.length - pos - 1;
    $('m1').style.opacity = quedan >= 1 ? '' : '0'; $('m2').style.opacity = quedan >= 2 ? '' : '0';
  }
  function ajustar(cara) {
    const t = cara.querySelector('.tag'), c = cara.querySelector('.cuerpo');
    const dentro = c ? [...c.children].reduce((h, x) => h + x.offsetHeight, 0) : 0;
    const alto = (t ? t.offsetHeight + 18 : 0) + dentro + (cara === $('caraR') ? 70 : 100);
    $('carta').style.minHeight = Math.max(340, Math.min(alto, Math.max(420, innerHeight - 250))) + 'px';
    if (c) setTimeout(() => masAbajo(c), 320);
  }
  function masAbajo(c) { c.classList.toggle('mas', c.scrollHeight - c.scrollTop - c.clientHeight > 8); c.classList.toggle('arriba', c.scrollTop > 8); }
  document.addEventListener('scroll', e => { if (e.target.classList && e.target.classList.contains('cuerpo')) masAbajo(e.target); }, true);
  let volteada = false, girando = null;
  function voltear() {
    if ($('juego').hidden || saliendo) return;
    const carta = $('carta');
    volteada = !volteada;
    carta.classList.remove('ida', 'regreso'); void carta.offsetWidth;
    carta.classList.add(volteada ? 'ida' : 'regreso');
    $('escena').classList.add('alzada'); clearTimeout(girando);
    girando = setTimeout(() => $('escena').classList.remove('alzada'), 650);
    ajustar(volteada ? $('caraR') : $('caraF'));
    vibrar(8); Sonido.voltear();
    if ($('acciones').hidden) {
      $('acciones').hidden = false; $('acciones').classList.remove('aparece'); void $('acciones').offsetWidth; $('acciones').classList.add('aparece');
      $('hint').innerHTML = '<b>←</b> desliza para repasar · desliza para "me la sé" <b>→</b>';
    }
  }
  let saliendo = false, racha = 0;
  function salir(sabe) {
    if (saliendo || $('acciones').hidden) return;
    saliendo = true;
    const a = $('arrastre');
    $(sabe ? 'selloSi' : 'selloNo').style.opacity = '1';
    a.style.transition = 'transform .38s cubic-bezier(.5,0,.75,0), opacity .38s ease';
    a.style.transform = `translate(${sabe ? 130 : -130}%, -20px) rotate(${sabe ? 24 : -24}deg)`;
    a.style.opacity = '0';
    vibrar(sabe ? 15 : [10, 40, 10]); Sonido[sabe ? 'bien' : 'repasar']();
    setTimeout(() => {
      responder(sabe);
      a.style.transition = 'none'; a.style.transform = ''; a.style.opacity = '';
      $('selloSi').style.opacity = '0'; $('selloNo').style.opacity = '0';
      a.classList.remove('entrar'); void a.offsetWidth; a.classList.add('entrar');
      saliendo = false;
    }, 380);
  }
  function combo(texto) {
    const d = document.createElement('div'); d.className = 'combo'; d.innerHTML = texto;
    document.body.appendChild(d); setTimeout(() => d.remove(), 1300);
  }
  function responder(sabe) {
    const c = cola[pos];
    marcar(c.id, sabe);
    if (!c.otraVez) {
      vistas++;
      if (sabe) { sabidas++; saltar($('mOk')); }
      else { falladas.push(c); cola.push(Object.assign({}, c, { otraVez: true })); saltar($('mRep')); }
    }
    racha = sabe ? racha + 1 : 0;
    if (racha >= 3 && racha % 3 === 0) {
      combo((racha >= 9 ? ICO.estrella : racha >= 6 ? ICO.rayo : ICO.fuego) + ` ${racha} seguidas`);
      const n = racha; setTimeout(() => Sonido.racha(n), 120);
    }
    pos++;
    if (pos >= cola.length) terminar(); else pintarCarta();
  }
  // Deslizar con el dedo (o el mouse): derecha = me la sé, izquierda = repasar
  (function () {
    const a = $('arrastre');
    let x0 = null, y0 = 0, dx = 0, moviendo = false, ignorarClick = false;
    a.addEventListener('pointerdown', e => { if (saliendo) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moviendo = false; });
    a.addEventListener('pointermove', e => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      if (!moviendo && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - y0)) {
        moviendo = true; a.style.transition = 'none';
        try { a.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (!moviendo) return;
      const listo = !$('acciones').hidden, f = listo ? 1 : .35;
      a.style.transform = `translateX(${dx * f}px) rotate(${dx * f / 18}deg)`;
      if (listo) { $('selloSi').style.opacity = Math.max(0, Math.min(1, dx / 110)); $('selloNo').style.opacity = Math.max(0, Math.min(1, -dx / 110)); }
    });
    const soltar = () => {
      if (x0 === null) return;
      x0 = null;
      if (!moviendo) return;
      ignorarClick = true; setTimeout(() => { ignorarClick = false; }, 50);
      if (Math.abs(dx) > 100 && !$('acciones').hidden) { salir(dx > 0); return; }
      a.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)'; a.style.transform = '';
      $('selloSi').style.opacity = '0'; $('selloNo').style.opacity = '0';
      if ($('acciones').hidden && Math.abs(dx) > 60) { $('hint').innerHTML = '<b>Primero voltea la tarjeta</b> para ver la respuesta'; }
    };
    a.addEventListener('pointerup', soltar); a.addEventListener('pointercancel', soltar);
    $('carta').addEventListener('click', e => { if (ignorarClick || e.target.closest('summary, a')) return; voltear(); });
  })();
  function confeti() {
    const colores = ['#C6E000', '#e9ff6a', '#FF9F43', '#ffffff', '#a78bfa'];
    for (let i = 0; i < 70; i++) {
      const d = document.createElement('i'); d.className = 'confeti';
      d.style.left = Math.random() * 100 + '%'; d.style.background = colores[i % colores.length];
      d.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); d.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = (Math.random() * .5) + 's';
      $('fin').appendChild(d); setTimeout(() => d.remove(), 4000);
    }
  }
  function terminar() {
    subir();
    $('fill').style.width = '100%';
    const nf = falladas.length, pct = total ? Math.round(sabidas / total * 100) : 0;
    const tiro = pct >= 50 && pct < 80;
    $('finMedalla').classList.toggle('tiro', tiro);
    $('finMedalla').innerHTML = pct === 100 ? ICO.copa : pct >= 80 ? ICO.estrella : tiro ? DIANA : ICO.libro;
    $('finTitulo').textContent = pct === 100 ? '¡Perfecto!' : pct >= 80 ? '¡Muy bien!' : pct >= 50 ? '¡Vas bien!' : '¡Sigue practicando!';
    $('finNum').textContent = sabidas + ' de ' + total;
    $('finOk').innerHTML = ICO.si + sabidas + ' me la sé'; $('finRep').innerHTML = ICO.rep + nf + ' por repasar';
    $('finRep').hidden = !nf;
    $('finTexto').textContent = (nf ? (nf === 1 ? 'La que fallaste volverá a salir hasta que te la sepas.' : 'Las ' + nf + ' que fallaste volverán a salir hasta que te las sepas.')
      : 'Te las sabías todas al primer intento.') + ' Las que ya dominas aparecen cada vez menos, para que no se te olviden.';
    $('btnOtra').hidden = !nf;
    mostrar('fin');
    const arco = $('finArco'), L = 326.7;
    arco.style.transition = 'none'; arco.style.strokeDashoffset = L; void arco.getBoundingClientRect();
    arco.style.transition = ''; arco.style.strokeDashoffset = L * (1 - pct / 100);
    const t0 = performance.now();
    (function paso(t) { const k = Math.min(1, (t - t0) / 1300); $('finPct').textContent = Math.round(pct * (1 - Math.pow(1 - k, 3))) + '%'; if (k < 1) requestAnimationFrame(paso); })(t0);
    if (pct >= 70 && !matchMedia('(prefers-reduced-motion: reduce)').matches) confeti();
    vibrar([20, 60, 30]); Sonido.fin(pct);
  }
  $('carta').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); voltear(); } });
  document.addEventListener('keydown', e => {
    if ($('juego').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') salir(true);
    if (e.key === 'ArrowLeft') salir(false);
  });
  $('btnSe').innerHTML = ICO.si + ' Ya me la sé'; $('btnRep').innerHTML = ICO.rep + ' Repasar';
  $('btnOtra').innerHTML = ICO.rep + ' Repasar las que fallé'; $('btnNueva').innerHTML = ICO.flash + ' Otra ronda';
  $('btnAlEstudio').innerHTML = ICO.estudio + ' Volver al estudio';
  $('btnEmpezar').innerHTML = ICO.jugar + ' Empezar'; $('icFlash').innerHTML = ICO.flash;
  $('icPrac').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>';
  $('icReto').innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.5z"/></svg>';
  $('btnSe').addEventListener('click', () => salir(true));
  $('btnRep').addEventListener('click', () => salir(false));
  ['btnOtra', 'btnNueva', 'btnAlEstudio'].forEach(id => $(id).addEventListener('pointerdown', () => Sonido.toque()));
  $('btnOtra').addEventListener('click', () => empezar(falladas.map(c => Object.assign({}, c, { otraVez: false })), 0));
  $('btnNueva').addEventListener('click', abrirPreparar);
  $('btnAlEstudio').addEventListener('click', abrirEstudio);

  /* ---------- Inicio ---------- */
  async function iniciar() {
    const c = CURSO && window.MCCursos ? await MCCursos.curso(CURSO).catch(() => null) : null;
    const nombre = (c && c.nombre) || 'Razonamiento Verbal';
    document.title = 'Vocabulario · ' + nombre + ' · Modo Cachimbo';
    $('eyebrow').textContent = 'Vocabulario · ' + nombre;
    if (CURSO) { $('backLink').href = CURSO + '/index.html'; $('backLabel').textContent = nombre; }
    // Primero lo guardado en el teléfono (abre al instante); luego lo nuevo del servidor
    const local = bancoLocal();
    if (local && local.length) { banco = local.map(limpiar).filter(w => w.palabra); estado = leerLocal(); abrirEstudio(); }
    else aviso('Cargando palabras…');
    let fresco = null;
    try { [fresco] = await Promise.all([cargarBanco(), cargarEstado()]); }
    catch (e) { if (!banco.length) { aviso('No se pudieron cargar las palabras. Revisa tu conexión e intenta de nuevo.'); return; } }
    if (fresco) banco = fresco.map(limpiar).filter(w => w.palabra);
    if (!banco.length) { aviso('Pronto habrá palabras aquí. Tu profe las está preparando.'); return; }
    if (!$('estudio').hidden || !$('estado').hidden) abrirEstudio();
  }
  iniciar();
})();
</script>
<script src="assets/alertas.js" defer></script>
<script src="assets/sonido.js"></script>
