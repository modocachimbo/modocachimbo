<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06040F">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<title>Laboratorio · Modo Cachimbo</title>
<script src="assets/app.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Sora:wght@700;800&display=swap">
<style>
:root{--bg:#06040F;--card:#151127;--card2:#1D1834;--borde:#2A2346;--lima:#C6E000;--lima-osc:#8fa300;--tx:#EEEAF7;--dim:#A99FC8;--faint:#6F6690;--oro:#FFC800;--vidrio:rgba(21,17,39,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:700 15px/1.45 "Nunito",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* ===== escena ===== */
#escena{position:fixed;inset:0;touch-action:none;cursor:grab;background:radial-gradient(70% 70% at 50% 45%,#140D33 0%,#08051A 60%,#030209 100%)}
#escena:active{cursor:grabbing}
#escena svg{width:100%;height:100%;display:block}
.org{cursor:pointer}
.etq{pointer-events:none;transition:opacity .3s}
.etq text{font:700 20px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;fill:#EEEAF7}
.etq rect{fill:rgba(10,7,26,.82);stroke:rgba(198,224,0,.55);stroke-width:1.2}
.etq line{stroke:rgba(198,224,0,.7);stroke-width:1.4}
.etq circle{fill:#C6E000}
.sin-nombres .etq{opacity:0}
/* célula ilustrada */
.org{fill:transparent;cursor:pointer}
.org,#mHueco,#brillo path{fill-rule:evenodd}
.org.memb{fill:none;stroke:transparent;stroke-width:70;pointer-events:stroke}
.osc{fill:rgba(4,3,12,.66);opacity:0;transition:opacity .45s}
.cel-foco .osc{opacity:1}
.br-a{fill:none;stroke:#C6E000;stroke-width:14;opacity:.55;filter:url(#fGlow);animation:late 1.6s ease-in-out infinite}
.br-b{fill:none;stroke:#E4FF5A;stroke-width:3.5}
.br-m{fill:none;stroke:#C6E000;stroke-width:16;opacity:.8;filter:url(#fGlow);animation:late 1.6s ease-in-out infinite}
@keyframes late{50%{opacity:.25}}
.part circle{fill:#DDF3FF;opacity:.35;animation:flota 9s ease-in-out infinite alternate}
@keyframes flota{from{transform:translate(0,0)}to{transform:translate(18px,-26px)}}
.img-cel{animation:respira 7s ease-in-out infinite;transform-origin:1200px 900px}
@keyframes respira{50%{transform:scale(1.006)}}
.etq text{font-size:28px}
/* ===== HUD ===== */
.hud{position:fixed;z-index:5;display:flex;gap:10px;align-items:center}
.glass{background:var(--vidrio);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:16px}
.h-top{top:max(14px,env(safe-area-inset-top));left:16px;right:16px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:14px}
.ib svg{width:20px;height:20px}
.ttl{padding:6px 14px 7px}
.ttl small{display:block;font:900 10.5px/1.2 "Nunito";letter-spacing:.16em;text-transform:uppercase;color:var(--lima)}
.ttl b{display:block;font:800 19px/1.2 "Sora",sans-serif;letter-spacing:-.01em}
.sp{flex:1}
.av{display:flex;padding:4px;gap:2px;height:44px}
.av button{display:flex;align-items:center;gap:6px;padding:0 13px;border-radius:11px;font:800 13px/1 "Nunito";color:var(--dim)}
.av button.on{background:var(--lima);color:#151A03}
.av em{font:800 9.5px/1 "Barlow Condensed";font-style:normal;letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--faint)}
.son{color:var(--lima)}.son.off{color:var(--faint)}
.son.off svg .on-l{display:none}
.son:not(.off) svg .off-l{display:none}
.tg{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;font:800 13px/1 "Nunito";color:var(--dim)}
.sw{width:38px;height:22px;border-radius:11px;background:var(--lima);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#151A03;transition:.2s}
.sw.off{background:#3A3358}.sw.off::after{right:19px;background:#A99FC8}
.h-zoom{right:16px;top:50%;transform:translateY(-50%);flex-direction:column;padding:6px;gap:4px}
.h-zoom .nv{font:800 12px/1 "Barlow Condensed";letter-spacing:.06em;color:var(--lima);padding:4px 0}
.h-esc{left:16px;bottom:calc(76px + env(safe-area-inset-bottom));padding:8px 12px;flex-direction:column;align-items:flex-start;gap:5px}
.h-esc i{display:block;height:6px;border:2px solid var(--tx);border-top:0;width:80px}
.h-esc span{font:800 12px/1 "Barlow Condensed";letter-spacing:.08em;color:var(--dim)}
.h-bot{left:0;right:0;bottom:0;padding:10px 16px max(14px,env(safe-area-inset-bottom));display:block}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.pista{transition:opacity .5s}.pista.fuera{opacity:0;pointer-events:none}
/* Lista de organelas: escondida; se abre con el botón de lista (los nombres ya están en la célula) */
html:not(.lista-on) .h-bot{display:none}
html:not(.lista-on) .h-esc{bottom:max(16px,env(safe-area-inset-bottom))}
.lis.on{color:var(--lima)}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:14px;font:800 14px/1 "Nunito";white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--lima);color:#151A03;border-color:var(--lima)}
.modo{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));display:flex;padding:4px;border-radius:16px}
.modo button{padding:9px 16px;border-radius:12px;font:900 13px/1 "Nunito";color:var(--dim);display:flex;align-items:center;gap:6px}
.modo button svg{width:16px;height:16px}
.modo .on{background:var(--lima);color:#151A03}
.pista{display:none;position:fixed;z-index:4;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);padding:8px 14px;border-radius:12px;font:800 13px/1.2 "Nunito";color:var(--dim);gap:8px;align-items:center;white-space:nowrap}
.pista svg{width:18px;height:18px;color:var(--lima)}
/* ===== detalle ===== */
#det{position:fixed;inset:0;z-index:20;display:none;background:rgba(4,3,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#det.on{display:flex;animation:ent .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ent{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.d-box{margin:auto;width:min(1240px,100% - 40px);height:min(760px,100% - 40px);display:grid;grid-template-columns:1.25fr 1fr;border-radius:26px;overflow:hidden;background:#0C0920;border:1px solid var(--borde);box-shadow:0 40px 120px rgba(0,0,0,.6)}
.d-ilus{animation:dIlus .6s ease both,dFlota 6s ease-in-out .6s infinite}
@keyframes dIlus{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes dFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.d-vis .mk-onda{transform-box:fill-box;transform-origin:center;animation:mkOnda 2.2s ease-out infinite}
@keyframes mkOnda{from{transform:scale(1);opacity:.8}to{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.d-ilus,.d-vis .mk-onda{animation:none}}

.d-vis{position:relative;background:radial-gradient(80% 80% at 50% 50%,#1C1240 0%,#0A0720 70%);overflow:hidden}
.d-vis svg{position:absolute;inset:0;width:100%;height:100%}
.d-vis .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px}
.d-vis .lbl text{font:700 17px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;fill:#EEEAF7}
.d-vis .lbl line,.d-vis .lbl polyline{stroke:#C6E000;stroke-width:1.3;fill:none}
.d-vis .lbl circle{fill:#C6E000}
.d-vis .lbl .n{fill:#151A03;font:800 14px "Barlow Condensed"}
.d-vis .lbl .nb{fill:#C6E000}
.d-cab{position:absolute;left:18px;top:16px;right:18px;display:flex;align-items:center;gap:10px}
.pill{padding:6px 11px;border-radius:10px;font:800 12px/1 "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;background:rgba(198,224,0,.12);color:var(--lima);border:1px solid rgba(198,224,0,.35)}
.d-pie{position:absolute;left:18px;bottom:16px;right:18px;display:flex;align-items:center;gap:10px;font:800 12px/1 "Barlow Condensed";letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.d-pie .esc{text-transform:none}
.d-pie .esc i{display:inline-block;width:60px;height:6px;border:2px solid var(--dim);border-top:0;margin-right:8px;vertical-align:middle}
.d-inf{padding:26px 28px;overflow:auto;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--borde)}
.d-inf header{display:flex;gap:12px;align-items:flex-start}
.d-inf h2{margin:0;font:800 34px/1.05 "Sora",sans-serif;letter-spacing:-.02em}
.d-inf .lat{display:block;margin-top:6px;font:700 14px/1.2 "Nunito";color:var(--dim)}
.d-inf .x{margin-left:auto;width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--borde);display:grid;place-items:center;flex:none}
.d-inf .x svg{width:18px;height:18px}
.ficha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ficha div{padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--borde)}
.ficha small{display:block;font:800 10.5px/1 "Nunito";letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.ficha b{font:800 15px/1.15 "Nunito"}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--borde)}
.tabs button{flex:1;padding:10px 6px;border-radius:10px;font:900 13px/1 "Nunito";color:var(--dim)}
.tabs .on{background:var(--card2);color:var(--tx);box-shadow:inset 0 -2px 0 var(--lima)}
.txt{margin:0;font:700 15.5px/1.55 "Nunito";color:#DCD6EE}
.partes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.partes li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--borde)}
.partes li.on{border-color:rgba(198,224,0,.6);background:linear-gradient(90deg,rgba(198,224,0,.09),transparent)}
.partes .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lima);color:#151A03;font:800 15px/1 "Barlow Condensed"}
.partes b{display:block;font:800 15px/1.2 "Nunito"}
.partes span{display:block;font:700 13.5px/1.4 "Nunito";color:var(--dim);margin-top:2px}
.proc{flex-shrink:0;display:flex;flex-direction:column;gap:0;border-radius:16px;border:1px solid var(--borde);overflow:hidden}
.proc .eq{padding:12px 14px;background:var(--card2);font:700 16px/1.3 "Nunito";text-align:center}
.proc .eq b{color:var(--oro)}
.proc .st{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--borde)}
.proc .st i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 15px/1 "Barlow Condensed";font-style:normal}
.proc .st b{display:block;font:800 14.5px/1.2 "Nunito"}
.proc .st span{font:700 12.5px/1.3 "Nunito";color:var(--dim)}
.proc .st em{font:800 14px/1 "Barlow Condensed";letter-spacing:.04em;color:var(--oro);font-style:normal;white-space:nowrap}
.clave{flex-shrink:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,rgba(255,200,0,.1),rgba(255,200,0,.03));border:1px solid rgba(255,200,0,.38)}
.clave b{display:flex;align-items:center;gap:7px;font:900 11px/1 "Nunito";letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin-bottom:8px}
.clave b svg{width:16px;height:16px}
.clave p{margin:0;font:700 14.5px/1.5 "Nunito"}
.clave p+p{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,200,0,.2)}
.d-acc{display:flex;gap:10px;margin-top:auto;padding-top:4px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:16px;font:800 16px/1 "Sora";background:var(--lima);color:#151A03;box-shadow:0 5px 0 var(--lima-osc)}
.btn svg{width:20px;height:20px}
.btn.sec{background:var(--card2);color:var(--tx);box-shadow:0 5px 0 #0d0a1c;border:1px solid var(--borde);flex:.8}
/* Beta: solo admin + influencers, igual que el Arcade (assets/arcade-beta.js) */
html:not(.arcade-si) #escena, html:not(.arcade-si) .hud, html:not(.arcade-si) .pista, html:not(.arcade-si) #det { display:none !important; }
.beta-aviso{display:none;max-width:420px;margin:90px auto 0;padding:30px 24px;text-align:center;border-radius:24px;background:var(--card);border:1px solid var(--borde);border-bottom:5px solid var(--lima)}
html.arcade-no .beta-aviso{display:block}
.beta-aviso b{display:block;font:800 26px/1.2 "Sora",sans-serif}
.beta-aviso p{margin:10px 0 20px;color:var(--dim);font-weight:700}
.beta-aviso a{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:14px;background:var(--lima);color:#151A03;font:800 15px/1 "Sora";text-decoration:none}
.cargando{display:none;margin:120px auto;width:40px;height:40px;border-radius:50%;border:4px solid var(--borde);border-top-color:var(--lima);animation:gira .8s linear infinite}
html:not(.arcade-si):not(.arcade-no) .cargando{display:block}
@keyframes gira{to{transform:rotate(1turn)}}
a.ib{text-decoration:none}
@media (max-width:760px){
  .pista{display:flex}
  .ttl b{font-size:16px}
  .h-top .tg span{display:none}
  .h-top{flex-wrap:wrap;row-gap:8px}
  .h-top .sp{display:none}
  .ttl .pc{display:none}
  .ttl{padding:6px 10px 7px}.ttl b{font-size:15px}.h-top{gap:8px}
  .ttl{flex:1;min-width:0}.ttl b,.ttl small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av{order:5;height:38px}.av button{padding:0 11px;font-size:12.5px}
  .pista{font-size:12px;top:calc(120px + env(safe-area-inset-top));white-space:normal;width:max-content;max-width:calc(100vw - 32px);text-align:center}
  .h-zoom{top:auto;bottom:calc(76px + env(safe-area-inset-bottom));transform:none}
  .h-esc{bottom:calc(76px + env(safe-area-inset-bottom))}
  html:not(.lista-on) .h-zoom,html:not(.lista-on) .h-esc{bottom:max(16px,env(safe-area-inset-bottom))}
  .modo{bottom:calc(70px + env(safe-area-inset-bottom))}
  .d-box{width:100%;height:100%;border-radius:0;grid-template-columns:1fr;grid-template-rows:44% 1fr;border:0}
  .d-inf{border-left:0;border-top:1px solid var(--borde);padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;margin-top:-22px;background:#0C0920;position:relative;z-index:2;gap:14px}
  .d-inf h2{font-size:27px}
  .d-vis .lbl text{font-size:22px}
  .d-cab{top:max(14px,env(safe-area-inset-top))}
  .ficha b{font-size:13.5px}
  .d-acc .sec{display:none}
  .d-pie{display:none}
}

/* ===== detalle: adaptación a cada pantalla ===== */
.d-acc{position:sticky;bottom:0;margin-top:auto;padding:10px 0 2px;background:linear-gradient(transparent,#0C0920 30%)}
.d-inf>*{flex-shrink:0}
@media (min-width:1600px) and (min-height:950px){
  .d-box{width:min(1480px,100% - 80px);height:min(900px,100% - 80px)}
  .d-inf{padding:32px 34px}
}
/* celular, y tablet en vertical: dibujo arriba, ficha abajo */
@media (max-width:760px),(orientation:portrait) and (max-width:1024px){
  .d-box{width:100%;height:100%;border-radius:0;grid-template-columns:1fr;grid-template-rows:auto 1fr;border:0}
  .d-vis{height:clamp(190px,58vw,46vh)}
  .d-inf{border-left:0;border-top:1px solid var(--borde);padding:18px 16px max(14px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;margin-top:-22px;background:#0C0920;position:relative;z-index:2;gap:12px}
  .d-inf h2{font-size:clamp(24px,6.6vw,34px)}
  .ficha{gap:6px}.ficha div{padding:8px 10px;border-radius:12px}
  .ficha small{font-size:9.5px;margin-bottom:4px}.ficha b{font-size:13.5px}
  .tabs button{padding:9px 4px}
  .partes li{padding:9px 11px}
  .d-acc .sec{display:none}
}
@media (orientation:portrait) and (min-width:600px) and (max-width:1024px){
  .d-vis{height:44vh}
  .d-inf{padding:24px 28px;max-width:none}
  .d-acc .sec{display:flex}
}
/* celular en horizontal (poca altura): todo más compacto */
@media (max-height:520px) and (orientation:landscape){
  .d-box{width:100%;height:100%;border-radius:0;border:0;grid-template-columns:1.1fr 1fr}
  .d-inf{padding:12px 16px 8px;gap:8px}
  .d-inf h2{font-size:22px}.d-inf .lat{margin-top:2px;font-size:12.5px}
  .d-inf .x{width:36px;height:36px}
  .ficha div{padding:6px 9px}.ficha small{font-size:9px;margin-bottom:3px}.ficha b{font-size:12.5px}
  .tabs button{padding:7px 4px;font-size:12px}
  .partes{gap:4px}.partes li{padding:7px 10px;gap:8px;grid-template-columns:24px 1fr}.partes .n{width:24px;height:24px;font-size:13px}
  .partes b{font-size:13.5px}.partes span{font-size:12px}
  .txt{font-size:13.5px}
  .btn{height:42px;font-size:14px}
  .d-cab .pill{font-size:10px;padding:4px 8px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- citoplasma -->
  <radialGradient id="gCito" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#2B2170"/><stop offset=".55" stop-color="#1D1550"/><stop offset="1" stop-color="#130D38"/></radialGradient>
  <linearGradient id="gPared" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A7A12"/><stop offset=".5" stop-color="#3C4708"/><stop offset="1" stop-color="#1A2003"/></linearGradient>
  <filter id="fRuido" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .7  0 0 0 0 .65  0 0 0 0 1  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="fNiebla" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 1  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="fSombra" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="fBrillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <pattern id="pLip" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="3" fill="#D8F04A"/><circle cx="3.6" cy="3.6" r="1" fill="#fff" opacity=".6"/></pattern>
  <!-- núcleo -->
  <radialGradient id="gNuc" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#B49CFF"/><stop offset=".45" stop-color="#6E4FE0"/><stop offset="1" stop-color="#2E1B86"/></radialGradient>
  <radialGradient id="gNucCorte" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#4A33A8"/><stop offset="1" stop-color="#2A1A74"/></radialGradient>
  <radialGradient id="gNcl" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FF9BD0"/><stop offset=".6" stop-color="#C2307A"/><stop offset="1" stop-color="#6B1145"/></radialGradient>

var ROT=innerHeight>innerWidth*1.2, CX=IW/2, CY=IH/2;

function celula(){

    '<mask id="mOsc" maskUnits="userSpaceOnUse" x="-4000" y="-4000" width="10400" height="10400"><rect x="-4000" y="-4000" width="10400" height="10400" fill="#fff"/><path id="mHueco" fill="#000"/></mask></defs>';
  s+='<image class="img-cel" href="'+IMG+'" width="'+IW+'" height="'+IH+'"/>';

  s+='<g class="part" pointer-events="none">';
  for(var i=0;i<34;i++){ var a=rnd()*6.28, r=Math.sqrt(rnd()), x=1200+Math.cos(a)*r*900, y=980+Math.sin(a)*r*480;
    s+='<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+(2+rnd()*3).toFixed(1)+'" style="animation-delay:-'+(rnd()*9).toFixed(1)+'s;animation-duration:'+(7+rnd()*6).toFixed(1)+'s"/>'; }
  s+='</g>';
  s+='<rect class="osc" x="-4000" y="-4000" width="10400" height="10400" mask="url(#mOsc)" pointer-events="none"/>';
  s+='<g id="brillo" pointer-events="none"></g><g id="atp" pointer-events="none"></g>';

  ORDEN.forEach(function(id){ if(id!=='membrana') s+='<path class="org" data-id="'+id+'" d="'+(F[id]||'')+'"/>'; });

}
function etiquetas(){

  var s=''; (cajas||[]).forEach(function(b,i){ var cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2, a=Math.atan2(cy-900,cx-1200)+(i%2?.5:-.4), d=150;

    ['x','y','w','h'].forEach(function(p){ cam[p]=a[p]+(b[p]-a[p])*k; }); aplicar(); if(k<1) requestAnimationFrame(paso); else if(fin) fin(); })(t0); }
