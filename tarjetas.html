<title>Flashcards · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
    --red: #E03C3C; --orange: #FF9F43;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px 16px 48px; }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  .backlink { display: flex; align-items: center; margin-bottom: 18px; }
  .backlink a.back { display: inline-flex; align-items: center; gap: 6px; color: #888; text-decoration: none; font-size: 13px; font-weight: 500; }
  .backlink a.back:hover { color: var(--accent); }
  .backlink svg { width: 14px; height: 14px; }
  .home-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); color: #888; text-decoration: none; margin-left: 10px; }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }

  .eyebrow { font-size: 11.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 6vw, 30px); margin-top: 6px; line-height: 1.2; text-wrap: balance; }
  .lead { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin-top: 8px; }

  .paso { margin-top: 26px; }
  .paso-ttl { font-size: 12px; font-weight: 700; color: #cfcfcf; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .paso-ttl .n { width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font: 800 11px Sora, sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: #d8d8d8; border-radius: 100px; padding: 9px 16px; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .chip small { color: var(--text-faint); font-weight: 500; margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #0e0e0e; }
  .chip.on small { color: rgba(14,14,14,.6); }
  .chip:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--text-faint); font-size: 12.5px; }

  .temas { display: flex; flex-direction: column; gap: 6px; }
  .tema { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; cursor: pointer; font-size: 13.5px; }
  .tema input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .tema .nm { flex: 1; min-width: 0; }
  .tema .ct { color: var(--text-faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tema.todo { border-color: rgba(198,224,0,.3); font-weight: 600; }

  .btn { width: 100%; padding: 14px; border-radius: 13px; border: 1px solid #262626; background: #141414; color: #ccc; font: 700 14px Sora, sans-serif; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .resumen { text-align: center; color: var(--text-dim); font-size: 12.5px; margin: 22px 0 10px; font-variant-numeric: tabular-nums; }

  /* Candado */
  .lock { margin-top: 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .lock h2 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .lock h2 .accent { color: var(--accent); }
  .lock p { color: #999; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
  .lock input { width: 100%; background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 13px 14px; color: #f2f2f2; font-size: 14px; text-align: center; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px; }
  .lock input:focus { outline: none; border-color: var(--accent); }
  .lock-error { display: none; margin-top: 14px; font-size: 12.5px; color: #ff8a8a; background: rgba(224,60,60,0.08); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .lock-error.show { display: block; }
  .lock-whatsapp { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(37,211,102,0.1); color: #25D366; text-decoration: none; font-size: 13px; font-weight: 700; }
  .lock-whatsapp.show { display: flex; }

  /* Juego */
  .barra { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .track { flex: 1; height: 5px; background: #1c1c1c; border-radius: 100px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 100px; transition: width .3s ease; }
  .cuenta { font: 700 12.5px Sora, sans-serif; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .marcador { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .marcador .ok { color: var(--accent); }
  .marcador .rep { color: var(--orange); }

  .escena { perspective: 1400px; margin-top: 16px; }
  .carta { position: relative; min-height: 340px; cursor: pointer; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; -webkit-tap-highlight-color: transparent; }
  .carta.vuelta { transform: rotateY(180deg); }
  .cara { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 22px 20px 48px; display: flex; flex-direction: column; overflow-y: auto; }
  .frente { background: var(--surface); border: 1px solid var(--border); }
  .reverso { background: linear-gradient(160deg, #141a03, #0e0e0e 60%); border: 1px solid rgba(198,224,0,.35); transform: rotateY(180deg); }
  .cara .tag { font-size: 11px; color: var(--text-faint); font-weight: 600; margin-bottom: 14px; display: flex; gap: 6px; align-items: center; }
  .cara .tag .prof { color: var(--accent); background: var(--accent-soft); border-radius: 100px; padding: 2px 8px; }
  .cara .txt { font-size: 15.5px; line-height: 1.65; color: #ececec; margin: auto 0; }
  .reverso .txt.resp { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: #f5ffcc; text-align: center; line-height: 1.45; }
  .cara .pie { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11.5px; color: var(--text-faint); }
  .ops { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .op { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: #cfcfcf; padding: 8px 10px; border-radius: 10px; background: #141414; }
  .op b { color: var(--accent); font-family: Sora, sans-serif; font-size: 12px; min-width: 14px; }
  .op.si { background: rgba(198,224,0,.14); color: #f5ffcc; font-weight: 600; }
  .q-graphic { margin: 10px 0; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 10px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .acciones .btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.rep { border-color: rgba(255,159,67,.45); color: var(--orange); background: rgba(255,159,67,.08); }
  .acciones[hidden] { display: none; }
  .voltear-hint { text-align: center; color: var(--text-faint); font-size: 12px; margin-top: 14px; }

  .fin { text-align: center; margin-top: 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 30px 22px; }
  .fin h2 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; }
  .fin .grande { font: 800 44px Sora, sans-serif; color: var(--accent); margin: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .fin p { color: var(--text-dim); font-size: 13px; line-height: 1.6; }
  .fin .botones { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 50px 10px; }
  [hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('mc:katex'))"></script>
<script src="assets/mc-config.js"></script>
<script src="assets/acceso.js"></script>
<script src="assets/pregunta.js"></script>
<script src="assets/cursos.js"></script>
<script src="assets/auth.js"></script>
</head>
<body>
<div class="wrap">
  <div class="backlink">
    <a class="back" id="backLink" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="backLabel">Volver</span></a>
    <a class="home-btn" href="index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
  </div>

  <div class="eyebrow" id="eyebrow">Flashcards</div>
  <h1 id="titulo">Cargando…</h1>
  <p class="lead" id="lead"></p>

  <!-- Elegir qué estudiar (desde la página del curso) -->
  <div id="elegir" hidden>
    <div class="paso">
      <div class="paso-ttl"><span class="n">1</span> ¿De dónde?</div>
      <div class="chips" id="chSec"></div>
    </div>
    <div class="paso" id="pasoAnio" hidden>
      <div class="paso-ttl"><span class="n">2</span> ¿Qué año?</div>
      <div class="chips" id="chAnio"></div>
    </div>
    <div class="paso" id="pasoTemas" hidden>
      <div class="paso-ttl"><span class="n">3</span> ¿Qué temas?</div>
      <div class="temas" id="lsTemas"></div>
    </div>
    <div class="paso" id="pasoCant" hidden>
      <div class="paso-ttl"><span class="n">4</span> ¿Cuántas tarjetas?</div>
      <div class="chips" id="chCant"></div>
    </div>
    <div id="pasoIr" hidden>
      <div class="resumen" id="resumen"></div>
      <button class="btn primary" id="btnEmpezar" type="button">Empezar</button>
    </div>
  </div>

  <!-- Candado: el mismo código de la sección -->
  <div class="lock" id="lock" hidden>
    <h2>Flashcards <span class="accent">Premium</span></h2>
    <p id="lockTexto">Ingresa tu código de alumno.</p>
    <input type="text" id="lockInput" placeholder="Ej: BIO-4X9K" autocomplete="off" autocapitalize="characters">
    <button class="btn primary" id="btnUnlock" type="button">Desbloquear</button>
    <div class="lock-error" id="lockError"></div>
    <a class="lock-whatsapp" id="lockWhatsapp" href="#" target="_blank" rel="noopener noreferrer">Escríbeme por WhatsApp</a>
  </div>

  <!-- Repaso con tarjetas -->
  <div id="juego" hidden>
    <div class="barra"><div class="track"><div class="fill" id="fill"></div></div><div class="cuenta" id="cuenta">0 / 0</div></div>
    <div class="marcador"><span class="ok" id="mOk">✓ 0 me la sé</span><span class="rep" id="mRep">↻ 0 por repasar</span></div>
    <div class="escena">
      <div class="carta" id="carta" role="button" tabindex="0" aria-label="Voltear tarjeta">
        <div class="cara frente" id="caraF"></div>
        <div class="cara reverso" id="caraR"></div>
      </div>
    </div>
    <div class="voltear-hint" id="hint">Toca la tarjeta para ver la respuesta</div>
    <div class="acciones" id="acciones" hidden>
      <button class="btn rep" id="btnRep" type="button">↻ Repasar</button>
      <button class="btn primary" id="btnSe" type="button">✓ Ya me la sé</button>
    </div>
  </div>

  <div class="fin" id="fin" hidden>
    <h2>¡Ronda terminada!</h2>
    <div class="grande" id="finNum">0</div>
    <p id="finTexto"></p>
    <div class="botones">
      <button class="btn primary" id="btnOtra" type="button">Repasar las que fallé</button>
      <button class="btn" id="btnNueva" type="button">Elegir otras tarjetas</button>
    </div>
  </div>

  <div class="state-msg" id="estado" hidden></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CURSO = (params.get('curso') || '').replace(/[^a-z0-9-]/g, '');
  const DIRECTO = params.get('sec') && params.get('year') && params.get('tema');
  const SECCIONES = [['libros', 'Libro'], ['seminarios', 'Seminarios'], ['banqueo', 'Banqueo']];
  const NOMBRE_SEC = Object.fromEntries(SECCIONES);
  const PRODUCTO = { libros: 'repaso-', seminarios: 'seminario-', banqueo: 'banqueo-' };
  const CODIGO_DE = { libros: 'Repaso', seminarios: 'Seminarios', banqueo: 'Banqueo' };
  const DIAS = [0, 1, 2, 4, 8, 16];   // caja → días hasta volver a verla
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hoy = () => Math.floor((Date.now() - 5 * 3600e3) / 864e5);   // día en Lima
  const ahora = () => Math.floor(Date.now() / 60000);

  const sel = { sec: null, anio: null, temas: new Set(), cant: 20 };
  let nombreCurso = CURSO, temasAnio = [], profAnio = [], mazo = '', estado = {}, cambios = {};

  function renderMath(el) {
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', () => renderMath(el), { once: true }); return; }
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  }
  function mostrar(id) { ['elegir', 'lock', 'juego', 'fin', 'estado'].forEach(x => { $(x).hidden = x !== id; }); $('lead').hidden = id === 'juego' || id === 'fin'; }
  function aviso(t) { $('estado').textContent = t; mostrar('estado'); }
  function chips(cont, lista, actual, alElegir) {
    cont.innerHTML = lista.map(x => `<button type="button" class="chip ${x[0] === actual ? 'on' : ''}" data-v="${esc(x[0])}" ${x[3] ? 'disabled' : ''}>${esc(x[1])}${x[2] ? ` <small>${esc(x[2])}</small>` : ''}</button>`).join('');
    cont.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => alElegir(b.dataset.v)));
  }

  /* ---------- Datos ---------- */
  function cargarTemas(sec, anio) {
    return fetch(CURSO + '/' + sec + '/data/' + encodeURIComponent(anio) + '.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('sin datos'); return r.json(); });
  }
  // Tarjetas que escribió el profesor en el panel (Supabase, tabla tarjetas)
  function cargarProf(sec, anio) {
    if (!window.MCAuth) return Promise.resolve([]);
    return MCAuth.listo.then(c => c.from('tarjetas').select('tema,orden,frente,reverso').eq('curso', CURSO).eq('seccion', sec).eq('anio', anio).order('orden'))
      .then(r => (r && !r.error && r.data) || [], () => []);
  }
  // Respuestas que no se entienden sin ver las alternativas ("A y B", "I y III", "VFV", "Todas las anteriores")
  function conAlternativas(q) {
    const o = q.options[q.correct], t = String(o.text || '').replace(/\$/g, '').trim();
    return !MCPregunta.sePuedeMezclar(q) || /^[\sIVX,yeo]+$/.test(t) || /^[VF\s]{2,}$/.test(t) || t.length < 1;
  }
  function cartasDe(tema, prof) {
    const n = pad(tema.num), out = [];
    (tema.questions || []).forEach((q, i) => {
      if (!q || !Array.isArray(q.options) || !q.options[q.correct]) return;
      out.push({ id: n + '#' + (i + 1), tema: n, nombre: tema.name, q, ops: conAlternativas(q) });
    });
    prof.filter(p => pad(p.tema) === n).forEach(p => out.push({ id: n + '#p' + p.orden, tema: n, nombre: tema.name, frente: p.frente, reverso: p.reverso }));
    return out;
  }

  /* ---------- Avance (qué tarjetas ya domina) ---------- */
  // estado[id] = [caja, día en que toca verla, minuto en que se marcó]
  function leerLocal(m) { try { return JSON.parse(localStorage.getItem('mc_tj_' + m) || '{}') || {}; } catch (e) { return {}; } }
  function guardarLocal() { try { localStorage.setItem('mc_tj_' + mazo, JSON.stringify(estado)); } catch (e) {} }
  function cargarEstado(m) {
    mazo = m; estado = leerLocal(m); cambios = {};
    if (!window.MCAuth) return Promise.resolve();
    return MCAuth.listo.then(c => c.from('tarjetas_estado').select('estado').eq('mazo', m).maybeSingle())
      .then(r => {
        const srv = (r && !r.error && r.data && r.data.estado) || {};
        Object.keys(srv).forEach(k => { const a = srv[k], b = estado[k]; if (Array.isArray(a) && (!b || (a[2] || 0) > (b[2] || 0))) estado[k] = a; });
        guardarLocal();
      }, () => {});
  }
  let envio = null;
  function subir() {
    const p = cambios; if (!Object.keys(p).length || !window.MCAuth || !MCAuth.usuario()) return;
    cambios = {};
    MCAuth.listo.then(c => c.rpc('guardar_tarjetas', { p_mazo: mazo, p_estado: p }))
      .then(r => { if (r && r.error) Object.assign(cambios, p, cambios); }, () => Object.assign(cambios, p, cambios));
  }
  function marcar(id, sabe) {
    const e = estado[id], caja = sabe ? Math.min((e ? e[0] : 0) + 1, 5) : 0;
    estado[id] = cambios[id] = [caja, hoy() + DIAS[caja], ahora()];
    guardarLocal();
    clearTimeout(envio); envio = setTimeout(subir, 4000);
    window.MCRacha ? MCRacha.respondio() : (window.mcRachaPend = (window.mcRachaPend || 0) + 1);
  }
  addEventListener('pagehide', subir);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') subir(); });
  const toca = c => { const e = estado[c.id]; return !e || e[1] <= hoy(); };

  /* ---------- Acceso: el mismo código de la sección ---------- */
  function conAcceso(sec) {
    const P = PRODUCTO[sec] + CURSO;
    if (MCAcceso.accesoLocal(P)) { MCAcceso.verificar(P).then(v => { if (!v.acceso) pedirCodigo(sec, v.mensaje); }); return Promise.resolve(true); }
    return MCAcceso.verificar(P).then(v => v.acceso || pedirCodigo(sec, v.mensaje), () => pedirCodigo(sec, 'No se pudo verificar tu acceso. Revisa tu conexión.'));
  }
  let alDesbloquear = null;
  function pedirCodigo(sec, mensaje) {
    $('lockTexto').innerHTML = `Las flashcards de <b>${esc(NOMBRE_SEC[sec])}</b> se abren con tu código de <b>${esc(CODIGO_DE[sec])}</b> de ${esc(nombreCurso)}. Si ya lo tienes, ingrésalo abajo.`;
    $('lockWhatsapp').href = 'https://wa.me/51917797543?text=' + encodeURIComponent('Hola! Quiero acceso a ' + CODIGO_DE[sec] + ' de ' + nombreCurso + ' en Modo Cachimbo 🎓');
    $('lockError').classList.toggle('show', !!mensaje); $('lockError').textContent = mensaje || '';
    $('lockWhatsapp').classList.toggle('show', !!mensaje);
    $('btnUnlock').dataset.sec = sec;
    mostrar('lock');
    return new Promise(res => { alDesbloquear = res; });
  }
  async function desbloquear() {
    const sec = $('btnUnlock').dataset.sec, codigo = $('lockInput').value.trim().toUpperCase();
    if (!codigo) { $('lockError').textContent = 'Ingresa tu código de acceso.'; $('lockError').classList.add('show'); return; }
    $('btnUnlock').disabled = true; $('btnUnlock').textContent = 'Verificando…';
    try {
      const r = await MCAcceso.activar(codigo, PRODUCTO[sec] + CURSO);
      if (r.ok) { const f = alDesbloquear; alDesbloquear = null; if (f) f(true); }
      else { $('lockError').textContent = r.mensaje || 'Código inválido.'; $('lockError').classList.add('show'); $('lockWhatsapp').classList.add('show'); }
    } catch (e) { $('lockError').textContent = 'No se pudo verificar el código. Revisa tu conexión.'; $('lockError').classList.add('show'); }
    $('btnUnlock').disabled = false; $('btnUnlock').textContent = 'Desbloquear';
  }
  $('btnUnlock').addEventListener('click', desbloquear);
  $('lockInput').addEventListener('keydown', e => { if (e.key === 'Enter') desbloquear(); });

  /* ---------- Elegir sección, año y temas ---------- */
  async function pintarSecciones() {
    const mans = await Promise.all(SECCIONES.map(s => MCCursos.manifest(CURSO, s[0])));
    const lista = SECCIONES.map((s, i) => [s[0], s[1], '', !(mans[i] || []).some(m => m.temas > 0)]);
    const elegir = v => { sel.sec = v; sel.anio = null; sel.temas.clear(); chips($('chSec'), lista, v, elegir); pintarAnios(mans[SECCIONES.findIndex(s => s[0] === v)]); };
    chips($('chSec'), lista, sel.sec, elegir);
    const disp = lista.filter(x => !x[3]);
    if (!disp.length) $('chSec').insertAdjacentHTML('afterend', '<p class="hint" style="margin-top:10px;">Este curso aún no tiene temas publicados.</p>');
    else if (disp.length === 1) elegir(disp[0][0]);
  }
  function pintarAnios(man) {
    ['pasoTemas', 'pasoCant', 'pasoIr'].forEach(x => { $(x).hidden = true; });
    $('pasoAnio').hidden = false;
    const lista = (man || []).filter(m => m.temas > 0).map(m => [m.id, m.label || m.id, m.temas + ' temas']);
    const elegir = v => { sel.anio = v; sel.temas.clear(); chips($('chAnio'), lista, v, elegir); pintarTemas(); };
    chips($('chAnio'), lista, sel.anio, elegir);
    if (lista.length === 1) elegir(lista[0][0]);
  }
  async function pintarTemas() {
    $('pasoTemas').hidden = false; ['pasoCant', 'pasoIr'].forEach(x => { $(x).hidden = true; });
    $('lsTemas').innerHTML = '<p class="hint">Cargando temas…</p>';
    const pedido = sel.sec + '|' + sel.anio;
    let temas, prof;
    try { [temas, prof] = await Promise.all([cargarTemas(sel.sec, sel.anio), cargarProf(sel.sec, sel.anio), cargarEstado(CURSO + '|' + sel.sec + '|' + sel.anio)]); }
    catch (e) { $('lsTemas').innerHTML = '<p class="hint">No se pudieron cargar los temas.</p>'; return; }
    if (pedido !== sel.sec + '|' + sel.anio) return;
    temasAnio = temas.map(t => ({ num: pad(t.num), name: t.name, cartas: cartasDe(t, prof) })).filter(t => t.cartas.length);
    temasAnio.forEach(t => sel.temas.add(t.num));
    const fila = (v, nm, ct, cls) => `<label class="tema ${cls || ''}"><input type="checkbox" value="${esc(v)}" checked><span class="nm">${nm}</span><span class="ct">${ct}</span></label>`;
    $('lsTemas').innerHTML = fila('*', 'Todo el año', temasAnio.reduce((s, t) => s + t.cartas.length, 0) + ' tarjetas', 'todo') +
      temasAnio.map(t => fila(t.num, `${esc(t.num)} · ${esc(t.name)}`, cuantasTxt(t.cartas))).join('');
    const cajas = [...$('lsTemas').querySelectorAll('input')];
    cajas.forEach(c => c.addEventListener('change', () => {
      if (c.value === '*') cajas.forEach(x => { x.checked = c.checked; });
      else cajas[0].checked = cajas.slice(1).every(x => x.checked);
      sel.temas = new Set(cajas.slice(1).filter(x => x.checked).map(x => x.value));
      pintarCantidad();
    }));
    pintarCantidad();
  }
  function cuantasTxt(cartas) { const r = cartas.filter(c => estado[c.id] && toca(c)).length; return cartas.length + ' tarjetas' + (r ? ' · ' + r + ' por repasar' : ''); }
  function elegidas() { return temasAnio.filter(t => sel.temas.has(t.num)).flatMap(t => t.cartas); }
  function pintarCantidad() {
    const total = elegidas().length;
    $('pasoCant').hidden = $('pasoIr').hidden = !total;
    if (!total) return;
    const lista = [[20, '20'], [50, '50'], [0, 'Todas', String(total)]].filter(x => !x[0] || x[0] < total).map(x => [String(x[0]), x[1], x[2]]);
    if (sel.cant && sel.cant >= total) sel.cant = 0;
    const elegir = v => { sel.cant = +v; chips($('chCant'), lista, v, elegir); resumen(); };
    chips($('chCant'), lista, String(sel.cant), elegir);
    resumen();
  }
  function resumen() {
    const c = elegidas(), n = sel.cant ? Math.min(sel.cant, c.length) : c.length;
    const rep = c.filter(x => estado[x.id] && toca(x)).length, nuevas = c.filter(x => !estado[x.id]).length;
    $('resumen').textContent = `${n} tarjetas` + (rep ? ` · ${rep} te tocan repasar hoy` : '') + (nuevas ? ` · ${nuevas} nuevas` : '');
  }
  $('btnEmpezar').addEventListener('click', async () => {
    const ok = await conAcceso(sel.sec);
    if (ok) empezar(elegidas(), sel.cant);
  });

  /* ---------- Juego ---------- */
  let cola = [], pos = 0, sabidas = 0, falladas = [], vistas = 0, total = 0;
  const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function empezar(cartas, cant) {
    // Primero las que toca repasar, luego las nuevas, al final las que ya domina
    const grupo = c => { const e = estado[c.id]; return !e ? 1 : toca(c) ? 0 : 2; };
    const orden = [0, 1, 2].flatMap(g => barajar(cartas.filter(c => grupo(c) === g)));
    cola = cant ? orden.slice(0, cant) : orden;
    if (!cola.length) { aviso('No hay tarjetas para repasar.'); return; }
    pos = 0; sabidas = 0; falladas = []; vistas = 0; total = cola.length;
    mostrar('juego'); pintarCarta();
  }
  function frenteHtml(c) {
    const tag = `<div class="tag">Tema ${esc(c.tema)} · ${esc(c.nombre)}${c.q ? '' : ' <span class="prof">Del profe</span>'}</div>`;
    if (!c.q) return tag + `<div class="txt">${MCPregunta.formato(c.frente).replace(/\n/g, '<br>')}</div><div class="pie">Toca para voltear</div>`;
    const r = MCPregunta.armar(c.q.text, {});
    const ops = c.ops ? `<div class="ops">${c.q.options.map(o => `<div class="op"><b>${esc(o.letter)}</b><span>${MCPregunta.formato(o.text)}</span></div>`).join('')}</div>` : '';
    return tag + `<div class="txt">${r.html}${c.q.graphic ? `<div class="q-graphic">${c.q.graphic}</div>` : ''}${r.derecha ? `<div class="q-graphic">${r.derecha}</div>` : ''}${ops}</div><div class="pie">Toca para voltear</div>`;
  }
  function reversoHtml(c) {
    const tag = `<div class="tag">Respuesta</div>`;
    if (!c.q) return tag + `<div class="txt resp">${MCPregunta.formato(c.reverso).replace(/\n/g, '<br>')}</div>`;
    const o = c.q.options[c.q.correct];
    if (c.ops) return tag + `<div class="ops" style="margin:auto 0;">${c.q.options.map((x, i) => `<div class="op ${i === c.q.correct ? 'si' : ''}"><b>${esc(x.letter)}</b><span>${MCPregunta.formato(x.text)}</span></div>`).join('')}</div>`;
    return tag + `<div class="txt resp">${MCPregunta.formato(o.text)}</div>`;
  }
  function pintarCarta() {
    const c = cola[pos];
    $('carta').classList.remove('vuelta');
    $('caraF').innerHTML = frenteHtml(c); $('caraR').innerHTML = reversoHtml(c);
    $('caraF').scrollTop = 0; $('caraR').scrollTop = 0;
    renderMath($('carta'));
    // La tarjeta crece con el contenido más largo de sus dos caras
    ajustar($('caraF'));
    $('acciones').hidden = true; $('hint').hidden = false;
    $('cuenta').textContent = Math.min(vistas + 1, total) + ' / ' + total;
    $('fill').style.width = (vistas / total * 100) + '%';
    $('mOk').textContent = '✓ ' + sabidas + ' me la sé';
    $('mRep').textContent = '↻ ' + falladas.length + ' por repasar';
  }
  // La tarjeta toma el alto de la cara que se ve (una lectura larga no agranda la respuesta)
  function ajustar(cara) {
    $('carta').style.minHeight = '340px';
    $('carta').style.minHeight = Math.max(340, cara.scrollHeight) + 'px';
  }
  function voltear() {
    if ($('juego').hidden) return;
    $('carta').classList.toggle('vuelta');
    ajustar($('carta').classList.contains('vuelta') ? $('caraR') : $('caraF'));
    $('acciones').hidden = false; $('hint').hidden = true;
  }
  function responder(sabe) {
    if ($('acciones').hidden) return;
    const c = cola[pos];
    marcar(c.id, sabe);
    if (!c.otraVez) {
      vistas++;
      if (sabe) sabidas++;
      else { falladas.push(c); cola.push(Object.assign({}, c, { otraVez: true })); }  // vuelve a salir al final de esta ronda
    }
    pos++;
    if (pos >= cola.length) terminar(); else pintarCarta();
  }
  function terminar() {
    subir();
    $('fill').style.width = '100%';
    $('finNum').textContent = sabidas + ' / ' + total;
    const nf = falladas.length;
    $('finTexto').textContent = (nf ? `Te sabías ${sabidas} de ${total} al primer intento. ${nf === 1 ? 'La que fallaste volverá a salir hasta que te la sepas.' : 'Las ' + nf + ' que fallaste volverán a salir hasta que te las sepas.'}`
      : '¡Te las sabías todas!') + ' Las que ya dominas aparecen cada vez menos, para que no se te olviden.';
    $('btnOtra').hidden = !nf;
    mostrar('fin');
  }
  $('carta').addEventListener('click', e => { if (!e.target.closest('summary, a')) voltear(); });
  $('carta').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); voltear(); } });
  document.addEventListener('keydown', e => {
    if ($('juego').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') responder(true);
    if (e.key === 'ArrowLeft') responder(false);
  });
  $('btnSe').addEventListener('click', () => responder(true));
  $('btnRep').addEventListener('click', () => responder(false));
  $('btnOtra').addEventListener('click', () => empezar(falladas.map(c => Object.assign({}, c, { otraVez: false })), 0));
  $('btnNueva').addEventListener('click', () => { if (DIRECTO) location.href = CURSO + '/index.html'; else { mostrar('elegir'); pintarTemas(); } });

  /* ---------- Inicio ---------- */
  async function iniciar() {
    if (!CURSO) { aviso('Falta indicar el curso.'); return; }
    const c = await MCCursos.curso(CURSO).catch(() => null);
    nombreCurso = (c && c.nombre) || CURSO;
    document.title = 'Flashcards · ' + nombreCurso + ' · Modo Cachimbo';
    if (DIRECTO) {
      const sec = params.get('sec'), anio = params.get('year'), num = pad(params.get('tema'));
      if (!PRODUCTO[sec]) { aviso('Sección no válida.'); return; }
      $('backLink').href = CURSO + '/' + sec + '/tema.html?year=' + encodeURIComponent(anio) + '&tema=' + encodeURIComponent(params.get('tema'));
      $('backLabel').textContent = 'Tema ' + num;
      $('eyebrow').textContent = 'Flashcards · ' + nombreCurso + ' · ' + NOMBRE_SEC[sec] + ' ' + anio;
      $('titulo').textContent = 'Tema ' + num;
      aviso('Cargando tarjetas…');
      if (!(await conAcceso(sec))) return;
      try {
        const [temas, prof] = await Promise.all([cargarTemas(sec, anio), cargarProf(sec, anio), cargarEstado(CURSO + '|' + sec + '|' + anio)]);
        const t = temas.find(x => pad(x.num) === num);
        if (!t) throw new Error('tema');
        $('titulo').textContent = t.name;
        const cartas = cartasDe(t, prof);
        $('lead').textContent = cartas.length + ' tarjetas. Voltea cada una y marca si ya te la sabes.';
        empezar(cartas, 0);
      } catch (e) { aviso('No se pudo cargar este tema.'); }
      return;
    }
    $('backLink').href = CURSO + '/index.html';
    $('backLabel').textContent = nombreCurso;
    $('eyebrow').textContent = 'Flashcards · ' + nombreCurso;
    $('titulo').textContent = 'Repasa con tarjetas';
    $('lead').textContent = 'Elige de dónde sacar las tarjetas. En cada una ves la pregunta, la volteas y marcas si ya te la sabes; las que fallas vuelven a salir.';
    mostrar('elegir');
    pintarSecciones();
  }
  iniciar();
})();
</script>
<script src="assets/alertas.js" defer></script>
</body>
