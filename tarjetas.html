<!DOCTYPE html>
<html lang="es">
<head>

<title>Flashcards · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Nunito:wght@700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
    --red: #E03C3C; --orange: #FF9F43;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px 16px 48px; }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; }

  .backlink { display: flex; align-items: center; margin-bottom: 18px; }
  .backlink a.back { display: inline-flex; align-items: center; gap: 6px; color: #888; text-decoration: none; font-size: 13px; font-weight: 500; }
  .backlink a.back:hover { color: var(--accent); }
  .backlink svg { width: 14px; height: 14px; }
  .home-btn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); color: #888; text-decoration: none; margin-left: 10px; }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }

  .eyebrow { font-size: 11.5px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 6vw, 30px); margin-top: 6px; line-height: 1.2; text-wrap: balance; }
  .lead { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin-top: 8px; }

  .paso { margin-top: 26px; }
  .paso-ttl { font-size: 12px; font-weight: 700; color: #cfcfcf; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .paso-ttl .n { width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font: 800 11px Sora, sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: #d8d8d8; border-radius: 100px; padding: 9px 16px; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .chip small { color: var(--text-faint); font-weight: 500; margin-left: 4px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #0e0e0e; }
  .chip.on small { color: rgba(14,14,14,.6); }
  .chip:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--text-faint); font-size: 12.5px; }

  .temas { display: flex; flex-direction: column; gap: 6px; }
  .tema { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 14px; cursor: pointer; font-size: 13.5px; }
  .tema input { accent-color: var(--accent); width: 17px; height: 17px; flex-shrink: 0; }
  .tema .nm { flex: 1; min-width: 0; }
  .tema .ct { color: var(--text-faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tema.todo { border-color: rgba(198,224,0,.3); font-weight: 600; }

  .btn { width: 100%; padding: 14px; border-radius: 13px; border: 1px solid #262626; background: #141414; color: #ccc; font: 700 14px Sora, sans-serif; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .resumen { text-align: center; color: var(--text-dim); font-size: 12.5px; margin: 22px 0 10px; font-variant-numeric: tabular-nums; }

  /* Candado */
  .lock { margin-top: 26px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .lock h2 { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .lock h2 .accent { color: var(--accent); }
  .lock p { color: #999; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
  .lock input { width: 100%; background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 13px 14px; color: #f2f2f2; font-size: 14px; text-align: center; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px; }
  .lock input:focus { outline: none; border-color: var(--accent); }
  .lock-error { display: none; margin-top: 14px; font-size: 12.5px; color: #ff8a8a; background: rgba(224,60,60,0.08); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .lock-error.show { display: block; }
  .lock-whatsapp { display: none; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(37,211,102,0.1); color: #25D366; text-decoration: none; font-size: 13px; font-weight: 700; }
  .lock-whatsapp.show { display: flex; }

  /* Juego */
  .barra { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .track { flex: 1; height: 8px; background: #161616; border-radius: 100px; overflow: hidden; position: relative; }
  .fill { height: 100%; width: 0; border-radius: 100px; transition: width .5s cubic-bezier(.34,1.56,.64,1);
    background: linear-gradient(90deg, #9fbf00, var(--accent) 60%, #e9ff6a); box-shadow: 0 0 14px rgba(198,224,0,.55); position: relative; overflow: hidden; }
  .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: brillo 2.4s ease-in-out infinite; }
  @keyframes brillo { 60%, 100% { transform: translateX(100%); } }
  .cuenta { font: 800 13px Sora, sans-serif; color: #e6e6e6; font-variant-numeric: tabular-nums; }
  .marcador { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font: 700 12px Sora, sans-serif; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 100px; }
  .pill.ok { color: var(--accent); background: rgba(198,224,0,.09); }
  .pill.rep { color: var(--orange); background: rgba(255,159,67,.09); }
  .pill.salta { animation: salta .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes salta { 40% { transform: scale(1.22); } }

  .escena { position: relative; perspective: 1200px; margin-top: 20px; padding-bottom: 34px; }
  /* Mazo: las tarjetas que faltan, asomando detrás */
  .mazo { position: absolute; left: 0; right: 0; top: 0; bottom: 34px; border-radius: 28px; background: linear-gradient(160deg, #1c1d17, #111); border: 1px solid #2c2d25; transition: transform .45s ease, opacity .45s ease; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .mazo.m1 { transform: translateY(12px) scale(.95) rotate(-1.5deg); opacity: .95; }
  .mazo.m2 { transform: translateY(24px) scale(.9) rotate(2deg); opacity: .6; }
  /* Sombra en el piso: se encoge cuando la tarjeta se levanta al girar */
  .piso { position: absolute; left: 10%; right: 10%; bottom: 14px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(198,224,0,.28), transparent); filter: blur(6px); z-index: 1; transition: transform .35s ease, opacity .35s ease; }
  .escena.alzada .piso { transform: scale(.65); opacity: .45; }
  .arrastre { position: relative; z-index: 2; touch-action: pan-y; will-change: transform; }
  .arrastre.entrar { animation: repartir .55s cubic-bezier(.22,1.3,.36,1); }
  @keyframes repartir { from { transform: translate(0, 30px) rotate(-3deg) scale(.9); opacity: 0; } 60% { opacity: 1; } }
  .flota { animation: flota 4s ease-in-out infinite; transform-style: preserve-3d; }
  @keyframes flota { 0%, 100% { transform: translateY(0) rotateX(0); } 50% { transform: translateY(-5px) rotateX(1.5deg); } }
  .escena.alzada .flota { animation-play-state: paused; }
  .carta { position: relative; min-height: 380px; cursor: pointer; transform-style: preserve-3d; -webkit-tap-highlight-color: transparent; transition: min-height .3s ease; }
  /* Giro: sube, voltea con un poco de rebote y vuelve a apoyarse */
  .carta.ida { animation: ida .8s cubic-bezier(.45,.05,.25,1) forwards; }
  .carta.vuelta { transform: rotateY(180deg); }
  .carta.regreso { animation: regreso .8s cubic-bezier(.45,.05,.25,1) forwards; }
  @keyframes ida { 0% { transform: rotateY(0) translateZ(0); } 45% { transform: rotateY(100deg) translateZ(70px) scale(1.04); } 75% { transform: rotateY(192deg) translateZ(20px); } 100% { transform: rotateY(180deg) translateZ(0); } }
  @keyframes regreso { 0% { transform: rotateY(180deg); } 45% { transform: rotateY(80deg) translateZ(70px) scale(1.04); } 75% { transform: rotateY(-12deg) translateZ(20px); } 100% { transform: rotateY(0); } }
  .cara { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; padding: 24px 24px 60px; display: flex; flex-direction: column; overflow: hidden; }
  .cara .cuerpo { flex: 1; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
  /* Reflejo de luz que cruza la tarjeta durante el giro */
  .cara::after { content: ''; position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%); transform: translateX(-120%); pointer-events: none; }
  .carta.ida .reverso::after, .carta.regreso .frente::after { animation: reflejo .8s ease .25s; }
  @keyframes reflejo { to { transform: translateX(120%); } }

  /* Estilo Duolingo: letra gruesa y redonda, tarjetas con borde inferior grueso */
  .carta, .acciones .btn, .pill, .cuenta, .combo, .fin, .fin h2, .fin .btn, .anillo .pct { font-family: 'Nunito', 'Inter', sans-serif; }
  .fin h2, .anillo .pct { font-weight: 900; }
  .frente { background: #ffffff; color: #3c3c3c; border: 2px solid #e5e5e5; border-bottom-width: 7px; }
  .frente .marca { position: absolute; right: 14px; bottom: -22px; font: 900 150px/1 Nunito, sans-serif; color: rgba(0,0,0,.04); pointer-events: none; }
  .reverso { transform: rotateY(180deg); color: #2b3300; padding-bottom: 28px;
    background: radial-gradient(90% 60% at 50% 40%, #e6ff5c, transparent 70%), #c6e000; border: 2px solid #b3cc00; border-bottom: 7px solid #8fa300; }
  .reverso::after { background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.6) 50%, transparent 62%); }

  .cara .tag { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; font-size: 13px; font-weight: 800; position: relative; }
  .cara .tag .num { font: 900 12px Nunito, sans-serif; letter-spacing: 1px; border-radius: 12px; padding: 5px 11px; }
  .frente .tag { color: #afafaf; }
  .frente .tag .num { background: #f2fbd0; color: #6b7d00; border: 2px solid #dbef7a; }
  .cara .tag .prof { color: #8e4ff0; background: #f3ecff; border: 2px solid #ddccff; border-radius: 12px; padding: 3px 9px; }
  .reverso .tag { color: rgba(43,51,0,.6); }
  .reverso .tag .num { background: #2b3300; color: #e6ff5c; }
  .cara .txt { font-size: 19px; line-height: 1.55; margin: auto 0; position: relative; font-weight: 800; }
  .frente .txt { color: #3c3c3c; }
  .cara .katex { font-size: 1.08em; }
  .reverso .resp .katex { font-size: 1.3em; }
  .frente .q-graphic, .frente .mcq-img { background: transparent; border: 0; padding: 4px 0; }
  .frente .mcq-lec { background: #f7f7f7; border-left-color: #c6e000; }
  .frente .mcq-lec summary { color: #4b4b4b; }
  .frente .mcq-tabla table { font-weight: 800; }
  .frente .mcq-tabla th { color: #3c3c3c; background: #f2fbd0; }
  .frente .mcq-tabla th, .frente .mcq-tabla td { border: 2px solid #e5e5e5; }

  /* La respuesta aparece palabra por palabra */
  .reverso .txt.resp { font: 900 clamp(24px, 7vw, 32px)/1.3 Nunito, sans-serif; color: #2b3300; text-align: center; }
  .resp .w { display: inline-block; opacity: 0; transform: translateY(14px) scale(.9); }
  .carta.vuelta .resp .w, .carta.ida .resp .w { animation: palabra .5s cubic-bezier(.22,1.3,.36,1) forwards; animation-delay: calc(.42s + var(--i) * 60ms); }
  @keyframes palabra { to { opacity: 1; transform: none; } }
  .chek { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 50%; background: #fff; color: #7a8f00; display: flex; align-items: center; justify-content: center; position: relative; transform: scale(0); box-shadow: 0 5px 0 #8fa300; }
  .chek svg { width: 30px; height: 30px; }
  .chek::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid #fff; opacity: 0; }
  .carta.vuelta .chek, .carta.ida .chek { animation: pop .55s cubic-bezier(.22,1.6,.36,1) .35s forwards; }
  .carta.vuelta .chek::before, .carta.ida .chek::before { animation: onda .9s ease-out .5s; }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes onda { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.9); } }

  .cara .pie { position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .3px; }
  .frente .pie { color: #afafaf; text-transform: uppercase; }
  .frente .pie .dedo { display: inline-block; font-size: 18px; animation: toque 1.6s ease-in-out infinite; }
  @keyframes toque { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-5px) scale(1.05); } 55% { transform: translateY(1px) scale(.92); } }
  .ops { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .op { display: flex; gap: 10px; align-items: center; font-size: 16px; font-weight: 800; padding: 10px 12px; border-radius: 14px; border: 2px solid; border-bottom-width: 4px; }
  .op b { font: 900 13px Nunito, sans-serif; min-width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid; }
  .frente .op { background: #fff; color: #4b4b4b; border-color: #e5e5e5; }
  .frente .op b { color: #afafaf; border-color: #e5e5e5; }
  .reverso .op { background: rgba(255,255,255,.35); color: rgba(43,51,0,.55); border-color: rgba(0,0,0,.06); }
  .reverso .op b { color: rgba(43,51,0,.5); border-color: rgba(0,0,0,.1); }
  .reverso .op.si { background: #fff; color: #2b3300; border-color: #fff; border-bottom-color: #8fa300; }
  .reverso .op.si b { background: #c6e000; color: #2b3300; border-color: #8fa300; }
  .q-graphic { margin: 10px 0; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 10px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }

  .sello { position: absolute; top: 26px; z-index: 3; font: 800 17px Sora, sans-serif; letter-spacing: 1.5px; padding: 8px 14px; border-radius: 12px; border: 3px solid; opacity: 0; pointer-events: none; }
  .sello.si { left: 20px; color: var(--accent); border-color: var(--accent); background: rgba(10,12,4,.85); transform: rotate(-12deg); }
  .sello.no { right: 20px; color: var(--orange); border-color: var(--orange); background: rgba(14,9,4,.85); transform: rotate(12deg); }

  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .acciones .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px; border-radius: 16px; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; border: 0; transition: transform .08s ease, box-shadow .08s ease; }
  .btn.rep { color: #fff; background: #ff9600; box-shadow: 0 5px 0 #cc7800; }
  #btnSe { color: #2b3300; background: var(--accent); box-shadow: 0 5px 0 #8fa300; }
  .acciones .btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .acciones.aparece { animation: aparece .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); } }
  .voltear-hint { text-align: center; color: #6a6a6a; font-size: 12px; margin-top: 6px; min-height: 18px; }
  .voltear-hint b { color: #9a9a9a; }

  .combo { position: fixed; left: 50%; top: 22%; z-index: 50; transform: translate(-50%, 0); pointer-events: none;
    font: 800 22px Sora, sans-serif; color: #0e0e0e; background: var(--accent); padding: 10px 20px; border-radius: 100px; box-shadow: 0 14px 40px rgba(198,224,0,.45);
    animation: combo 1.2s cubic-bezier(.34,1.56,.64,1) forwards; white-space: nowrap; }
  @keyframes combo { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 75% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(.95); } }

  .fin { text-align: center; margin-top: 26px; background: radial-gradient(120% 60% at 50% 0%, rgba(198,224,0,.12), transparent 60%), var(--surface); border: 1px solid var(--border); border-radius: 26px; padding: 30px 22px; position: relative; overflow: hidden; }
  .ico { width: 1.1em; height: 1.1em; flex-shrink: 0; vertical-align: -.18em; }
  .acciones .btn .ico { width: 20px; height: 20px; }
  .cara .pie .dedo .ico { width: 22px; height: 22px; color: #c6e000; }
  .combo { display: inline-flex; align-items: center; gap: 8px; }
  .combo .ico { width: 24px; height: 24px; color: #ff6b00; }
  .fin .medalla { width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: var(--accent); color: #2b3300; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #8fa300; animation: entrar .6s cubic-bezier(.34,1.56,.64,1); }
  .fin .medalla .ico { width: 38px; height: 38px; }
  .fin h2 { font-family: 'Sora', sans-serif; font-size: 23px; font-weight: 800; margin-top: 4px; }
  .anillo { position: relative; width: 168px; height: 168px; margin: 18px auto 10px; }
  .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anillo circle { fill: none; stroke-width: 12; }
  .anillo .base { stroke: #1d1d1d; }
  .anillo .arco { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.3,.8,.3,1); filter: drop-shadow(0 0 6px rgba(198,224,0,.6)); }
  .anillo .dentro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .anillo .pct { font: 800 38px Sora, sans-serif; color: var(--accent); font-variant-numeric: tabular-nums; }
  .anillo .de { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .fin .stats { display: flex; justify-content: center; gap: 10px; margin: 6px 0 14px; flex-wrap: wrap; }
  .fin p { color: var(--text-dim); font-size: 13px; line-height: 1.6; }
  .fin .botones { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
  .confeti { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: cae linear forwards; pointer-events: none; }
  @keyframes cae { to { transform: translate(var(--dx), 620px) rotate(var(--r)); opacity: .2; } }

  @media (prefers-reduced-motion: reduce) {
    .carta, .arrastre, .fill, .anillo .arco { transition: none !important; }
    .resp .w { opacity: 1; transform: none; filter: none; } .chek { transform: none; } .carta.ida { transform: rotateY(180deg); }
    .arrastre.entrar, .carta.ida, .carta.regreso, .flota, .resp .w, .chek, .cara::after, .frente .pie .dedo, .fill::after, .cara .pie svg, .combo, .confeti, .pill.salta, .acciones.aparece { animation: none !important; }
  }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 50px 10px; }
  [hidden] { display: none !important; }
</style>

  <div class="backlink">
    <a class="back" id="backLink" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="backLabel">Volver</span></a>
    <a class="home-btn" href="index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
  </div>

  <div class="eyebrow" id="eyebrow">Flashcards</div>
  <h1 id="titulo">Cargando…</h1>
  <p class="lead" id="lead"></p>

  <!-- Elegir qué estudiar (desde la página del curso) -->
  <div id="elegir" hidden>
    <div class="paso">
      <div class="paso-ttl"><span class="n">1</span> ¿De dónde?</div>
      <div class="chips" id="chSec"></div>
    </div>
    <div class="paso" id="pasoAnio" hidden>
      <div class="paso-ttl"><span class="n">2</span> ¿Qué año?</div>
      <div class="chips" id="chAnio"></div>
    </div>
    <div class="paso" id="pasoTemas" hidden>
      <div class="paso-ttl"><span class="n">3</span> ¿Qué temas?</div>
      <div class="temas" id="lsTemas"></div>
    </div>
    <div class="paso" id="pasoCant" hidden>
      <div class="paso-ttl"><span class="n">4</span> ¿Cuántas tarjetas?</div>
      <div class="chips" id="chCant"></div>
    </div>
    <div id="pasoIr" hidden>
      <div class="resumen" id="resumen"></div>
      <button class="btn primary" id="btnEmpezar" type="button">Empezar</button>
    </div>
  </div>

  <!-- Candado: el mismo código de la sección -->
  <div class="lock" id="lock" hidden>
    <h2>Flashcards <span class="accent">Premium</span></h2>
    <p id="lockTexto">Ingresa tu código de alumno.</p>
    <input type="text" id="lockInput" placeholder="Ej: BIO-4X9K" autocomplete="off" autocapitalize="characters">
    <button class="btn primary" id="btnUnlock" type="button">Desbloquear</button>
    <div class="lock-error" id="lockError"></div>
    <a class="lock-whatsapp" id="lockWhatsapp" href="#" target="_blank" rel="noopener noreferrer">Escríbeme por WhatsApp</a>
  </div>

  <!-- Repaso con tarjetas -->
  <div id="juego" hidden>
    <div class="barra"><div class="track"><div class="fill" id="fill"></div></div><div class="cuenta" id="cuenta">0 / 0</div></div>
    <div class="marcador"><span class="pill ok" id="mOk">0 me la sé</span><span class="pill rep" id="mRep">0 por repasar</span></div>
    <div class="escena" id="escena">
      <div class="mazo m2" id="m2"></div><div class="mazo m1" id="m1"></div>
      <div class="piso"></div>
      <div class="arrastre" id="arrastre">
        <div class="flota">
          <div class="carta" id="carta" role="button" tabindex="0" aria-label="Voltear tarjeta">
            <div class="cara frente" id="caraF"></div>
            <div class="cara reverso" id="caraR"></div>
          </div>
        </div>
        <div class="sello si" id="selloSi">ME LA SÉ</div>
        <div class="sello no" id="selloNo">REPASAR</div>
      </div>
    </div>
    <div class="acciones" id="acciones" hidden>
      <button class="btn rep" id="btnRep" type="button">Repasar</button>
      <button class="btn primary" id="btnSe" type="button">Ya me la sé</button>
    </div>
    <div class="voltear-hint" id="hint">Toca la tarjeta para ver la respuesta</div>
  </div>

  <div class="fin" id="fin" hidden>
    <div class="medalla" id="finMedalla"></div>
    <h2 id="finTitulo">¡Ronda terminada!</h2>
    <div class="anillo">
      <svg viewBox="0 0 120 120"><circle class="base" cx="60" cy="60" r="52"/><circle class="arco" id="finArco" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="dentro"><div class="pct" id="finPct">0%</div><div class="de" id="finNum">0 de 0</div></div>
    </div>
    <div class="stats"><span class="pill ok" id="finOk"></span><span class="pill rep" id="finRep"></span></div>
    <p id="finTexto"></p>
    <div class="botones">
      <button class="btn primary" id="btnOtra" type="button">Repasar las que fallé</button>
      <button class="btn" id="btnNueva" type="button">Elegir otras tarjetas</button>
    </div>
  </div>

  <div class="state-msg" id="estado" hidden></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CURSO = (params.get('curso') || '').replace(/[^a-z0-9-]/g, '');
  const DIRECTO = params.get('sec') && params.get('year') && params.get('tema');
  const SECCIONES = [['libros', 'Libro'], ['seminarios', 'Seminarios'], ['banqueo', 'Banqueo']];
  const NOMBRE_SEC = Object.fromEntries(SECCIONES);
  const PRODUCTO = { libros: 'repaso-', seminarios: 'seminario-', banqueo: 'banqueo-' };
  const CODIGO_DE = { libros: 'Repaso', seminarios: 'Seminarios', banqueo: 'Banqueo' };
  const DIAS = [0, 1, 2, 4, 8, 16];   // caja → días hasta volver a verla
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hoy = () => Math.floor((Date.now() - 5 * 3600e3) / 864e5);   // día en Lima
  const ahora = () => Math.floor(Date.now() / 60000);

  const sel = { sec: null, anio: null, temas: new Set(), cant: 20 };
  let nombreCurso = CURSO, temasAnio = [], profAnio = [], mazo = '', estado = {}, cambios = {};

  function renderMath(el) {
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', () => renderMath(el), { once: true }); return; }
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  }
  function mostrar(id) { ['elegir', 'lock', 'juego', 'fin', 'estado'].forEach(x => { $(x).hidden = x !== id; }); $('lead').hidden = id === 'juego' || id === 'fin'; }
  function aviso(t) { $('estado').textContent = t; mostrar('estado'); }
  function chips(cont, lista, actual, alElegir) {
    cont.innerHTML = lista.map(x => `<button type="button" class="chip ${x[0] === actual ? 'on' : ''}" data-v="${esc(x[0])}" ${x[3] ? 'disabled' : ''}>${esc(x[1])}${x[2] ? ` <small>${esc(x[2])}</small>` : ''}</button>`).join('');
    cont.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => alElegir(b.dataset.v)));
  }

  /* ---------- Datos ---------- */
  function cargarTemas(sec, anio) {
    return fetch(CURSO + '/' + sec + '/data/' + encodeURIComponent(anio) + '.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('sin datos'); return r.json(); });
  }
  // Tarjetas que escribió el profesor en el panel (Supabase, tabla tarjetas)
  function cargarProf(sec, anio) {
    if (!window.MCAuth) return Promise.resolve([]);
    return MCAuth.listo.then(c => c.from('tarjetas').select('tema,orden,frente,reverso').eq('curso', CURSO).eq('seccion', sec).eq('anio', anio).order('orden'))
      .then(r => (r && !r.error && r.data) || [], () => []);
  }
  // Respuestas que no se entienden sin ver las alternativas ("A y B", "I y III", "VFV", "Todas las anteriores")
  function conAlternativas(q) {
    const o = q.options[q.correct], t = String(o.text || '').replace(/\$/g, '').trim();
    return !MCPregunta.sePuedeMezclar(q) || /^[\sIVX,yeo]+$/.test(t) || /^[VF\s]{2,}$/.test(t) || t.length < 1;
  }
  function cartasDe(tema, prof) {
    const n = pad(tema.num), out = [];
    (tema.questions || []).forEach((q, i) => {
      if (!q || !Array.isArray(q.options) || !q.options[q.correct]) return;
      out.push({ id: n + '#' + (i + 1), tema: n, nombre: tema.name, q, ops: conAlternativas(q) });
    });
    prof.filter(p => pad(p.tema) === n).forEach(p => out.push({ id: n + '#p' + p.orden, tema: n, nombre: tema.name, frente: p.frente, reverso: p.reverso }));
    return out;
  }

  /* ---------- Avance (qué tarjetas ya domina) ---------- */
  // estado[id] = [caja, día en que toca verla, minuto en que se marcó]
  function leerLocal(m) { try { return JSON.parse(localStorage.getItem('mc_tj_' + m) || '{}') || {}; } catch (e) { return {}; } }
  function guardarLocal() { try { localStorage.setItem('mc_tj_' + mazo, JSON.stringify(estado)); } catch (e) {} }
  function cargarEstado(m) {
    mazo = m; estado = leerLocal(m); cambios = {};
    if (!window.MCAuth) return Promise.resolve();
    return MCAuth.listo.then(c => c.from('tarjetas_estado').select('estado').eq('mazo', m).maybeSingle())
      .then(r => {
        const srv = (r && !r.error && r.data && r.data.estado) || {};
        Object.keys(srv).forEach(k => { const a = srv[k], b = estado[k]; if (Array.isArray(a) && (!b || (a[2] || 0) > (b[2] || 0))) estado[k] = a; });
        guardarLocal();
      }, () => {});
  }
  let envio = null;
  function subir() {
    const p = cambios; if (!Object.keys(p).length || !window.MCAuth || !MCAuth.usuario()) return;
    cambios = {};
    MCAuth.listo.then(c => c.rpc('guardar_tarjetas', { p_mazo: mazo, p_estado: p }))
      .then(r => { if (r && r.error) Object.assign(cambios, p, cambios); }, () => Object.assign(cambios, p, cambios));
  }
  function marcar(id, sabe) {
    const e = estado[id], caja = sabe ? Math.min((e ? e[0] : 0) + 1, 5) : 0;
    estado[id] = cambios[id] = [caja, hoy() + DIAS[caja], ahora()];
    guardarLocal();
    clearTimeout(envio); envio = setTimeout(subir, 4000);
    window.MCRacha ? MCRacha.respondio() : (window.mcRachaPend = (window.mcRachaPend || 0) + 1);
  }
  addEventListener('pagehide', subir);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') subir(); });
  const toca = c => { const e = estado[c.id]; return !e || e[1] <= hoy(); };

  /* ---------- Acceso: el mismo código de la sección ---------- */
  function conAcceso(sec) {
    const P = PRODUCTO[sec] + CURSO;
    if (MCAcceso.accesoLocal(P)) { MCAcceso.verificar(P).then(v => { if (!v.acceso) pedirCodigo(sec, v.mensaje); }); return Promise.resolve(true); }
    return MCAcceso.verificar(P).then(v => v.acceso || pedirCodigo(sec, v.mensaje), () => pedirCodigo(sec, 'No se pudo verificar tu acceso. Revisa tu conexión.'));
  }
  let alDesbloquear = null;
  function pedirCodigo(sec, mensaje) {
    $('lockTexto').innerHTML = `Las flashcards de <b>${esc(NOMBRE_SEC[sec])}</b> se abren con tu código de <b>${esc(CODIGO_DE[sec])}</b> de ${esc(nombreCurso)}. Si ya lo tienes, ingrésalo abajo.`;
    $('lockWhatsapp').href = 'https://wa.me/51917797543?text=' + encodeURIComponent('Hola! Quiero acceso a ' + CODIGO_DE[sec] + ' de ' + nombreCurso + ' en Modo Cachimbo 🎓');
    $('lockError').classList.toggle('show', !!mensaje); $('lockError').textContent = mensaje || '';
    $('lockWhatsapp').classList.toggle('show', !!mensaje);
    $('btnUnlock').dataset.sec = sec;
    mostrar('lock');
    return new Promise(res => { alDesbloquear = res; });
  }
  async function desbloquear() {
    const sec = $('btnUnlock').dataset.sec, codigo = $('lockInput').value.trim().toUpperCase();
    if (!codigo) { $('lockError').textContent = 'Ingresa tu código de acceso.'; $('lockError').classList.add('show'); return; }
    $('btnUnlock').disabled = true; $('btnUnlock').textContent = 'Verificando…';
    try {
      const r = await MCAcceso.activar(codigo, PRODUCTO[sec] + CURSO);
      if (r.ok) { const f = alDesbloquear; alDesbloquear = null; if (f) f(true); }
      else { $('lockError').textContent = r.mensaje || 'Código inválido.'; $('lockError').classList.add('show'); $('lockWhatsapp').classList.add('show'); }
    } catch (e) { $('lockError').textContent = 'No se pudo verificar el código. Revisa tu conexión.'; $('lockError').classList.add('show'); }
    $('btnUnlock').disabled = false; $('btnUnlock').textContent = 'Desbloquear';
  }
  $('btnUnlock').addEventListener('click', desbloquear);
  $('lockInput').addEventListener('keydown', e => { if (e.key === 'Enter') desbloquear(); });

  /* ---------- Elegir sección, año y temas ---------- */
  async function pintarSecciones() {
    const mans = await Promise.all(SECCIONES.map(s => MCCursos.manifest(CURSO, s[0])));
    const lista = SECCIONES.map((s, i) => [s[0], s[1], '', !(mans[i] || []).some(m => m.temas > 0)]);
    const elegir = v => { sel.sec = v; sel.anio = null; sel.temas.clear(); chips($('chSec'), lista, v, elegir); pintarAnios(mans[SECCIONES.findIndex(s => s[0] === v)]); };
    chips($('chSec'), lista, sel.sec, elegir);
    const disp = lista.filter(x => !x[3]);
    if (!disp.length) $('chSec').insertAdjacentHTML('afterend', '<p class="hint" style="margin-top:10px;">Este curso aún no tiene temas publicados.</p>');
    else if (disp.length === 1) elegir(disp[0][0]);
  }
  function pintarAnios(man) {
    ['pasoTemas', 'pasoCant', 'pasoIr'].forEach(x => { $(x).hidden = true; });
    $('pasoAnio').hidden = false;
    const lista = (man || []).filter(m => m.temas > 0).map(m => [m.id, m.label || m.id, m.temas + ' temas']);
    const elegir = v => { sel.anio = v; sel.temas.clear(); chips($('chAnio'), lista, v, elegir); pintarTemas(); };
    chips($('chAnio'), lista, sel.anio, elegir);
    if (lista.length === 1) elegir(lista[0][0]);
  }
  async function pintarTemas() {
    $('pasoTemas').hidden = false; ['pasoCant', 'pasoIr'].forEach(x => { $(x).hidden = true; });
    $('lsTemas').innerHTML = '<p class="hint">Cargando temas…</p>';
    const pedido = sel.sec + '|' + sel.anio;
    let temas, prof;
    try { [temas, prof] = await Promise.all([cargarTemas(sel.sec, sel.anio), cargarProf(sel.sec, sel.anio), cargarEstado(CURSO + '|' + sel.sec + '|' + sel.anio)]); }
    catch (e) { $('lsTemas').innerHTML = '<p class="hint">No se pudieron cargar los temas.</p>'; return; }
    if (pedido !== sel.sec + '|' + sel.anio) return;
    temasAnio = temas.map(t => ({ num: pad(t.num), name: t.name, cartas: cartasDe(t, prof) })).filter(t => t.cartas.length);
    temasAnio.forEach(t => sel.temas.add(t.num));
    const fila = (v, nm, ct, cls) => `<label class="tema ${cls || ''}"><input type="checkbox" value="${esc(v)}" checked><span class="nm">${nm}</span><span class="ct">${ct}</span></label>`;
    $('lsTemas').innerHTML = fila('*', 'Todo el año', temasAnio.reduce((s, t) => s + t.cartas.length, 0) + ' tarjetas', 'todo') +
      temasAnio.map(t => fila(t.num, `${esc(t.num)} · ${esc(t.name)}`, cuantasTxt(t.cartas))).join('');
    const cajas = [...$('lsTemas').querySelectorAll('input')];
    cajas.forEach(c => c.addEventListener('change', () => {
      if (c.value === '*') cajas.forEach(x => { x.checked = c.checked; });
      else cajas[0].checked = cajas.slice(1).every(x => x.checked);
      sel.temas = new Set(cajas.slice(1).filter(x => x.checked).map(x => x.value));
      pintarCantidad();
    }));
    pintarCantidad();
  }
  function cuantasTxt(cartas) { const r = cartas.filter(c => estado[c.id] && toca(c)).length; return cartas.length + ' tarjetas' + (r ? ' · ' + r + ' por repasar' : ''); }
  function elegidas() { return temasAnio.filter(t => sel.temas.has(t.num)).flatMap(t => t.cartas); }
  function pintarCantidad() {
    const total = elegidas().length;
    $('pasoCant').hidden = $('pasoIr').hidden = !total;
    if (!total) return;
    const lista = [[20, '20'], [50, '50'], [0, 'Todas', String(total)]].filter(x => !x[0] || x[0] < total).map(x => [String(x[0]), x[1], x[2]]);
    if (sel.cant && sel.cant >= total) sel.cant = 0;
    const elegir = v => { sel.cant = +v; chips($('chCant'), lista, v, elegir); resumen(); };
    chips($('chCant'), lista, String(sel.cant), elegir);
    resumen();
  }
  function resumen() {
    const c = elegidas(), n = sel.cant ? Math.min(sel.cant, c.length) : c.length;
    const rep = c.filter(x => estado[x.id] && toca(x)).length, nuevas = c.filter(x => !estado[x.id]).length;
    $('resumen').textContent = `${n} tarjetas` + (rep ? ` · ${rep} te tocan repasar hoy` : '') + (nuevas ? ` · ${nuevas} nuevas` : '');
  }
  $('btnEmpezar').addEventListener('click', async () => {
    const ok = await conAcceso(sel.sec);
    if (ok) empezar(elegidas(), sel.cant);
  });

  /* ---------- Juego ---------- */
  let cola = [], pos = 0, sabidas = 0, falladas = [], vistas = 0, total = 0;
  const barajar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function empezar(cartas, cant) {
    // Primero las que toca repasar, luego las nuevas, al final las que ya domina
    const grupo = c => { const e = estado[c.id]; return !e ? 1 : toca(c) ? 0 : 2; };
    const orden = [0, 1, 2].flatMap(g => barajar(cartas.filter(c => grupo(c) === g)));
    cola = cant ? orden.slice(0, cant) : orden;
    if (!cola.length) { aviso('No hay tarjetas para repasar.'); return; }
    pos = 0; sabidas = 0; falladas = []; vistas = 0; total = cola.length; racha = 0;
    mostrar('juego'); pintarCarta();
  }
  // Íconos propios (sin emojis)
  const svg = (d, relleno) => `<svg class="ico" viewBox="0 0 24 24" ${relleno ? 'fill="currentColor" stroke="none"' : 'fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"'}>${d}</svg>`;
  const ICO = {
    si: svg('<polyline points="20 6 9 17 4 12"/>'),
    rep: svg('<path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><polyline points="3 21 3 16 8 16"/>'),
    toque: svg('<path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v1"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1.5a6 6 0 0 1-4.6-2.2l-3.4-4.2a2 2 0 0 1 3-2.6L9 14.5"/>'),
    profe: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
    fuego: svg('<path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z"/>', 1),
    rayo: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', 1),
    estrella: svg('<path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.8l-6.2 3.3 1.4-7L2 9.3l7-.8z"/>', 1),
    copa: svg('<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3a3 3 0 0 1-3 4"/><path d="M7 6H4a3 3 0 0 0 3 4"/>'),
    diana: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>'),
    libro: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>')
  };
  const ICONO_GIRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>';
  function etiqueta(c, extra) {
    return `<div class="tag"><span class="num">TEMA ${esc(c.tema)}</span><span>${esc(c.nombre)}</span>${extra || ''}</div>`;
  }
  // Respuesta palabra por palabra (si tiene fórmulas o formato, aparece entera)
  function palabras(html) {
    if (/[<$]/.test(html)) return `<span class="w" style="--i:0">${html}</span>`;
    return html.split(/\s+/).filter(Boolean).map((w, i) => `<span class="w" style="--i:${i}">${w}</span>`).join(' ');
  }
  const CHEK = '<div class="chek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
  function frenteHtml(c) {
    const tag = etiqueta(c, c.q ? '' : '<span class="prof">' + ICO.profe + ' Del profe</span>');
    const pie = `<div class="pie"><span class="dedo">${ICO.toque}</span> Toca para ver la respuesta</div><div class="marca">?</div>`;
    if (!c.q) return tag + `<div class="cuerpo"><div class="txt">${MCPregunta.formato(c.frente).replace(/\n/g, '<br>')}</div></div>` + pie;
    const r = MCPregunta.armar(c.q.text, {});
    const ops = c.ops ? `<div class="ops">${c.q.options.map(o => `<div class="op"><b>${esc(o.letter)}</b><span>${MCPregunta.formato(o.text)}</span></div>`).join('')}</div>` : '';
    return tag + `<div class="cuerpo"><div class="txt">${r.html}${c.q.graphic ? `<div class="q-graphic">${c.q.graphic}</div>` : ''}${r.derecha ? `<div class="q-graphic">${r.derecha}</div>` : ''}${ops}</div></div>` + pie;
  }
  function reversoHtml(c) {
    const tag = etiqueta(c, '<span>· Respuesta</span>');
    const pie = '';
    if (!c.q) return tag + `<div class="cuerpo"><div class="txt resp">${CHEK}${palabras(MCPregunta.formato(c.reverso).replace(/\n/g, '<br>'))}</div></div>` + pie;
    const o = c.q.options[c.q.correct];
    if (c.ops) return tag + `<div class="cuerpo"><div class="ops" style="margin:auto 0;">${c.q.options.map((x, i) => `<div class="op ${i === c.q.correct ? 'si' : ''}"><b>${esc(x.letter)}</b><span>${MCPregunta.formato(x.text)}</span></div>`).join('')}</div></div>` + pie;
    return tag + `<div class="cuerpo"><div class="txt resp">${CHEK}${palabras(MCPregunta.formato(o.text))}</div></div>` + pie;
  }
  const vibrar = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
  function saltar(el) { el.classList.remove('salta'); void el.offsetWidth; el.classList.add('salta'); }
  function pintarCarta() {
    const c = cola[pos];
    $('carta').classList.remove('ida', 'regreso'); volteada = false;
    $('caraF').innerHTML = frenteHtml(c); $('caraR').innerHTML = reversoHtml(c);
    $('caraF').scrollTop = 0; $('caraR').scrollTop = 0;
    renderMath($('carta'));
    ajustar($('caraF'));
    $('acciones').hidden = true; $('hint').hidden = false;
    $('hint').innerHTML = '';
    $('cuenta').textContent = Math.min(vistas + 1, total) + ' / ' + total;
    $('fill').style.width = (vistas / total * 100) + '%';
    $('mOk').innerHTML = ICO.si + sabidas + ' me la sé';
    $('mRep').innerHTML = ICO.rep + falladas.length + ' por repasar';
    // El mazo de atrás se achica cuando quedan pocas
    const quedan = cola.length - pos - 1;
    $('m1').style.opacity = quedan >= 1 ? '' : '0'; $('m2').style.opacity = quedan >= 2 ? '' : '0';
  }
  // La tarjeta toma el alto de la cara que se ve; si es muy larga, su contenido se desliza por dentro
  function ajustar(cara) {
    const t = cara.querySelector('.tag'), c = cara.querySelector('.cuerpo');
    const dentro = c ? [...c.children].reduce((h, x) => h + x.offsetHeight, 0) : 0;   // alto real del contenido, sin el espacio que lo centra
    const alto = (t ? t.offsetHeight + 18 : 0) + dentro + (cara === $('caraR') ? 70 : 100);
    $('carta').style.minHeight = Math.max(380, Math.min(alto, Math.max(420, innerHeight - 250))) + 'px';
  }
  let volteada = false, girando = null;
  function voltear() {
    if ($('juego').hidden || saliendo) return;
    const carta = $('carta');
    volteada = !volteada;
    carta.classList.remove('ida', 'regreso'); void carta.offsetWidth;
    carta.classList.add(volteada ? 'ida' : 'regreso');
    $('escena').classList.add('alzada'); clearTimeout(girando);
    girando = setTimeout(() => $('escena').classList.remove('alzada'), 650);
    ajustar(volteada ? $('caraR') : $('caraF'));
    vibrar(8);
    if ($('acciones').hidden) {
      $('acciones').hidden = false; $('acciones').classList.remove('aparece'); void $('acciones').offsetWidth; $('acciones').classList.add('aparece');
      $('hint').innerHTML = '<b>←</b> desliza para repasar · desliza para "me la sé" <b>→</b>';
    }
  }
  // La tarjeta sale volando hacia un lado y entra la siguiente desde el mazo
  let saliendo = false, racha = 0;
  function salir(sabe) {
    if (saliendo || $('acciones').hidden) return;
    saliendo = true;
    const a = $('arrastre');
    $(sabe ? 'selloSi' : 'selloNo').style.opacity = '1';
    a.style.transition = 'transform .38s cubic-bezier(.5,0,.75,0), opacity .38s ease';
    a.style.transform = `translate(${sabe ? 130 : -130}%, -20px) rotate(${sabe ? 24 : -24}deg)`;
    a.style.opacity = '0';
    vibrar(sabe ? 15 : [10, 40, 10]);
    setTimeout(() => {
      responder(sabe);
      a.style.transition = 'none'; a.style.transform = ''; a.style.opacity = '';
      $('selloSi').style.opacity = '0'; $('selloNo').style.opacity = '0';
      a.classList.remove('entrar'); void a.offsetWidth; a.classList.add('entrar');
      saliendo = false;
    }, 380);
  }
  function combo(texto) {
    const d = document.createElement('div'); d.className = 'combo'; d.innerHTML = texto;
    document.body.appendChild(d); setTimeout(() => d.remove(), 1300);
  }
  function responder(sabe) {
    const c = cola[pos];
    marcar(c.id, sabe);
    if (!c.otraVez) {
      vistas++;
      if (sabe) { sabidas++; saltar($('mOk')); }
      else { falladas.push(c); cola.push(Object.assign({}, c, { otraVez: true })); saltar($('mRep')); }  // vuelve a salir al final de esta ronda
    }
    racha = sabe ? racha + 1 : 0;
    if (racha >= 3 && racha % 3 === 0) combo((racha >= 9 ? ICO.estrella : racha >= 6 ? ICO.rayo : ICO.fuego) + ` ${racha} seguidas`);
    pos++;
    if (pos >= cola.length) terminar(); else pintarCarta();
  }

  // Deslizar con el dedo (o el mouse): derecha = me la sé, izquierda = repasar
  (function () {
    const a = $('arrastre');
    let x0 = null, y0 = 0, dx = 0, moviendo = false, ignorarClick = false;
    a.addEventListener('pointerdown', e => { if (saliendo) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moviendo = false; });
    a.addEventListener('pointermove', e => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      if (!moviendo && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - y0)) {
        moviendo = true; a.style.transition = 'none';
        try { a.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (!moviendo) return;
      const listo = !$('acciones').hidden, f = listo ? 1 : .35;
      a.style.transform = `translateX(${dx * f}px) rotate(${dx * f / 18}deg)`;
      if (listo) { $('selloSi').style.opacity = Math.max(0, Math.min(1, dx / 110)); $('selloNo').style.opacity = Math.max(0, Math.min(1, -dx / 110)); }
    });
    const soltar = () => {
      if (x0 === null) return;
      x0 = null;
      if (!moviendo) return;
      ignorarClick = true; setTimeout(() => { ignorarClick = false; }, 50);
      if (Math.abs(dx) > 100 && !$('acciones').hidden) { salir(dx > 0); return; }
      a.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)'; a.style.transform = '';
      $('selloSi').style.opacity = '0'; $('selloNo').style.opacity = '0';
      if ($('acciones').hidden && Math.abs(dx) > 60) { $('hint').innerHTML = '<b>Primero voltea la tarjeta</b> para ver la respuesta'; }
    };
    a.addEventListener('pointerup', soltar); a.addEventListener('pointercancel', soltar);
    $('carta').addEventListener('click', e => { if (ignorarClick || e.target.closest('summary, a')) return; voltear(); });
  })();

  function confeti() {
    const colores = ['#C6E000', '#e9ff6a', '#FF9F43', '#ffffff', '#a78bfa'];
    for (let i = 0; i < 70; i++) {
      const d = document.createElement('i'); d.className = 'confeti';
      d.style.left = Math.random() * 100 + '%'; d.style.background = colores[i % colores.length];
      d.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); d.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; d.style.animationDelay = (Math.random() * .5) + 's';
      $('fin').appendChild(d); setTimeout(() => d.remove(), 4000);
    }
  }
  function terminar() {
    subir();
    $('fill').style.width = '100%';
    const nf = falladas.length, pct = total ? Math.round(sabidas / total * 100) : 0;
    $('finMedalla').innerHTML = pct === 100 ? ICO.copa : pct >= 80 ? ICO.estrella : pct >= 50 ? ICO.diana : ICO.libro;
    $('finTitulo').textContent = pct === 100 ? '¡Perfecto!' : pct >= 80 ? '¡Muy bien!' : pct >= 50 ? '¡Vas bien!' : '¡Sigue practicando!';
    $('finNum').textContent = sabidas + ' de ' + total;
    $('finOk').innerHTML = ICO.si + sabidas + ' me la sé'; $('finRep').innerHTML = ICO.rep + nf + ' por repasar';
    $('finRep').hidden = !nf;
    $('finTexto').textContent = (nf ? `${nf === 1 ? 'La que fallaste volverá a salir hasta que te la sepas.' : 'Las ' + nf + ' que fallaste volverán a salir hasta que te las sepas.'}`
      : 'Te las sabías todas al primer intento.') + ' Las que ya dominas aparecen cada vez menos, para que no se te olviden.';
    $('btnOtra').hidden = !nf;
    mostrar('fin');
    // Anillo y número que suben solos
    const arco = $('finArco'), L = 326.7;
    arco.style.transition = 'none'; arco.style.strokeDashoffset = L; void arco.getBoundingClientRect();
    arco.style.transition = ''; arco.style.strokeDashoffset = L * (1 - pct / 100);
    const t0 = performance.now();
    (function paso(t) { const k = Math.min(1, (t - t0) / 1300); $('finPct').textContent = Math.round(pct * (1 - Math.pow(1 - k, 3))) + '%'; if (k < 1) requestAnimationFrame(paso); })(t0);
    if (pct >= 70 && !matchMedia('(prefers-reduced-motion: reduce)').matches) confeti();
    vibrar([20, 60, 30]);
  }
  $('carta').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); voltear(); } });
  document.addEventListener('keydown', e => {
    if ($('juego').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') salir(true);
    if (e.key === 'ArrowLeft') salir(false);
  });
  $('btnSe').innerHTML = ICO.si + ' Ya me la sé'; $('btnRep').innerHTML = ICO.rep + ' Repasar';
  $('btnSe').addEventListener('click', () => salir(true));
  $('btnRep').addEventListener('click', () => salir(false));
  $('btnOtra').addEventListener('click', () => empezar(falladas.map(c => Object.assign({}, c, { otraVez: false })), 0));
  $('btnNueva').addEventListener('click', () => { if (DIRECTO) location.href = CURSO + '/index.html'; else { mostrar('elegir'); pintarTemas(); } });

  /* ---------- Inicio ---------- */
  async function iniciar() {
    if (!CURSO) { aviso('Falta indicar el curso.'); return; }
    const c = await MCCursos.curso(CURSO).catch(() => null);
    nombreCurso = (c && c.nombre) || CURSO;
    document.title = 'Flashcards · ' + nombreCurso + ' · Modo Cachimbo';
    if (DIRECTO) {
      const sec = params.get('sec'), anio = params.get('year'), num = pad(params.get('tema'));
      if (!PRODUCTO[sec]) { aviso('Sección no válida.'); return; }
      $('backLink').href = CURSO + '/' + sec + '/tema.html?year=' + encodeURIComponent(anio) + '&tema=' + encodeURIComponent(params.get('tema'));
      $('backLabel').textContent = 'Tema ' + num;
      $('eyebrow').textContent = 'Flashcards · ' + nombreCurso + ' · ' + NOMBRE_SEC[sec] + ' ' + anio;
      $('titulo').textContent = 'Tema ' + num;
      aviso('Cargando tarjetas…');
      if (!(await conAcceso(sec))) return;
      try {
        const [temas, prof] = await Promise.all([cargarTemas(sec, anio), cargarProf(sec, anio), cargarEstado(CURSO + '|' + sec + '|' + anio)]);
        const t = temas.find(x => pad(x.num) === num);
        if (!t) throw new Error('tema');
        $('titulo').textContent = t.name;
        const cartas = cartasDe(t, prof);
        $('lead').textContent = cartas.length + ' tarjetas. Voltea cada una y marca si ya te la sabes.';
        empezar(cartas, 0);
      } catch (e) { aviso('No se pudo cargar este tema.'); }
      return;
    }
    $('backLink').href = CURSO + '/index.html';
    $('backLabel').textContent = nombreCurso;
    $('eyebrow').textContent = 'Flashcards · ' + nombreCurso;
    $('titulo').textContent = 'Repasa con tarjetas';
    $('lead').textContent = 'Elige de dónde sacar las tarjetas. En cada una ves la pregunta, la volteas y marcas si ya te la sabes; las que fallas vuelven a salir.';
    mostrar('elegir');
    pintarSecciones();
  }
  iniciar();
})();
</script>
<script src="assets/alertas.js" defer></script>
