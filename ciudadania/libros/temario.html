<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temario · Ciudadanía · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }

  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .logo span { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; }

  .page-title { padding: 20px 0 8px; }
  .page-title .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-title h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(26px, 5vw, 38px); margin-top: 8px; }
  .page-title p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }

  .tema-list { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
  .tema-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  .tema-card:hover { border-color: var(--accent); transform: translateX(3px); }
  .tema-num {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
  }
  .tema-info { flex: 1; }
  .tema-info .name { font-size: 14.5px; font-weight: 600; }
  .tema-info .count { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tema-card svg.arrow { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Libros</a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
      </div>
      <div class="logo"><div class="dot"></div><span id="badgeYear">Ciudadanía</span></div>
    </header>

    <div class="page-title">
      <div class="eyebrow" id="eyebrowYear">Temario</div>
      <h1>Ciudadanía — 10 temas</h1>
      <p>Elige un tema para ver sus 10 preguntas con la respuesta marcada, o practícalo directo en modo quiz.</p>
    </div>

    <div class="tema-list" id="temaList"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const list = document.getElementById('temaList');

  if (!year) {
    list.innerHTML = '<div class="state-msg">No se indicó ningún año. Vuelve a la lista de libros.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Ciudadanía · ' + year;
    document.getElementById('eyebrowYear').textContent = 'Temario · ' + year;

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(temas => {
        temas.forEach(t => {
          const a = document.createElement('a');
          a.className = 'tema-card';
          a.href = `tema.html?year=${encodeURIComponent(year)}&tema=${t.num}`;
          a.innerHTML = `
            <div class="tema-num">${t.num}</div>
            <div class="tema-info">
              <div class="name">${t.name}</div>
              <div class="count">${t.questions.length} preguntas</div>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          `;
          list.appendChild(a);
        });
      })
      .catch(() => {
        list.innerHTML = '<div class="state-msg">Todavía no hay temario cargado para ' + year + '.</div>';
      });
  }
</script>
</body>
</html>
