<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema · Ciudadanía · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 60px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(5,5,5,0.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid #161616;
  }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .course-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .course-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  .page-head { padding: 30px 0 6px; }
  .page-head .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-head h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 5vw, 32px); margin-top: 8px; text-transform: lowercase; }
  .page-head p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }

  .quiz-cta {
    margin: 22px 0 34px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .quiz-cta span { font-size: 13.5px; color: var(--text-dim); }
  .quiz-cta a {
    background: var(--accent); color: #0e0e0e; text-decoration: none;
    padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .qcard { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
  .qcard .qnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
    margin-bottom: 14px;
  }
  .qcard .qtext { font-size: 14.5px; line-height: 1.7; color: #ececec; white-space: pre-line; margin-bottom: 16px; }

  .opt-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; font-size: 13.5px; color: var(--text-dim); border-top: 1px solid #1a1a1a; }
  .opt-row:first-of-type { border-top: none; }
  .opt-row .letter { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .opt-row.correct { color: #f5ffcc; font-weight: 600; }
  .opt-row.correct .letter { background: var(--accent); color: #0e0e0e; }
  .opt-row.correct svg { margin-left: auto; width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }
  .q-graphic { margin: 4px 0 14px; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 12px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }

  /* ===== Aviso central: claves no oficiales ===== */
  body.aviso-open { overflow: hidden; }
  .aviso-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: avisoFade .25s ease;
  }
  .aviso-overlay.closing { animation: avisoFadeOut .2s ease forwards; }
  .aviso-card {
    position: relative; overflow: hidden;
    width: 100%; max-width: 480px;
    background: linear-gradient(160deg, #1a1a1a 0%, var(--surface) 60%);
    border: 1px solid #2c2c2c;
    border-radius: 26px;
    padding: 40px 34px 30px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(251,191,36,0.06);
    animation: avisoPop .35s cubic-bezier(.2,.9,.3,1.2);
  }
  .aviso-overlay.closing .aviso-card { animation: avisoPopOut .2s ease forwards; }
  .aviso-card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, #FBBF24, var(--accent));
  }
  .aviso-icon {
    width: 76px; height: 76px; margin: 0 auto 20px;
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(251,191,36,0.12);
    border: 1px solid rgba(251,191,36,0.28);
    color: #FBBF24;
    box-shadow: 0 0 40px rgba(251,191,36,0.18);
  }
  .aviso-icon svg { width: 38px; height: 38px; }
  .aviso-tag {
    font-size: 11.5px; letter-spacing: 3px; text-transform: uppercase;
    color: #FBBF24; font-weight: 700; margin-bottom: 10px;
  }
  .aviso-card h2 {
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: clamp(22px, 5vw, 28px); line-height: 1.2; color: var(--text);
    margin-bottom: 14px;
  }
  .aviso-card p { font-size: 15px; line-height: 1.65; color: var(--text-dim); }
  .aviso-card p b { color: var(--text); }
  .aviso-btn {
    margin-top: 28px; width: 100%;
    background: var(--accent); color: #0e0e0e;
    border: none; border-radius: 14px; cursor: pointer;
    padding: 15px 20px;
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .aviso-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(198,224,0,0.25); }
  .aviso-btn:active { transform: translateY(0); }
  @keyframes avisoFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes avisoFadeOut { to { opacity: 0; } }
  @keyframes avisoPop { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes avisoPopOut { to { opacity: 0; transform: scale(.96); } }
  @media (max-width: 480px) {
    .aviso-card { padding: 34px 22px 22px; border-radius: 22px; }
    .aviso-icon { width: 64px; height: 64px; border-radius: 18px; }
    .aviso-icon svg { width: 32px; height: 32px; }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="aviso-open">
  <div class="aviso-overlay" id="avisoOverlay" role="dialog" aria-modal="true" aria-labelledby="avisoTitle">
    <div class="aviso-card">
      <div class="aviso-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <div class="aviso-tag">Aviso importante</div>
      <h2 id="avisoTitle">Claves no oficiales</h2>
      <p>Las claves de las preguntas <b>no son oficiales</b>. Son de elaboración propia y pueden contener errores. Verifícalas con tu profesor.</p>
      <button class="aviso-btn" id="avisoBtn" type="button">Entendido</button>
    </div>
  </div>

  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" id="backLink" href="temario.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="backLabel">Temario</span></a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
      </div>
      <div class="course-badge"><div class="dot"></div><span id="badgeYear">Ciudadanía</span></div>
    </header>

    <div class="page-head">
      <div class="eyebrow" id="eyebrowTema">tema · modo estudio</div>
      <h1 id="temaTitle">Cargando…</h1>
      <p id="countLabel"></p>
    </div>

    <div class="quiz-cta">
      <span>¿Ya las repasaste? Practícalas en modo quiz.</span>
      <a id="practicarLink" href="#">Practicar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
    </div>

    <div id="qlist"></div>
  </div>

<script>
  // Aviso central: aparece cada vez que se abre el tema
  (function () {
    const overlay = document.getElementById('avisoOverlay');
    const btn = document.getElementById('avisoBtn');
    function cerrarAviso() {
      if (!overlay || overlay.classList.contains('closing')) return;
      overlay.classList.add('closing');
      setTimeout(() => { overlay.remove(); document.body.classList.remove('aviso-open'); }, 200);
    }
    btn.addEventListener('click', cerrarAviso);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrarAviso(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarAviso(); });
    btn.focus();
  })();
</script>
<script>
  function renderMath(el) {
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }


  // Escapa HTML y convierte *texto* en cursiva (para nombres científicos, etc.)
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function formatQText(str) {
    let esc = escapeHtml(str);
    esc = esc.replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, '<u>$1</u>');
    esc = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    esc = esc.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return esc;
  }

  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const temaNum = params.get('tema');
  const qlistEl = document.getElementById("qlist");

  document.getElementById('backLink').href = 'temario.html?year=' + encodeURIComponent(year || '');
  document.getElementById('backLabel').textContent = 'Temario ' + (year || '');

  if (!year || !temaNum) {
    qlistEl.innerHTML = '<div class="state-msg">Falta indicar año y tema. Vuelve al temario.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Ciudadanía · ' + year;
    document.getElementById('practicarLink').href = `quiz.html?year=${encodeURIComponent(year)}&tema=${encodeURIComponent(temaNum)}`;

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(temas => {
        const tema = temas.find(t => t.num === temaNum);
        if (!tema) throw new Error('tema no encontrado');

        document.getElementById('eyebrowTema').textContent = `tema ${tema.num} · modo estudio`;
        document.getElementById('temaTitle').textContent = tema.name;
        document.getElementById('countLabel').textContent = `${tema.questions.length} preguntas con respuesta marcada.`;

        tema.questions.forEach((q, idx) => {
          const div = document.createElement('div');
          div.className = 'qcard';
          let optsHtml = '';
          q.options.forEach((o, i) => {
            const isCorrect = i === q.correct;
            optsHtml += `<div class="opt-row ${isCorrect ? 'correct' : ''}">
              <div class="letter">${o.letter}</div>
              <span>${formatQText(o.text)}</span>
              ${isCorrect ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
            </div>`;
          });
          div.innerHTML = `<div class="qnum">${idx + 1}</div><div class="qtext">${formatQText(q.text).replace(/\n/g,'<br>')}</div>${q.graphic ? `<div class="q-graphic">${q.graphic}</div>` : ''}${optsHtml}`;
          renderMath(div);
          qlistEl.appendChild(div);
        });
      })
      .catch(() => {
        qlistEl.innerHTML = '<div class="state-msg">No se pudo cargar este tema.</div>';
      });
  }
</script>
</body>
</html>
