<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170C46">
<meta name="robots" content="noindex">
<title>Arcade · Retos del nivel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Lilita+One&display=swap">
<link rel="stylesheet" href="assets/arcade-retos.css">
<style>
/* Laboratorio de retos: vitrina para probar cada minijuego por separado.
   Todavía no está enlazada desde el Arcade; el mapa de niveles la usará después. */
html, body { margin: 0; height: 100%; }
body { font-family: "Nunito", system-ui, sans-serif; color: #fff; background: #170C46; }
.lab { position: fixed; inset: 0; overflow: auto; z-index: 1; }
.lab .rt-cielo { position: fixed; }
.lab-in { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 40px; }
.lab-cint { display: inline-block; padding: 5px 20px 6px; font: 400 14px/1 "Lilita One", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #1C2600; background: linear-gradient(180deg, #F4FF8A, #C6E000 60%, #9CB800); border: 2px solid #2A3300; box-shadow: 0 3px 0 #2A3300; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 50%, 100% 100%, 0 100%, 10px 50%); }
.lab h1 { margin: 10px 0 4px; font: 400 clamp(30px, 8vw, 46px)/1.05 "Lilita One", sans-serif; text-transform: uppercase; letter-spacing: .02em; text-shadow: 0 4px 0 #2A1A66; }
.lab .sub { margin: 0 0 20px; font: 800 16px/1.4 "Nunito", sans-serif; color: #E2DBFF; }
.lab-todo { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; height: 66px; border-radius: 20px; cursor: pointer; font: 400 clamp(21px, 6vw, 28px)/1 "Lilita One", sans-serif; white-space: nowrap; letter-spacing: .04em; color: #fff; text-transform: uppercase; -webkit-text-stroke: 5px #1F2600; paint-order: stroke fill;
  background: linear-gradient(180deg, #F4FF8A, #C6E000 55%, #A8C000); border: 4px solid #1F2600; box-shadow: 0 7px 0 #1F2600, inset 0 3px 0 rgba(255,255,255,.5); margin-bottom: 26px; }
.lab-todo:active { transform: translateY(5px); box-shadow: 0 2px 0 #1F2600; }
.lab-todo svg { width: 34px; height: 34px; }
.lab h2 { margin: 0 0 12px; font: 400 20px/1 "Lilita One", sans-serif; letter-spacing: .04em; color: #C6E000; text-transform: uppercase; }
.lab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 14px; }
.lab-card { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; cursor: pointer; text-align: left; color: #fff; font: inherit;
  background: linear-gradient(180deg, rgba(60,40,150,.92), rgba(36,22,104,.92)); border: 2px solid #6A54C8; box-shadow: 0 5px 0 #1A0F4A; transition: transform .1s; }
.lab-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #1A0F4A; }
.lab-card .ic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 16px; background: rgba(16,8,48,.6); border: 2px solid rgba(198,224,0,.4); }
.lab-card .ic svg { width: 38px; height: 38px; }
.lab-card b { display: block; font: 400 19px/1.1 "Lilita One", sans-serif; letter-spacing: .02em; }
.lab-card span { display: block; margin-top: 4px; font: 700 13px/1.3 "Nunito", sans-serif; color: #D6CEFA; }
.lab-card em { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px; font: normal 900 10px/1 "Nunito", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #1C2600; background: #C6E000; }
.lab-nota { margin-top: 22px; font: 700 13px/1.5 "Nunito", sans-serif; color: #CFC6F5; }
</style>
</head>
<body>
<div class="lab rt" style="position:fixed">
  <div class="lab-in">
    <span class="lab-cint">Isla 1 · Nivel 1</span>
    <h1>Poblamiento americano</h1>
    <p class="sub">Retos del nivel: juegos cortos al estilo Duolingo para repasar teorías, rutas y sitios del Lítico peruano.</p>
    <button class="lab-todo" id="todo"><svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#1F2600"/><path d="M13.5 10.5l10 6.5-10 6.5z" fill="#C6E000"/></svg>Jugar nivel completo</button>
    <h2>Probar cada juego</h2>
    <div class="lab-grid" id="grid"></div>
    <p class="lab-nota" id="nota"></p>
  </div>
</div>
<script src="assets/arcade-sonido.js"></script>
<script src="assets/arcade-retos.js"></script>
<script>
(function () {
  var INFO = {
    imagen: ['Elige la imagen', 'Como Duolingo: 4 dibujos, toca el correcto.'],
    relacionar: ['Toca los pares', 'Dos columnas: une investigador y teoría.'],
    parejas: ['Cartas parejas', 'Memoria: voltea y encuentra sitio y región.'],
    completar: ['Completa la frase', 'Banco de palabras que se tocan.'],
    ordenar: ['Línea de tiempo', 'Ordena los sitios del más antiguo al más reciente.'],
    sopa: ['Sopa de letras', 'Arrastra el dedo sobre las palabras.'],
    vf: ['Contrarreloj', 'Desliza la carta: verdadero o falso en 45 s.']
  };
  fetch('assets/arcade-retos/hp-01-poblamiento.json').then(function (r) { return r.json(); }).then(function (data) {
    var grid = document.getElementById('grid'), todos = data.retos.concat(data.extra || []);
    document.getElementById('nota').textContent = data.nota;
    todos.forEach(function (r) {
      var i = INFO[r.tipo] || [r.titulo, ''];
      var b = document.createElement('button'); b.className = 'lab-card';
      b.innerHTML = '<span class="ic">' + (MCRetos.iconos[r.tipo] || '') + '</span><span><b>' + i[0] + '</b><span>' + (r.pregunta || i[1]) + '</span>' + (data.retos.indexOf(r) < 0 ? '<em>Extra</em>' : '') + '</span>';
      b.onclick = function () { MCRetos.jugar({ titulo: data.titulo, retos: [r] }); };
      grid.appendChild(b);
    });
    document.getElementById('todo').onclick = function () { MCRetos.jugar({ titulo: 'Nivel ' + data.nivel + ' · ' + data.titulo, retos: data.retos }); };
    var q = new URLSearchParams(location.search), solo = q.get('reto');
    if (solo) { var r = todos.filter(function (x) { return x.id === solo || x.tipo === solo; })[0]; if (r) MCRetos.jugar({ titulo: data.titulo, retos: [r] }); }
    else if (q.get('nivel')) document.getElementById('todo').click();
  });
})();
</script>
</body>
</html>
