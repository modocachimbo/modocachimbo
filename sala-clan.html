<title>Sala de clan · Modo Cachimbo</title>
<!--
  Modo Cachimbo · Sala de clan (clan vs clan en vivo, amistosa)
  Crear una sala gasta 1 ticket (se canjea con rayos o lo regala el panel).
  El rival entra con el código de 5; todos ven la misma pregunta al mismo tiempo.
  Servidor: supabase/104-clanes-sala.sql (clan_sala_crear, _entrar, _ver, _empezar, _responder, _salir,
  clan_sala_mia, mis_tickets, canjear_ticket). Las preguntas salen de los libros (cursos/*/libros/data).
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800;1,900&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346; --borde: #2C2549;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --oro: #FFC800; --rojo: #FF4B4B; --azul: #1CB0F6; --nar: #FF9600; --ok: #58CC02;
    --ca: #C6E000; --cb: #1CB0F6;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  }
  body { background: radial-gradient(900px 500px at 50% -200px, rgba(176,124,255,.18), transparent 70%), var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; min-height: 100vh; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  header.top { display: flex; align-items: center; gap: 14px; padding: 22px 0 18px; }
  header.top h1 { flex: 1; display: flex; align-items: center; gap: 18px; min-width: 0; font: italic 900 46px/1 var(--display); text-transform: uppercase; color: var(--accent); padding-top: 4px; text-shadow: 0 3px 0 rgba(0,0,0,.45); white-space: nowrap; }
  header.top h1::after { content: ""; flex: 1; height: 2px; min-width: 20px; background: linear-gradient(90deg, rgba(198,224,0,.45), rgba(198,224,0,0)); }
  .c-volver { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 46px; padding: 0 16px 0 10px; border-radius: 10px; background: var(--surface-2); border: 2px solid #352E58; border-bottom-width: 5px; color: var(--text); font-weight: 900; font-size: 15px; text-decoration: none; transform: skewX(-10deg); }
  .c-volver > * { transform: skewX(10deg); }
  .c-volver svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 640px) { header.top { gap: 10px; padding: 16px 0 14px; } header.top h1 { font-size: 32px; gap: 10px; } }
  .estado { color: var(--text-dim); text-align: center; padding: 40px 10px; }
  .card { background: linear-gradient(180deg, #1b1533, #141027); border: 1.5px solid #2a2346; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .h2 { font: italic 900 24px/1 var(--display); text-transform: uppercase; color: #fff; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .h2 em { font-style: italic; color: var(--text-dim); font-size: 17px; }
  .small { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
  .lb { display: block; font: 900 11px/1 Nunito, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); margin: 14px 0 8px; }
  .dos { display: grid; gap: 14px; }
  @media (min-width: 860px) { .dos { grid-template-columns: 1.25fr 1fr; align-items: start; } }

  .cb { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 48px; padding: 0 18px; border-radius: 12px; font: italic 900 19px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; cursor: pointer; border: 0; border-bottom: 4px solid rgba(0,0,0,.35); text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .cb:active { transform: translateY(2px); border-bottom-width: 2px; }
  .cb:disabled { opacity: .5; cursor: default; }
  .cb.l { background: linear-gradient(180deg, #e2f75a, #C6E000); color: #14101f; }
  .cb.g { background: #241d44; color: #fff; border: 2px solid #352E58; border-bottom-width: 4px; }
  .cb.r { background: #3a1528; color: #ff9a9a; border: 2px solid #5a2338; border-bottom-width: 4px; }
  .cb.wa { background: #22C55E; color: #fff; }
  .cb.w { width: 100%; }
  .cb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .inp { width: 100%; height: 50px; border-radius: 12px; background: #0f0b1e; border: 2px solid #352E58; padding: 0 12px; color: #fff; font: 800 16px Nunito, sans-serif; outline: none; }
  .inp:focus { border-color: var(--accent); }
  .inp.code { font: 1000 28px/1 Nunito, sans-serif; letter-spacing: .32em; text-align: center; color: var(--accent); text-transform: uppercase; }
  .err { color: #ff8a8a; font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* Ticket */
  .ticket { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(110deg, #2b2a07, #1a1730 60%); border: 1.5px solid rgba(198,224,0,.45); overflow: hidden; }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }
  .ticket::before { left: -11px; } .ticket::after { right: -11px; }
  .ticket .tk { flex: none; width: 58px; height: 42px; }
  .ticket b { font: italic 900 30px/1 var(--display); color: var(--accent); }
  .ticket .t { flex: 1; min-width: 0; }
  .ticket .t span { display: block; font: 900 12px Nunito, sans-serif; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .canje { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .canje .cb { height: 40px; font-size: 16px; }
  .rayo { display: inline-flex; align-items: center; gap: 4px; color: #6FC8FF; font-weight: 900; }

  /* Opciones de la sala */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 40px; padding: 0 14px; border-radius: 12px; background: #1b1533; border: 2px solid #2f2852; color: var(--text); font: 900 14px Nunito, sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .chip img { width: 20px; height: 20px; }
  .chip.on { border-color: var(--accent); background: rgba(198,224,0,.12); color: #fff; box-shadow: 0 0 0 3px rgba(198,224,0,.12); }
  .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg3 .chip { justify-content: center; height: 54px; flex-direction: column; gap: 0; font: italic 900 22px/1 var(--display); }
  .seg3 .chip small { font: 800 11px Nunito, sans-serif; color: var(--text-dim); margin-top: 2px; font-style: normal; }

  /* Sala: VS */
  .vs { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 22px 16px 18px; border-radius: 22px; overflow: hidden;
        background: radial-gradient(260px 160px at 18% 50%, color-mix(in srgb, var(--ca) 22%, transparent), transparent 70%), radial-gradient(260px 160px at 82% 50%, color-mix(in srgb, var(--cb) 22%, transparent), transparent 70%), linear-gradient(180deg, #1d1638, #130f26);
        border: 1.5px solid #2f2852; margin-bottom: 14px; }
  .vs .lado { text-align: center; min-width: 0; }
  .vs .esc { display: block; width: 92px; height: 104px; margin: 0 auto 6px; filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .vs .esc svg { width: 100%; height: 100%; }
  .vs .nm { font: italic 900 22px/1 var(--display); text-transform: uppercase; color: #fff; overflow-wrap: anywhere; }
  .vs .pt { font: italic 900 40px/1 var(--display); margin-top: 6px; }
  .vs .pt small { display: block; font: 800 11px Nunito, sans-serif; color: var(--text-dim); font-style: normal; letter-spacing: .06em; text-transform: uppercase; }
  .vs .x { font: italic 900 46px/1 var(--display); color: #fff; text-shadow: 0 0 22px rgba(198,224,0,.5); }
  .vs .vacio .esc { opacity: .35; }
  .vs .vacio .nm { color: var(--text-faint); }
  .pulso { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rojo); box-shadow: 0 0 0 0 rgba(255,75,75,.6); animation: pulso 1.6s infinite; vertical-align: 2px; margin-right: 6px; }
  @keyframes pulso { 70% { box-shadow: 0 0 0 9px rgba(255,75,75,0); } 100% { box-shadow: 0 0 0 0 rgba(255,75,75,0); } }
  @media (max-width: 560px) { .vs .esc { width: 66px; height: 76px; } .vs .nm { font-size: 17px; } .vs .x { font-size: 34px; } .vs .pt { font-size: 30px; } }

  .codigo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .codigo .c { font: 1000 40px/1 Nunito, sans-serif; letter-spacing: .28em; color: var(--accent); }
  .codigo .sp { flex: 1; }
  .codigo .cb { height: 42px; font-size: 16px; }
  .info { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .info span { padding: 5px 10px; border-radius: 999px; background: #221c3d; border: 1px solid #332b57; font: 900 12px Nunito, sans-serif; color: var(--text-dim); }

  .equipos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .eq { border-radius: 16px; padding: 12px; background: #120e22; border: 1.5px solid #2a2346; }
  .eq h3 { font: italic 900 18px/1 var(--display); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 6px; }
  .eq h3 span { color: var(--text-dim); }
  .jug { display: flex; align-items: center; gap: 8px; padding: 6px 0; min-width: 0; }
  .jug .ft { width: 34px; height: 34px; flex: none; }
  .jug b { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jug em { font: italic 900 16px/1 var(--display); font-style: italic; }
  .jug.yo b { color: var(--accent); }
  .slot { height: 46px; border-radius: 10px; border: 2px dashed #2f2852; margin: 4px 0; display: grid; place-items: center; color: var(--text-faint); font-size: 12px; }
  @media (max-width: 560px) { .equipos { grid-template-columns: 1fr; } }

  /* Juego */
  .marca { position: sticky; top: 8px; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(21,17,39,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1.5px solid #2f2852; margin-bottom: 12px; }
  .marca .m { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .marca .m.b { flex-direction: row-reverse; text-align: right; }
  .marca .esc { width: 34px; height: 38px; flex: none; } .marca .esc svg { width: 100%; height: 100%; }
  .marca .m b { font: italic 900 26px/1 var(--display); }
  .marca .m small { display: block; font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reloj { position: relative; width: 56px; height: 56px; }
  .reloj svg { width: 56px; height: 56px; transform: rotate(-90deg); }
  .reloj circle { fill: none; stroke-width: 6; }
  .reloj .f { stroke: #2a2346; } .reloj .v { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .reloj b { position: absolute; inset: 0; display: grid; place-items: center; font: italic 900 22px/1 var(--display); }
  .reloj.poco .v { stroke: var(--rojo); }
  .barra-q { display: flex; gap: 4px; margin-bottom: 12px; }
  .barra-q i { flex: 1; height: 6px; border-radius: 3px; background: #2a2346; }
  .barra-q i.ok { background: var(--ok); } .barra-q i.mal { background: var(--rojo); } .barra-q i.ya { background: #5b5480; } .barra-q i.act { background: var(--accent); }
  .preg { font-size: 16px; line-height: 1.5; font-weight: 800; }
  .preg .tag { display: inline-block; font: 900 11px Nunito, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .preg img { max-width: 100%; border-radius: 10px; }
  .alts { list-style: none; display: grid; gap: 8px; margin-top: 14px; }
  .alts button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #1b1533; border: 2px solid #2f2852; border-bottom-width: 4px; text-align: left; cursor: pointer; font: 800 15px/1.35 Nunito, sans-serif; color: var(--text); }
  .alts button i { flex: none; width: 30px; height: 30px; border-radius: 9px; background: #2a2346; display: grid; place-items: center; font: italic 900 17px/1 var(--display); font-style: normal; }
  .alts button:not(:disabled):hover { border-color: #4a417a; }
  .alts button.sel { border-color: var(--accent); background: rgba(198,224,0,.1); }
  .alts button.ok { border-color: var(--ok); background: rgba(88,204,2,.14); } .alts button.ok i { background: var(--ok); color: #0b1a00; }
  .alts button.mal { border-color: var(--rojo); background: rgba(255,75,75,.12); } .alts button.mal i { background: var(--rojo); color: #fff; }
  .alts button:disabled { cursor: default; }
  .veredicto { margin-top: 12px; min-height: 26px; text-align: center; font: italic 900 22px/1 var(--display); text-transform: uppercase; }
  .veredicto.ok { color: var(--ok); } .veredicto.mal { color: var(--rojo); } .veredicto.esp { color: var(--text-dim); font-size: 17px; }
  .cuenta { display: grid; place-items: center; min-height: 52vh; text-align: center; }
  .cuenta b { font: italic 900 120px/1 var(--display); color: var(--accent); text-shadow: 0 0 40px rgba(198,224,0,.45); animation: late 1s ease infinite; }
  @keyframes late { 0% { transform: scale(1.25); opacity: .4; } 30% { transform: scale(1); opacity: 1; } }

  /* Resultado */
  .gana { text-align: center; padding: 8px 0 4px; }
  .gana .tit { font: italic 900 44px/1 var(--display); text-transform: uppercase; color: var(--oro); text-shadow: 0 0 30px rgba(255,200,0,.35); }
  .gana .tit.emp { color: #fff; }
  .mvp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mvp .m { border-radius: 16px; padding: 14px; text-align: center; background: linear-gradient(180deg, rgba(255,200,0,.12), transparent); border: 1.5px solid rgba(255,200,0,.35); }
  .mvp .m .ft { width: 58px; height: 58px; margin: 0 auto 6px; display: block; }
  .mvp .m small { display: block; font: 900 11px Nunito, sans-serif; letter-spacing: .14em; color: var(--oro); }
  .mvp .m b { display: block; font-size: 15px; margin-top: 2px; }
  .premio { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 12px; border-radius: 14px; background: rgba(255,200,0,.1); border: 1px solid rgba(255,200,0,.3); font-weight: 900; margin-top: 12px; }
  .cb.comp { background: linear-gradient(180deg, #ffd84d, #FFB800); color: #2a1a00; }
  .foto-fondo { position: fixed; inset: 0; z-index: 60; background: rgba(5,3,12,.86); display: grid; place-items: center; padding: 16px; }
  .foto-caja { width: min(420px, 100%); text-align: center; }
  .foto-caja img { width: 100%; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .foto-caja .bt { display: flex; gap: 10px; margin-top: 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #241d44; border: 1.5px solid #3a3266; padding: 12px 18px; border-radius: 14px; font-weight: 900; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 92vw; }
  /* ===== Sala de espera: arena con el búho de cada jugador, un lado por clan (como la del duelo) ===== */
  .arena { --lima: #C6E000; --dim: #A99FC8; --bh0: 150px; position: relative; margin: 0 0 14px; border-radius: 24px; overflow: hidden; text-align: center; border: 2px solid #2a2350; border-bottom-width: 5px;
    background: radial-gradient(120% 70% at 50% 108%, #3b1f7a 0%, transparent 55%), linear-gradient(180deg, #120b2c 0%, #1c1142 55%, #0e0922 100%); }
  .arena::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
    background: conic-gradient(from 200deg at 15% -10%, transparent 0 10deg, color-mix(in srgb, var(--ca) 22%, transparent) 14deg, transparent 22deg),
                conic-gradient(from 130deg at 85% -10%, transparent 0 10deg, color-mix(in srgb, var(--cb) 22%, transparent) 14deg, transparent 22deg),
                conic-gradient(from 165deg at 50% -20%, transparent 0 8deg, rgba(255,255,255,.10) 11deg, transparent 15deg); }
  .arena .franja { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, color-mix(in srgb, var(--ca) 11%, transparent), transparent 45%, transparent 55%, color-mix(in srgb, var(--cb) 12%, transparent)); }
  .arena .piso { position: absolute; left: -10%; right: -10%; bottom: 0; height: 34%; pointer-events: none; background: radial-gradient(60% 100% at 50% 0%, #2c1a5e, #120a29 70%);
    border-top: 2px solid rgba(198,224,0,.22); transform: perspective(500px) rotateX(35deg); transform-origin: top; }
  .arena .piso::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 60px); }
  .arena .a-cab { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0 18px; }
  .arena .a-tit { font: italic 900 22px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: #fff; opacity: .9; }
  .arena .a-tit b { color: var(--accent); letter-spacing: .12em; }
  .arena .lados { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; padding: 10px 14px 18px; align-items: end; }
  .arena .ld { position: relative; min-width: 0; border-radius: 20px; padding: 6px 4px 0; background: radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--k) 20%, transparent), transparent 70%); }
  .arena .lcab { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; min-width: 0; }
  .arena .lcab .e { width: 58px; height: 65px; flex: none; filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--k) 55%, transparent)); }
  .arena .lcab .e svg { width: 100%; height: 100%; }
  .arena .lcab .t { min-width: 0; text-align: left; }
  .arena .lcab b { display: block; font: italic 900 26px/1 var(--display); text-transform: uppercase; color: var(--k); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arena .lcab small { display: block; font: 800 12px/1.3 Nunito, sans-serif; color: var(--dim); margin-top: 3px; }
  .arena .lcab small i { font-style: normal; color: #58CC02; }
  .arena .ld.vacio .lcab .e { opacity: .3; filter: grayscale(1); }
  .arena .ld.vacio .lcab b { color: var(--text-faint); }
  .arena .jgs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; align-items: end; }
  .arena .vsx { align-self: center; margin-bottom: 90px; font: italic 900 64px/1 var(--display); color: #fff; text-shadow: 0 0 24px rgba(198,224,0,.7), 0 4px 0 rgba(0,0,0,.5); padding: 0 6px; }
  .arena .sl { --jc: var(--k); position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; container-type: inline-size; }
  .arena .bh-w { position: relative; z-index: 2; width: 100%; height: min(var(--bh0), 118cqw); display: flex; align-items: flex-end; justify-content: center; }
  .arena .bh-w[data-jug] { cursor: pointer; }
  .arena .bh { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; animation: vaiven 4s ease-in-out infinite; transform-origin: 50% 100%; }
  .arena .ld.b .bh { scale: -1 1; }
  .arena .sl:nth-child(2n) .bh { animation-delay: -1.3s; } .arena .sl:nth-child(3n) .bh { animation-delay: -2.4s; }
  @keyframes vaiven { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .arena .bh .mcb-antiguo { aspect-ratio: 200 / 210; }
  .arena .bh .mcb-antiguo svg { width: 100% !important; height: 100% !important; overflow: visible; }
  .arena .bh .mcb { position: relative; height: 100%; width: auto; max-width: none; z-index: 1; cursor: inherit; }
  .arena .sl.entra .bh-w { animation: caeArena .75s cubic-bezier(.3, 1.45, .5, 1) both; }
  @keyframes caeArena { 0% { transform: translateY(-46px) scale(.85); opacity: 0; } 60% { opacity: 1; } }

      if (mvp && me && mvp.yo) { txt('MVP DE LA SALA', W / 2 + 26, 1155, 'italic 900 38px ' + D, '#C6E000'); c.font = 'italic 900 38px ' + D; estrella(W / 2 - c.measureText('MVP DE LA SALA').width / 2 - 8, 1142, 22); }
      else txt(S.titulo + ' · ' + S.n + ' preguntas', W / 2, 1155, '800 28px ' + N, '#A99FC8');
      txt('modocachimbo.github.io', W / 2, 1270, '900 30px ' + N, '#6F6690');
      var f = new Date(); txt(f.toLocaleDateString('es-PE', { day: 'numeric', month: 'long', year: 'numeric' }), W / 2, 1310, '700 24px ' + N, '#6F6690');
      return new Promise(function (ok) { cv.toBlob(function (bl) { ok(bl); }, 'image/png'); });
    });
  }
  function mostrarFoto(bl) {
    var url = URL.createObjectURL(bl), nombre = 'victoria-modo-cachimbo.png', archivo = null;
    try { archivo = new File([bl], nombre, { type: 'image/png' }); } catch (e) {}
    var puede = archivo && navigator.canShare && navigator.canShare({ files: [archivo] });
    var d = document.createElement('div'); d.className = 'foto-fondo';
    d.innerHTML = '<div class="foto-caja"><img src="' + url + '" alt="Tu resultado"><div class="bt">' + (puede ? '<button type="button" class="cb comp" style="flex:1" data-f="compartir">Compartir</button>' : '') +
      '<a class="cb l" style="flex:1" href="' + url + '" download="' + nombre + '">Descargar</a><button type="button" class="cb g" data-f="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-f]');
      if ((b && b.dataset.f === 'cerrar') || e.target === d) { d.remove(); URL.revokeObjectURL(url); return; }
      if (b && b.dataset.f === 'compartir') navigator.share({ files: [archivo], title: 'Modo Cachimbo', text: '¡Sala de clan en Modo Cachimbo!' }).catch(function () {});
    });
  }

  /* ---------- Pintar y sondeo ---------- */
  var NOMBRE = {};
  function pintarSala() {
    clearInterval(sondeo); sondeo = 0;
    if (S.estado === 'cancelada') { app.innerHTML = '<div class="card estado"><div class="h2" style="justify-content:center">Sala cerrada</div><p class="small">La sala se canceló o venció sin empezar. Si era tuya, el ticket volvió.</p><a class="cb l" style="margin-top:14px" href="sala-clan.html">Volver</a></div>'; return; }
    if (S.estado === 'espera') {
      // Si ya está la sala en pantalla, solo se actualizan la arena y los botones (los búhos no se reinician)
      if (document.getElementById('arenaClan') && document.getElementById('lbBtns')) document.getElementById('lbBtns').innerHTML = lobbyBtns(); else app.innerHTML = lobby();
      pintarArena(); sondeo = setInterval(visible(refrescar), 3000); return;
    }
    if (S.estado === 'fin') { clearInterval(tic); tic = 0; app.innerHTML = resultado(); son('bien'); if (S.yo && S.yo.premio == null) setTimeout(refrescar, 2500); return; }
    // En juego: preguntas cargadas una sola vez; marcador cada 4 s
    var seguir = function () { if (!tic) { tic = setInterval(bucle, 200); bucle(); } sondeo = setInterval(visible(refrescar), 4000); };
    if (!QS) cargarRefs(S.preguntas).then(function (L) { QS = L; if (window.MCPregunta) MCPregunta.rangos(L.map(function (q) { return q || {}; })); seguir(); }); else seguir();
    var m = document.getElementById('marca'); if (m) m.innerHTML = marca();
  }
  function visible(fn) { return function () { if (!document.hidden) fn(); }; }
  function refrescar() {
    return rpc('clan_sala_ver', { p_codigo: COD }).then(function (d) {
      var antes = S && S.estado; S = d; desfase = new Date(d.ahora).getTime() - Date.now();
      Object.keys((d.yo && d.yo.resp) || {}).forEach(function (i) { var r = d.yo.resp[i]; mios[i] = { k: r[0], ok: r[1], p: r[2] }; });
      if (antes === 'juego' && d.estado === 'juego') { var m = document.getElementById('marca'); if (m) m.innerHTML = marca(); return; }
      pintarSala();
    }, function (e) { app.innerHTML = '<div class="card estado"><p>' + esc(error(e)) + '</p><a class="cb l" style="margin-top:14px" href="sala-clan.html">Volver</a></div>'; clearInterval(sondeo); });
  }

  /* ---------- Clics ---------- */
  app.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('#alts button'))) { responder(+el.dataset.k); return; }
    if ((el = e.target.closest('[data-invitar]'))) { var en = location.origin + location.pathname + '?c=' + S.codigo; if (navigator.share) navigator.share({ title: 'Modo Cachimbo', text: '¡Sala de clan! Entra con el código ' + S.codigo, url: en }).catch(function () {}); else A.copiar(en, 'Enlace copiado: pásalo a tu clan'); return; }
    if ((el = e.target.closest('[data-jug]')) && window.MCTarjeta && MCTarjeta.ver) { MCTarjeta.ver(+el.dataset.jug); return; }
    if ((el = e.target.closest('[data-vercursos]'))) { verCursos = !verCursos; app.innerHTML = inicio(); return; }
    if ((el = e.target.closest('[data-curso]'))) { F.curso = el.dataset.curso; app.innerHTML = inicio(); return; }
    if ((el = e.target.closest('[data-n]'))) { F.n = +el.dataset.n; app.innerHTML = inicio(); return; }
    if ((el = e.target.closest('[data-seg]'))) { F.seg = +el.dataset.seg; app.innerHTML = inicio(); return; }
    if ((el = e.target.closest('[data-formato]'))) { F.formato = +el.dataset.formato; app.innerHTML = inicio(); return; }
    if ((el = e.target.closest('[data-canje]'))) {
      el.disabled = true;
      rpc('canjear_ticket').then(function (t) { MIO.tickets = t.tickets; MIO.rayos = t.rayos; son('bien'); toast('¡Canjeaste 1 ticket de sala!'); app.innerHTML = inicio(); }, function (x) { toast(error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-crear]'))) {
      var er = document.getElementById('eCrear'); el.disabled = true; el.textContent = 'Armando preguntas…';
      var lista = F.curso === 'mezcla' ? CURSOS.map(function (c) { return c.id; }) : F.curso.indexOf('a:') === 0 ? CURSOS.filter(function (c) { return c.area === F.curso.slice(2); }).map(function (c) { return c.id; }) : [F.curso];
      var nom = F.curso === 'mezcla' ? 'Mezcla de todo' : F.curso.indexOf('a:') === 0 ? (AREAS.filter(function (a) { return 'a:' + a.id === F.curso; })[0] || {}).nombre : NOMBRE[F.curso];
      armar(lista, F.n).then(function (L) {
        if (L.length < F.n) throw new Error('Con esa opción solo hay ' + L.length + ' preguntas. Elige otra.');
        return rpc('clan_duelo_crear', { p: { titulo: nom, curso: F.curso === 'mezcla' || F.curso.indexOf('a:') === 0 ? 'todos' : F.curso, fuente: 'libro', n: F.n, seg: F.seg, por_lado: String(F.formato), preguntas: L.map(function (x) { return { ref: x.ref, c: x.q.correct, k: x.q.options.length }; }) } });
      }).then(function (cod) { location.href = 'duelo.html?d=' + cod; }, function (x) { er.textContent = x && x.message && x.message.indexOf('Con esa') === 0 ? x.message : error(x); app.innerHTML = inicio(); document.getElementById('eCrear').textContent = er.textContent; });
      return;
    }
    if ((el = e.target.closest('[data-entrar]'))) {
      var c = (document.getElementById('iCod').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 5 && c.length !== 6) { document.getElementById('eEntrar').textContent = 'El código tiene 6 letras o números.'; return; }
      el.disabled = true;
      if (c.length === 6) { rpc('entrar_duelo', { p_codigo: c }).then(function () { location.href = 'duelo.html?d=' + c; }, function (x) { document.getElementById('eEntrar').textContent = /No existe/.test(String(x && x.message)) ? ERR.sala_no_existe : error(x); el.disabled = false; }); return; }
      rpc('clan_sala_entrar', { p_codigo: c }).then(function () { location.href = 'sala-clan.html?c=' + c; }, function (x) { document.getElementById('eEntrar').textContent = error(x); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-unirme]'))) {
      el.disabled = true;
      rpc('clan_sala_entrar', { p_codigo: S.codigo }).then(refrescar, function (x) { document.getElementById('eSala').textContent = error(x); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-empezar]'))) {
      el.disabled = true;
      rpc('clan_sala_empezar', { p_codigo: S.codigo }).then(refrescar, function (x) { document.getElementById('eSala').textContent = error(x); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-salir]'))) {
      el.disabled = true;
      rpc('clan_sala_salir', { p_codigo: S.codigo }).then(function () { location.href = 'sala-clan.html'; }, function (x) { toast(error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-compartir]'))) { el.disabled = true; fotoVictoria().then(mostrarFoto, function () { toast('No se pudo armar la imagen.'); }).then(function () { el.disabled = false; }); return; }
    if ((el = e.target.closest('[data-copiar]'))) { A.copiar(el.dataset.copiar, 'Enlace copiado'); return; }
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'iCod') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); });

  /* ---------- Arranque ---------- */
  var empezado = false;
  function empezar(u) {
    if (!u || empezado) return; empezado = true;
    fetch('assets/cursos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).catch(function () { return {}; }).then(function (reg) {
      CURSOS = ((reg && reg.cursos) || []).filter(function (c) { return !c.oculto; }).sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
      AREAS = (reg && reg.areas) || []; CURSOS.forEach(function (c) { NOMBRE[c.id] = c.nombre; });
      if (COD) return refrescar();
      return Promise.all([rpc('clan_duelo_mio').catch(function () { return rpc('clan_sala_mia'); }), rpc('mi_clan').catch(function () { return {}; })]).then(function (r) {
        MIO = r[0] || {}; MIO.puedo = !!(r[1] && r[1].clan && r[1].rol !== 'miembro');
        if (!(r[1] && r[1].clan)) { app.innerHTML = '<div class="card estado"><div class="h2" style="justify-content:center">Primero únete a un clan</div><p class="small">Las salas son entre clanes.</p><a class="cb l" style="margin-top:14px" href="clanes.html">Ir a Clanes</a></div>'; return; }
        app.innerHTML = inicio();
      });
    }).catch(function (e) { app.innerHTML = '<div class="card estado"><p>' + esc(error(e)) + '</p></div>'; });
  }
  MCAuth.listo.then(function () { var u = MCAuth.usuario(); if (u) empezar(u); else app.innerHTML = '<div class="card estado"><p>Ingresa con tu cuenta para jugar.</p></div>'; MCAuth.alCambiar(empezar); });
})();
</script>
<script src="assets/sonido.js"></script>
