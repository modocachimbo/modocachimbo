<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }

  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .logo span { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; }
  .page-title { padding: 20px 0 8px; }
  .page-title .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-title h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 42px); margin-top: 8px; }
  .page-title p { color: var(--text-dim); font-size: 14px; margin-top: 10px; max-width: 560px; line-height: 1.6; }

  .years-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 30px 0 20px; }
  @media (max-width: 760px) { .years-grid { grid-template-columns: repeat(2, 1fr); } }

  .year-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 18px; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .year-card.active:hover { border-color: var(--accent); transform: translateY(-2px); }
  .year-card .yr { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 800; }
  .year-card .count { font-size: 12px; color: var(--accent); font-weight: 600; }
  .year-card.disabled { opacity: 0.38; cursor: default; pointer-events: none; }
  .year-card.disabled .count { color: var(--text-faint); }
  /* Tarjetas gruesas estilo Duolingo con sombrita verde: se hunden al tocarlas */
  .year-card { border: 2px solid #2e2e2e; border-radius: 18px; padding: 18px 18px 16px; -webkit-tap-highlight-color: transparent; }
  .year-card.active { background: #121212; border-color: #3a4a00; box-shadow: 0 5px 0 #6f7f00; transition: transform .08s ease, box-shadow .08s ease, border-color .15s ease; }
  .year-card.active:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 7px 0 #8fa300; }
  .year-card.active:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .year-card .yr { font-family: 'Nunito', 'Sora', sans-serif; font-weight: 900; font-size: 22px; }
  .year-card .count { font: 800 13px 'Nunito', 'Inter', sans-serif; }
  .year-card.active .count { display: inline-block; align-self: flex-start; background: var(--accent-soft); border-radius: 10px; padding: 3px 9px; }
  .year-card.disabled { opacity: .45; border-style: dashed; border-color: #262626; background: transparent; }

  /* Casita con estilo grueso: se hunde al tocarla */
  .home-btn { border: 2px solid #2e2e2e; border-bottom-width: 4px; border-radius: 12px; background: #141414; width: 36px; height: 36px; color: #e6e6e6;
    transition: transform .08s ease, border-color .15s ease, color .15s ease; -webkit-tap-highlight-color: transparent; }
  .home-btn:hover { border-color: var(--accent, #C6E000); border-bottom-color: #8fa300; color: var(--accent, #C6E000); }
  .home-btn:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }

  /* Letra gruesita en toda la web (Nunito); las fórmulas y el código conservan su letra */
  body, body :not(.katex):not(.katex *):not(code):not(pre):not(kbd):not(samp):not(.formato):not(.ta.big):not(.cdnuevos code) { font-family: 'Nunito', 'Inter', system-ui, sans-serif !important; }
  body { font-weight: 600; }

<script>
  const allYears = [
    "2027-III","2027-II","2027-I",
    "2026-III","2026-II","2026-I",
    "2025-III","2025-II","2025-I",
    "2024-III","2024-II","2024-I",
    "2023-III","2023-II","2023-I",
    "2022-III","2022-II","2022-I",
    "2021-III","2021-II","2021-I",
    "2020-III","2020-II","2020-I",
    "2019-III","2019-II","2019-I",
    "2018-III","2018-II","2018-I",
    "2017-III","2017-II","2017-I",
    "2016-III","2016-II","2016-I",
    "2015-III","2015-II","2015-I"
  ];

  const grid = document.getElementById('yearsGrid');

  fetch('data/manifest.json')
    .then(r => r.json())
    .then(manifest => {
      const activeMap = {};
      manifest.forEach(m => { activeMap[m.id] = m; });
      // años nuevos publicados desde el panel que aún no están en la lista
      const rom = { I: 1, II: 2, III: 3 };
      const orden = id => { const x = String(id).match(/^(\d{4})-(III|II|I)$/); return x ? +x[1] * 10 + rom[x[2]] : 0; };
      manifest.forEach(m => { if (!allYears.includes(m.id)) allYears.push(m.id); });
      allYears.sort((a, b) => orden(b) - orden(a));

      allYears.forEach(id => {
        const info = activeMap[id];
        const active = !!info && info.temas > 0; // año sin temas = Próximamente
        const a = document.createElement(active ? 'a' : 'div');
        a.className = 'year-card ' + (active ? 'active' : 'disabled');
        if (active) a.dataset.mcNav = 'tema';
        if (active) a.href = 'temario.html?year=' + encodeURIComponent(id);
        a.innerHTML = `<div class="yr">${id}</div><div class="count">${active ? info.temas + (info.temas === 1 ? ' tema' : ' temas') : 'Próximamente'}</div>`;
        grid.appendChild(a);
      });
    })
    .catch(() => {
      grid.innerHTML = '<div class="state-msg" style="grid-column:1/-1;">No se pudo cargar la lista de banqueo.</div>';
    });
</script>
