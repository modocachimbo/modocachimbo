<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800;1,900&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --oro: #FFC800; --rojo: #FF4B4B; --azul: #1CB0F6; --nar: #FF9600; --ok: #58CC02; --mor: #8a5cf0;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  }
  html, body { background: var(--bg); }
  body { color: var(--text); font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; min-height: 100vh;
    background: radial-gradient(90% 60% at 50% -10%, rgba(138,92,240,.28), transparent 70%), var(--bg); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 50px; }

  /* Barra de arriba */
  .top { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; }
  .vol { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid var(--border); color: #fff; text-decoration: none; font: 900 14px/1 Nunito, sans-serif; }
  .vol svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .top h1 { flex: 1; min-width: 0; font: italic 900 26px/1 var(--display); text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top h1 small { display: block; font: 800 12px/1.2 Nunito, sans-serif; color: var(--text-dim); text-transform: none; font-style: normal; margin-top: 3px; }

  /* Portada de la partida */
  .ini { text-align: center; padding: 8px 0 0; }
  .ini .emb { width: 220px; height: 254px; margin: 0 auto -6px; animation: flota 3.2s ease-in-out infinite; }
  .ini .emb svg { width: 100%; height: 100%; }
  @keyframes flota { 50% { transform: translateY(-6px); } }
  .ini h2 { font: italic 900 40px/1 var(--display); text-transform: uppercase; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .ini h2 em { color: var(--accent); font-style: italic; }
  .ini p { font-size: 14.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.45; }
  .reglas3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
  .reglas3 div { padding: 12px 8px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); }
  .reglas3 b { display: block; font: italic 900 24px/1 var(--display); color: var(--accent); }
  .reglas3 span { display: block; font-size: 11.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.25; }
  .vidas { display: flex; justify-content: center; gap: 6px; margin: 4px 0 14px; }
  .vidas i { width: 34px; height: 12px; border-radius: 6px; background: var(--accent); box-shadow: 0 0 10px rgba(198,224,0,.5); }
  .vidas i.usada { background: #2a2346; box-shadow: none; }
  .big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 60px; border-radius: 16px; border: 0; border-bottom: 5px solid #7f9200;
    background: linear-gradient(180deg, #e7fb62, #C6E000); color: #14101f; font: italic 900 26px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .big:active { transform: translateY(3px); border-bottom-width: 2px; }
  .big:disabled { filter: grayscale(1); opacity: .55; cursor: default; }
  .big.gris { background: var(--surface-2); color: #fff; border-bottom-color: #0e0b1c; }
  .nota { font-size: 12.5px; color: var(--text-dim); margin-top: 10px; text-align: center; }
  .err { color: #ff8a8a; text-align: center; font-size: 14px; margin-top: 10px; }

  /* Cuenta regresiva */
  .cuenta { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(11,8,24,.86); }
  .cuenta b { font: italic 900 160px/1 var(--display); color: var(--accent); text-shadow: 0 0 40px rgba(198,224,0,.6); animation: pum .8s ease-out both; }
  @keyframes pum { from { transform: scale(2.2); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); opacity: 1; } }

  /* Juego */
  .hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-bottom: 10px; }
  .hud .n { font: italic 900 20px/1 var(--display); color: var(--text-dim); }
  .hud .n b { color: #fff; }
  .hud .pts { font: italic 900 26px/1 var(--display); color: var(--oro); text-align: right; }
  .hud .pts small { font: 800 11px/1 Nunito, sans-serif; color: var(--text-dim); font-style: normal; margin-left: 3px; }
  .pasos { display: flex; gap: 4px; }
  .pasos i { flex: 1; height: 8px; border-radius: 4px; background: #241d44; }
  .pasos i.hecha { background: #6b6390; }
  .pasos i.ok { background: var(--ok); } .pasos i.no { background: var(--rojo); } .pasos i.ya { background: #fff; }
  .reloj { position: relative; height: 12px; border-radius: 6px; background: #1a1433; overflow: hidden; border: 1.5px solid #2c2550; margin-bottom: 12px; }
  .reloj i { position: absolute; inset: 0; transform-origin: left; background: linear-gradient(90deg, var(--accent), #e7fb62); }
  .reloj.poco i { background: linear-gradient(90deg, var(--rojo), #ff8a5c); }
  .combo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; min-height: 26px; }
  .combo .cur { font: 800 12.5px/1.2 Nunito, sans-serif; color: var(--text-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .combo .cur b { color: #fff; }
  .combo .x { flex: none; padding: 4px 10px; border-radius: 99px; background: rgba(255,150,0,.15); border: 1.5px solid rgba(255,150,0,.5); color: var(--nar); font: italic 900 16px/1 var(--display); text-transform: uppercase; }
  .combo .x.cero { opacity: 0; }
  .combo .x.sube { animation: sube .35s ease-out; }
  @keyframes sube { 50% { transform: scale(1.3); } }
  .preg { padding: 16px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--border); font: 700 16px/1.5 Nunito, sans-serif; color: #fff; }
  .preg .q-graphic { margin-top: 10px; }
  .preg img { max-width: 100%; max-height: 32vh; width: auto; height: auto; display: block; margin: 8px auto 0; object-fit: contain; }
  .opts { display: grid; gap: 8px; margin-top: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--border); border-bottom-width: 4px; font: 700 15px/1.35 Nunito, sans-serif; color: #fff; }
  .opt:hover:not(.locked) { border-color: #4a3f78; }
  .opt .letter { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #2a2346; color: var(--text-dim); font: 900 14px/1 Nunito, sans-serif; }
  .opt.correct { border-color: var(--ok); background: rgba(88,204,2,.14); } .opt.correct .letter { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--rojo); background: rgba(255,75,75,.12); } .opt.wrong .letter { background: var(--rojo); color: #fff; }
  .opt.locked { cursor: default; }
  .opt .icon { display: none; }
  .flot { position: fixed; left: 50%; top: 38%; z-index: 20; transform: translate(-50%, -50%); font: italic 900 46px/1 var(--display); color: var(--oro); text-shadow: 0 3px 0 rgba(0,0,0,.5); pointer-events: none; animation: flot 1s ease-out forwards; white-space: nowrap; }
  .flot.no { color: var(--rojo); font-size: 34px; }
  .flot small { display: block; font-size: 18px; color: var(--nar); text-align: center; }
  @keyframes flot { from { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } to { opacity: 0; transform: translate(-50%, -120%) scale(1); } }

  /* Resultado */
  .fin { text-align: center; padding-top: 10px; }
  .fin .tg { font: italic 900 18px/1 var(--display); color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
  .fin .pt { font: italic 900 84px/1 var(--display); color: var(--oro); text-shadow: 0 4px 0 rgba(0,0,0,.4); margin-top: 6px; }
  .fin .pt small { font-size: 26px; color: var(--text-dim); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .stats div { padding: 12px 6px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border); }
  .stats b { display: block; font: italic 900 26px/1 var(--display); color: #fff; }
  .stats span { display: block; font-size: 11px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .aporte { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: linear-gradient(90deg, rgba(198,224,0,.14), rgba(138,92,240,.12)); border: 1.5px solid rgba(198,224,0,.4); text-align: left; margin-bottom: 14px; font-size: 14px; color: #e9e3f8; }
  .aporte b { color: var(--accent); }
  .aporte .ic { flex: none; width: 46px; height: 54px; }
  .fin .big + .big { margin-top: 10px; }
  @media (max-width: 420px) { .ini h2 { font-size: 34px; } .ini .emb { width: 180px; height: 208px; } .preg { font-size: 15px; } }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">

<body>
<div class="wrap">
  <header class="top">
    <a class="vol" href="clanes.html#guerra"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Guerra</a>
    <h1 id="tit">Guerra de clanes<small id="sub">Cargando…</small></h1>
  </header>
  <main id="app"><p class="nota" style="padding:40px 0">Cargando…</p></main>
</div>
<script>
/* =========================================================
   Modo Cachimbo · Modo guerra (supabase/134-guerra-clanes.sql)
   - guerra_empezar() da la partida y una semilla; con ella se eligen
     10 preguntas al azar del ciclo más nuevo (Libros, Seminarios y
     Banqueo de todos los cursos).
   - 20 s por pregunta. Acierto = 100 + hasta 50 por rapidez + combo
     (20 por cada acierto seguido, hasta 100). Máximo 250 por pregunta.
   - guerra_terminar() guarda los puntos para el clan.
   ========================================================= */
(function () {
  var app = document.getElementById('app'), sub = document.getElementById('sub');
  var N = 10, SEG = 20;
  var V = null, P = null, Q = [], i = 0, pts = 0, combo = 0, maxCombo = 0, buenas = 0, marcas = [], reloj = 0, t0 = 0, listo = false;
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function nf(n) { return (+n || 0).toLocaleString('en-US'); }
  function rpc(n, a) {
    if (!window.MCAuth) return Promise.reject(new Error('sin-auth'));
    return MCAuth.listo.then(function (c) { return c.rpc(n, a || {}); }).then(function (r) { if (r.error) throw r.error; return r.data; });
  }
  var ERR = { sin_clan: 'Únete a un clan para jugar la guerra.', guerra_cerrada: 'La ronda está cerrada. Abre martes y jueves de 8:00 a 20:00.', partida_no_existe: 'Esa partida ya se cerró.', sin_partidas: 'Ya jugaste tus 5 partidas de esta ronda.', partida_cerrada: 'Esa partida ya se guardó.' };
  function errTxt(e) { var m = String(e && (e.message || e) || ''); for (var k in ERR) if (m.indexOf(k) >= 0) return ERR[k]; if (/function|schema cache/i.test(m)) return 'La guerra se activa muy pronto.'; return 'No se pudo conectar. Revisa tu internet.'; }
  function son(k) { try { if (window.MCSonido && MCSonido[k]) MCSonido[k](); } catch (e) {} }
  function math(el) {
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', function () { math(el); }, { once: true }); return; }
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  }

  /* ---------- Preguntas: al azar del ciclo más nuevo ---------- */
  function azar(sem) { var a = sem >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function ordenCiclo(id) { var m = String(id).match(/^(\d{4})-([IVX]+)$/), R = { I: 1, II: 2, III: 3 }; return m ? +m[1] * 10 + (R[m[2]] || 0) : 0; }
  var FUENTES = ['libros', 'seminarios', 'banqueo'], cache = {}, NOMBRE = {};
  function json(r) { if (!cache[r]) cache[r] = fetch(r, { cache: 'no-cache' }).then(function (x) { return x.ok ? x.json() : []; }).catch(function () { return []; }); return cache[r]; }
  var BANCO = null;   // [{curso, f, ciclo}] del ciclo más nuevo
  function banco() {
    if (BANCO) return BANCO;
    BANCO = json('assets/cursos.json').then(function (reg) {
      var cursos = ((reg && reg.cursos) || []).filter(function (c) { return !c.oculto; });
      cursos.forEach(function (c) { NOMBRE[c.id] = c.nombre; });
      var pares = [];
      cursos.forEach(function (c) { FUENTES.forEach(function (f) { pares.push([c.id, f]); }); });
      return Promise.all(pares.map(function (p) { return json(p[0] + '/' + p[1] + '/data/manifest.json').then(function (m) { return { curso: p[0], f: p[1], ids: (Array.isArray(m) ? m : []).filter(function (x) { return x && x.id && (x.temas == null || x.temas > 0); }).map(function (x) { return x.id; }) }; }); }));
    }).then(function (L) {
      var todos = {}; L.forEach(function (x) { x.ids.forEach(function (id) { todos[id] = 1; }); });
      var ult = Object.keys(todos).sort(function (a, b) { return ordenCiclo(a) - ordenCiclo(b); }).pop();
      return L.filter(function (x) { return x.ids.indexOf(ult) >= 0; }).map(function (x) { return { curso: x.curso, f: x.f, ciclo: ult }; });
    });
    return BANCO;
  }
  function valida(q) {
    if (!q || !Array.isArray(q.options) || q.options.length < 2 || !Number.isInteger(q.correct) || q.correct < 0 || q.correct >= q.options.length) return false;
    if (q.abierta || (window.MCPregunta && MCPregunta.esAbierta && MCPregunta.esAbierta(q))) return false;
    return true;
  }
  function elegir(sem) {
    var r = azar(sem);
    return banco().then(function (B) {
      if (!B.length) throw new Error('sin_preguntas');
      // 10 archivos al azar (pueden repetirse cursos), luego una pregunta de cada uno
      var ar = []; for (var k = 0; k < N + 4; k++) ar.push(B[Math.floor(r() * B.length)]);
      return Promise.all(ar.map(function (a) { return json(a.curso + '/' + a.f + '/data/' + a.ciclo + '.json').then(function (temas) { return { a: a, temas: Array.isArray(temas) ? temas : [] }; }); }));
    }).then(function (L) {
      var out = [], vistos = {};
      L.forEach(function (x) {
        if (out.length >= N) return;
        var qs = [];
        x.temas.forEach(function (t) { (t.questions || []).forEach(function (q, k) { if (valida(q)) qs.push({ q: q, t: t, k: k }); }); });
        if (!qs.length) return;
        for (var intento = 0; intento < 6; intento++) {
          var e = qs[Math.floor(r() * qs.length)], id = x.a.curso + x.a.f + e.t.num + '#' + e.k;
          if (vistos[id]) continue;
          vistos[id] = 1;
          out.push(Object.assign({}, e.q, { _curso: x.a.curso, _tit: e.t.name }));
          return;
        }
      });
      if (out.length < 5) throw new Error('sin_preguntas');
      return out;
    });
  }

  /* ---------- Pantallas ---------- */
  function cabecera() {
    var v = V || {};
    sub.textContent = v.viva ? 'Temporada ' + v.temporada + ' · Ronda ' + v.viva_n + ' en vivo' : 'Temporada ' + (v.temporada || 1);
  }
  function portada(msg) {
    cabecera();
    var v = V, usadas = v && v.yo ? +v.yo.partidas_hoy || 0 : 0, max = v ? +v.max_partidas || 5 : 5, quedan = Math.max(0, max - usadas);
    var ab = v && v.yo && v.yo.abierta;   // partida a medias (se cortó): se sigue sin gastar otra
    var puede = ab || (v && v.viva && v.tengo_clan && quedan > 0);
    var vid = ''; for (var k = 0; k < max; k++) vid += '<i' + (k < usadas ? ' class="usada"' : '') + '></i>';
    app.innerHTML = '<section class="ini"><div class="emb">' + (window.MCGuerraEmblema ? MCGuerraEmblema(v ? v.temporada : 1) : '') + '</div>' +
      '<h2>¡A la <em>guerra</em>!</h2>' +
      '<p>' + (v && v.mi_clan ? 'Juegas por <b style="color:#fff">' + esc(v.mi_clan.nombre) + '</b>. ' : '') + 'Cada punto que ganes suma para tu clan.</p>' +
      '<div class="reglas3"><div><b>10</b><span>preguntas al azar de todos los cursos</span></div><div><b>20 s</b><span>por pregunta; más rápido, más puntos</span></div><div><b>Combo</b><span>aciertos seguidos suman extra</span></div></div>' +
      '<div class="vidas" aria-label="Partidas">' + vid + '</div>' +
      '<button type="button" class="big" id="go"' + (puede ? '' : ' disabled') + '>' + (ab ? 'Continuar partida' : puede ? 'Jugar partida' : !v ? 'Cargando…' : !v.tengo_clan ? 'Necesitas un clan' : !v.viva ? 'Ronda cerrada' : 'Sin partidas') + '</button>' +
      '<p class="nota">' + (ab ? 'Se cortó tu partida: sigues en la pregunta <b style="color:#fff">' + (Math.min(9, +ab.n || 0) + 1) + ' de 10</b> con <b style="color:#FFC800">' + nf(ab.puntos) + ' pts</b>. No gasta otra partida.' : v && v.viva ? 'Te quedan <b style="color:#fff">' + quedan + ' de ' + max + '</b> partidas en esta ronda.' : 'Las rondas son martes y jueves de 8:00 a 20:00.') + '</p>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') + '</section>';
    var b = document.getElementById('go');
    if (b) b.onclick = empezar;
  }
  function empezar() {
    var b = document.getElementById('go'); b.disabled = true; b.textContent = 'Preparando…';
    rpc('guerra_empezar').then(function (p) {
      P = p;
      return elegir(p.semilla);
    }).then(function (qs) {
      Q = qs; i = 0; pts = 0; combo = 0; maxCombo = 0; buenas = 0; marcas = [];
      // Partida que se cortó: sigue donde iba, con sus puntos
      if (P.reanudar) {
        i = Math.min(+P.n || 0, Q.length); pts = +P.puntos || 0; buenas = +P.correctas || 0; combo = maxCombo = +P.combo || 0;
        for (var k = 0; k < i; k++) marcas[k] = 'hecha';
        if (i >= Q.length) { terminar(); return; }
      }
      cuenta(3);
    }, function (e) { portada(/sin_preguntas/.test(String(e && e.message)) ? 'No se pudieron cargar las preguntas. Revisa tu internet.' : errTxt(e)); });
  }
  function cuenta(n) {
    var o = document.querySelector('.cuenta') || document.body.appendChild(Object.assign(document.createElement('div'), { className: 'cuenta' }));
    o.innerHTML = '<b>' + (n || '¡YA!') + '</b>';
    son(n ? 'tic' : 'empezar');
    if (n === 0) { setTimeout(function () { o.remove(); t0 = Date.now(); pregunta(); }, 600); return; }
    setTimeout(function () { cuenta(n - 1); }, 750);
  }
  function pasos() { var h = ''; for (var k = 0; k < Q.length; k++) h += '<i class="' + (marcas[k] || (k === i ? 'ya' : '')) + '"></i>'; return h; }
  function pregunta() {
    var q = Q[i]; listo = false;
    app.innerHTML = '<div class="hud"><span class="n"><b>' + (i + 1) + '</b>/' + Q.length + '</span><div class="pasos">' + pasos() + '</div><span class="pts" id="pts">' + nf(pts) + '<small>pts</small></span></div>' +
      '<div class="reloj" id="rl"><i id="rli"></i></div>' +
      '<div class="combo"><span class="cur"><b>' + esc(NOMBRE[q._curso] || q._curso) + '</b> · ' + esc(q._tit || '') + '</span><span class="x' + (combo > 1 ? '' : ' cero') + '" id="cx">Combo x' + combo + '</span></div>' +
      '<div class="preg"><div id="qt"></div><div class="q-graphic" id="qg" style="display:none"></div></div><div class="opts" id="op"></div>';
    var qt = document.getElementById('qt'), qg = document.getElementById('qg'), op = document.getElementById('op');
    var mcq = window.MCPregunta ? MCPregunta.pintar({ texto: qt, grafico: qg }, q) : null;
    if (!mcq) qt.textContent = q.text;
    q.options.forEach(function (o, k) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt option';
      b.innerHTML = '<span class="letter">' + esc(o.letter || 'ABCDE'[k]) + '</span><span class="text">' + (window.MCPregunta ? MCPregunta.formato(o.text || '') : esc(o.text)) + '</span>';
      b.onclick = function () { responder(k); };
      op.appendChild(b);
    });
    if (mcq && MCPregunta.alternativas) MCPregunta.alternativas(op, q, mcq);
    math(app);
    var ini = Date.now(), rli = document.getElementById('rli'), rl = document.getElementById('rl');
    clearInterval(reloj);
    reloj = setInterval(function () {
      var r = Math.max(0, SEG - (Date.now() - ini) / 1000);
      rli.style.transform = 'scaleX(' + (r / SEG) + ')';
      rl.classList.toggle('poco', r < 5);
      if (r <= 0) responder(-1);
    }, 100);
    Q[i]._ini = ini;
  }
  function flot(html, no) { var f = document.createElement('div'); f.className = 'flot' + (no ? ' no' : ''); f.innerHTML = html; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 1000); }
  function responder(k) {
    if (listo) return; listo = true; clearInterval(reloj);
    var q = Q[i], ok = k === q.correct, resto = Math.max(0, SEG - (Date.now() - q._ini) / 1000);
    document.querySelectorAll('#op .opt').forEach(function (b, j) { b.classList.add('locked'); if (j === q.correct) b.classList.add('correct'); else if (j === k) b.classList.add('wrong'); });
    if (ok) {
      combo++; maxCombo = Math.max(maxCombo, combo); buenas++;
      var gana = 100 + Math.round(50 * resto / SEG) + Math.min(combo - 1, 5) * 20;
      pts += gana; marcas[i] = 'ok'; son('bien');
      flot('+' + gana + (combo > 1 ? '<small>Combo x' + combo + '</small>' : ''));
    } else {
      combo = 0; marcas[i] = 'no'; son('mal');
      flot(k < 0 ? '¡Tiempo!' : 'Fallaste', true);
    }
    var e = document.getElementById('pts'); if (e) e.innerHTML = nf(pts) + '<small>pts</small>';
    // Guarda el avance: si la app se cierra, al volver sigue aquí
    rpc('guerra_avance', { p_id: P.id, p_n: i + 1, p_puntos: pts, p_correctas: buenas, p_combo: combo }).catch(function () {});
    setTimeout(function () { i++; if (i < Q.length) pregunta(); else terminar(); }, ok ? 1100 : 1700);
  }
  function terminar() {
    app.innerHTML = '<p class="nota" style="padding:60px 0">Guardando tus puntos…</p>';
    var intento = 0;
    (function enviar() {
      rpc('guerra_terminar', { p_id: P.id, p_puntos: pts, p_correctas: buenas, p_combo: maxCombo }).then(function (d) { V = d; resultado(d.resultado || {}); },
        function (e) { if (++intento < 3) setTimeout(enviar, 1500); else { app.innerHTML = '<p class="err" style="padding:40px 0">' + esc(errTxt(e)) + '</p><button type="button" class="big gris" onclick="location.reload()">Reintentar</button>'; } });
    })();
  }
  function resultado(r) {
    cabecera();
    var v = V, quedan = Math.max(0, (+v.max_partidas || 5) - (+v.yo.partidas_hoy || 0));
    son('racha');
    app.innerHTML = '<section class="fin"><div class="tg">Partida terminada</div><div class="pt">' + nf(r.puntos) + '<small> pts</small></div>' +
      '<div class="stats"><div><b>' + (r.correctas || 0) + '/' + Q.length + '</b><span>Aciertos</span></div><div><b>x' + maxCombo + '</b><span>Mejor combo</span></div><div><b>+' + (r.xp || 0) + '</b><span>XP</span></div></div>' +
      (v.mi_clan ? '<div class="aporte"><span class="ic">' + (window.MCGuerraEmblema ? MCGuerraEmblema() : '') + '</span><span>Tus puntos ya suman para <b>' + esc(v.mi_clan.nombre) + '</b>: van <b>' + nf(v.mi_clan.puntos_ronda) + '</b> en esta ronda' + (r.puesto_clan ? ' y están en el puesto <b>#' + r.puesto_clan + '</b>' : '') + '.</span></div>' : '') +
      (v.viva && quedan ? '<button type="button" class="big" id="otra">Otra partida (' + quedan + ')</button>' : '') +
      '<a class="big gris" href="clanes.html#guerra" style="text-decoration:none">Ver la guerra</a></section>';
    var o = document.getElementById('otra'); if (o) o.onclick = function () { portada(); empezar(); };
  }

  rpc('guerra_ver').then(function (d) { V = d; portada(); }, function (e) { V = null; portada(errTxt(e)); });
  banco();   // va cargando las listas mientras tanto
})();
</script>
</body>
</html>
