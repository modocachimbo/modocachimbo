<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800;1,900&family=Nunito:wght@600;700;800;900;1000&family=Lilita+One&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; --cuerpo: Nunito, system-ui, sans-serif;
  }
  body { background: radial-gradient(120% 60% at 50% 0, #1d1540, var(--bg) 60%) fixed, var(--bg); color: var(--text); font-family: var(--cuerpo); font-weight: 700; min-height: 100vh; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }
  @media (min-width: 900px) { .wrap { padding: 0 32px 60px; } }

  /* ---------- Cabecera ---------- */
  header.top { display: flex; align-items: center; gap: 14px; padding: 22px 0 10px; }
  header.top h1 { flex: 1; display: flex; align-items: center; gap: 18px; min-width: 0; font: italic 900 46px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--accent); text-shadow: 0 0 18px rgba(198,224,0,.3); }
  header.top h1::after { content: ""; flex: 1; height: 2px; min-width: 20px; background: linear-gradient(90deg, rgba(198,224,0,.45), rgba(198,224,0,0)); }
  .c-volver { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 46px; padding: 0 16px 0 10px; border-radius: 10px; background: var(--surface-2); border: 2px solid #352E58; border-bottom-width: 5px; color: var(--text); font-weight: 900; font-size: 15px; text-decoration: none; transform: skewX(-10deg); }
  .c-volver > * { transform: skewX(10deg); }
  .c-volver svg { display: block; flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .c-volver:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 700px) {
    header.top { gap: 10px; padding: 16px 0 8px; }
    header.top h1 { font-size: 32px; gap: 10px; }
    .c-volver { height: 40px; padding: 0 10px 0 6px; font-size: 0; gap: 0; }
  }

  /* ---------- Diamantes: el mismo botón del Arcade (arcade.html .rec.di) ---------- */
  .rec { --c: #D46BFF; --c2: #8A2BD0; --o: #3A0A6A; position: relative; flex: none; width: 150px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 30px 0 26px; border-radius: 8px; cursor: pointer; color: #fff; margin-left: 22px;
    background: linear-gradient(180deg, #2A2158, #140D36); border: 2px solid #0A0620; box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.35), 0 3px 0 rgba(10,6,32,.6); overflow: visible; }
  .rec b { font: 400 21px/1 "Lilita One", var(--cuerpo); letter-spacing: .03em; text-shadow: 0 2px 0 #000; }
  .rec .ri { position: absolute; left: -22px; top: 50%; width: 52px; height: 52px; margin-top: -27px; animation: diaA 3.4s ease-in-out infinite; }
  .rec .mas { position: absolute; right: 3px; top: 50%; width: 24px; height: 24px; margin-top: -12px; display: grid; place-items: center; border-radius: 6px; font: 400 20px/1 "Lilita One", var(--cuerpo); font-style: normal; color: var(--o);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 55%, var(--c2)); border: 2px solid var(--o); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); animation: masL 2.6s ease-in-out .8s infinite; }
  .rec:active { transform: translateY(2px); }
  .rec::after { content: ""; position: absolute; inset: 2px; border-radius: 6px; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.18) 50%, transparent 65%) no-repeat; background-size: 250% 100%; animation: barridoR 5s ease-in-out 3.2s infinite; pointer-events: none; }
  .rec .chis { position: absolute; top: 50%; pointer-events: none; opacity: 0; width: 12px; height: 12px; left: 14px; margin-top: -20px; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: destello 2.2s ease-in-out infinite; }
  .rec .chis:nth-of-type(2) { left: -14px; margin-top: 4px; animation-delay: -1.1s; width: 9px; height: 9px; }
  .rec.sube b { animation: subeN .6s cubic-bezier(.2,1.6,.4,1); color: #F7B8FF; }
  @keyframes subeN { 40% { transform: scale(1.35); } }
  @keyframes barridoR { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  @keyframes masL { 0%, 82%, 100% { transform: scale(1); } 88% { transform: scale(1.22); } 94% { transform: scale(.95); } }
  @keyframes diaA { 0%, 100% { transform: rotate(-6deg) translateY(0); filter: drop-shadow(0 0 8px #D46BFF); } 50% { transform: rotate(6deg) translateY(-3px); filter: drop-shadow(0 0 16px #F0B8FF) brightness(1.2); } }
  @keyframes destello { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
  @media (max-width: 700px) { .rec { width: 124px; height: 36px; margin-left: 18px; } .rec .ri { width: 44px; height: 44px; margin-top: -23px; left: -18px; } .rec b { font-size: 18px; } }

  /* ---------- Activo ahora ---------- */
  .act { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .act span { --c: #C6E000; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 8px; border-radius: 10px; background: color-mix(in srgb, var(--c) 12%, #151127); border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); font: 900 13px var(--cuerpo); }
  .act span i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 0 var(--c); animation: vivo 1.6s ease-out infinite; }
  .act span small { font: 800 12px var(--cuerpo); color: var(--text-dim); }
  @keyframes vivo { 70% { box-shadow: 0 0 0 7px transparent; } }

  h2 { font: italic 900 26px var(--display); text-transform: uppercase; margin: 22px 0 14px; display: flex; align-items: baseline; gap: 10px; }
  h2 small { font: 800 13px var(--cuerpo); color: var(--text-faint); text-transform: none; }

  /* ---------- Tarjetas (diseño v5). Todo se mide en --u = 1/214 del ancho ---------- */
  .lay { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 14px; }
  .rail { position: sticky; top: 16px; display: grid; gap: 10px; }
  .rail .r { position: relative; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 9px 14px; border-radius: 10px; cursor: pointer; width: 100%; text-align: left;
    background: linear-gradient(180deg, #1f1938, #15112a); border: 2px solid #2f2852; border-bottom-width: 5px; color: #d9d3ef; font: italic 900 21px/1 var(--display); text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
  .rail .r:hover { border-color: #4a3f78; color: #fff; }
  .rail .r svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .rail .r .tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rail .r .tx small { font: 800 11.5px/1.1 var(--cuerpo); text-transform: none; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .r .n { margin-left: auto; font: 900 12px var(--cuerpo); padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.08); }
  .rail .r.on { background: linear-gradient(180deg, #e2f75a, #C6E000); border-color: #8fa300; color: #14101f; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .rail .r.on .tx small { color: #3d4a00; } .rail .r.on .n { background: rgba(0,0,0,.12); }
  .g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  @media (min-width: 1100px) { .g { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 899px) {
    .lay { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); gap: 6px; overflow-x: auto; scrollbar-width: none; margin-right: -16px; padding-right: 16px; }
    .rail .r { min-height: 0; height: 54px; padding: 0 4px; justify-content: center; flex-direction: column; gap: 4px; font-size: 13px; }
    .rail .r .tx small, .rail .r .n { display: none; }
    .rail .r svg { width: 20px; height: 20px; }
  }
  @media (max-width: 560px) { .g { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
  .cd { container-type: inline-size; filter: drop-shadow(0 12px 18px rgba(0,0,0,.55)); cursor: pointer; transition: transform .15s; -webkit-tap-highlight-color: transparent; background: none; border: 0; text-align: inherit; display: block; width: 100%; }
  .cd:hover { transform: translateY(-4px); }
  .cd:active { transform: scale(.97); }
  .cd:focus { outline: none; } .cd:focus-visible .fr { outline: 3px solid #fff; outline-offset: 2px; }
  .fr { --u: calc(100cqw / 214); --cut: calc(16 * var(--u)); padding: calc(3 * var(--u)); clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    background: linear-gradient(160deg, #fff 0%, var(--r) 18%, var(--rd) 45%, var(--r) 70%, #fff 100%); }
  .in { position: relative; height: calc(312 * var(--u)); overflow: hidden; clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, 100% calc(100% - var(--cut) + 1px), calc(100% - var(--cut) + 1px) 100%, 0 100%, 0 calc(var(--cut) - 1px));
    background: radial-gradient(120% 70% at 50% 25%, color-mix(in srgb, var(--rd) 85%, #0b0817), color-mix(in srgb, var(--rd) 35%, #0b0817) 55%, #0d0920 85%); }
  .in::after { content: ""; position: absolute; z-index: 4; top: 0; bottom: 0; width: calc(60 * var(--u)); left: -40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); transform: skewX(-18deg); animation: brillo 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  @keyframes brillo { 0%, 55% { left: -40%; } 85%, 100% { left: 120%; } }
  .bg { position: absolute; inset: 0 0 auto 0; height: calc(186 * var(--u)); overflow: hidden; }
  .tex { position: absolute; inset: 0; opacity: .10; background-image: radial-gradient(circle at 1px 1px, #fff 1px, transparent 1.4px); background-size: calc(9 * var(--u)) calc(9 * var(--u)); -webkit-mask: linear-gradient(180deg, #000, transparent 90%); mask: linear-gradient(180deg, #000, transparent 90%); }
  .luz { position: absolute; left: 50%; top: 44%; width: calc(230 * var(--u)); height: calc(230 * var(--u)); margin: calc(-115 * var(--u)) 0 0 calc(-115 * var(--u)); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 55%, transparent), transparent); animation: pulso 2.6s ease-in-out infinite; }
  @keyframes pulso { 50% { transform: scale(1.12); opacity: .75; } }
  .piso { position: absolute; left: 50%; top: calc(140 * var(--u)); width: calc(150 * var(--u)); height: calc(34 * var(--u)); margin-left: calc(-75 * var(--u)); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 75%, #fff), color-mix(in srgb, var(--c) 30%, transparent) 60%, transparent); filter: blur(2px); animation: sombra 3s ease-in-out infinite; }
  @keyframes sombra { 50% { transform: scale(.82); opacity: .7; } }
  .sp { position: absolute; width: calc(10 * var(--u)); height: calc(10 * var(--u)); background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: .9; animation: tw 1.8s ease-in-out infinite; }
  .sp.a { left: 13%; top: 16%; } .sp.b { right: 14%; top: 12%; transform: scale(.7); animation-delay: .6s; } .sp.c { right: 20%; top: 39%; transform: scale(.55); animation-delay: 1.2s; }
  @keyframes tw { 50% { opacity: .15; } }
  .rz { position: absolute; z-index: 3; left: 0; top: 0; display: flex; align-items: center; gap: calc(6 * var(--u)); padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(6 * var(--u)) calc(20 * var(--u)); font: 900 calc(10.5 * var(--u)) var(--cuerpo); letter-spacing: .1em; text-transform: uppercase; color: #14101f;
    background: linear-gradient(90deg, var(--r), color-mix(in srgb, var(--r) 60%, #fff)); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .st { display: flex; gap: 2px; } .st i { width: calc(8 * var(--u)); height: calc(8 * var(--u)); background: #14101f; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .of { position: absolute; z-index: 3; right: calc(8 * var(--u)); top: calc(38 * var(--u)); font: italic 900 calc(15 * var(--u)) var(--display); padding: calc(3 * var(--u)) calc(8 * var(--u)); border-radius: 6px; background: #FF4B4B; color: #fff; transform: rotate(4deg); box-shadow: 0 3px 0 #8a1020; }
  .ico { position: absolute; z-index: 2; left: 50%; top: calc(34 * var(--u)); width: calc(140 * var(--u)); height: calc(140 * var(--u)); margin-left: calc(-70 * var(--u)); filter: drop-shadow(0 8px 8px rgba(0,0,0,.55)) drop-shadow(0 0 16px color-mix(in srgb, var(--c) 55%, transparent)); animation: flota 3s ease-in-out infinite; }
  .ico svg { width: 100%; height: 100%; overflow: visible; display: block; }
  @keyframes flota { 50% { transform: translateY(calc(-7 * var(--u))) rotate(1.5deg); } }
  .cant { position: absolute; z-index: 3; right: calc(10 * var(--u)); top: calc(146 * var(--u)); }
  .cant span { display: block; font: italic 900 calc(16 * var(--u)) var(--display); color: #fff; padding: calc(4 * var(--u)) calc(12 * var(--u)) calc(4 * var(--u)) calc(14 * var(--u)); background: linear-gradient(180deg, #2a2152, #140f2b); border: 1.5px solid var(--r); clip-path: polygon(8px 0, 100% 0, 100% 100%, 0 100%, 0 8px); }
  .pl { position: absolute; z-index: 2; left: 0; right: 0; top: calc(174 * var(--u)); padding: calc(10 * var(--u)) calc(14 * var(--u)) 0; text-align: center; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent); border-top: 2px solid color-mix(in srgb, var(--r) 70%, transparent); }
  .pl b { display: block; font: italic 900 calc(21 * var(--u))/1 var(--display); text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .pl p { font: 700 calc(11.5 * var(--u))/1.3 var(--cuerpo); color: #b9b2d6; margin: calc(5 * var(--u)) 0 0; }
  .pre { position: absolute; left: calc(12 * var(--u)); right: calc(12 * var(--u)); bottom: calc(12 * var(--u)); display: flex; align-items: center; justify-content: center; gap: calc(4 * var(--u)); padding: calc(6 * var(--u)); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    background: linear-gradient(180deg, #F4FF8a, #C6E000 55%, #9fb400); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6); font: italic 900 calc(25 * var(--u)) var(--display); color: #14101f; }
  .pre svg { width: calc(32 * var(--u)); height: calc(32 * var(--u)); filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .cd.falta .pre { background: linear-gradient(180deg, #4a3f78, #2f2756); color: #d9d1f5; box-shadow: inset 0 -4px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.15); }
  .cd.on .rz::after { content: "Activo"; margin-left: 4px; padding: 1px 5px; border-radius: 4px; background: #14101f; color: var(--r); letter-spacing: .06em; }
  @media (max-width: 560px) { .pl p { display: none; } .in { height: calc(268 * var(--u)); } .act { flex-wrap: nowrap; overflow-x: auto; margin-right: -16px; padding-right: 16px; scrollbar-width: none; } .act span { flex: none; } }

  /* ---------- Tarjetas estilo C: el dibujo sale del marco ---------- */
  .g { row-gap: 64px; padding-top: 50px; }
  .tc { --c: #C6E000; position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; border-radius: 18px; padding: 86px 14px 14px; text-align: center; cursor: pointer; color: #fff; -webkit-tap-highlight-color: transparent;
    background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, transparent) 0 14px, transparent 14px 28px), linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, #161130), #120e26);
    border: 2px solid var(--c); box-shadow: 0 0 0 4px rgba(0,0,0,.35), 0 0 24px color-mix(in srgb, var(--c) 35%, transparent); transition: transform .15s; }
  .tc:hover { transform: translateY(-4px); } .tc:active { transform: scale(.97); }
  .tc:focus { outline: none; } .tc:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .tc::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(60% 45% at 50% 0, color-mix(in srgb, var(--c) 45%, transparent), transparent); pointer-events: none; animation: brillaC 2.6s ease-in-out infinite; }
  @keyframes brillaC { 50% { opacity: .5; } }
  .tc::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.14) 50%, transparent 60%) no-repeat; background-size: 250% 100%; animation: barridoR 4.5s ease-in-out infinite; animation-delay: var(--d); pointer-events: none; }
  .tc > * { position: relative; z-index: 1; }
  .tc .ic { position: absolute; left: 50%; top: -52px; width: 132px; height: 132px; margin-left: -66px; filter: drop-shadow(0 10px 10px rgba(0,0,0,.55)) drop-shadow(0 0 14px color-mix(in srgb, var(--c) 45%, transparent)); animation: flotaC 3s ease-in-out infinite; animation-delay: var(--d); }
  .tc .ic svg { width: 100%; height: 100%; overflow: visible; display: block; }
  @keyframes flotaC { 50% { transform: translateY(-7px) rotate(2deg); } }
  .tc .du { position: absolute; right: -6px; top: 10px; font: italic 900 15px var(--display); padding: 3px 10px; background: var(--c); color: #14101f; transform: rotate(6deg); border-radius: 6px; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .tc .rzc { display: inline-block; margin-bottom: 6px; font: 1000 9.5px var(--cuerpo); letter-spacing: 1px; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.45); color: var(--r); }
  .tc.on .rzc::after { content: " · Activo"; color: #fff; }
  .tc .ofc { position: absolute; right: -4px; top: 42px; font: italic 900 14px var(--display); padding: 2px 7px; border-radius: 6px; background: #FF4B4B; color: #fff; transform: rotate(-4deg); box-shadow: 0 3px 0 #8a1020; }
  .tc b { display: block; font: italic 900 22px/1 var(--display); text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .tc small { display: block; font: 800 12px/1.3 var(--cuerpo); color: #cfc6ee; margin: 5px 0 12px; min-height: 31px; }
  .tc .pr { margin-top: auto; align-self: stretch; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border-radius: 12px; background: linear-gradient(180deg, #E3FF3A, #C6E000); box-shadow: 0 4px 0 #7d8f00; color: #14101f; font: italic 900 24px/1 var(--display); }
  .tc .pr svg { width: 26px; height: 26px; }
  .tc.sinclan { filter: grayscale(.85) brightness(.7); cursor: not-allowed; }
  .tc.sinclan .nc { display: inline-block; margin-top: 8px; padding: 3px 9px; border-radius: 7px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); font: 900 11px/1.2 Nunito, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: #fff; }
  .tc.falta .pr { background: #2a2152; color: #d9d1f5; box-shadow: 0 4px 0 #120e26; }
  @media (max-width: 560px) { .g { row-gap: 54px; padding-top: 42px; } .tc { padding: 66px 10px 10px; } .tc .ic { width: 104px; height: 104px; margin-left: -52px; top: -42px; } .tc b { font-size: 18px; } .tc small { display: none; } .tc .pr { font-size: 21px; margin-top: 10px; } .tc .du { font-size: 13px; } .tc .ofc { display: none; } }
  /* ---------- Mis compras ---------- */
  .lay h2:first-child { margin-top: 0; }
  .mc-l { display: grid; gap: 10px; }
  .mc-f { --c: #C6E000; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 20%, #151127), #151127 55%); border: 2px solid color-mix(in srgb, var(--c) 40%, #2a2346); border-bottom-width: 5px; }

<script>

(function () {

    doblexp: { t: 'Doble XP', c: '1 día', d: 'Todo el XP que ganes vale el doble por 24 horas.', col: '#FFC800', rz: 'raro', g: 'pot' },
    corazones: { t: '+5 corazones', c: '+5', d: '5 corazones extra para seguir practicando.', col: '#FF4B6E', rz: 'comun', g: 'vid' },
    energia: { t: 'Energía', c: '+20', d: 'Más energía para el Arcade y el Laboratorio.', col: '#1CB0F6', rz: 'comun', g: 'pot' },

  };
  var GRUPOS = [
    ['vid', 'Vidas', 'Corazones e infinitos', '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.2-9.2C1.6 7.3 3.7 4 7.1 4c2 0 3.6 1.1 4.9 2.9C13.3 5.1 14.9 4 16.9 4c3.4 0 5.5 3.3 4.3 6.8C19.5 15.4 12 20 12 20z"/></svg>'],
    ['pot', 'Potenciadores', 'Doble XP y energía', '<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>'],

    ['clan', 'Clan', 'Fortuna, salas y cupos', '<svg viewBox="0 0 24 24"><path d="M12 2 20 5v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>'],
    ['sor', 'Sorpresas', 'Cofre al azar', '<svg viewBox="0 0 24 24"><path d="M3 10h18v10H3zM2 6h20v4H2zM12 6v14M12 6s-1-4-4-4-3 4 0 4h4zm0 0s1-4 4-4 3 4 0 4h-4z"/></svg>']];
  var cat = 'vid';
  try { cat = localStorage.getItem('mc_tienda_cat') || 'vid'; } catch (e) {}
  var ERR = {
    pocos_diamantes: 'No tienes diamantes suficientes.',
    escudo_tope: 'Ya tienes 3 protecciones guardadas. Úsalas primero.',
    sin_racha_revivir: 'No tienes una racha perdida en los últimos 7 días. No se cobró nada.',
    item_no_existe: 'Eso ya no está en la tienda.',
    sin_clan: 'Únete a un clan para comprar esto.',
    cupo_tope: 'Ese clan ya tiene el máximo: 40 integrantes.',
    no_existe: 'No hay ningún clan con ese ID.',
    cupo_con_id: 'Esta tarjeta se compra con el ID del clan.',
    sin_inventario: 'Ya no te queda de esa tarjeta.',
    nada_activo: 'No hay nada activo para pausar.',
    nada_pausado: 'No hay nada en pausa.'
  };
  var T = null, saldo = 0, ocupado = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nf(n) { return (+n || 0).toLocaleString('es-PE'); }
  function rpc(n, a) {
    if (!window.MCAuth) return Promise.reject(new Error('sin-auth'));
    return MCAuth.listo.then(function (c) { return c.rpc(n, a || {}); }).then(function (r) { if (r.error) throw r.error; return r.data; });
  }
  function errTxt(e) {
    var m = String(e && (e.message || e) || '');
    for (var k in ERR) if (m.indexOf(k) >= 0) return ERR[k];
    if (/does not exist|Could not find the function/i.test(m)) return 'La tienda se activa muy pronto.';
    return 'No se pudo. Revisa tu internet e intenta otra vez.';
  }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  function fecha(s) {
    var d = new Date(s), ms = d - Date.now();
    if (ms < 90 * 60e3) return 'quedan ' + Math.max(1, Math.round(ms / 60e3)) + ' min';
    if (ms < 36 * 3600e3) return 'quedan ' + Math.round(ms / 3600e3) + ' h';
    return 'hasta el ' + d.toLocaleDateString('es-PE', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  // Número del botón de diamantes (sube contando)
  function ponerSaldo(n, animar) {

    if (!animar || de === saldo) { recN.textContent = nf(saldo); return; }
    var t0 = performance.now(), dur = 700;
    recB.classList.remove('sube'); void recB.offsetWidth; recB.classList.add('sube');
    (function paso(t) { var p = Math.min(1, (t - t0) / dur); recN.textContent = nf(Math.round(de + (saldo - de) * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(paso); })(t0);
  }

  function activo(id) {
    if (!T) return false;
    if (/^vida/.test(id)) return !!T.infinito_hasta;
    if (id === 'doblexp') return !!T.doble_xp_hasta;
    if (id === 'fortuna') return !!T.fortuna_hasta;
    if (id === 'escudo') return +T.escudos > 0;
    return false;
  }
  // Fortuna y Ticket de sala sin clan: desactivados (supabase/130-tienda-pide-clan.sql). Si el SQL aún no está, T.clan no viene y no se bloquea
  function sinClan(id) { return id !== 'cupo5' && INFO[id] && INFO[id].g === 'clan' && T && T.clan === false; }
  function tarjeta(it, i) {
    var f = INFO[it.id]; if (!f) return '';
    var r = RZ[f.rz], sc = sinClan(it.id);
    return '<button type="button" class="tc' + (saldo < it.precio ? ' falta' : '') + (sc ? ' sinclan' : '') + (activo(it.id) ? ' on' : '') + '" data-item="' + esc(it.id) + '" style="--c:' + f.col + ';--r:' + r[1] + ';--d:' + (i * .5 % 3).toFixed(1) + 's" aria-label="' + esc(f.t + ' ' + f.c + ', ' + it.precio + ' diamantes') + '">' +
      '<span class="ic">' + (IC[it.id] || '') + '</span><span class="du">' + esc(f.c) + '</span>' +
      '<span class="rzc">' + r[0] + '</span>' + (f.of ? '<span class="ofc">' + f.of + '</span>' : '') +
      '<b>' + esc(f.t) + '</b><small>' + esc(f.d) + '</small>' + (sc ? '<span class="nc">Necesitas un clan</span>' : '') + '<span class="pr">' + DIA + '<span>' + nf(it.precio) + '</span></span></button>';
  }
  function pintar() {
    if (!T) return;
    if (T.error) { app.innerHTML = '<p class="estado">' + esc(T.error) + '</p>'; return; }
    var h = '';
    var cnt = function (g) { return (T.items || []).filter(function (it) { return INFO[it.id] && INFO[it.id].g === g; }).length; };
    if (cat !== 'mis' && !cnt(cat)) cat = GRUPOS[0][0];
    var G = GRUPOS.filter(function (g) { return g[0] === cat; })[0];
    var l = (T.items || []).filter(function (it) { return INFO[it.id] && INFO[it.id].g === cat; });
    var nInv = 0, inv = T.inv || {}; for (var k in inv) nInv += +inv[k] || 0;
    var nAct = (T.infinito_hasta ? 1 : 0) + (T.doble_xp_hasta ? 1 : 0) + (T.fortuna_hasta ? 1 : 0) + (+T.escudos ? 1 : 0);
    h += '<div class="lay"><nav class="rail" aria-label="Secciones de la tienda"><button type="button" class="r mis' + (cat === 'mis' ? ' on' : '') + '" data-cat="mis">' + SVM + '<span class="tx"><span>Mis compras</span><small>' + (nAct ? nAct + (nAct === 1 ? ' activa' : ' activas') : 'Actívalas cuando quieras') + '</small></span>' + (nInv ? '<i class="n">' + nInv + '</i>' : '') + '</button>' + GRUPOS.filter(function (g) { return cnt(g[0]); }).map(function (g) {
        return '<button type="button" class="r' + (g[0] === cat ? ' on' : '') + '" data-cat="' + g[0] + '">' + g[3] + '<span class="tx"><span>' + g[1] + '</span><small>' + g[2] + '</small></span><i class="n">' + cnt(g[0]) + '</i></button>';
      }).join('') + '</nav><div>' + (cat === 'mis' ? misVista() : '<div class="g">' + l.map(function (it, i) { return tarjeta(it, i); }).join('') + '</div>') + '</div></div>';
    app.innerHTML = h;
  }
  var SVM = '<svg viewBox="0 0 24 24"><path d="M4 8h16l-1.5 12h-13zM9 8V6a3 3 0 0 1 6 0v2"/></svg>';
  var EFE = { infinito: ['vida1', 'Vidas ilimitadas', '#FF4B6E'], doblexp: ['doblexp', 'Doble XP', '#FFC800'], fortuna: ['fortuna', 'Fortuna', '#58CC02'] };
  function dur(s) { s = +s || 0; if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min'; if (s < 172800) { var hh = Math.floor(s / 3600), mm = Math.round(s % 3600 / 60); return hh + ' h' + (mm ? ' ' + mm + ' min' : ''); } return Math.round(s / 86400) + ' días'; }
  function fila(ico, col, tit, sub, est, bt) {
    return '<div class="tc mc" style="--c:' + col + '"><span class="ic">' + ico + '</span>' + (est ? '<span class="du">' + est + '</span>' : '') + '<b>' + tit + '</b><small>' + sub + '</small>' + bt + '</div>';
  }
  function misVista() {
    var h = '', a = '', ps = '', g = '', inv = T.inv || {}, pz = T.pausa || {};
    [['infinito', T.infinito_hasta], ['doblexp', T.doble_xp_hasta], ['fortuna', T.fortuna_hasta]].forEach(function (x) {
      if (!x[1]) return; var e = EFE[x[0]];
      a += fila(IC[e[0]], e[2], esc(e[1]), 'Quedan <b>' + dur((new Date(x[1]) - Date.now()) / 1000) + '</b>', '<i class="vivo"></i> Activa', '<button type="button" class="mc-b gris" data-pausar="' + x[0] + '">Pausar</button>');
    });
    if (+T.escudos) a += fila(IC.escudo, '#1CB0F6', 'Protección de racha', 'Cuidando tu racha <b>' + T.escudos + (+T.escudos === 1 ? ' escudo' : ' escudos') + '</b>', '<i class="vivo"></i> Activa', '<button type="button" class="mc-b gris" data-quitar>Quitar 1</button>');
    for (var k in pz) if (EFE[k] && +pz[k] > 0) ps += fila(IC[EFE[k][0]], EFE[k][2], esc(EFE[k][1]), 'Te quedan <b>' + dur(pz[k]) + '</b>', 'En pausa', '<button type="button" class="mc-b" data-reanudar="' + k + '">Reanudar</button>');
    (T.items || []).forEach(function (it) {
      var n = +inv[it.id] || 0, f = INFO[it.id]; if (!n || !f) return;
      g += fila(IC[it.id], f.col, esc(f.t) + ' <em>' + esc(f.c) + '</em>', esc(f.d), 'x' + n, '<button type="button" class="mc-b" data-usar="' + it.id + '">Activar</button>');
    });
    if (a) h += '<h2>Activas ahora</h2><div class="g">' + a + '</div>';
    if (ps) h += '<h2>En pausa <small>El tiempo no corre</small></h2><div class="g">' + ps + '</div>';
    h += '<h2>Guardadas <small>Actívalas cuando quieras</small></h2>' + (g ? '<div class="g">' + g + '</div>' : '<p class="estado" style="text-align:left;padding:6px 0">Aún no tienes compras guardadas. Lo que compres llega aquí.</p>');
    return h;
  }
  function accion(fn, args, btn, despues) {
    if (ocupado) return; ocupado = true; if (btn) { btn.disabled = true; btn.textContent = '…'; }
    rpc(fn, args).then(function (d) { ocupado = false; T = d; ponerSaldo(d.diamantes); pintar(); if (despues) despues(d); },

  }
  function cargar() {
    return rpc('tienda_ver').then(function (d) { T = d || { items: [] }; ponerSaldo(T.diamantes); pintar(); },

  function ventana(html, cls, col) {

    o.addEventListener('click', function (e) { if (e.target === o || e.target.closest('.x')) o.remove(); });
    document.body.appendChild(o);
    return o;
  }

  // «+5 integrantes»: se compra con el ID del clan (supabase/133-tienda-cupo-clan.sql)
  function confirmarCupo() {
    var it = (T.items || []).filter(function (x) { return x.id === 'cupo5'; })[0], f = INFO.cupo5;
    if (!it) return;
    var falta = it.precio - saldo, clan = null, pide = 0;
    var o = ventana('<div class="gi">' + (IC.cupo5 || '') + '</div><h3>' + esc(f.t) + '</h3><p>Escribe el <b>ID del clan</b> que recibirá 5 cupos más (hasta 40). Puede ser el tuyo u otro.</p>' +
      '<input class="cu-in" id="cuId" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" placeholder="ID del clan (7 números)" value="' + (T.clan_id || '') + '">' +
      '<div class="cu-pv" id="cuPv"></div>' +
      (falta > 0 ? '<button type="button" class="bt gris" data-ganar>Te faltan ' + nf(falta) + ' ' + DIA + '</button><button type="button" class="lnk" data-ganar>¿Cómo consigo diamantes?</button>'
        : '<button type="button" class="bt" data-si disabled>Comprar ' + DIA + '<span>' + nf(it.precio) + '</span></button><p style="font-size:12.5px">Te quedan <b>' + nf(saldo - it.precio) + '</b> diamantes.</p>') +
      '<div class="err" hidden></div>', '', f.col);
    var inp = o.querySelector('#cuId'), pv = o.querySelector('#cuPv'), si = o.querySelector('[data-si]');
    function ver() {

      if (v.length < 7) { pv.innerHTML = v ? '<span class="cu-tx">Faltan ' + (7 - v.length) + ' números</span>' : ''; return; }
      var yo = ++pide; pv.innerHTML = '<span class="cu-tx">Buscando…</span>';
      rpc('clan_por_codigo', { p_codigo: v }).then(function (c) {
        if (yo !== pide) return;
        if (!c) { pv.innerHTML = '<span class="cu-tx mal">No hay ningún clan con ese ID.</span>'; return; }
        var cu = +c.cupo || 20;
        clan = c;
        pv.innerHTML = '<b>' + esc(c.nombre) + '</b><span class="cu-tx">' + c.miembros + ' miembros · ' + (cu >= 40 ? '<span class="mal">ya tiene el máximo (40)</span>' : 'cupo <s>' + cu + '</s> → <em>' + Math.min(40, cu + 5) + '</em>') + '</span>';
        if (si && cu < 40) si.disabled = false;
      }, function () { if (yo === pide) pv.innerHTML = '<span class="cu-tx mal">No se pudo buscar. Revisa tu internet.</span>'; });
    }
    inp.addEventListener('input', ver); ver();
    o.addEventListener('click', function (e) {
      if (e.target.closest('[data-ganar]')) { o.remove(); ganar(); return; }
      var b = e.target.closest('[data-si]'); if (!b || ocupado || !clan) return;
      ocupado = true; b.disabled = true; b.innerHTML = 'Comprando…';
      rpc('tienda_comprar_cupo', { p_clan: +inp.value }).then(function (d) {
        ocupado = false; o.remove(); T = d; ponerSaldo(d.diamantes, true); pintar(); listo('cupo5', d.premio || {});
      }, function (e) {
        ocupado = false; b.disabled = false; b.innerHTML = 'Comprar ' + DIA + '<span>' + nf(it.precio) + '</span>';
        var er = o.querySelector('.err'); er.hidden = false; er.textContent = errTxt(e);
      });
    });
  }
  // Confirmar compra
  function confirmar(id) {
    if (id === 'cupo5') return confirmarCupo();
    var it = (T.items || []).filter(function (x) { return x.id === id; })[0], f = INFO[id];
    if (!it || !f) return;
    var falta = it.precio - saldo;
    var o = ventana('<div class="gi">' + (IC[id] || '') + '</div><h3>' + esc(f.t) + ' <em>' + esc(f.c) + '</em></h3><p>' + esc(f.d) + '</p>' +
      (falta > 0 ? '<button type="button" class="bt gris" data-ganar>Te faltan ' + nf(falta) + ' ' + DIA + '</button><button type="button" class="lnk" data-ganar>¿Cómo consigo diamantes?</button>'
        : '<button type="button" class="bt" data-si>Comprar ' + DIA + '<span>' + nf(it.precio) + '</span></button><p style="font-size:12.5px">Te quedan <b>' + nf(saldo - it.precio) + '</b> diamantes.</p>') +
      '<div class="err" hidden></div>', '', f.col);
    o.addEventListener('click', function (e) {

        ocupado = false; o.remove(); T = d; ponerSaldo(d.diamantes, true); pintar(); (d.premio && d.premio.tipo === 'guardado') ? guardado(id, d.premio) : listo(id, d.premio || {});
      }, function (e) {
        ocupado = false; b.disabled = false; b.innerHTML = 'Comprar ' + DIA + '<span>' + nf(it.precio) + '</span>';

  // Qué se llevó (el cofre sorpresa dice qué salió)

    xp: ['doblexp', function (n) { return '+' + nf(n) + ' XP'; }], diamantes: [null, function (n) { return '+' + nf(n) + ' diamantes'; }],

    racha: ['revivir', function (n) { return 'Tu racha volvió: ' + n + (n == 1 ? ' día' : ' días'); }] };
  function listo(id, pr, act) {

    var ch = ''; for (var i = 0; i < 14; i++) { var a = i / 14 * Math.PI * 2, r = 110 + (i % 3) * 30; ch += '<i style="--x:' + Math.round(Math.cos(a) * r) + 'px;--y:' + Math.round(Math.sin(a) * r) + 'px;--t:' + (.15 + (i % 4) * .06) + 's"></i>'; }

      '<button type="button" class="bt" data-ok>Genial</button>', 'ok-v', col);

  // Comprado: se guardó en Mis compras (o activarlo ya)

      '<p>Se guardó en <b>Mis compras</b>. Actívala cuando quieras.</p><button type="button" class="bt" data-ya>Activar ahora</button><button type="button" class="lnk" data-luego>Guardar para después</button>', 'ok-v', f.col);
    o.addEventListener('click', function (e) {
      if (e.target.closest('[data-luego]')) { o.remove(); return; }
      var b = e.target.closest('[data-ya]'); if (!b) return;

    });
  }

  // Cómo conseguir diamantes (el «+»)
  // Paquetes de diamantes (se pagan por Yape y se recargan por ID). Cambia aquí cantidades y precios.
  var PAQ = [
    { n: 50, s: 1, f: 'bandeja' },
    { n: 110, s: 2, f: 'bolsa', tag: '+10%' },
    { n: 300, s: 5, f: 'saco', tag: 'Popular' },
    { n: 650, s: 10, f: 'cofre', tag: '+30%' },
    { n: 1050, s: 15, f: 'carrito', tag: '+40%' },
    { n: 2000, s: 25, f: 'mina', tag: 'Mejor precio' }
  ];
  var WSP = '51928030708', YAPE = '928 030 708', YAPE_NOMBRE = 'Javier R.';
  var IC_YAPE = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="4" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M12 10l4 5 4-5M16 15v6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="25" r="1.3" fill="#fff"/></svg>';
  var IC_CAP = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4C9.4 4 4 8.9 4 15c0 2.4.8 4.6 2.3 6.4L5 28l6.4-2.3c1.4.5 3 .8 4.6.8 6.6 0 12-4.9 12-11S22.6 4 16 4z" fill="none" stroke="#14101f" stroke-width="2.4" stroke-linejoin="round"/><rect x="11" y="10" width="10" height="10" rx="2" fill="none" stroke="#14101f" stroke-width="2.2"/><path d="M13 18l2.5-3 2 2 1.5-2" fill="none" stroke="#14101f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function paqIco(i) { return '<span class="pq-i"><i class="pq-s a"></i><i class="pq-s b"></i><i class="pq-s c"></i><img src="assets/diamantes/' + PAQ[i].f + '.webp" alt="" loading="lazy"></span>'; }
  function ganar() {
    var img = function (f) { return '<img src="assets/cofres/' + f + '-cerrado.webp" alt="">'; };
    var his = (T && T.historial || []).slice(0, 6);
    var o = ventana('<div class="gi" style="width:110px;height:110px">' + DIA + '</div><h3>Consigue <em>diamantes</em></h3>' +
      '<div data-compra><h4 class="pq-h">Recarga con Yape</h4><div class="pq">' + PAQ.map(function (p, i) {
        return '<button type="button" class="pq-c' + (p.tag === 'Mejor precio' || p.tag === 'Popular' ? ' top' : '') + '" data-paq="' + i + '">' + (p.tag ? '<span class="pq-t">' + p.tag + '</span>' : '') + paqIco(i) +
          '<b>' + nf(p.n) + '</b><small>diamantes</small><span class="pq-p">S/ ' + p.s + '</span></button>';
      }).join('') + '</div>' +
      '<div class="yp"><div class="yp-y"><span class="yp-ic">' + IC_YAPE + '</span><span class="yp-tx"><small>Yapea a</small><b>' + YAPE + '</b><span>A nombre de <em>' + YAPE_NOMBRE + '</em></span></span><button type="button" class="yp-b" data-copiar>Copiar</button></div>' +
        '<div class="yp-w"><span class="yp-ic">' + IC_CAP + '</span><span class="yp-tx"><small>Recarga automática</small><span>Toca un paquete, yapea y <em>sube tu captura</em>. Tus diamantes llegan solos.</span></span></div></div>' +
      '<div class="ym" id="ymMias"></div>' +
      '<p class="pq-n">¿Algún problema? Escríbenos por <a href="#" data-captura>WhatsApp al ' + YAPE + '</a>.</p></div>' +
      '<h4 class="pq-h">Gratis jugando</h4><div class="gan">' +
        '<div><span class="gi2">' + img('leyenda') + '</span><span><b>Cofres del clan</b><small>Cada semana: Oro <em>20</em> · Amatista <em>40</em> · Leyenda <em>80</em> diamantes.</small></span></div>' +
        '<div><span class="gi2">' + (IC.fortuna || '') + '</span><span><b>Cofres personales con Fortuna</b><small>Con Fortuna activa: <em>10 · 15 · 25 · 50</em> diamantes por cofre.</small></span></div>' +
      '</div>' +
      (his.length ? '<div class="his"><h4>Tus últimos movimientos</h4>' + his.map(function (x) { return '<div><span>' + esc(x.motivo) + '</span><b class="' + (x.cantidad < 0 ? 'm' : '') + '">' + (x.cantidad > 0 ? '+' : '') + nf(x.cantidad) + '</b></div>'; }).join('') + '</div>' : ''), 'ancha');
    var miId = function () { return T && T.id ? T.id : '(sin ID)'; };
    o.querySelector('[data-copiar]').addEventListener('click', function () {
      var num = YAPE.replace(/\s/g, '');
      try { navigator.clipboard.writeText(num).then(function () { toast('Número copiado: ' + YAPE); }, function () { toast('Yape: ' + YAPE); }); } catch (e) { toast('Yape: ' + YAPE); }
    });
    o.querySelector('[data-captura]').addEventListener('click', function () {
      if (arguments[0] && arguments[0].preventDefault) arguments[0].preventDefault();
      var msg = 'Hola Modo Cachimbo, tengo un problema con mi recarga de diamantes por Yape.\nMi ID: ' + miId();
      window.open('https://wa.me/' + WSP + '?text=' + encodeURIComponent(msg), '_blank');
    });
    o.querySelectorAll('[data-paq]').forEach(function (b) {

  // ---------- Recarga automática con Yape (supabase/141-yape-recargas.sql) ----------
  var EST_Y = { esperando: 'Verificando', revision: 'En revisión', aprobada: 'Recargado', rechazada: 'Rechazado' };
  function pintarMias(o) {
    var caja = o.querySelector('#ymMias'); if (!caja) return;
    rpc('yape_mias').then(function (l) {
      l = (l || []).filter(function (r) { return r.estado !== 'aprobada' || Date.now() - new Date(r.creado) < 864e5; }).slice(0, 3);
      caja.innerHTML = l.map(function (r) {
        return '<div class="' + r.estado + '"><span>S/ ' + (+r.monto) + ' · ' + nf(r.diamantes) + ' diamantes' + (r.estado === 'rechazada' && r.nota ? ' · ' + esc(r.nota) : '') + '</span><em>' + EST_Y[r.estado] + '</em></div>';
      }).join('');
    }, function () {});
  }
  function wspProblema(p) {
    var msg = 'Hola Modo Cachimbo, quiero recargar ' + nf(p.n) + ' diamantes por S/ ' + p.s + '.\nYa yapeé a ' + YAPE + ' (' + YAPE_NOMBRE + ').\nMi ID: ' + (T && T.id ? T.id : '(sin ID)') + '\nTe paso la captura del Yape.';
    window.open('https://wa.me/' + WSP + '?text=' + encodeURIComponent(msg), '_blank');
  }
  // Achica la captura (máx. 1280 px, JPG) para que suba rápido
  function achicar(file) {
    return new Promise(function (ok, mal) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? ok(b) : mal(new Error('imagen')); }, 'image/jpeg', .82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); mal(new Error('imagen')); };
      img.src = url;
    });
  }
  var IC_SUBE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L7 20"/></svg>';
  var IC_RELOJ = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  function pagar(i) {
    var p = PAQ[i], archivo = null;
    var o = ventana('<div class="yq"><div class="yq-top"><img src="assets/diamantes/' + p.f + '.webp" alt=""><div><b>' + nf(p.n) + '</b><span>diamantes</span></div><span class="yq-precio">S/ ' + p.s + '</span></div>' +
      '<div class="yq-paso"><span class="yq-n">1</span><div class="yq-c"><h4>Yapea S/ ' + p.s + '</h4><div class="yq-num"><div><b>' + YAPE + '</b><small>A nombre de ' + YAPE_NOMBRE + '</small></div><button type="button" class="yp-b" data-copiar>Copiar</button></div></div></div>' +
      '<div class="yq-paso" id="yqP2"><span class="yq-n">2</span><div class="yq-c"><h4>Sube tu captura</h4><label class="yq-sube" id="yqSube">' + IC_SUBE + '<span>Elegir captura</span><input type="file" accept="image/*" id="yqFile"></label></div></div>' +
      '<div class="yq-paso" id="yqP3"><span class="yq-n">3</span><div class="yq-c"><h4>Código de seguridad</h4><div class="yq-cod"><input inputmode="numeric" maxlength="1" aria-label="Primer número"><input inputmode="numeric" maxlength="1" aria-label="Segundo número"><input inputmode="numeric" maxlength="1" aria-label="Tercer número"></div>' +
        '<div class="yq-ej"><i><span>3</span><span>3</span><span>9</span></i>Los 3 números que salen en tu captura de Yape.</div></div></div>' +
      '<button type="button" class="bt" id="yqEnviar" disabled>Enviar y recargar</button>' +
      '<small class="yq-ayuda">¿Problemas? <a href="#" data-wsp>Escríbenos por WhatsApp</a></small></div>', 'yq-v', '#C07BFF');
    var cods = [].slice.call(o.querySelectorAll('.yq-cod input')), env = o.querySelector('#yqEnviar');
    function codigo() { return cods.map(function (x) { return x.value; }).join(''); }
    function listo() {
      o.querySelector('#yqP3').classList.toggle('ok', /^\d{3}$/.test(codigo()));
      env.disabled = !(archivo && /^\d{3}$/.test(codigo()));
    }
    cods.forEach(function (x, k) {
      x.addEventListener('input', function () {
        var v = x.value.replace(/\D/g, '');
        if (v.length > 1) { v.split('').slice(0, 3 - k).forEach(function (d, j) { cods[k + j].value = d; }); (cods[Math.min(2, k + v.length)] || x).focus(); }
        else { x.value = v; if (v && cods[k + 1]) cods[k + 1].focus(); }
        listo();
      });
      x.addEventListener('keydown', function (e) { if (e.key === 'Backspace' && !x.value && cods[k - 1]) cods[k - 1].focus(); });
    });
    o.querySelector('[data-copiar]').addEventListener('click', function () {
      var num = YAPE.replace(/\s/g, '');
      try { navigator.clipboard.writeText(num).then(function () { toast('Número copiado: ' + YAPE); }, function () { toast('Yape: ' + YAPE); }); } catch (e) { toast('Yape: ' + YAPE); }
    });
    o.querySelector('[data-wsp]').addEventListener('click', function (e) { e.preventDefault(); wspProblema(p); });
    o.querySelector('#yqFile').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      archivo = f;
      var sube = o.querySelector('#yqSube');
      sube.classList.add('con');
      sube.querySelector('svg') && sube.querySelector('svg').remove();
      var im = sube.querySelector('img') || sube.insertBefore(document.createElement('img'), sube.firstChild);
      im.src = URL.createObjectURL(f);
      sube.querySelector('span').textContent = 'Captura lista · toca para cambiar';
      o.querySelector('#yqP2').classList.add('ok');
      listo();
      if (!codigo()) cods[0].focus();
    });
    env.addEventListener('click', function () {
      if (env.disabled) return;
      env.disabled = true; env.textContent = 'Enviando…';
      var u = window.MCAuth && MCAuth.usuario();
      if (!u) { toast('Entra con tu cuenta primero.'); env.disabled = false; env.textContent = 'Enviar y recargar'; return; }
      var ruta = u.id + '/' + Date.now() + '.jpg';
      achicar(archivo).then(function (blob) {
        return MCAuth.listo.then(function (c) { return c.storage.from('yape').upload(ruta, blob, { contentType: 'image/jpeg', upsert: false }); });
      }).then(function (r) {
        if (r && r.error) throw r.error;
        return rpc('yape_pedir', { p_paquete: i, p_codigo: codigo(), p_captura: ruta });
      }).then(function (d) { esperar(o, p, d); }, function (e) {
        var m = String(e && (e.message || e) || '');
        env.disabled = false; env.textContent = 'Enviar y recargar';
        if (/yape_codigo/.test(m)) return toast('Escribe los 3 números del código de seguridad.');
        if (/yape_muchas/.test(m)) return toast('Ya tienes recargas verificándose. Espera a que terminen.');
        if (/yape_dia/.test(m)) return toast('Llegaste al máximo de recargas de hoy. Escríbenos por WhatsApp.');
        if (/imagen/.test(m)) return toast('No se pudo leer esa imagen. Prueba con otra captura.');
        if (/bucket|does not exist|Could not find the function/i.test(m)) { toast('La recarga automática se activa pronto. Te abrimos WhatsApp.'); return wspProblema(p); }
        toast('No se pudo enviar. Revisa tu internet e intenta otra vez.');
      });
    });
  }
  // Después de enviar: pregunta cada 4 s (hasta 1 min) si ya llegó el pago
  function esperar(o, p, d) {
    var ven = o.querySelector('.ven'), id = d && d.id, n = 0, fin = false;
    function pintar(d) {
      var x = ven.querySelector('.x');
      if (d.estado === 'aprobada') {
        fin = true;
        ven.innerHTML = '<div class="yq-est"><div class="gi">' + DIA + '</div><h3>¡Recarga <em>lista</em>!</h3><p>Se sumaron <b>' + nf(d.diamantes) + ' diamantes</b> a tu cuenta.</p><button type="button" class="bt" data-cerrar>Seguir comprando</button></div>';
        if (typeof d.saldo === 'number') { ponerSaldo(d.saldo, true); if (T) T.diamantes = d.saldo; }
      } else if (d.estado === 'rechazada') {
        fin = true;
        ven.innerHTML = '<div class="yq-est"><div class="ic">' + IC_RELOJ + '</div><h3>No se <em>recargó</em></h3><p>' + esc(d.nota || 'No encontramos ese pago.') + '</p><button type="button" class="bt" data-wsp>Escribir por WhatsApp</button></div>';
      } else if (d.estado === 'revision' || n >= 15) {
        fin = true;
        ven.innerHTML = '<div class="yq-est"><div class="ic">' + IC_RELOJ + '</div><h3>Pago en <em>revisión</em></h3><p>Aún no vemos tu Yape de S/ ' + p.s + '. Lo revisamos y tus diamantes llegan apenas se confirme. Puedes cerrar esta ventana.</p><button type="button" class="bt" data-cerrar>Entendido</button></div>';
      } else {
        ven.innerHTML = '<div class="yq-est"><div class="yq-gira" aria-hidden="true"></div><h3>Verificando tu <em>pago</em></h3><p>Estamos buscando tu Yape de S/ ' + p.s + '. Suele tardar menos de un minuto.</p></div>';
      }
      if (x) ven.insertBefore(x, ven.firstChild);
    }
    o.addEventListener('click', function (e) {
      if (e.target.closest('[data-cerrar]')) o.remove();
      if (e.target.closest('[data-wsp]')) wspProblema(p);
    });
    pintar(d || { estado: 'esperando' });
    (function otra() {
      if (fin || !id || !document.body.contains(o)) return;
      setTimeout(function () {
        if (!document.body.contains(o)) return;
        n++;
        rpc('yape_ver', { p_id: id }).then(function (r) { if (r) pintar(r); otra(); }, function () { otra(); });
      }, 4000);
    })();
  }

  app.addEventListener('click', function (e) {
    var q = e.target.closest('[data-usar],[data-pausar],[data-reanudar],[data-quitar]');
    if (q) {
      if (q.dataset.usar) accion('tienda_usar', { p_item: q.dataset.usar }, q, function (d) { listo(q.dataset.usar, d.premio || {}, true); });
      else if (q.dataset.pausar) accion('tienda_pausar', { p_efecto: q.dataset.pausar }, q, function () { toast('En pausa. El tiempo que te queda se guardó.'); });
      else if (q.dataset.reanudar) accion('tienda_reanudar', { p_efecto: q.dataset.reanudar }, q, function () { toast('¡Activada otra vez!'); });
      else accion('tienda_escudo_quitar', {}, q, function () { toast('Volvió a Mis compras.'); });
      return;
    }
    var cb = e.target.closest('[data-cat]'); if (cb) { cat = cb.dataset.cat; try { localStorage.setItem('mc_tienda_cat', cat); } catch (er) {} pintar(); return; } var c = e.target.closest('[data-item]'); if (c && T && !T.error) { if (sinClan(c.dataset.item)) { toast('Únete a un clan para comprar esto.'); return; } confirmar(c.dataset.item); } });
  recB.addEventListener('click', function () { if (T && !T.error) ganar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { var o = document.querySelector('.ov'); if (o) o.remove(); } });
  cargar();
  setInterval(function () { if (T && !T.error && !document.querySelector('.ov')) pintar(); }, 60e3);
})();
