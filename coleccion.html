<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="apple-touch-icon" href="assets/app/icono-180.png">

<title>Mi colección · Modo Cachimbo</title>
<link rel="stylesheet" href="assets/buho/buho.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800;1,900&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346; --borde: #2C2549;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; min-height: 100vh; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 60px; }
  @media (min-width: 900px) { .wrap { padding: 0 32px 60px; } }
  /* Arriba: volver al inicio, el título y tu tarjeta */
  header.top { display: flex; align-items: center; gap: 14px; padding: 22px 0 18px; }
  header.top h1 { flex: 1; display: flex; align-items: center; gap: 18px; min-width: 0; font: italic 900 46px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--accent); padding-top: 4px; text-shadow: 0 3px 0 rgba(0,0,0,.45); white-space: nowrap; }
  header.top h1::after { content: ""; flex: 1; height: 2px; min-width: 20px; background: linear-gradient(90deg, rgba(198,224,0,.45), rgba(198,224,0,0)); }
  .top-tarj { flex: none; }
  @media (max-width: 700px) {
    header.top { gap: 10px; padding: 16px 0 14px; }
    header.top h1 { font-size: 32px; gap: 10px; }
    /* En el celular tu tarjeta ya sale en la vista previa */
    .top-tarj { display: none !important; }
  }
  .panel { background: var(--surface); border: 2px solid var(--borde); border-bottom-width: 5px; border-radius: 22px; padding: 22px; }
  .vacio { text-align: center; padding: 50px 24px; }
  .vacio h1 { font: italic 900 30px/1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
  .vacio p { color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 420px; margin: 0 auto 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--accent); color: #1a1f00; border: 2px solid #8fa300; border-bottom-width: 5px; border-radius: 14px; padding: 12px 22px; font: 1000 14px Nunito, sans-serif; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; text-decoration: none; }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
  .btn.gris { background: var(--surface-2); color: var(--text-dim); border-color: #352E58; }

  /* Volver al inicio: botón con relieve, como los de la grilla */
  .c-volver { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 46px; padding: 0 16px 0 10px; border-radius: 14px; background: var(--surface-2); border: 2px solid #352E58; border-bottom-width: 5px; color: var(--text); font-weight: 900; font-size: 15px; text-decoration: none; text-transform: uppercase; letter-spacing: .04em; transition: transform .08s, border-color .15s, color .15s; -webkit-tap-highlight-color: transparent; }
  .c-volver svg { display: block; flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
  .c-volver:hover { border-color: var(--accent); color: var(--accent); }
  .c-volver:hover svg { transform: translateX(-3px); }
  .c-volver:active { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
  .c-volver { transform: skewX(-10deg); border-radius: 10px; }
  .c-volver > * { transform: skewX(10deg); }
  .c-volver:active { transform: skewX(-10deg) translateY(3px); }
  /* En el celular la vista previa es más bajita para llegar rápido a las pestañas */
  @media (max-width: 700px) { .c-volver { width: 46px; height: 46px; padding: 0; justify-content: center; } .c-volver span { display: none; } .c-volver svg { width: 24px; height: 24px; } }

  .vault { display: grid; gap: 16px; }
  .vault > div { min-width: 0; }
  @media (min-width: 900px) { .vault { grid-template-columns: 330px minmax(0, 1fr); align-items: start; } .puesto { position: sticky; top: 16px; } }

  /* Lo que llevas puesto */
  .puesto { position: relative; overflow: hidden; text-align: center; padding: 16px; border-radius: 22px; border: 2px solid #3a2a6e; border-bottom-width: 5px;
    background: radial-gradient(circle at 50% 30%, rgba(124,77,255,.22), transparent 62%), linear-gradient(180deg, #1b1532, #120e22); animation: entra .5s ease-out both; }
  .puesto .k { display: inline-block; padding: 5px 14px; transform: skewX(-10deg); background: #2a2150; border-radius: 6px; color: #fff !important; }
  .puesto .k { font-size: 12px; color: var(--text-dim); font-weight: 1000; text-transform: uppercase; letter-spacing: 1.5px; }
  .p-tarj { justify-content: center; margin: 10px 0 10px; pointer-events: none; }
  .p-tarj .mcu-chip { transform: scale(.92); }
  .p-esc { position: relative; aspect-ratio: 1.05; border-radius: 18px; overflow: hidden; isolation: isolate; border: 1px solid var(--borde);
    background: var(--esc, radial-gradient(120% 85% at 50% 30%, #3a1f73 0%, #22124a 38%, #110b26 78%)); }
  .p-esc::before { content: ""; position: absolute; left: 28%; right: 28%; top: 0; bottom: 18%; z-index: -1; background: linear-gradient(to bottom, rgba(255,236,190,.16), transparent); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
  .p-piso { position: absolute; left: 24%; right: 24%; bottom: 12%; height: 13%; z-index: -1; }
  .p-piso svg { position: absolute; inset: -6% -4%; width: 108%; height: 112%; overflow: visible; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .p-buho { position: absolute; left: 50%; bottom: 19%; width: 46%; translate: -50% 0; }
  .p-buho .mcb { width: 100%; translate: 0 var(--drop); }
  .p-buho > img { display: block; width: 118%; margin-left: -9%; height: auto; translate: 0 6%; filter: drop-shadow(0 6px 5px rgba(0,0,0,.4)); animation: flota 3.2s ease-in-out infinite; }
  .p-racha { --rc1: #5b34b8; --rc2: #241452; --rcb: #3a2380; --rcd: #1a0f40; position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 16px; color: #fff; text-align: left; background: linear-gradient(135deg, var(--rc1), var(--rc2)); border: 2px solid var(--rcb); border-bottom: 5px solid var(--rcd); transition: background .4s, border-color .4s; }
  .p-racha::before { content: ''; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.16), transparent 70%); pointer-events: none; }
  .pr-fuego svg { width: 28px; height: 32px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .pr-fuego .f1 { fill: var(--fl1, #FF9600); } .pr-fuego .f2 { fill: var(--fl2, #FFD84D); }
  .pr-n { display: grid; line-height: 1; }
  .pr-n b { font: 900 26px/1 var(--display); }
  .pr-n small { font-size: 11px; font-weight: 800; opacity: .85; margin-top: 2px; }
  .pr-dias { margin-left: auto; display: flex; gap: 4px; }
  .pr-dias i { width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.25); }
  .pr-dias i.on { background: #FF9600; border-color: #FFD84D; }
  .puesto.probando { border-color: var(--accent); }
  .p-prueba { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(198,224,0,.08); border: 1.5px solid rgba(198,224,0,.45); text-align: left; animation: entra .3s ease-out both; }
  .p-prueba .pp-t { font-size: 14px; color: var(--text); min-width: 0; }
  .p-prueba .pp-t b { color: var(--accent); }
  .p-prueba .pp-t small { display: block; color: var(--text-dim); font-size: 12px; margin-top: 2px; font-weight: 700; }
  .p-prueba .pp-b { display: flex; gap: 6px; }
  .p-prueba .btn { padding: 8px 14px; font-size: 12.5px; border-bottom-width: 4px; }
  .slot.prueba { border-color: var(--accent); }
  .p-reset { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--text-dim); font: 800 13px Nunito, sans-serif; text-decoration: underline; cursor: pointer; }
  .p-reset:hover { color: var(--accent); }
  .mcc-dib .mcb, .slot .v .mcb { width: 78%; height: auto; }
  .p-buho .mcb img, .mcc-dib .mcb img, .slot .v .mcb img { width: auto; height: auto; object-fit: initial; }
  .p-buho.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .p-nom { font: italic 900 28px/1 var(--display); text-transform: uppercase; margin-top: 2px; }
  .p-tit { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; font-weight: 1000; color: var(--c, #FFC800); background: rgba(var(--cr, '255,200,0'), .1); border: 1.5px solid rgba(var(--cr), .5); border-radius: 999px; padding: 4px 11px; }
  .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .slot .mcc-av { width: 34px; border-radius: 9px; box-shadow: none; }
  /* El título va solo en su fila: el ícono a la izquierda y el nombre al lado */
  .slot[data-tab="titulo"] { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 14px; text-align: left; }
  .slot[data-tab="titulo"] .v { margin: 0; flex: none; }
  .slot[data-tab="titulo"] b { flex: 1; font-size: 13px; }
  .slot .mcc-av b { font-size: 16px; }
  .slot { background: var(--surface-2); border: 2px solid var(--borde); border-bottom-width: 4px; border-radius: 14px; padding: 8px 4px 7px; font-size: 11px; color: var(--text-dim); cursor: pointer; font-family: inherit; font-weight: 800; min-width: 0; }
  .slot .v { height: 34px; display: grid; place-items: center; margin-bottom: 3px; }
  .slot .v > * { max-height: 34px; }
  .slot .v img, .slot .v svg { width: 34px; height: 34px; object-fit: contain; display: block; }
  .slot b { display: block; color: var(--text); font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .mini-tema { width: 38px; height: 26px; border-radius: 8px; }
  .slot .mini-marco { width: 30px; height: 30px; border-radius: 10px; padding: 3px; }
  .slot .mini-marco i { display: block; width: 100%; height: 100%; border-radius: 7px; background: var(--surface-2); }
  .vit { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .vit .mcc-pin { width: 44px; border-width: 3px; }
  .vit .mcc-pin span { font-size: 22px; }
  .vit .hueco { width: 44px; height: 44px; border-radius: 50%; border: 2px dashed #352E58; }

  /* Pestañas estilo juego: inclinadas, con ícono y color propio; la elegida se enciende */
  .ctabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 8px; margin: -4px -4px 0; scrollbar-width: none; }
  .ctabs::-webkit-scrollbar { display: none; }
  .ctabs button { --tc: #C6E000; flex: none; position: relative; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
  .ctabs .tb { display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 16px 0 13px; transform: skewX(-10deg); border-radius: 10px; background: linear-gradient(180deg, #221c3d, #18132c); border: 2px solid #2f2852; border-bottom-width: 5px; color: var(--text-dim); font: italic 900 17px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; transition: transform .1s, background .15s, color .15s, border-color .15s; }
  .ctabs .tb > * { transform: skewX(10deg); }
  .ctabs .tb svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--tc); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .ctabs .tb em { font-style: normal; }
  .ctabs button:hover .tb { border-color: var(--tc); color: var(--text); }
  .ctabs button:active .tb { transform: skewX(-10deg) translateY(3px); border-bottom-width: 2px; }
  .ctabs button.on .tb { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 100%, #fff 18%), var(--tc)); border-color: color-mix(in srgb, var(--tc) 70%, #000); color: #14101f; box-shadow: 0 0 18px color-mix(in srgb, var(--tc) 45%, transparent); }
  .ctabs button.on .tb svg { stroke: #14101f; }
  .ctabs button .pto { position: absolute; right: 0; top: -3px; width: 12px; height: 12px; border-radius: 50%; background: #FF4B4B; box-shadow: 0 0 0 2px var(--bg); }
  /* Título de la pestaña */
  .sec { --tc: #C6E000; margin: 14px 2px 14px; }
  .sec h2 { display: flex; align-items: center; gap: 10px; font: italic 900 30px/1 var(--display); text-transform: uppercase; color: #fff; letter-spacing: .02em; }
  .sec h2 i { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: color-mix(in srgb, var(--tc) 18%, transparent); border: 2px solid color-mix(in srgb, var(--tc) 60%, transparent); }
  .sec h2 svg { width: 22px; height: 22px; fill: none; stroke: var(--tc); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .sec h2::after { content: ""; flex: 1; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--tc), transparent); opacity: .55; }
  .intro { color: var(--text-dim); font-size: 13.5px; margin: 8px 0 0; line-height: 1.5; }
  /* La grilla: pocos y grandes; los pines en más columnas */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .grid.muchos { gap: 10px; }
  @media (min-width: 560px) { .grid.muchos { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .grid.muchos { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid:not(.muchos) { grid-template-columns: repeat(2, minmax(0, 300px)); } }
  .nada { grid-column: 1 / -1; text-align: center; color: var(--text-faint); padding: 30px 10px; font-weight: 800; }
  /* Tarjetas estilo Free Fire: esquina cortada, brillo de su rareza y franja abajo */
  .grid .mcc-it { border-radius: 16px; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); padding: 12px 10px 14px;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 10px, transparent 10px 20px), radial-gradient(90% 70% at 50% 30%, rgba(var(--c), .35), transparent 70%), linear-gradient(180deg, #1f1938, #120e22); }
  .grid .mcc-it::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgb(var(--c)); opacity: .9; }
  .grid .mcc-it b { font: italic 900 22px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin-top: 6px; }
  .grid.muchos .mcc-it b { font-size: 17px; }
  .grid .mcc-it.mcc-on { box-shadow: inset 0 0 0 2px #C6E000, 0 0 26px rgba(198,224,0,.35); }
  .grid .mcc-it:hover { transform: translateY(-3px); }
  /* Rangos (vitrina de assets/rango.js) */
  .rangos .mc-rgo-vit { margin-top: 0; }

  /* Detalle de un objeto */
  .hoja { position: fixed; inset: 0; z-index: 50; background: rgba(8,6,18,.7); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .25s; }
  .hoja.ver { opacity: 1; }
  .hoja-c { position: relative; width: min(460px, 100%); background: radial-gradient(circle at 50% 30%, rgba(var(--c), .3), transparent 65%), var(--surface); border: 2.5px solid rgba(var(--c), .8); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 18px 20px 26px; text-align: center; transform: translateY(40px); transition: transform .3s cubic-bezier(.2,1.2,.4,1); }
  .hoja.ver .hoja-c { transform: none; }
  @media (min-width: 700px) { .hoja { align-items: center; } .hoja-c { border-radius: 26px; border-bottom: 6px solid rgba(var(--c), .8); } }
  .hoja-c .x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 12px; border: 2px solid var(--borde); background: var(--surface-2); color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .hoja-c .dib { width: 180px; height: 180px; margin: 0 auto; display: grid; place-items: center; }
  .hoja-c .dib .mcc-dib { width: 100%; height: 100%; }
  .hoja-c .dib.lock { filter: grayscale(1) brightness(.45); }
  .hoja-c .dib .mcc-titulo span { font-size: 18px; }
  .hoja-c small { display: block; font-size: 12px; font-weight: 1000; letter-spacing: 1.6px; text-transform: uppercase; color: rgb(var(--c)); margin-top: 6px; }
  .hoja-c h2 { font: italic 900 32px/1 var(--display); text-transform: uppercase; margin-top: 2px; }
  .hoja-c p { color: var(--text-dim); font-size: 14px; line-height: 1.5; margin: 8px auto 0; max-width: 340px; }
  .hoja-c .bar { height: 10px; border-radius: 9px; background: rgba(255,255,255,.08); margin: 12px auto 0; max-width: 260px; overflow: hidden; }
  .hoja-c .bar i { display: block; height: 100%; background: rgb(var(--c)); border-radius: 9px; }
  .hoja-c .acc { margin-top: 16px; display: flex; justify-content: center; gap: 8px; }
  .hoja-c .estado { margin-top: 10px; font-size: 12.5px; color: #ff8a8a; min-height: 1em; }

  .aviso { margin-top: 14px; font-size: 12.5px; color: var(--text-faint); text-align: center; line-height: 1.5; }

  /* En el celular la vista previa es más bajita para llegar rápido a las pestañas */
  @media (max-width: 899px) { .p-esc { aspect-ratio: 1.5; } .p-buho { width: 32%; bottom: 20%; } }
  /* Todas las pestañas a la vista */
  .ctabs { flex-wrap: wrap; overflow: visible; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes flota { 50% { transform: translateY(-6px); } }
  @keyframes pop { 0% { transform: scale(.6) rotate(-8deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .p-buho, .puesto { animation: none; } }
</style>

<body>
  <div class="wrap">
    <header class="top">
      <a class="c-volver" href="index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Inicio</span></a>
      <h1>Mi colección</h1>
      <div class="top-tarj" data-mc-auth data-mc-tarjeta="sola"></div>
    </header>

    <div id="cargando" class="panel vacio"><p>Cargando…</p></div>
    <div id="sinSesion" class="panel vacio" hidden>
      <h1>Tu colección</h1>
      <p>Ingresa para ver los búhos, fondos, marcos, títulos y pines que vas ganando.</p>
      <button class="btn" type="button" id="btnIngresar">Ingresar</button>
    </div>

    <div id="conSesion" hidden>
      <div class="vault">
        <section class="puesto" id="puesto" aria-label="Lo que llevas puesto">
          <span class="k">Lo que llevas puesto</span>
          <!-- Así se ve en tu inicio: tu tarjeta de perfil y tu búho en su escenario -->
          <div class="p-tarj" data-mc-tarjeta id="pTarj" aria-hidden="true"></div>
          <div class="p-esc" id="pEsc"><div class="p-piso" id="pPiso"></div><div class="p-buho" id="pBuho"></div></div>
          <!-- Tu cuadro de racha (en tu perfil) con el skin que llevas o pruebas -->
          <div class="p-racha" id="pRacha" aria-hidden="true">
            <span class="pr-fuego"><svg viewBox="0 0 32 36"><path class="f1" d="M16 1.5c1.2 4.6 7.6 8.2 9.6 13.6 2.6 7-1.6 17.4-9.6 17.4S3.8 24.9 6.1 17.6c1-3.2 3.3-5.3 4.9-6.9.2 2.8 1.4 4.6 3 5.2C13.3 10.6 14 6 16 1.5z"/><path class="f2" d="M16.3 15.5c.6 2.4 4.5 4.4 4.5 8.6a4.8 4.8 0 0 1-9.6 0c0-2 1-3.4 2.1-4.4.2 1.4.8 2.3 1.6 2.6-.4-2.4 0-4.6 1.4-6.8z"/></svg></span>
            <span class="pr-n"><b id="pRachaN">0</b><small>días de racha</small></span>
            <span class="pr-dias" id="pRachaD"></span>
          </div>
          <span class="p-tit" id="pTit"></span>
          <div class="p-prueba" id="pPrueba" role="status" hidden></div>
          <div class="slots" id="slots"></div>
          <div class="vit" id="pVit" aria-label="Mi vitrina de pines"></div>
          <button type="button" class="p-reset" id="pReset" hidden>Volver a lo predeterminado</button>
        </section>

        <div>
          <div class="ctabs" id="tabs" role="tablist"></div>
          <div class="sec" id="sec"><h2 id="secT"></h2><p class="intro" id="intro"></p></div>
          <div class="grid" id="grid"></div>
          <p class="aviso" id="aviso" hidden>Lo que te pones se guarda en este equipo. Muy pronto quedará en tu cuenta.</p>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var C = window.MCColeccion, R = C.rareza;
  var TAB = (location.hash || '').slice(1) || 'buho', FIL = 'todos';
  var INTRO = {
    buho: 'El búho que sale en tu inicio. Toca uno para probarlo y dale «Usar» si te gusta.',
    avatar: 'Tu foto de perfil: sale en tu tarjeta de arriba, en tu perfil y en los tops.',
    escena: 'Donde se para tu búho en el inicio: cada escenario trae su cielo y su piso. Galaxia es el de siempre.',
    racha: 'El fondo de tu tarjeta de perfil (arriba, junto a tu nombre) y en los tops. Galaxia es el de siempre.',
    cuadro: 'Tu cuadro de racha en tu perfil: su color y el de su fuego. Galaxia es el de siempre.',
    marco: 'El borde de tu foto en tu tarjeta de perfil y en tu perfil.',
    titulo: 'La frase que sale bajo tu nombre.',
    pines: 'Elige hasta 3 pines para tu vitrina. Se ganan en los eventos.',
    rangos: 'Cada lunes se guarda aquí el rango que alcanzaste en la semana. Toca uno para ver tus semanas.'
  };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function ver(cual) {
    $('cargando').hidden = cual !== 'cargando';
    $('sinSesion').hidden = cual !== 'sin';
    $('conSesion').hidden = cual !== 'con';
  }

  /* ---------- Lo que llevas puesto ---------- */
  // Vista previa: lo que tocas en la grilla se prueba aquí y solo se guarda con «Usar»
  var PREV = null;
  function P(e) { return PREV && PREV.espacio === e ? PREV.id : C.puesto(e); }
  function pintarPuesto(pop) {
    var b = C.item(P('buho')), t = C.item(P('titulo')), tr = R[t.rareza];
    var pb = $('pBuho');
    pb.innerHTML = C.buho(b);
    // El escenario: su cielo y su piso, como en el inicio
    var eid = P('escena'), et = C.escena(eid);
    if (eid === 'escena-galaxia') $('pEsc').style.removeProperty('--esc');
    else $('pEsc').style.setProperty('--esc', 'radial-gradient(120% 85% at 50% 30%, ' + et[0] + ' 0%, ' + et[3] + ' 42%, #0b0818 85%)');
    $('pPiso').innerHTML = C.piso(eid);
    pintarTarjeta();
    pintarRacha();
    pintarPrueba();
    // ¿Llevas algo distinto a lo de siempre?
    $('pReset').hidden = !!PREV || !['buho', 'avatar', 'escena', 'racha', 'cuadro', 'marco', 'titulo'].some(function (e) { return C.puesto(e) !== C.defecto[e]; });
    if (pop) { pb.classList.remove('pop'); void pb.offsetWidth; pb.classList.add('pop'); }
    var pt = $('pTit'); pt.textContent = '★ ' + t.nom;
    pt.style.setProperty('--cr', tr.c); pt.style.color = 'rgb(' + tr.c + ')';
    var tema = C.tema(P('racha')), marco = C.marco(P('marco')), av = C.item(P('avatar')), es = C.escena(P('escena'));
    var slots = [
      ['buho', b.nom, 'Búho', '<span style="width:34px;height:34px;display:block">' + C.buho(b) + '</span>'],
      ['avatar', av.nom, 'Perfil', '<span style="width:34px;height:34px;display:block">' + C.avatarHtml(av, av.av ? '' : miFoto(), miLetra()) + '</span>'],
      ['escena', C.item(P('escena')).nom, 'Escenario', '<span class="mini-tema" style="display:block;background:radial-gradient(120% 90% at 50% 20%,' + es[0] + ',' + es[3] + ')"></span>'],
      ['racha', C.item(P('racha')).nom, 'Fondo', '<span class="mini-tema" style="display:block;background:linear-gradient(135deg,' + tema[0] + ',' + tema[1] + ')"></span>'],
      ['cuadro', C.item(P('cuadro')).nom, 'Racha', '<span style="width:30px;height:34px;display:block">' + C.llama(C.cuadro(P('cuadro')).llama) + '</span>'],
      ['marco', C.item(P('marco')).nom, 'Marco', '<span class="mini-marco" style="display:block;background:' + (marco || '#2A2346') + '"><i></i></span>'],
      ['titulo', t.nom, 'Título', '<span style="font-size:22px;color:rgb(' + tr.c + ')">★</span>']
    ];
    $('slots').innerHTML = slots.map(function (s) {
      return '<button type="button" class="slot' + (PREV && PREV.espacio === s[0] ? ' prueba' : '') + '" data-tab="' + s[0] + '"><span class="v">' + s[3] + '</span><b>' + esc(s[1]) + '</b>' + s[2] + '</button>';
    }).join('');
    var pines = C.puesto('pines'), h = '';
    for (var i = 0; i < 3; i++) h += pines[i] ? C.pin(C.item(pines[i])) : '<span class="hueco" title="Espacio libre para un pin"></span>';
    $('pVit').innerHTML = h;
  }
  $('slots').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) elegirTab(b.dataset.tab); });
  $('pVit').addEventListener('click', function () { elegirTab('pines'); });

  // Tu tarjeta de perfil como la de arriba (assets/tarjeta-perfil.js), con lo que estás probando
  function pintarTarjeta() {
    var c = document.querySelector('header [data-mc-auth] .mcu-chip.mct');
    var nom = c && c.querySelector('.mcu-nom') ? c.querySelector('.mcu-nom').textContent : '';
    var rg = c && c.querySelector('.mct-rg'), t = C.tema(P('racha')), m = C.marco(P('marco')), src = C.avatar(P('avatar')) || miFoto();
    var h = '<div class="mcu-chip mct" style="--f1:' + t[0] + ';--f2:' + t[3] + '">' +
      '<span class="mct-marco' + (m ? ' con' : '') + '"' + (m ? ' style="--m:' + m + '"' : '') + '>' +
      '<span class="mcu-av' + (C.avatar(P('avatar')) ? ' mct-buho' : '') + '" style="--f1:' + t[0] + ';--f2:' + t[3] + '">' + (src ? '<img src="' + esc(src) + '" alt="">' : esc(miLetra())) + '</span></span>' +
      '<span class="mct-tx"><span class="mcu-nom">' + esc(nom) + '</span><small class="mct-rg"' + (rg ? ' style="' + esc(rg.getAttribute('style') || '') + '"' : '') + '>' + (rg ? rg.innerHTML : '') + '</small></span></div>';
    if ($('pTarj').innerHTML !== h) $('pTarj').innerHTML = h;
  }
  new MutationObserver(function () { setTimeout(pintarTarjeta, 0); }).observe(document.querySelector('header [data-mc-auth]'), { childList: true, subtree: true, attributes: true });
  // El cuadro de racha con el fondo que llevas (o pruebas) y tus días de esta semana
  var miRacha = null;
  function pintarRacha() {
    var k = C.cuadro(P('cuadro')), t = k.tema, c = $('pRacha');
    ['--rc1', '--rc2', '--rcb', '--rcd'].forEach(function (v, i) { c.style.setProperty(v, t[i]); });
    c.style.setProperty('--fl1', k.llama[0]); c.style.setProperty('--fl2', k.llama[1]);
    var n = miRacha ? +miRacha.actual || 0 : 0, h = '';
    $('pRachaN').textContent = n;
    for (var i = 0; i < 7; i++) h += '<i' + (i >= 7 - Math.min(n, 7) ? ' class="on"' : '') + '></i>';
    $('pRachaD').innerHTML = h;
  }
  (function esperar(i) {
    if (window.MCRacha) MCRacha.alCambiar(function (r) { miRacha = r; pintarRacha(); });
    else if (i < 100) setTimeout(function () { esperar(i + 1); }, 200);
  })(0);
  // La barra de «Probando…»: Usar lo guarda, Quitar vuelve a lo que llevas
  function pintarPrueba() {
    var bar = $('pPrueba');
    if (!PREV) { bar.hidden = true; $('puesto').classList.remove('probando'); return; }
    var x = C.item(PREV.id), ok = C.tiene(x.id);
    $('puesto').classList.add('probando');
    bar.hidden = false;
    bar.innerHTML = '<span class="pp-t">Probando <b>' + esc(x.nom) + '</b>' + (ok ? '' : '<small>' + esc(C.como(x)) + '</small>') + '</span>' +
      '<span class="pp-b">' + (ok ? '<button type="button" class="btn" data-p="usar">Usar</button>' : '<button type="button" class="btn gris" data-p="ver">Cómo se consigue</button>') +
      '<button type="button" class="btn gris" data-p="quitar">Quitar</button></span>';
  }
  $('pPrueba').addEventListener('click', function (e) {
    var b = e.target.closest('[data-p]'); if (!b || !PREV) return;
    var id = PREV.id;
    if (b.dataset.p === 'usar') { PREV = null; usar(id); }
    else if (b.dataset.p === 'ver') abrir(id);
    else { PREV = null; todo(false); }
  });
  function probar(id) {
    var x = C.item(id);
    if (x.espacio === 'pines' || C.puesto(x.espacio) === id) { PREV = null; abrir(id); return; }
    PREV = { espacio: x.espacio, id: id };
    C.marcarVistos([id]);
    todo(x.espacio === 'buho');
    if (innerWidth < 900) $('puesto').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Volver a lo de siempre: búho clásico, foto de búho, Galaxia, sin marco y el título de siempre
  $('pReset').addEventListener('click', function () {
    var b = this; b.disabled = true;
    ['buho', 'avatar', 'escena', 'racha', 'cuadro', 'marco', 'titulo'].filter(function (e) { return C.puesto(e) !== C.defecto[e]; })
      .reduce(function (p, e) { return p.then(function () { return C.poner(e, C.defecto[e]); }); }, Promise.resolve())
      .then(function () { b.disabled = false; todo(true); }, function () { b.disabled = false; todo(false); });
  });

  /* ---------- Pestañas ---------- */
  // Cada pestaña con su ícono y su color (estilo juego)
  var TABS = {
    buho: ['Búho', '#C6E000'], avatar: ['Perfil', '#1CB0F6'], escena: ['Escenarios', '#CE82FF'], racha: ['Fondos', '#FF86D0'],
    cuadro: ['Racha', '#FF9600'], marco: ['Marcos', '#FFC800'], titulo: ['Títulos', '#FF6E84'], pines: ['Pines', '#14C46A'], rangos: ['Rangos', '#5FDAFF']
  };
  var ICO = {
    buho: '<svg viewBox="0 0 24 24"><path d="M5 5l3.5 2.5h7L19 5v8a7 7 0 0 1-14 0z"/><circle cx="9.3" cy="12" r="1.3"/><circle cx="14.7" cy="12" r="1.3"/></svg>',
    avatar: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>',
    escena: '<svg viewBox="0 0 24 24"><path d="M3 19.5l6-9 4 5 3-3 5 7z"/><circle cx="17" cy="6" r="2"/></svg>',
    racha: '<svg viewBox="0 0 24 24"><path d="M3 6h18l-3 12H3z"/><circle cx="8" cy="12" r="2"/></svg>',
    cuadro: '<svg viewBox="0 0 24 24"><path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 3-6 0 2 1 3 2 3-1-3 0-6 1-8z"/></svg>',
    marco: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/></svg>',
    titulo: '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    pines: '<svg viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="5.5"/><path d="M9 14.5l-2 6 5-2 5 2-2-6"/></svg>',
    rangos: '<svg viewBox="0 0 24 24"><path d="M4 8l4 3 4-6 4 6 4-3-2 11H6z"/></svg>'
  };
  function pintarTabs() {
    var ids = C.espacios.map(function (e) { return e.id; }).concat('rangos');
    $('tabs').innerHTML = ids.map(function (id) {
      var L = id === 'rangos' ? [] : C.items(id), t = TABS[id] || [id, '#C6E000'];
      var nuevo = L.some(function (x) { return C.tiene(x.id) && C.nuevos().indexOf(x.id) >= 0; });
      return '<button type="button" role="tab" data-tab="' + id + '" class="' + (TAB === id ? 'on' : '') + '" aria-selected="' + (TAB === id) + '" style="--tc:' + t[1] + '">' +
        '<span class="tb">' + ICO[id] + '<em>' + t[0] + '</em></span>' + (nuevo ? '<span class="pto"></span>' : '') + '</button>';
    }).join('');
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) elegirTab(b.dataset.tab); });
  function elegirTab(t) {
    TAB = t;
    history.replaceState(null, '', '#' + t);
    pintarTabs(); pintarGrid();
    var b = $('tabs').querySelector('.on'); if (b && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (innerWidth < 900) $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- La grilla ---------- */
  var rangosHtml = null;
  function pintarGrid() {
    $('intro').textContent = INTRO[TAB] || '';
    var tb = TABS[TAB] || TABS.buho;
    $('sec').style.setProperty('--tc', tb[1]);
    $('secT').innerHTML = '<i>' + ICO[TAB] + '</i>' + tb[0];
    var g = $('grid');
    if (TAB === 'rangos') { pintarRangos(); return; }
    g.className = 'grid';
    var L = C.items(TAB).filter(function (x) { var ok = C.tiene(x.id); return FIL === 'todos' || (FIL === 'tengo' ? ok : !ok); });
    g.innerHTML = L.length ? L.map(function (x, i) { return C.tarjeta(x, i); }).join('') : '<p class="nada">' + (FIL === 'tengo' ? 'Todavía no tienes nada aquí.' : '¡Ya tienes todo lo de esta pestaña!') + '</p>';
    g.classList.toggle('muchos', L.length > 4);
  }
  function pintarRangos() {
    var g = $('grid'); g.className = 'rangos';
    if (!window.MCRango) { g.innerHTML = '<p class="nada">No se pudo cargar tus rangos.</p>'; return; }
    MCRango.css();
    if (rangosHtml) { g.innerHTML = rangosHtml.html; return; }
    g.innerHTML = '<p class="nada">Cargando tus rangos…</p>';
    MCAuth.listo.then(function (c) {
      return c.from('xp_semana').select('semana,xp').eq('usuario', MCAuth.usuario().id).order('semana', { ascending: false }).limit(60);
    }).then(function (r) {
      rangosHtml = MCRango.vitrina((r && r.data) || []);
      rangosHtml.html = '<div class="mc-rgo-vit">' + rangosHtml.html + '</div>';
      if (TAB === 'rangos') g.innerHTML = rangosHtml.html;
    }).catch(function () { g.innerHTML = '<p class="nada">No se pudo cargar tus rangos.</p>'; });
  }
  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('.mcc-it');
    if (b && e.target.closest('[data-usar]')) { usar(b.dataset.id); return; }
    if (b) { probar(b.dataset.id); return; }
    var r = e.target.closest('button.mc-rgo-pz');
    if (r && rangosHtml && MCRango.semanas) MCRango.semanas(+r.dataset.n, rangosHtml.semanas[+r.dataset.n]);
  });

  // Botón «Usar» de cada cuadro: se lo pone sin abrir el detalle
  function usar(id) {
    var x = C.item(id); PREV = null;
    C.poner(x.espacio, id).then(function () {
      if (window.MCSonido && MCSonido.bien) try { MCSonido.bien(); } catch (e) {}
      C.marcarVistos([id]); todo(x.espacio === 'buho');
    }, function () { abrir(id); });
  }
  // Tu foto de Google o tu inicial (de la tarjeta de arriba), para «Mi foto»
  function miFoto() { var i = document.querySelector('[data-mc-auth] .mcu-av'); var o = i && i.getAttribute('data-orig'); var m = o && /src="([^"]+)"/.exec(o); return m ? m[1].replace(/&amp;/g, '&') : ''; }
  function miLetra() { var i = document.querySelector('[data-mc-auth] .mcu-av'); var o = i && i.getAttribute('data-orig'); return o && !/</.test(o) ? o : ''; }

  /* ---------- Detalle ---------- */
  function abrir(id) {
    var x = C.item(id), ok = C.tiene(id), rz = R[x.rareza], av = C.avance(id);
    var lleva = x.espacio === 'pines' ? C.puesto('pines').indexOf(id) >= 0 : C.puesto(x.espacio) === id;
    var esp = C.espacios.filter(function (e) { return e.id === x.espacio; })[0];
    var d = document.createElement('div'); d.className = 'hoja'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', x.nom);
    var boton = !ok ? '' : x.espacio === 'pines'
      ? '<button type="button" class="btn' + (lleva ? ' gris' : '') + '" data-poner>' + (lleva ? 'Quitar de mi vitrina' : 'Poner en mi vitrina') + '</button>'
      : lleva ? '<button type="button" class="btn gris" disabled>Ya lo llevas puesto</button>' : '<button type="button" class="btn" data-poner>Ponérmelo</button>';
    d.innerHTML = '<div class="hoja-c" style="--c:' + rz.c + '"><button type="button" class="x" aria-label="Cerrar">✕</button>' +
      '<div class="dib' + (ok ? '' : ' lock') + '"><span class="mcc-dib" style="--c:' + rz.c + '">' + C.dibujo(x) + '</span></div>' +
      '<small>' + rz.nom + ' · ' + esp.uno + (x.area ? ' · ' + esc(x.area) : '') + '</small><h2>' + esc(x.nom) + '</h2>' +
      (x.desc ? '<p>' + esc(x.desc) + '</p>' : '') + '<p>' + esc(C.como(x)) + '</p>' +
      (!ok && av != null ? '<div class="bar"><i style="width:' + Math.round(av * 100) + '%"></i></div>' : '') +
      '<div class="acc">' + boton + '</div><p class="estado" role="status"></p></div>';
    function cerrar() { d.classList.remove('ver'); setTimeout(function () { d.remove(); }, 260); }
    d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('.x')) cerrar(); });
    document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { cerrar(); document.removeEventListener('keydown', k); } });
    var p = d.querySelector('[data-poner]');
    if (p) p.addEventListener('click', function () {
      p.disabled = true;
      C.poner(x.espacio, id).then(function () {
        if (window.MCSonido && MCSonido.bien) try { MCSonido.bien(); } catch (e) {}
        cerrar(); todo(x.espacio === 'buho');
      }, function () { p.disabled = false; d.querySelector('.estado').textContent = 'No se pudo guardar. Revisa tu conexión e intenta otra vez.'; });
    });
    document.body.appendChild(d);
    C.marcarVistos([id]);
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('ver'); }); });
  }

  function todo(pop) { pintarPuesto(pop); pintarTabs(); if (TAB !== 'rangos') pintarGrid(); $('aviso').hidden = C.estado().sql; }

  var primera = true;
  C.alCambiar(function () {
    if ($('conSesion').hidden) return;
    todo(false);
    // Lo nuevo que ganaste desde la última vez: sale el cofre
    if (primera && C.estado().listo && C.estado().rachaOk) { primera = false; var n = C.nuevos(); if (n.length) setTimeout(function () { C.celebrar(n, function () { todo(true); }); }, 700); }
  });
  function cargar(u) {
    if (!u) { ver('sin'); return; }
    ver('con'); C.css(); todo(false);
    C.cargar();
  }
  $('btnIngresar').addEventListener('click', function () { MCAuth.abrirIngreso(); });
  MCAuth.alCambiar(cargar);
  MCAuth.listo.catch(function () { ver('cargando'); $('cargando').innerHTML = '<p>No se pudo conectar. Revisa tu internet y recarga la página.</p>'; });
})();
</script>
<script src="assets/sonido.js"></script>
</body>
</html>
