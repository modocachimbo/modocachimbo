<style>
/* =========================================================
   Modo Cachimbo · Arcade (prototipo)
   Minijuegos por tema. Todo sale de un solo bloque de datos por tema
   (PAR / VF / ORDEN), así que cualquier tema nuevo trae los 3 juegos solos.
   ========================================================= */
:root {
  --fondo: #0B0818; --tarjeta: #151127; --tarjeta2: #1D1834; --borde: #2A2346;
  --texto: #EEEAF7; --suave: #A99FC8; --lima: #C6E000; --sobre-lima: #151a03;
  --ok: #58CC02; --mal: #FF4B4B; --oro: #FFC800; --morado: #A35CFF;
  --c: #F07A1A; --c2: #FFB067; --c-soft: rgba(240,122,26,.16);
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --cuerpo: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-modo="claro"] { --fondo: #F6F5FA; --tarjeta: #FFFFFF; --tarjeta2: #EEECF5; --borde: #DCD8E8; --texto: #1A1626; --suave: #6B6485; --lima: #7FA300; --sobre-lima: #fff; --c-soft: rgba(240,122,26,.12); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--fondo); color: var(--texto); font-family: var(--cuerpo); -webkit-tap-highlight-color: transparent; }
body { min-height: 100dvh; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.disp { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
.tit { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; line-height: .95; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Cabecera */
.cab { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 14px max(16px, env(safe-area-inset-left)) 14px; background: color-mix(in srgb, var(--fondo) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--borde); }
.cab .volver { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--tarjeta); border: 1px solid var(--borde); font-size: 22px; }
.cab h1 { font-size: 30px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab h1 small { display: block; font: 800 13px/1 var(--display); font-style: normal; letter-spacing: .08em; color: var(--suave); margin-bottom: 3px; }
.xp { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--tarjeta); border: 1px solid var(--borde); font: 800 18px/1 var(--display); color: var(--lima); white-space: nowrap; }
.xp .ic { font-size: 18px; color: var(--oro); }
.combo { display: none; padding: 8px 12px; border-radius: 12px; background: linear-gradient(135deg, #FF8A00, #FF3D6E); color: #fff; font: italic 900 18px/1 var(--display); white-space: nowrap; }
.combo.si { display: block; animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.18); } }

.vista { display: none; width: 100%; max-width: 1080px; margin: 0 auto; padding: 22px 16px calc(40px + env(safe-area-inset-bottom)); }
.vista.on { display: block; animation: entra .28s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } }

.sec-t { margin: 30px 0 12px; font-size: 26px; display: flex; align-items: baseline; gap: 10px; }
.sec-t small { font: 800 14px/1 var(--display); font-style: normal; letter-spacing: .06em; color: var(--suave); }
.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tema { position: relative; overflow: hidden; display: grid; gap: 10px; padding: 18px; border-radius: 20px; text-align: left; background: var(--tarjeta); border: 1px solid var(--borde); border-bottom: 4px solid var(--tc, var(--c)); transition: transform .15s; }
.tema:not(.bloq):hover { transform: translateY(-3px); }
.tema .curso { display: flex; align-items: center; gap: 8px; font: 800 13px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--tc, var(--c)); }
.tema .curso i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc, var(--c)); }
.tema b { font-size: 26px; }
.tema .mini { display: flex; gap: 6px; flex-wrap: wrap; }
.tema .mini span { padding: 4px 9px; border-radius: 8px; background: var(--tarjeta2); color: var(--suave); font: 800 12.5px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.tema .prog { height: 8px; border-radius: 8px; background: var(--tarjeta2); overflow: hidden; }
.tema .prog i { display: block; height: 100%; width: var(--p, 0%); background: var(--tc, var(--c)); border-radius: 8px; }
.tema.bloq { opacity: .55; cursor: default; }
.tema .pronto { position: absolute; right: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: var(--tarjeta2); color: var(--suave); font: 800 12px/1 var(--display); letter-spacing: .08em; }
.tema .nuevo { position: absolute; right: 12px; top: 12px; padding: 4px 9px; border-radius: 8px; background: var(--lima); color: var(--sobre-lima); font: 800 12px/1 var(--display); letter-spacing: .08em; }

/* ---------- Mapa de mundos (estilo Plants vs. Zombies 2) ----------
   Cada curso es un mundo (una isla flotante) sobre el remolino; se pasa de uno a otro
   deslizando o con las flechas. Imágenes en assets/arcade/: mundo-<curso>.webp (isla sin
   fondo), nombre-<curso>.webp (letrero), fondo.jpg y remolino.webp (capa que gira). */
body.en-inicio { background: #04112E; overflow: hidden; }
body.en-inicio .cab { display: none; }
#v-inicio { max-width: none; padding: 0; }
.mapa { position: relative; height: 100dvh; min-height: 560px; overflow: hidden; color: #fff; background: #04112E url("assets/arcade/fondo.jpg") center / cover no-repeat; user-select: none; -webkit-user-select: none; }
.mapa::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(2,8,30,.55) 100%); }
/* El remolino: gira siempre y da una vuelta rápida al cambiar de mundo */
.vtx { position: absolute; left: 50%; top: 44%; width: min(118vw, 112vh); aspect-ratio: 1; translate: -50% -50%; transition: transform 1s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
.vtx img { width: 100%; height: 100%; animation: gira 60s linear infinite; opacity: .7; mix-blend-mode: screen; }
.vtx::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle, rgba(140,240,255,.35), transparent 70%); animation: late 3.2s ease-in-out infinite; }
@keyframes late { 50% { opacity: .45; transform: scale(1.08); } }
.chispas { position: absolute; inset: 0; pointer-events: none; }
.chispas i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #CFFAFF; box-shadow: 0 0 8px 2px rgba(120,230,255,.8); animation: chispa var(--t) linear infinite; animation-delay: var(--d); opacity: 0; }
@keyframes chispa { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.2); } }
/* Barra de arriba */
.m-top { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; align-items: center; gap: 10px; padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); }
.m-btn { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 16px; font-size: 26px; color: #fff; background: linear-gradient(180deg, #3D8BFF, #1A55D0); border: 3px solid #0B2A70; box-shadow: 0 4px 0 #0B2A70, inset 0 2px 0 rgba(255,255,255,.35); }
.m-btn .ic { stroke-width: 3.2; }
.m-tit { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.m-tit b { font: italic 900 clamp(28px, 4.5vw, 40px)/1 var(--display); letter-spacing: .03em; text-transform: uppercase; text-shadow: 0 3px 0 #0B2A70, 0 0 18px rgba(80,200,255,.6); }
.m-chip { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 14px; background: rgba(4,17,46,.72); border: 2px solid rgba(120,200,255,.35); font: 900 17px/1 var(--cuerpo); backdrop-filter: blur(4px); }
.m-chip .ic { font-size: 19px; color: #FFD23F; }
.m-chip.xp b { color: var(--lima); }
.btn-sonido { cursor: pointer; font-size: 18px; color: #fff; justify-content: center; min-width: 46px; }
.cab .btn-sonido { min-width: 0; }
/* Las islas */
.escena { position: absolute; inset: 0; z-index: 2; touch-action: pan-y; }
.isla { --h: min(64vh, 640px); position: absolute; left: 50%; top: 42%; height: var(--h); width: calc(var(--h) * .75); margin-left: calc(var(--h) * -.375); margin-top: calc(var(--h) * -.5); display: grid; place-items: center; transition: transform .75s cubic-bezier(.22,.9,.25,1), opacity .6s, filter .6s; cursor: pointer; }
.isla .flota { width: 100%; height: 100%; display: grid; place-items: center; animation: flota 4.6s ease-in-out infinite; }
.isla img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 26px 30px rgba(0,10,40,.55)); pointer-events: none; }
.isla .sombra { position: absolute; bottom: -4%; left: 25%; right: 25%; height: 7%; border-radius: 50%; background: radial-gradient(rgba(0,10,40,.55), transparent 70%); animation: sombra 4.6s ease-in-out infinite; }
@keyframes flota { 50% { transform: translateY(-14px); } }
@keyframes sombra { 50% { transform: scale(.85); opacity: .7; } }
.isla.c { transform: none; z-index: 3; }
.isla.l { transform: translateX(calc(var(--h) * -.92)) scale(.46); opacity: .62; filter: brightness(.65) saturate(.8); z-index: 2; }
.isla.r { transform: translateX(calc(var(--h) * .92)) scale(.46); opacity: .62; filter: brightness(.65) saturate(.8); z-index: 2; }
.isla.ll { transform: translateX(calc(var(--h) * -1.6)) scale(.3); opacity: 0; pointer-events: none; }
.isla.rr { transform: translateX(calc(var(--h) * 1.6)) scale(.3); opacity: 0; pointer-events: none; }
.isla.c.entra .flota { animation: emerge .8s cubic-bezier(.2,.9,.3,1.2), flota 4.6s ease-in-out .8s infinite; }
@keyframes emerge { from { transform: scale(.55) rotate(-14deg); filter: brightness(2.2) blur(2px); } }
/* Mundo sin juegos todavía: silueta apagada con candado */
.isla.bloq img { filter: grayscale(.55) brightness(.62) drop-shadow(0 26px 30px rgba(0,10,40,.55)); }
.isla.bloq.sil img { filter: brightness(0) drop-shadow(0 0 18px rgba(120,220,255,.55)); opacity: .85; }
.isla .cand { position: absolute; top: 38%; left: 50%; translate: -50% -50%; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; color: #fff; background: rgba(4,17,46,.75); border: 3px solid rgba(160,220,255,.6); box-shadow: 0 0 24px rgba(80,200,255,.5); }
.isla.l .cand, .isla.r .cand { display: none; }
.isla .sig { position: absolute; top: 34%; left: 50%; translate: -50% -50%; font: 900 120px/1 var(--cuerpo); color: rgba(150,230,255,.7); text-shadow: 0 0 24px rgba(80,200,255,.8); }
/* Flechas */
.m-fl { position: absolute; top: 42%; z-index: 5; width: 58px; height: 58px; margin-top: -29px; display: grid; place-items: center; border-radius: 50%; font-size: 30px; color: #fff; background: linear-gradient(180deg, #FFD23F, #F59E0B); border: 3px solid #7A4A00; box-shadow: 0 5px 0 #7A4A00, inset 0 2px 0 rgba(255,255,255,.5); transition: transform .12s, opacity .2s; }
.m-fl .ic { stroke-width: 3.4; color: #4A2A00; }
.m-fl:active { transform: translateY(3px); box-shadow: 0 2px 0 #7A4A00; }
.m-fl.izq { left: max(14px, 3vw); } .m-fl.der { right: max(14px, 3vw); } .m-fl.der .ic { transform: scaleX(-1); }
.m-fl[disabled] { opacity: 0; pointer-events: none; }
/* Pie: letrero, datos y botón jugar */
.m-pie { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: grid; justify-items: center; gap: 10px; padding: 0 16px max(22px, env(safe-area-inset-bottom)); }
.placa { height: clamp(70px, 12vh, 110px); display: flex; justify-content: center; align-items: center; animation: aparece .5s cubic-bezier(.2,.9,.3,1.3); }
.placa img { height: 100%; width: auto; max-width: 90vw; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.placa .txt { padding: 12px 30px; border-radius: 14px; background: linear-gradient(180deg, #8C8576, #6D6758); border: 3px solid #4A4538; box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 6px 0 #3A3628; font: 900 clamp(22px, 4vw, 32px)/1 var(--cuerpo); color: #EDE6D2; text-transform: uppercase; text-shadow: 0 3px 0 #3A3628; }
@keyframes aparece { from { transform: scale(.6) translateY(10px); opacity: 0; } }
.m-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font: 900 15px/1 var(--cuerpo); color: #DDF4FF; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
.m-info span { display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 12px; background: rgba(4,17,46,.7); border: 1px solid rgba(120,200,255,.3); }
.m-info .ic { color: #FFD23F; font-size: 17px; }
.jugar { min-width: 230px; height: 64px; padding: 0 34px; border-radius: 20px; font: 900 28px/1 var(--cuerpo); letter-spacing: .04em; color: #fff; text-transform: uppercase; text-shadow: 0 3px 0 #1E6B00; background: linear-gradient(180deg, #8BEA2C, #4DB80A); border: 4px solid #1E5A00; box-shadow: 0 7px 0 #1E5A00, inset 0 3px 0 rgba(255,255,255,.45); transition: transform .1s; animation: late2 2.4s ease-in-out infinite; }
.jugar:active { transform: translateY(4px); box-shadow: 0 3px 0 #1E5A00; }
.jugar[disabled] { background: linear-gradient(180deg, #8A93A8, #5F6880); border-color: #353C50; box-shadow: 0 7px 0 #353C50; text-shadow: 0 3px 0 #353C50; animation: none; font-size: 22px; }
@keyframes late2 { 50% { transform: scale(1.04); } }
.puntos { display: flex; gap: 8px; }
.puntos i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.3); transition: all .3s; }
.puntos i.on { width: 26px; border-radius: 6px; background: #FFD23F; }
@media (max-width: 720px) {
  .isla { --h: min(46vh, 420px); top: 42%; }
  .isla.l { transform: translateX(calc(var(--h) * -.78)) scale(.4); }
  .isla.r { transform: translateX(calc(var(--h) * .78)) scale(.4); }
  .m-fl { width: 48px; height: 48px; margin-top: -24px; font-size: 24px; top: 42%; }
  .vtx { top: 42%; width: 150vw; }
  .m-chip { height: 38px; padding: 0 10px; font-size: 15px; }
  .m-btn { width: 44px; height: 44px; }
  .jugar { height: 58px; font-size: 25px; min-width: 210px; }
}
@media (min-width: 721px) and (max-height: 700px) { .isla { --h: 60vh; top: 41%; } .placa { height: 70px; } .m-pie { gap: 8px; } }
@media (max-width: 720px) and (max-height: 640px) { .isla { --h: 40vh; } .placa { height: 58px; } }
/* ---------- Inicio del Arcade (pantalla al tocar "Arcade") ----------
   Cielo hecho con código en los colores de Modo Cachimbo, con nubes que
   pasan, estrellitas que titilan, luces que suben y una estrella fugaz.
   Arriba: volver, jugador (foto, nivel, XP), monedas y sonido.
   Debajo: estrellas del mundo. Centro: "MUNDO N" + la isla con su sombra.
   Abajo: rombos de niveles con flechas, JUGAR + dificultad e isla chica (mapa). */
.mapa { --top: calc(env(safe-area-inset-top) + 150px); --bot: calc(env(safe-area-inset-bottom) + 232px); --mo: #2A1A66;
  background: radial-gradient(120% 55% at 50% 112%, rgba(198,224,0,.22), transparent 60%), linear-gradient(180deg, #170C46 0%, #3B23A8 30%, #5B3FD6 56%, #3E8BEA 84%, #5FD0F5 100%); }
.mapa::after { background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(16,8,48,.45) 100%); }
.vtx, .chispas, .m-fl, .puntos, .h-cap .placa, .h-cap .m-info { display: none; }
/* Cielo animado */
.cielo { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.cielo .nube { position: absolute; left: 0; width: var(--w); height: calc(var(--w) * .34); top: var(--y); border-radius: 50%; background: rgba(255,255,255,var(--o)); filter: blur(6px); animation: nube var(--t) linear infinite; animation-delay: var(--d); }
.cielo .nube::before, .cielo .nube::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
.cielo .nube::before { width: 55%; height: 150%; left: 15%; bottom: 20%; }
.cielo .nube::after { width: 40%; height: 120%; right: 14%; bottom: 25%; }
@keyframes nube { from { transform: translateX(-40vw); } to { transform: translateX(140vw); } }
.cielo .est { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; box-shadow: 0 0 6px 1px rgba(255,255,255,.8); animation: titila var(--t) ease-in-out infinite; animation-delay: var(--d); }
.cielo .est.l { background: #E6FF5A; box-shadow: 0 0 8px 2px rgba(198,224,0,.8); }
@keyframes titila { 50% { opacity: .15; transform: scale(.5); } }
.cielo .luz { position: absolute; bottom: -10px; width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #F4FF8A, rgba(198,224,0,0) 70%); animation: sube var(--t) linear infinite; animation-delay: var(--d); opacity: 0; }
@keyframes sube { 10% { opacity: .9; } 90% { opacity: .6; } to { transform: translate(var(--x), -100dvh); opacity: 0; } }
.cielo .fugaz { position: absolute; top: 12%; left: 70%; width: 120px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #fff, transparent); rotate: -28deg; opacity: 0; animation: fugaz 9s ease-in 3s infinite; }
@keyframes fugaz { 0% { opacity: 0; transform: translateX(0); } 3% { opacity: 1; } 12% { opacity: 0; transform: translateX(-420px); } 100% { opacity: 0; transform: translateX(-420px); } }
@media (prefers-reduced-motion: reduce) { .cielo * { animation: none !important; } }
/* La isla: más grande, sin vecinas a los lados y con sombra en el "suelo" */
.escena { top: var(--top); bottom: var(--bot); inset-inline: 0; }
.isla { --h: min(calc(100dvh - var(--top) - var(--bot) + 10px), 560px); top: 50%; }
.isla.l, .isla.r { opacity: 0; pointer-events: none; }
.isla img { filter: drop-shadow(0 20px 22px rgba(20,10,60,.55)); }
.isla .sombra { bottom: -6%; left: 22%; right: 22%; height: 9%; background: radial-gradient(closest-side, rgba(16,8,48,.7), rgba(16,8,48,.3) 60%, transparent); filter: blur(3px); }
.isla::after { content: ""; position: absolute; z-index: -1; inset: 8% 4% 30%; border-radius: 50%; background: radial-gradient(closest-side, rgba(198,224,0,.28), transparent); filter: blur(10px); animation: late 3.2s ease-in-out infinite; pointer-events: none; }
.isla.l::after, .isla.r::after { display: none; }
/* Botón brillante base (volver, sonido, flechas) */
.g-btn { position: relative; display: grid; place-items: center; color: #fff; cursor: pointer; border-radius: 14px; background: linear-gradient(180deg, #B58BFF, #7A4DF0 48%, #5A2FD0 52%, #4A22B8); border: 3px solid var(--mo); box-shadow: 0 4px 0 var(--mo), 0 6px 12px rgba(16,8,48,.45), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.2); transition: transform .1s; }
.g-btn::before { content: ""; position: absolute; left: 4px; right: 4px; top: 3px; height: 40%; border-radius: 10px 10px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); pointer-events: none; }
.g-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mo), inset 0 2px 0 rgba(255,255,255,.55); }
.g-btn .ic { position: relative; stroke-width: 3.2; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.g-btn[disabled] { filter: grayscale(.8) brightness(.7); opacity: .55; pointer-events: none; }
/* Barra de arriba */
.h-top { position: absolute; z-index: 7; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); }
.h-volver { width: 44px; height: 44px; flex: none; font-size: 22px; }
.h-son { width: 44px; height: 44px; flex: none; font-size: 20px; border-radius: 50%; }
.h-son::before { border-radius: 50% 50% 40% 40%; }
/* Estrellas del mundo */

/* ---------- Animaciones de los botones ---------- */
.rec { overflow: visible; }

.rec.co::after { animation-delay: 1.6s; } .rec.di::after { animation-delay: 3.2s; }
@keyframes barridoR { 0%, 70% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
.rec .mas { animation: masL 2.6s ease-in-out infinite; }
.rec.co .mas { animation-delay: .4s; } .rec.di .mas { animation-delay: .8s; }
@keyframes masL { 0%, 82%, 100% { transform: scale(1); } 88% { transform: scale(1.22); } 94% { transform: scale(.95); } }
/* Rayo: destello eléctrico */
.rec.ry .ri { animation: rayoA 2.8s ease-in-out infinite; }
@keyframes rayoA { 0%, 70%, 100% { transform: rotate(0); filter: drop-shadow(0 0 8px #2FA8FF); } 74% { transform: rotate(-12deg) scale(1.15); filter: drop-shadow(0 0 16px #9BE4FF) brightness(1.5); } 78% { transform: rotate(8deg) scale(1.05); filter: drop-shadow(0 0 6px #2FA8FF); } 82% { transform: rotate(-4deg) scale(1.12); filter: drop-shadow(0 0 18px #CFF2FF) brightness(1.6); } 88% { transform: rotate(0) scale(1); } }
.rec .chis { position: absolute; left: 4px; top: 50%; width: 4px; height: 4px; border-radius: 50%; pointer-events: none; opacity: 0; }
.rec.ry .chis { background: #CFF2FF; box-shadow: 0 0 6px #2FA8FF; animation: chisR 2.8s ease-out infinite; }
.rec.ry .chis:nth-of-type(2) { --dx: -16px; --dy: 14px; } .rec.ry .chis:nth-of-type(1) { --dx: -10px; --dy: -18px; }
@keyframes chisR { 0%, 72% { opacity: 0; transform: translate(0, 0); } 76% { opacity: 1; } 92%, 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
/* Corazón: latido + corazoncito que sube */
.rec.co .chis { width: 10px; height: 9px; left: -2px; border-radius: 0; background: #FF6B7A; clip-path: path("M5 9C2 6.5 0 5 0 2.7A2.5 2.5 0 0 1 5 1.5a2.5 2.5 0 0 1 5 1.2C10 5 8 6.5 5 9z"); animation: sube2 3.2s ease-out infinite; }
.rec.co .chis:nth-of-type(2) { animation-delay: 1.6s; left: 10px; }
@keyframes sube2 { 0%, 40% { opacity: 0; transform: translateY(0) scale(.6); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }
/* Diamante: gira un poco y destella */

@keyframes diaA { 0%, 100% { transform: rotate(-6deg) translateY(0); filter: drop-shadow(0 0 8px #D46BFF); } 50% { transform: rotate(6deg) translateY(-3px); filter: drop-shadow(0 0 16px #F0B8FF) brightness(1.2); } }
.rec.di .chis { width: 12px; height: 12px; left: 0; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: destello 2.2s ease-in-out infinite; }
.rec.di .chis:nth-of-type(1) { left: 14px; margin-top: -20px; } .rec.di .chis:nth-of-type(2) { left: -14px; margin-top: 4px; animation-delay: -1.1s; width: 9px; height: 9px; }
@keyframes destello { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
/* JUGAR: respira y el play late con un anillo */
#jugar { animation: jg2 2.4s ease-in-out infinite, respira 2.4s ease-in-out infinite; }
@keyframes respira { 50% { scale: 1.035; } }

@keyframes mapaA { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-14deg) scale(1.2); } 90% { transform: rotate(10deg) scale(1.2); } 95% { transform: rotate(0); } }

.beta-aviso .ico { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; color: var(--morado); background: rgba(163,92,255,.15); }
.beta-aviso b { display: block; font-size: 34px; }
.beta-aviso p { margin: 10px 0 20px; color: var(--suave); font-weight: 700; line-height: 1.5; }
.cargando { display: none; margin: 80px auto; width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--borde); border-top-color: var(--morado); animation: gira .8s linear infinite; }
html:not(.arcade-si):not(.arcade-no) .cargando { display: block; }
@keyframes gira { to { transform: rotate(1turn); } }
.chip-beta { padding: 5px 9px; border-radius: 9px; background: var(--morado); color: #fff; font: 800 13px/1 var(--display); letter-spacing: .1em; }
.confeti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

@media (max-width: 720px) {
  .cab h1 { font-size: 24px; }
  .xp { font-size: 16px; padding: 7px 10px; }
  .une { gap: 10px 28px; }
  .ficha { font-size: 14px; min-height: 60px; padding: 8px 11px; border-radius: 14px; }
  .col.der .ficha { padding-left: 14px; }
  .linea { grid-template-columns: 1fr; gap: 18px; }
  .nodo:nth-child(even) { translate: 14px 0; } .nodo:nth-child(odd) { translate: -14px 0; }
  .carta p { font-size: 20px; }
  .mesa { height: 320px; }
  .pozo .ficha.usada { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  var mundo = 0, mundos = [];

    N.forEach(function (x, i) { var ok = x.t && maxTema(x.t) > 0 && temaCompleto(x.t); if (ok) hechos = i + 1; else if (act < 0 && x.t) act = i; });

  var tToast;

        if (window.MCSonido) MCSonido.efecto(s.abierto ? 'tap' : 'bloq');
        $('hoja').innerHTML = '<div class="agarre"></div><div class="nv">Nivel extra</div><h3>' + x.n + '</h3><p class="nota">' + x.desc + '</p>' +
          (s.abierto ? '<p class="nota">🛠️ Muy pronto tendrá su desafío. ¡Prepárate!</p><button class="jugar" type="button" disabled>Próximamente</button>'
            : '<p class="nota">🔒 Gana el nivel ' + (x.tras + 1) + ' para abrir este nivel extra.</p><button class="jugar" type="button" disabled>Bloqueado</button>');
        $('hoja').classList.add('on'); $('hojaFondo').classList.add('on');
      }
    });
    // La cámara empieza en el nivel actual
    requestAnimationFrame(function () { if (r.foco) window.scrollTo(0, Math.max(0, r.foco.getBoundingClientRect().top + window.scrollY - innerHeight * .55)); });
  }
  function abrirHoja(c, i, nv, s) {
    if (window.MCSonido) MCSonido.efecto(nv.t && s.abierto ? 'tap' : 'bloq');
    var ult = i === c.niveles.length - 1, h = '<div class="agarre"></div><div class="nv">' + (ult ? 'Jefe del mundo' : 'Nivel ' + (i + 1)) + '</div><h3>' + nv.n + '</h3>';
    if (nv.t && s.abierto) {
      var t = nv.t;
      h += '<div class="estr">' + [1, 2, 3].map(function (k) { return estrella(k <= s.tres); }).join('') + '</div><div class="jg">' +
        juegosDe(t).map(function (j) {
          var e = estado.est[t + ':' + j.id] || 0;
          return '<div><i style="background:' + j.c + '"><svg class="ic"><use href="#' + j.ic + '"/></svg></i>' + j.nom + '<span>' + [1, 2, 3].map(function (k) { return estrella(k <= e); }).join('') + '</span></div>';
        }).join('') + '</div><button class="jugar" type="button" id="hojaJugar">' + (s.hecho ? 'Repetir' : 'Jugar') + '</button>';
    } else if (nv.t) {
      h += '<p class="nota">🔒 Termina el nivel ' + i + ' para abrir este.</p><button class="jugar" type="button" disabled>Bloqueado</button>';
    } else {
      h += '<p class="nota">🛠️ Este nivel está en construcción. ¡Muy pronto tendrá sus juegos!</p><button class="jugar" type="button" disabled>Próximamente</button>';
    }
    $('hoja').innerHTML = h;
    $('hoja').classList.add('on'); $('hojaFondo').classList.add('on');
    var b = $('hojaJugar'); if (b) b.onclick = function () { if (window.MCSonido) MCSonido.efecto('abrir'); cerrarHoja(); estado.tema = nv.t; irRuta(); };
  }
  function cerrarHoja() { $('hoja').classList.remove('on'); $('hojaFondo').classList.remove('on'); }
  $('hojaFondo').onclick = cerrarHoja;

  function irCurso(id) {
    var c = cursoDe(id); estado.curso = id;
    if (c.niveles && window.MCMundo) return irMapa(c);
    ver('v-curso', c.nom, 'Arcade'); volverA(irInicio);
    var e = 0, m = 0; c.temas.forEach(function (t) { e += estrellasTema(t); m += maxTema(t); });
    $('cursoCab').style.setProperty('--cc', c.c);
    $('cursoCab').innerHTML = (c.img ? '<img class="ar" src="assets/arcade/mundo-' + c.img + '.webp" alt="">' : '<svg class="ar" viewBox="0 0 120 120"><use href="#' + c.arte + '"/></svg>') + '<div><small>Arcade · ' + AREAS.filter(function (a) { return a[0] === c.area; })[0][1] + '</small><b class="tit">' + c.nom + '</b><p>' + e + ' de ' + m + ' estrellas</p></div>';
    $('temas').innerHTML = c.temas.map(function (t) {
      var T = TEMAS[t], et = estrellasTema(t), mt = maxTema(t);
      return '<button class="tema" type="button" data-t="' + t + '" style="--tc:' + c.c + '">' +
        (et ? '' : '<span class="nuevo">Nuevo</span>') +
        '<span class="curso"><i></i>' + (T.n || '') + '</span><b class="tit">' + T.titulo + '</b>' +
        '<span class="mini">' + juegosDe(t).filter(function (j) { return !j.bloq; }).map(function (j) { return '<span>' + j.nom + '</span>'; }).join('') + '</span>' +
        '<span class="estrellas-t">' + estrella(true) + et + ' / ' + mt + '</span>' +
        '<span class="prog"><i style="--p:' + (mt ? Math.round(et / mt * 100) : 0) + '%"></i></span></button>';
    }).join('');
    $('temas').querySelectorAll('.tema').forEach(function (b) { b.onclick = function () { estado.tema = b.dataset.t; irRuta(); }; });
  }

  function irRuta() {
    var T = TEMAS[estado.tema], c = cursoDelTema(estado.tema);
    estado.ultimo = c.id; guardar();
    ver('v-ruta', 'Ruta del tema', c.nom); volverA(function () { irCurso(c.id); });
    $('rutaCab').style.background = 'linear-gradient(135deg, ' + c.c + ' 0, color-mix(in srgb, ' + c.c + ' 55%, #000) 100%)';
    $('rutaCab').style.borderBottomColor = 'color-mix(in srgb, ' + c.c + ' 40%, #000)';
    $('rutaCab').innerHTML = '<small>' + c.nom + ' · ' + (T.n || '') + '</small><b class="tit">' + T.titulo + '</b><p>' + (T.desc || '') + '</p>';
    var js = juegosDe(estado.tema), normales = js.filter(function (j) { return !j.bloq; });
    var hechos = normales.filter(function (j) { return estado.est[estado.tema + ':' + j.id]; }).length;
    $('ruta').innerHTML = js.map(function (j) {
      var i = JUEGOS.indexOf(j), e = estado.est[estado.tema + ':' + j.id] || 0, bloq = j.bloq && hechos < normales.length;
      return '<button class="nodo' + (bloq ? ' bloq' : '') + '" type="button" data-i="' + i + '" style="--nc:' + j.c + '">' +
        '<span class="bola"><svg class="ic"><use href="#' + (bloq ? 'i-candado' : j.ic) + '"/></svg></span>' +
        '<span><b class="tit">' + j.nom + '</b><small>' + (bloq ? 'Completa los ' + normales.length + ' juegos para desbloquear' : j.sub) + '</small></span>' +
        '<span class="est">' + [1, 2, 3].map(function (k) { return estrella(k <= e); }).join('') + '</span></button>';
    }).join('');
    $('ruta').querySelectorAll('.nodo:not(.bloq)').forEach(function (n) { n.onclick = function () { jugar(+n.dataset.i); }; });
  }

  /* ---------- Puntos y combo ---------- */
  function acierto() {
    estado.ok++; estado.combo++; estado.mejor = Math.max(estado.mejor, estado.combo);
    var gana = 10 * (estado.combo >= 5 ? 3 : estado.combo >= 3 ? 2 : 1);
    estado.ganado += gana; estado.xp += gana; $('xpN').textContent = estado.xp;
    var c = $('combo');
    if (estado.combo >= 3) { c.textContent = 'x' + (estado.combo >= 5 ? 3 : 2); c.classList.remove('si'); void c.offsetWidth; c.classList.add('si'); }
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    if (window.MCSonido) MCSonido.efecto('bien');
  }
  function fallo() { if (window.MCSonido) MCSonido.efecto('mal'); estado.combo = 0; $('combo').classList.remove('si'); if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch (e) {} }
  function progreso(h, t) { $('jBarra').style.width = Math.round(h / t * 100) + '%'; }

  function jugar(i) {
    estado.juego = i; estado.ok = 0; estado.total = 0; estado.combo = 0; estado.mejor = 0; estado.ganado = 0; estado.fallos = 0;
    $('combo').classList.remove('si');
    var j = JUEGOS[i];
    ver('v-juego', j.nom, TEMAS[estado.tema].curso);
    $('volver').onclick = function (e) { e.preventDefault(); irRuta(); };
    $('jTit').textContent = j.nom; $('jSub').textContent = j.sub; progreso(0, 1);
    ({ une: une, vf: vf, orden: orden })[j.id](TEMAS[estado.tema]);
  }

  /* ---------- 1 · Une parejas ---------- */
  function une(T) {
    var izq = mezclar(T.pares.map(function (p, i) { return { t: p[0], i: i }; }));
    var der = mezclar(T.pares.map(function (p, i) { return { t: p[1], i: i }; }));
    estado.total = T.pares.length;
    var z = $('jZona');
    z.innerHTML = '<p class="aviso" id="aviso">Toca un autor y luego su teoría</p>' +
      '<div class="une" id="une"><svg class="lineas" id="lineas"></svg>' +
      '<div class="col izq">' + izq.map(function (x) { return '<button class="ficha" type="button" data-l="i" data-i="' + x.i + '">' + x.t + '<span class="pt"></span></button>'; }).join('') + '</div>' +
      '<div class="col der">' + der.map(function (x) { return '<button class="ficha" type="button" data-l="d" data-i="' + x.i + '"><span class="pt"></span>' + x.t + '</button>'; }).join('') + '</div></div>';
    var sel = null, hechas = [], box = $('une');
    function dibujar() {
      var r0 = box.getBoundingClientRect();
      $('lineas').innerHTML = hechas.map(function (i) {
        var a = box.querySelector('[data-l="i"][data-i="' + i + '"] .pt').getBoundingClientRect(), b = box.querySelector('[data-l="d"][data-i="' + i + '"] .pt').getBoundingClientRect();
        var x1 = a.left + a.width / 2 - r0.left, y1 = a.top + a.height / 2 - r0.top, x2 = b.left + b.width / 2 - r0.left, y2 = b.top + b.height / 2 - r0.top, mx = (x1 + x2) / 2;
        return '<path d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 + '" stroke="#58CC02" stroke-width="4" fill="none" stroke-linecap="round"/>';
      }).join('');
    }
    window.onresize = dibujar;
    box.querySelectorAll('.ficha').forEach(function (f) {
      f.onclick = function () {
        if (f.classList.contains('hecha')) return;
        if (!sel || sel.dataset.l === f.dataset.l) {
          if (sel) sel.classList.remove('sel');
          sel = sel === f ? null : f; if (sel) sel.classList.add('sel'); return;
        }
        var a = sel; sel = null; a.classList.remove('sel');
        if (a.dataset.i === f.dataset.i) {
          a.classList.add('hecha'); f.classList.add('hecha'); hechas.push(+f.dataset.i); dibujar(); acierto();
          $('aviso').className = 'aviso ok'; $('aviso').textContent = '¡Bien! ' + T.pares[+f.dataset.i][0] + ' → ' + T.pares[+f.dataset.i][1];
          progreso(hechas.length, T.pares.length);
          if (hechas.length === T.pares.length) setTimeout(terminar, 900);
        } else {
          estado.fallos++; fallo();
          [a, f].forEach(function (x) { x.classList.remove('error'); void x.offsetWidth; x.classList.add('error'); });
          $('aviso').className = 'aviso mal'; $('aviso').textContent = 'No corresponde, intenta otra vez';
        }
      };
    });
  }

  /* ---------- 2 · Verdadero o falso (cartas que se deslizan) ---------- */
  function vf(T) {
    var cartas = mezclar(T.vf), k = 0; estado.total = cartas.length;
    var z = $('jZona');
    z.innerHTML = '<div class="mesa" id="mesa"></div>' +
      '<div class="vf-btns"><div><button class="no" type="button" id="bF" aria-label="Falso"><svg class="ic"><use href="#i-x"/></svg></button><small>Falso</small></div>' +
      '<div><button class="si" type="button" id="bV" aria-label="Verdadero"><svg class="ic"><use href="#i-check"/></svg></button><small>Verdadero</small></div></div>' +
      '<p class="explica" id="explica">Desliza a la <b>derecha</b> si es verdadero y a la <b>izquierda</b> si es falso</p>';
    var mesa = $('mesa');
    function pintar() {
      mesa.innerHTML = '';
      for (var i = Math.min(k + 2, cartas.length - 1); i >= k; i--) {
        var c = document.createElement('div'); c.className = 'carta' + (i === k + 1 ? ' atras' : i === k + 2 ? ' atras2' : '');
        c.innerHTML = '<span class="sello v">Verdad</span><span class="sello f">Falso</span><span class="tag">' + (i + 1) + ' de ' + cartas.length + '</span><p>' + cartas[i][0] + '</p>';
        mesa.appendChild(c);
      }
      var top = mesa.lastChild; if (top) arrastre(top);
    }
    function responder(dijoV, el) {
      var c = cartas[k], bien = c[1] === dijoV;
      if (bien) acierto(); else { estado.fallos++; fallo(); }
      $('explica').innerHTML = (bien ? '✅ ' : '❌ ') + c[2];
      el.style.transition = 'transform .35s ease-in, opacity .35s';
      el.style.transform = 'translate(' + (dijoV ? 140 : -140) + '%, -10%) rotate(' + (dijoV ? 28 : -28) + 'deg)'; el.style.opacity = '0';
      k++; progreso(k, cartas.length);
      setTimeout(function () { if (k >= cartas.length) terminar(); else pintar(); }, 330);
    }
    function arrastre(el) {
      var x0 = 0, dx = 0, activo = false;
      el.onpointerdown = function (e) { activo = true; x0 = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; };
      el.onpointermove = function (e) {
        if (!activo) return; dx = e.clientX - x0;
        el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 14 + 'deg)';
        el.querySelector('.sello.v').style.opacity = Math.max(0, Math.min(1, dx / 90));
        el.querySelector('.sello.f').style.opacity = Math.max(0, Math.min(1, -dx / 90));
      };
      el.onpointerup = el.onpointercancel = function () {
        if (!activo) return; activo = false;
        if (Math.abs(dx) > 90) responder(dx > 0, el);
        else { el.style.transition = 'transform .25s'; el.style.transform = ''; el.querySelectorAll('.sello').forEach(function (s) { s.style.opacity = 0; }); }
      };
    }
    $('bV').onclick = function () { var t = mesa.lastChild; if (t) { t.querySelector('.sello.v').style.opacity = 1; responder(true, t); } };
    $('bF').onclick = function () { var t = mesa.lastChild; if (t) { t.querySelector('.sello.f').style.opacity = 1; responder(false, t); } };
    pintar();
  }

  /* ---------- 3 · Línea del tiempo ---------- */
  function orden(T) {
    var n = T.orden.length, fichas = mezclar(T.orden.map(function (o, i) { return { o: o, i: i }; })), puesto = new Array(n).fill(null);
    estado.total = n;
    var z = $('jZona');
    z.innerHTML = '<p class="aviso" id="aviso">Toca las etapas en orden, de la más antigua a la más reciente</p>' +
      '<div class="linea"><div><h3>Etapas</h3><div class="pozo" id="pozo">' +
      fichas.map(function (f, j) { return '<button class="ficha" type="button" data-j="' + j + '"><span><span class="lt-et">' + f.o[0] + '</span>' + f.o[1] + '</span></button>'; }).join('') +
      '</div></div><div><h3>Más antiguo ↓ Más reciente</h3><div class="huecos" id="huecos">' +
      puesto.map(function (_, i) { return '<button class="hueco" type="button" data-n="' + (i + 1) + '" data-h="' + i + '">Vacío</button>'; }).join('') +
      '</div></div></div><div class="acciones"><button class="btn" type="button" id="comprobar" disabled style="opacity:.5">Comprobar</button></div>';
    var intentos = 0;
    function pintar() {
      document.querySelectorAll('#huecos .hueco').forEach(function (h, i) {
        var f = puesto[i];
        if (f == null) { h.className = 'hueco'; h.innerHTML = 'Vacío'; return; }
        h.classList.add('lleno'); h.innerHTML = '<span><span class="lt-et">' + fichas[f].o[0] + '</span>' + fichas[f].o[1] + '</span>';
      });
      document.querySelectorAll('#pozo .ficha').forEach(function (b) { b.classList.toggle('usada', puesto.indexOf(+b.dataset.j) >= 0); });
      var lleno = puesto.every(function (x) { return x != null; });
      $('comprobar').disabled = !lleno; $('comprobar').style.opacity = lleno ? 1 : .5;
      progreso(puesto.filter(function (x) { return x != null; }).length, n);
    }
    document.querySelectorAll('#pozo .ficha').forEach(function (b) {
      b.onclick = function () { var v = puesto.indexOf(null); if (v < 0) return; puesto[v] = +b.dataset.j; pintar(); };
    });
    document.querySelectorAll('#huecos .hueco').forEach(function (h, i) {
      h.onclick = function () { if (h.classList.contains('bien')) return; puesto[i] = null; pintar(); };
    });
    $('comprobar').onclick = function () {
      intentos++;
      var buenos = 0;
      document.querySelectorAll('#huecos .hueco').forEach(function (h, i) {
        var bien = fichas[puesto[i]].i === i;
        if (bien) { if (!h.classList.contains('bien')) acierto(); buenos++; h.classList.add('bien'); }
        else { estado.fallos++; fallo(); h.classList.remove('malo'); void h.offsetWidth; h.classList.add('malo'); }
      });
      if (buenos === n) { $('aviso').className = 'aviso ok'; $('aviso').textContent = '¡Orden perfecto!'; setTimeout(terminar, 900); return; }
      $('aviso').className = 'aviso mal'; $('aviso').textContent = buenos + ' de ' + n + ' en su lugar. Toca las rojas para quitarlas y vuelve a ordenar';
      setTimeout(function () { puesto = puesto.map(function (f, i) { return fichas[f].i === i ? f : null; }); pintar(); }, 900);
    };
  }

  /* ---------- Fin del juego ---------- */
  function terminar() {
    var j = JUEGOS[estado.juego], f = estado.fallos;
    var est = f === 0 ? 3 : f <= 2 ? 2 : 1, clave = estado.tema + ':' + j.id;
    estado.est[clave] = Math.max(estado.est[clave] || 0, est); guardar();
    ver('v-fin', 'Resultado', j.nom); $('combo').classList.remove('si');
    $('volver').onclick = function (e) { e.preventDefault(); irRuta(); };
    $('fEst').innerHTML = [1, 2, 3].map(function (k) { return '<svg class="ic' + (k <= est ? ' on' : '') + '"><use href="#i-estrella"/></svg>'; }).join('');
    $('fTit').textContent = est === 3 ? '¡Perfecto!' : est === 2 ? '¡Muy bien!' : '¡Completado!';
    $('fAc').textContent = estado.total + '/' + (estado.total + f);
    $('fCombo').textContent = 'x' + estado.mejor;
    $('fXp').textContent = '+' + estado.ganado;
    $('fOtra').onclick = function () { jugar(estado.juego); };
    var nj = juegosDe(estado.tema).filter(function (x) { return !x.bloq; }).map(function (x) { return JUEGOS.indexOf(x); }), pos = nj.indexOf(estado.juego);
    var sig = pos >= 0 && pos + 1 < nj.length ? nj[pos + 1] : null;
    $('fSig').textContent = sig != null ? 'Siguiente: ' + JUEGOS[sig].nom : 'Volver a la ruta';
    $('fSig').onclick = function () { if (sig != null) jugar(sig); else irRuta(); };
    if (window.MCSonido) MCSonido.efecto('victoria');
    if (est === 3) confeti();
  }

  function confeti() {
    var cv = $('confeti'), cx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, cols = ['#C6E000', '#FFC800', '#A35CFF', '#1CB0F6', '#FF4B4B', '#F07A1A'];
    var ps = Array.from({ length: 120 }, function () { return { x: Math.random() * W, y: -20 - Math.random() * H * .5, v: 2 + Math.random() * 4, r: Math.random() * 6, a: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)] }; });
    var t = 0, mio = confetiVivo;
    (function cuadro() {
      if (mio !== confetiVivo) return;
      cx.clearRect(0, 0, W, H);
      ps.forEach(function (p) { p.y += p.v; p.a += .1; cx.save(); cx.translate(p.x + Math.sin(p.a) * 12, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-4, -6, 8, 12); cx.restore(); });
      if (++t < 160) requestAnimationFrame(cuadro); else cx.clearRect(0, 0, W, H);
    })();
  }

  irInicio();
  
})();
</script>
