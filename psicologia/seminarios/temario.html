<title>Seminarios · Psicología · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }

  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .logo span { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; }

  .page-title { padding: 20px 0 8px; }
  .page-title .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-title h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(26px, 5vw, 38px); margin-top: 8px; }
  .page-title p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }

  .tema-list { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
  .tema-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  .tema-card:hover { border-color: var(--accent); transform: translateX(3px); }
  .tema-num {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
  }
  .tema-info { flex: 1; }
  .tema-info .name { font-size: 14.5px; font-weight: 600; }
  .tema-info .count { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tema-card svg.arrow { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }
  /* Tarjetas gruesas estilo Duolingo con sombrita verde: se hunden al tocarlas */
  .tema-card { border: 2px solid #3a4a00; border-radius: 18px; background: #121212; box-shadow: 0 5px 0 #6f7f00; margin-bottom: 4px;
    transition: transform .08s ease, box-shadow .08s ease, border-color .15s ease; -webkit-tap-highlight-color: transparent; }
  .tema-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 7px 0 #8fa300; }
  .tema-card:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .tema-num { border-radius: 12px; border: 2px solid rgba(198,224,0,.35); font: 900 15px 'Nunito', 'Sora', sans-serif; }
  .tema-info .name { font: 800 16px 'Nunito', 'Inter', sans-serif; }
  .tema-info .count { font: 700 12.5px 'Nunito', 'Inter', sans-serif; }
  .tema-card svg.arrow { color: var(--accent); }

  /* Casita con estilo grueso: se hunde al tocarla */
  .home-btn { border: 2px solid #2e2e2e; border-bottom-width: 4px; border-radius: 12px; background: #141414; width: 36px; height: 36px; color: #e6e6e6;
    transition: transform .08s ease, border-color .15s ease, color .15s ease; -webkit-tap-highlight-color: transparent; }
  .home-btn:hover { border-color: var(--accent, #C6E000); border-bottom-color: #8fa300; color: var(--accent, #C6E000); }
  .home-btn:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }

  /* Letra gruesita en toda la web (Nunito); las fórmulas y el código conservan su letra */
  body, body :not(.katex):not(.katex *):not(code):not(pre):not(kbd):not(samp):not(.formato):not(.ta.big):not(.cdnuevos code) { font-family: 'Nunito', 'Inter', system-ui, sans-serif !important; }
  body { font-weight: 600; }
</style>
<script src="../../assets/mc-config.js"></script>

</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Seminarios</a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24.66 24.65" fill="currentColor" aria-hidden="true"><path d="M11.88,0h.87a2.91,2.91,0,0,1,1.39.84l9.64,9.65a3.33,3.33,0,0,1,.36.39,2.2,2.2,0,0,1,.31,2.35,2.14,2.14,0,0,1-1.82,1.35c-.68.08-.6,0-.61.67,0,2.28,0,4.57,0,6.85a2.63,2.63,0,0,1-2.65,2.54H15.57c-.65,0-.92-.26-.92-.91V18.19a1.16,1.16,0,0,0-1.24-1.25c-.71,0-1.43,0-2.14,0A1.17,1.17,0,0,0,10,18.25v5.56a.74.74,0,0,1-.83.83H5.27A2.6,2.6,0,0,1,3,23.39a3,3,0,0,1-.42-1.71V14.86a.23.23,0,0,0-.23-.25,2.64,2.64,0,0,1-.74-.1A2.32,2.32,0,0,1,0,12.75v-.87a2.91,2.91,0,0,1,.86-1.42Q5.66,5.67,10.45.88A2.86,2.86,0,0,1,11.88,0Z"/></svg></a>
      </div>
      <div class="logo"><div class="dot"></div><span id="badgeYear">Psicología</span></div>
    </header>

    <div class="page-title">
      <div class="eyebrow" id="eyebrowYear">Temario</div>
      <h1>Psicología · Seminarios</h1>
      <p>Elige un tema para ver sus 10 preguntas con la respuesta marcada, o practícalo directo en modo quiz.</p>
    </div>

    <div class="tema-list" id="temaList"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const list = document.getElementById('temaList');

  if (!year) {
    list.innerHTML = '<div class="state-msg">No se indicó ningún año. Vuelve a la lista de ciclos.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Psicología · ' + year;
    document.getElementById('eyebrowYear').textContent = 'Temario · ' + year;

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(temas => {
        temas.forEach(t => {
          const a = document.createElement('a');
          a.className = 'tema-card';
          a.href = `tema.html?year=${encodeURIComponent(year)}&tema=${t.num}`;
          a.innerHTML = `
            <div class="tema-num">${t.num}</div>
            <div class="tema-info">
              <div class="name">${t.name}</div>
              <div class="count">${t.questions.length} preguntas</div>
            </div>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          `;
          list.appendChild(a);
        });
      })
      .catch(() => {
        list.innerHTML = '<div class="state-msg">Todavía no hay temario cargado para ' + year + '.</div>';
      });
  }
</script>
<script src="../../assets/alertas.js" defer></script>
<script src="../../assets/tutorial.js" defer></script>
<script src="../../assets/sonido.js"></script>
</body>
</html>
