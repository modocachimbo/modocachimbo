<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0818">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Modo Cachimbo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="preconnect" href="https://www.googleapis.com" crossorigin>

<title>Biblioteca · Modo Cachimbo</title>
<!--
  Biblioteca: libros en PDF que viven en el Google Drive de Modo Cachimbo.
  - La lista sale de supabase/42-biblioteca.sql (el panel → Biblioteca guarda el id de Drive).
  - Íconos propios en el <svg> de arriba del <body> (#i-…): se usan con <svg class="i"><use href="#i-…"/></svg>.
  - Buscador y filtros (área, curso, tipo, estado, colección, acceso, orden) viven en la URL
    (?area=…&tipo=…&q=…), así el link se puede compartir y el «atrás» del visor no los pierde.
  - El visor es propio (PDF.js): baja el PDF con la API de Google Drive (MC_CONFIG.DRIVE_KEY),
    dibuja las páginas a medida que llegas a ellas y guarda en qué página te quedaste.
  - Si falta la clave o Drive no responde, abre la vista previa de Drive dentro de la página.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --bib: #CE82FF; --vidrio: rgba(11,8,24,.78); --sombra: 0 10px 24px rgba(0,0,0,.42);
  }
  html[data-modo="claro"] { --bib: #9B4FD9; --vidrio: rgba(255,255,255,.9); --sombra: 0 8px 20px rgba(40,30,80,.16); }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: Nunito, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-user-select: none; user-select: none; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--bib); outline-offset: 2px; }
  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 20px 70px; }

  /* ---------- Cabecera ---------- */
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--text-dim); text-decoration: none; font-weight: 800; font-size: 14px; }
  .back:hover { color: var(--accent); }
  .back .i { font-size: 18px; }
  .cab { display: flex; align-items: center; gap: 14px; margin: 14px 0 18px; }
  .logo { position: relative; width: 56px; height: 56px; flex: none; border-radius: 18px; display: grid; place-items: center; color: var(--bib); font-size: 30px;
    background: linear-gradient(150deg, color-mix(in srgb, var(--bib) 26%, transparent), color-mix(in srgb, var(--bib) 8%, transparent)); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bib) 35%, transparent); }
  .cab .tt { flex: 1; min-width: 0; }
  .cab h1 { font: 1000 clamp(26px, 6vw, 34px)/1.05 Nunito, sans-serif; letter-spacing: -.01em; }
  .cab p { color: var(--text-dim); font-weight: 800; font-size: 14.5px; margin-top: 3px; }
  .stats { display: flex; gap: 8px; }
  .stat { display: flex; align-items: center; gap: 9px; padding: 9px 14px 9px 10px; border-radius: 15px; background: var(--surface); border: 1.5px solid var(--border); }
  .stat .i { font-size: 22px; color: var(--c); }
  .stat b { display: block; font-size: 17px; font-weight: 1000; line-height: 1; }
  .stat small { display: block; color: var(--text-dim); font-size: 11.5px; font-weight: 800; margin-top: 2px; }

  /* Buscador + botón de filtros */
  .barra { display: flex; gap: 10px; }
  .buscar { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
  .buscar > .i { position: absolute; left: 16px; font-size: 21px; color: var(--text-faint); pointer-events: none; transition: color .15s; }
  .buscar input { width: 100%; padding: 14px 84px 14px 48px; border-radius: 17px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: 800 15.5px Nunito, sans-serif; outline: none; transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none; }
  .buscar input::-webkit-search-cancel-button { display: none; }
  .buscar input::placeholder { color: var(--text-faint); }
  .buscar input:focus { border-color: var(--bib); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bib) 16%, transparent); }
  .buscar:focus-within > .i { color: var(--bib); }
  .buscar kbd { position: absolute; right: 14px; min-width: 26px; padding: 3px 8px; border-radius: 8px; border: 1.5px solid var(--border); border-bottom-width: 3px; color: var(--text-faint); font: 900 12px Nunito, sans-serif; text-align: center; pointer-events: none; }
  .buscar .limpiar { position: absolute; right: 8px; width: 36px; height: 36px; border: 0; border-radius: 11px; background: var(--surface-2); color: var(--text-dim); display: grid; place-items: center; cursor: pointer; font-size: 16px; }
  .bt-f { flex: none; position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border-radius: 17px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); font-weight: 1000; font-size: 15px; cursor: pointer; }
  .bt-f .i { font-size: 21px; color: var(--bib); }
  .bt-f b { min-width: 21px; height: 21px; padding: 0 6px; border-radius: 11px; background: var(--bib); color: #1b0d2b; font-size: 12px; display: grid; place-items: center; }
  .bt-f:active, .tab:active, .cur:active { transform: translateY(2px); }

  /* Áreas (con su ícono) y cursos del área elegida */
  .tabs, .cursos, .activos { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
  .tabs::-webkit-scrollbar, .cursos::-webkit-scrollbar, .activos::-webkit-scrollbar { display: none; }
  .tabs { margin-top: 14px; padding-bottom: 4px; }
  .tab { --c: var(--bib); flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 9px; border-radius: 15px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); font-weight: 900; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s; }
  .tab .ai { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); font-size: 17px; }
  .tab .ai i { width: 17px; height: 17px; background: var(--c); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .tab small { color: var(--text-faint); font-weight: 900; font-size: 12.5px; }
  .tab.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
  .tab.on small { color: var(--c); }
  .cursos { margin-top: 10px; gap: 6px; }
  .cur { flex: none; padding: 7px 13px; border-radius: 12px; border: 1.5px solid var(--border); background: none; color: var(--text-dim); font-weight: 900; font-size: 13.5px; cursor: pointer; }
  .cur small { color: var(--text-faint); margin-left: 3px; }
  .cur.on { background: var(--c); border-color: var(--c); color: #120c20; }
  .cur.on small { color: rgba(18,12,32,.6); }
  .activos { margin-top: 10px; gap: 6px; align-items: center; }
  .pil { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px 6px 11px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--bib) 45%, transparent); background: color-mix(in srgb, var(--bib) 12%, transparent); font-weight: 900; font-size: 13px; cursor: pointer; }
  .pil .i { font-size: 13px; opacity: .75; }
  .pil.lim { border: 0; background: none; color: var(--bib); padding-left: 6px; }

  /* ---------- Estantes ---------- */
  .estante { margin-top: 32px; content-visibility: auto; contain-intrinsic-size: auto 300px; }
  .est-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .est-cab h2 { font: 1000 21px Nunito, sans-serif; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .est-cab h2 small { color: var(--text-dim); font-size: 14px; font-weight: 800; white-space: nowrap; }
  .est-cab .gi { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--c); font-size: 19px; background: color-mix(in srgb, var(--c) 15%, transparent); }
  .est-cab .gi i { width: 20px; height: 20px; background: var(--c); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .est-cab .ver { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; color: var(--bib); font-weight: 900; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .est-cab .ver .i { font-size: 16px; transition: translate .15s; }
  .est-cab .ver:hover .i { translate: 3px 0; }
  .est-cab .fl { flex: none; width: 34px; height: 34px; border-radius: 11px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-size: 17px; }
  .est-cab .fl:hover { border-color: var(--text-faint); }
  .fila { display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; padding: 6px 20px 10px; margin: 0 -20px; scrollbar-width: none; }
  .fila::-webkit-scrollbar { display: none; }
  .fila > * { scroll-snap-align: start; }

  /* ---------- Libro: portada + título ---------- */
  .libro { display: block; text-align: left; background: none; border: 0; cursor: pointer; min-width: 0; }
  .libro > b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 1000; margin-top: 10px; line-height: 1.25; }
  .libro > small { display: flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; }
  .libro > small i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .libro > small span { overflow: hidden; text-overflow: ellipsis; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .portada { position: relative; display: block; aspect-ratio: 5 / 7; border-radius: 5px 12px 12px 5px; overflow: hidden; background: var(--surface-2); box-shadow: var(--sombra), inset 0 0 0 1px rgba(255,255,255,.04); transition: transform .18s cubic-bezier(.2,.7,.3,1.3), box-shadow .18s; }
  .portada::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.1) 3.5%, transparent 8%), linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%); pointer-events: none; }
  .libro:hover .portada, .libro:focus-visible .portada { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 18px 30px rgba(0,0,0,.5), 0 0 0 2px color-mix(in srgb, var(--c) 55%, transparent); }
  .portada img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
  .portada img.ok { opacity: 1; }
  .portada .chapa { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 8px; background: var(--vidrio); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--text); font: 1000 9.5px Nunito, sans-serif; letter-spacing: .07em; text-transform: uppercase; }
  .portada .chapa .i { font-size: 12px; }
  .portada .tp { left: 8px; bottom: 12px; }
  .portada .nuevo { right: 8px; top: 8px; background: #FF4B4B; color: #fff; }
  .portada .fin { right: 8px; top: 8px; background: #58CC02; color: #fff; padding: 4px; }
  .portada .fin .i { font-size: 13px; stroke-width: 2.6; }
  .portada .cand { right: 8px; bottom: 12px; padding: 4px; color: #FFC800; }
  .portada .cand .i { font-size: 14px; }
  .portada .av { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0,0,0,.45); }
  .portada .av i { display: block; height: 100%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  /* Portada dibujada (cuando no subiste foto): color del curso, título grande e ícono */
  .gen { position: absolute; inset: 0; padding: 22% 11% 0 16%; color: #0b0818;
    background: radial-gradient(90% 60% at 100% 100%, color-mix(in srgb, var(--c) 55%, #000), transparent 70%), linear-gradient(160deg, color-mix(in srgb, var(--c) 85%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 75%, #000)); }
  .gen::before { content: ""; position: absolute; inset: 6% 7% 6% 11%; border: 1px solid rgba(0,0,0,.14); border-radius: 4px; }
  .gen b { position: relative; display: block; font: 1000 17px/1.08 Nunito, sans-serif; text-transform: uppercase; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .gen em { position: relative; display: block; font: 900 10.5px/1.2 Nunito, sans-serif; font-style: normal; text-transform: uppercase; letter-spacing: .08em; opacity: .62; margin-top: 7px; }
  .gen i { position: absolute; right: -12%; bottom: 7%; width: 62%; aspect-ratio: 1; background: rgba(0,0,0,.2); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .gen u { position: absolute; left: 16%; top: 9%; text-decoration: none; font: 1000 7.5px Nunito, sans-serif; letter-spacing: .22em; opacity: .5; }
  .mini .gen { padding: 18% 8% 0 14%; } .mini .gen b { font-size: 7.5px; } .mini .gen em, .mini .gen u, .mini .gen::before, .mini .chapa { display: none; }

  /* Rejilla y lista (resultados) */
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 18px; margin-top: 18px; }
  .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 10px; margin-top: 18px; }
  .renglon { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border-radius: 18px; border: 1.5px solid var(--border); background: var(--surface); text-align: left; cursor: pointer; min-width: 0; transition: border-color .15s, background .15s; }
  .renglon:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
  .renglon .portada { border-radius: 3px 7px 7px 3px; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .renglon .tx { min-width: 0; }
  .renglon b { display: block; font-size: 15px; font-weight: 1000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .renglon .meta { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .renglon .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .renglon .meta .i { font-size: 14px; }
  .renglon .meta i.pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .renglon .bar { display: block; height: 5px; border-radius: 5px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; max-width: 260px; }
  .renglon .bar i { display: block; height: 100%; background: var(--c); border-radius: 5px; }
  .renglon .fin-l { display: inline-flex; align-items: center; gap: 4px; color: #58CC02; font-weight: 1000; font-size: 12.5px; }
  .renglon > .i { font-size: 18px; color: var(--text-faint); }

  /* ---------- Destacados: banner grande arriba ---------- */
  .heroes { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 26px; margin-top: 20px; }
  .heroes::-webkit-scrollbar { display: none; }
  .hero { position: relative; scroll-snap-align: start; display: flex; align-items: center; gap: 32px; padding: 30px 36px; min-height: 290px; border-radius: 26px; overflow: hidden; border: 1.5px solid color-mix(in srgb, var(--c) 30%, var(--border)); background: var(--surface); text-align: left; cursor: pointer; }
  .hero .fx { position: absolute; inset: -40px; background: var(--fondo) center / cover; filter: blur(44px) saturate(1.4); opacity: .55; }
  .hero .fx2 { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,8,24,.2), rgba(11,8,24,.88) 52%), radial-gradient(60% 90% at 100% 0, color-mix(in srgb, var(--c) 18%, transparent), transparent 70%); }
  .hero .portada { position: relative; flex: none; width: 170px; box-shadow: 0 22px 40px rgba(0,0,0,.55); transform: rotate(-3deg); }
  .hero:hover .portada { transform: rotate(-1deg) translateY(-4px); }
  .hero .tx { position: relative; min-width: 0; max-width: 580px; color: #EEEAF7; }
  .hero .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 7px; border-radius: 9px; background: var(--accent); color: #1a1f00; font: 1000 11px Nunito, sans-serif; letter-spacing: .1em; }
  .hero .tag .i { font-size: 14px; }
  .hero h2 { font: 1000 clamp(24px, 3.4vw, 38px)/1.06 Nunito, sans-serif; margin-top: 12px; letter-spacing: -.01em; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: #B8AFD6; font-weight: 800; font-size: 14px; margin-top: 8px; }
  .hero .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .hero .meta .i { font-size: 16px; color: var(--c); }
  .hero p { color: #d6d0ea; font-weight: 700; font-size: 14.5px; line-height: 1.5; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .pie { display: flex; align-items: center; gap: 16px; margin-top: 18px; }
  .hero .bt { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px 12px 18px; border-radius: 15px; background: var(--accent); color: #1a1f00; font-weight: 1000; text-transform: uppercase; letter-spacing: .5px; font-size: 14px; box-shadow: 0 4px 0 #8fa300; white-space: nowrap; }
  .hero .bt .i { font-size: 19px; }
  .hero .anillo { display: flex; align-items: center; gap: 8px; color: #B8AFD6; font-weight: 900; font-size: 13px; }
  .hero .anillo svg { width: 38px; height: 38px; rotate: -90deg; }
  .puntos { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .puntos button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--border); transition: width .25s, background .25s; cursor: pointer; }
  .puntos button.on { width: 24px; border-radius: 6px; background: var(--accent); }

  /* Seguir leyendo: tarjetas anchas con avance */
  .fila.anchas { grid-auto-columns: 310px; }
  .lee { display: flex; gap: 14px; align-items: center; padding: 12px 16px 12px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: linear-gradient(120deg, color-mix(in srgb, var(--c) 9%, var(--surface)), var(--surface) 60%); text-align: left; cursor: pointer; min-width: 0; transition: border-color .15s; }
  .lee:hover { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); }
  .lee .portada { flex: none; width: 60px; border-radius: 3px 8px 8px 3px; }
  .lee .tx { flex: 1; min-width: 0; }
  .lee b { display: block; font-size: 14.5px; font-weight: 1000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lee small { display: flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lee small .i { font-size: 13px; }
  .lee .bar { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11.5px; font-weight: 1000; color: var(--c); }
  .lee .bar span { flex: 1; height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
  .lee .bar span i { display: block; height: 100%; background: var(--c); border-radius: 6px; }
  .lee .play { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); font-size: 18px; }

  /* Colecciones: tres portadas en abanico */
  .fila.cols { grid-auto-columns: 256px; }
  .col { position: relative; display: block; padding: 18px 16px 14px; border-radius: 22px; border: 1.5px solid color-mix(in srgb, var(--c) 40%, transparent); background: radial-gradient(120% 70% at 50% 0, color-mix(in srgb, var(--c) 26%, var(--surface)), var(--surface) 75%); text-align: left; cursor: pointer; overflow: hidden; }
  .col .abanico { position: relative; display: block; height: 132px; margin-bottom: 14px; }
  .col .abanico .portada { position: absolute; bottom: 0; width: 84px; border-radius: 3px 8px 8px 3px; transition: translate .25s, rotate .25s; }
  .col .abanico .portada:nth-child(1) { left: 50%; translate: -50% 0; z-index: 3; }
  .col .abanico .portada:nth-child(2) { left: 50%; translate: -105% 6px; rotate: -10deg; z-index: 2; filter: brightness(.8); }
  .col .abanico .portada:nth-child(3) { left: 50%; translate: 5% 6px; rotate: 10deg; z-index: 1; filter: brightness(.7); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script>
(function () {
  var CFG = window.MC_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var COLOR = { 'ciencia-tecnologia': '#C6E000', matematica: '#1CB0F6', comunicacion: '#CE82FF', 'ciencias-sociales': '#FF9600' };
  var TIPOS = { libro: 'Libro', formulario: 'Formulario', solucionario: 'Solucionario', fichas: 'Fichas', resumen: 'Resumen', examenes: 'Exámenes', separata: 'Separata' };
  var ESTADOS = { sin: ['Sin empezar', 'i-lectura', '#A99FC8'], leyendo: ['Leyendo', 'i-leer', '#1CB0F6'], terminado: ['Terminados', 'i-hecho', '#58CC02'], nuevo: ['Nuevos', 'i-chispa', '#FF4B4B'] };
  var ORDENES = { '': 'Recomendado', nuevos: 'Más nuevos', az: 'Título A–Z', cortos: 'Menos páginas', leidos: 'Leídos hace poco' };
  var S = { libros: [], porId: {}, colecciones: [], lectura: {}, cursos: {}, areas: [], orden: {} };
  // Filtros: viven en la URL (?area=…&curso=…&tipo=…&estado=…&col=…&acceso=…&orden=…&q=…)
  var CLAVES_F = ['area', 'curso', 'col', 'tipo', 'estado', 'acceso', 'orden', 'q'];
  var F = {}; CLAVES_F.forEach(function (k) { F[k] = ''; });
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function sinAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function leer(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var CLAVE_LEC = 'mc_biblioteca_lectura', CLAVE_VISTA = 'mc_biblioteca_vista';
  var VISTA = leer(CLAVE_VISTA) === 'lista' ? 'lista' : 'rejilla';
  function svg(id, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function libros(n) { return n + (n === 1 ? ' libro' : ' libros'); }

  function curso(id) { return S.cursos[id] || { nombre: id, area: '', icono: '' }; }
  function color(id) { return COLOR[curso(id).area] || '#C6E000'; }
  function icoCurso(id) { var c = curso(id); return c.icono ? 'url(' + c.icono + ')' : 'none'; }
  function icoArea(a) { return 'url(assets/icons/' + a + '.svg)'; }
  function libro(id) { return S.porId[id]; }
  function coleccion(id) { return S.colecciones.filter(function (x) { return x.id === id; })[0]; }
  function area(id) { return S.areas.filter(function (a) { return a.id === id; })[0] || { id: id, nombre: id === 'otros' ? 'Otros' : id }; }
  function nombre(l) { return l.titulo + (l.subtitulo ? ' · ' + l.subtitulo : ''); }
  function esNuevo(l) { return Date.now() - new Date(l.creado) < 21 * 864e5 && !S.lectura[l.id]; }
  function estado(l) { var r = S.lectura[l.id]; return !r ? 'sin' : l.paginas && r.pagina >= l.paginas ? 'terminado' : 'leyendo'; }
  function porOrden(a, b) { return (S.orden[a.curso] || 99) - (S.orden[b.curso] || 99) || (a.orden || 0) - (b.orden || 0); }
  function hace(iso) {
    var d = (Date.now() - new Date(iso)) / 864e5;
    return d < 1 ? 'hoy' : d < 2 ? 'ayer' : d < 30 ? 'hace ' + Math.floor(d) + ' días' : 'hace ' + Math.floor(d / 30) + (d < 60 ? ' mes' : ' meses');
  }
  function avance(l) { var r = S.lectura[l.id]; return r && l.paginas ? Math.min(1, r.pagina / l.paginas) : 0; }
  function pct(p) { return Math.max(4, Math.round(p * 100)); }
  // Resalta lo que buscaste (sin importar tildes): las letras de sinAcento() calzan una a una con las del texto
  function resaltar(t) {
    var pal = sinAcento(F.q).split(/\s+/).filter(Boolean); t = String(t || '');
    if (!pal.length) return esc(t);
    var base = Array.prototype.map.call(t, function (ch) { return sinAcento(ch).charAt(0) || ch; }).join(''), on = new Array(t.length);
    pal.forEach(function (p) { var i = -1; while ((i = base.indexOf(p, i + 1)) >= 0) for (var k = 0; k < p.length; k++) on[i + k] = 1; });
    var out = '', ab = false;
    for (var i = 0; i < t.length; i++) { if (on[i] && !ab) { out += '<mark>'; ab = true; } if (!on[i] && ab) { out += '</mark>'; ab = false; } out += esc(t[i]); }
    return out + (ab ? '</mark>' : '');
  }

  /* ---------- Filtros ---------- */
  function hayFiltro() { return !!(F.q || F.area || F.curso || F.col || F.tipo || F.estado || F.acceso); }
  function nExtras() { return ['tipo', 'estado', 'col', 'acceso', 'orden'].filter(function (k) { return F[k]; }).length; }
  // ¿El libro pasa los filtros? «menos» ignora uno, para contar cuántos quedarían al cambiarlo
  function pasa(l, menos) {
    if (menos !== 'area' && F.area && (curso(l.curso).area || 'otros') !== F.area) return false;
    if (menos !== 'curso' && menos !== 'area' && F.curso && l.curso !== F.curso) return false;
    if (menos !== 'col' && F.col && l.coleccion !== F.col) return false;
    if (menos !== 'tipo' && F.tipo && (l.tipo || 'libro') !== F.tipo) return false;
    if (menos !== 'acceso' && F.acceso && (l.acceso || 'libre') !== F.acceso) return false;
    if (menos !== 'estado' && F.estado && (F.estado === 'nuevo' ? !esNuevo(l) : estado(l) !== F.estado)) return false;
    if (menos !== 'q' && F.q) { var pal = sinAcento(F.q).split(/\s+/); for (var i = 0; i < pal.length; i++) if (pal[i] && l._q.indexOf(pal[i]) < 0) return false; }
    return true;
  }
  function cuantos(k, v) { var g = F[k]; F[k] = v; var n = S.libros.filter(function (l) { return pasa(l); }).length; F[k] = g; return n; }
  function ordenar(lista) {
    var o = F.orden, q = sinAcento(F.q);
    return lista.sort(function (a, b) {
      if (o === 'nuevos') return new Date(b.creado) - new Date(a.creado);
      if (o === 'az') return a.titulo.localeCompare(b.titulo, 'es') || porOrden(a, b);
      if (o === 'cortos') return (a.paginas || 9999) - (b.paginas || 9999);
      if (o === 'leidos') return new Date((S.lectura[b.id] || {}).leido || 0) - new Date((S.lectura[a.id] || {}).leido || 0) || porOrden(a, b);
      // Recomendado: si buscas, primero los que lo tienen en el título
      if (q) { var ta = sinAcento(a.titulo).indexOf(q) >= 0, tb = sinAcento(b.titulo).indexOf(q) >= 0; if (ta !== tb) return ta ? -1 : 1; }
      return porOrden(a, b);
    });
  }
  function poner(k, v) {
    F[k] = F[k] === v ? '' : v;
    if (k === 'area') F.curso = '';
    if (k === 'curso' && F.curso) F.area = curso(F.curso).area || F.area;
    aUrl(); pintar();
  }
  function limpiar() { CLAVES_F.forEach(function (k) { if (k !== 'orden') F[k] = ''; }); $('q').value = ''; aUrl(); pintar(); }
  function aUrl() {
    var p = new URLSearchParams(location.search);
    CLAVES_F.forEach(function (k) { if (F[k]) p.set(k, F[k]); else p.delete(k); });
    var s = p.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
  }
  function deUrl() {
    var p = new URLSearchParams(location.search);
    CLAVES_F.forEach(function (k) { F[k] = (p.get(k) || '').slice(0, 80); });
    $('q').value = F.q;
  }

  /* ---------- Piezas ---------- */
  // Portada: la foto que subiste o, si no hay, una dibujada con el color y el ícono del curso
  function portada(l, op) {
    op = op || {};
    var tipo = l.tipo || 'libro', p = op.limpia ? 0 : avance(l), est = estado(l);
    var dentro = l.portada ? '<img src="' + esc(l.portada) + '" alt="" loading="' + (op.ya ? 'eager' : 'lazy') + '" decoding="async" onload="this.classList.add(\'ok\')">'
      : '<span class="gen" style="--ico:' + icoCurso(l.curso) + '"><u>MODO CACHIMBO</u><b>' + esc(l.titulo) + '</b>' + (l.subtitulo ? '<em>' + esc(l.subtitulo) + '</em>' : '') + '<i></i></span>';
    return '<span class="portada' + (op.mini ? ' mini' : '') + '" style="--c:' + color(l.curso) + '">' + dentro +
      (!op.limpia && tipo !== 'libro' ? '<span class="chapa tp">' + svg('t-' + tipo) + esc(TIPOS[tipo] || tipo) + '</span>' : '') +
      (!op.limpia && est === 'terminado' ? '<span class="chapa fin" title="Terminado">' + svg('i-check') + '</span>'
        : !op.limpia && esNuevo(l) ? '<span class="chapa nuevo">Nuevo</span>' : '') +
      (!op.limpia && l.acceso === 'codigo' ? '<span class="chapa cand" title="Con código de alumno">' + svg('i-candado') + '</span>' : '') +
      (p && est !== 'terminado' ? '<span class="av"><i style="width:' + pct(p) + '%"></i></span>' : '') + '</span>';
  }
  function tarjeta(l) {

      var col = F.col ? coleccion(F.col) : null, c, tit, ico = '', sv = '', sub = '';

      else { tit = 'Toda la biblioteca'; c = 'var(--bib)'; sv = 'i-filtro'; }

        '<label class="sel">' + svg('i-orden') + '<select id="orden" aria-label="Ordenar">' + Object.keys(ORDENES).map(function (k) { return '<option value="' + k + '"' + (F.orden === k ? ' selected' : '') + '>' + ORDENES[k] + '</option>'; }).join('') + '</select>' + svg('i-abajo', 'fl2') + '</label>' +

    cerrarFicha(true);
    var r = S.lectura[id], p = avance(l), col = coleccion(l.coleccion), tipo = l.tipo || 'libro', est = estado(l);
    var mas = S.libros.filter(function (x) { return x.id !== l.id && (col ? x.coleccion === col.id : x.curso === l.curso); }).sort(porOrden).slice(0, 10);
    var d = document.createElement('div'); d.className = 'ficha-fondo'; d.id = 'ficha';
    d.innerHTML = '<div class="ficha" role="dialog" aria-modal="true" aria-label="' + esc(nombre(l)) + '" style="--c:' + color(l.curso) + '">' +
      '<button class="x" type="button" data-cerrar aria-label="Cerrar">' + svg('i-x') + '</button>' +
      portada(l, { ya: true }) +
      '<div class="info"><div class="chs"><span class="ch">' + esc(curso(l.curso).nombre) + '</span><span class="ch" style="--c:#A99FC8">' + svg('t-' + tipo) + esc(TIPOS[tipo] || 'Libro') + '</span>' +
        (col ? '<span class="ch" style="--c:' + esc(col.color) + '">' + svg('i-coleccion') + esc(col.nombre) + '</span>' : '') +
        (l.acceso === 'codigo' ? '<span class="ch" style="--c:#FFC800">' + svg('i-candado') + 'Con código</span>' : '') + '</div>' +
        '<h2>' + esc(l.titulo) + '</h2>' + (l.subtitulo ? '<div class="sub">' + esc(l.subtitulo) + '</div>' : '') + '</div>' +
      '<div class="cuerpo"><div class="datos">' + (l.paginas ? dato('i-paginas', l.paginas, 'páginas') : '') + (l.autor ? dato('i-autor', esc(l.autor), 'autor') : '') +
        (est === 'terminado' ? dato('i-hecho', 'Terminado', hace(r.leido)) : r ? dato('i-reloj', 'Pág. ' + r.pagina, hace(r.leido)) : '') + (r && r.marcas && r.marcas.length ? dato('i-marcador', r.marcas.length, r.marcas.length === 1 ? 'marcador' : 'marcadores') : '') + '</div>' +
        (p ? '<div class="bar"><span><i style="width:' + pct(p) + '%"></i></span>' + Math.round(p * 100) + '%</div>' : '') +
        (l.descr ? '<p class="d">' + esc(l.descr) + '</p>' : '') +
        (l.etiquetas && l.etiquetas.length ? '<div class="etq">' + l.etiquetas.map(function (e) { return '<button type="button" data-etq="' + esc(e) + '">#' + esc(e) + '</button>'; }).join('') + '</div>' : '') +
        '<div class="bts"><button class="leer" type="button" id="fLeer">' + svg(r ? 'i-play' : 'i-leer') + (r && est !== 'terminado' ? 'Seguir · pág. ' + r.pagina : 'Leer') + '</button>' +
        (r && r.pagina > 1 ? '<button class="sec" type="button" id="fInicio" aria-label="Leer desde el inicio" title="Desde el inicio">' + svg('i-reiniciar') + '</button>' : '') +
        (l.descarga ? '<a class="sec" href="https://drive.google.com/uc?export=download&id=' + encodeURIComponent(l.drive) + '" target="_blank" rel="noopener" aria-label="Descargar" title="Descargar">' + svg('i-descargar') + '</a>' : '') +
        '<button class="sec" type="button" id="fCompartir" aria-label="Compartir" title="Compartir">' + svg('i-compartir') + '</button></div></div>' +
      (mas.length ? '<div class="mas"><h3>' + (col ? 'Más de ' + esc(col.nombre) : 'Más de ' + esc(curso(l.curso).nombre)) + '</h3><div class="fila">' + mas.map(tarjeta).join('') + '</div></div>' : '') +
      '</div>';
    document.body.appendChild(d);
    requestAnimationFrame(function () { d.classList.add('ver'); });
    d.addEventListener('click', function (e) {
      if (e.target === d || e.target.closest('[data-cerrar]')) cerrarFicha();
      var et = e.target.closest('[data-etq]'); if (et) { limpiar(); $('q').value = F.q = et.dataset.etq; $('qX').hidden = false; $('qKbd').hidden = true; aUrl(); pintar(); cerrarFicha(); }
    });
    var leer = function (desde) { if (desde || est === 'terminado') { S.lectura[id] = Object.assign({}, S.lectura[id] || {}, { pagina: 1 }); } cerrarFicha(true); abrir(id); };
    $('fLeer').addEventListener('click', function () { leer(false); });
    if ($('fInicio')) $('fInicio').addEventListener('click', function () { leer(true); });
    // Compartir: el link abre este libro directo en el visor
    $('fCompartir').addEventListener('click', function () {
      var url = location.origin + location.pathname + '#libro=' + encodeURIComponent(id);
      if (navigator.share) navigator.share({ title: nombre(l), text: nombre(l) + ' · Biblioteca de Modo Cachimbo', url: url }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { avisar('Link copiado'); });
    });
    $('fLeer').focus({ preventScroll: true });
  }
  function cerrarFicha(ya) {
    var d = $('ficha'); if (!d) return;
    d.id = '';
    if (ya) { d.remove(); return; }
    d.classList.remove('ver'); setTimeout(function () { d.remove(); }, 200);
  }

  function cargar() {
    S.lectura = leer(CLAVE_LEC) || {};
    deUrl(); if (F.q) { $('qX').hidden = false; $('qKbd').hidden = true; }
    var reg = fetch('assets/cursos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
      (d.cursos || []).forEach(function (c, i) { S.cursos[c.id] = { nombre: c.nombre, area: c.area, icono: c.icono || '' }; S.orden[c.id] = i + 1; });
      S.areas = d.areas || [];
    }).catch(function () {});
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario();
      return Promise.all([reg,
        c.from('biblioteca_libro').select('id,titulo,subtitulo,curso,drive,paginas,orden,creado,portada,tipo,autor,descr,coleccion,destacado,etiquetas,descarga,acceso').eq('visible', true).order('orden').order('creado'),
        u ? c.from('biblioteca_lectura').select('libro,pagina,marcas,leido').eq('usuario', u.id) : Promise.resolve({ data: [] }),
        c.from('biblioteca_coleccion').select('id,nombre,descripcion,color,orden').eq('visible', true).order('orden')
      ]);
    }).then(function (r) {
      if (r[1].error) throw r[1].error;
      S.libros = r[1].data || [];
      S.colecciones = (r[3] && !r[3].error && r[3].data) || [];
      // Índice para buscar rápido: todo el texto del libro, sin tildes, una sola vez
      S.libros.forEach(function (l) {
        // La llave es de toda la Biblioteca (candado.js data-producto): adentro se abren todos los libros
        l.acceso = 'libre';
        S.porId[l.id] = l;
        l._q = sinAcento([l.titulo, l.subtitulo, l.autor, l.descr, curso(l.curso).nombre, area(curso(l.curso).area).nombre, TIPOS[l.tipo], (l.etiquetas || []).join(' '), (coleccion(l.coleccion) || {}).nombre].join(' '));
      });
      (r[2].data || []).forEach(function (x) {
        var loc = S.lectura[x.libro];
        if (!loc || new Date(x.leido) > new Date(loc.leido)) S.lectura[x.libro] = { pagina: x.pagina, marcas: x.marcas || [], leido: x.leido };
      });
      guardar(CLAVE_LEC, S.lectura);
      pintar();
      var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true);
    }).catch(function () {
      $('grupos').innerHTML = vacio('No se pudo cargar la biblioteca', 'Revisa tu internet y vuelve a intentarlo.');
    });
  }

  /* ---------- Visor ---------- */
  var V = null;
  function abrir(id, sinHistorial) {
    var l = S.libros.filter(function (x) { return x.id === id; })[0]; if (!l) return;
    cerrarVisor(true);
    var r = S.lectura[id] || { pagina: 1, marcas: [] };
    V = { libro: l, pdf: null, zoom: 1, pagina: r.pagina || 1, marcas: (r.marcas || []).slice(), hojas: [], obs: null, guardo: null, tarea: null };
    if (!sinHistorial) history.pushState({ libro: id }, '', '#libro=' + encodeURIComponent(id));
    $('visor').style.setProperty('--c', color(l.curso));
    $('vTit').textContent = l.titulo + (l.subtitulo ? ' · ' + l.subtitulo : '');
    $('vSub').textContent = curso(l.curso).nombre + (l.paginas ? ' · ' + l.paginas + ' págs' : '');
    $('visor').hidden = false; document.body.classList.add('leyendo');
    $('vProg').style.width = '0';
    $('vHojas').innerHTML = ''; $('vHojas').hidden = false; $('vBarra').hidden = true; $('vIr').hidden = true; $('vMarca').hidden = false;
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    $('vCarga').hidden = false;
    $('vCarga').innerHTML = '<div><div class="ring"></div>Abriendo el libro…<div class="bar"><i id="vCargaBar"></i></div></div>';
    if (!CFG.DRIVE_KEY || !window.pdfjsLib) { vistaDrive(); return; }
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
    var url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(l.drive) + '?alt=media&key=' + encodeURIComponent(CFG.DRIVE_KEY);
    var t = pdfjsLib.getDocument({ url: url, disableAutoFetch: true, disableStream: false, rangeChunkSize: 262144, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' });
    V.tarea = t;
    var este = V;
    t.onProgress = function (p) { var b = $('vCargaBar'); if (b && p.total) b.style.width = Math.round(p.loaded / p.total * 100) + '%'; };
    t.promise.then(function (pdf) {
      if (V !== este) return;
      V.pdf = pdf;
      return pdf.getPage(1).then(function (p1) { if (V !== este) return; V.base = p1.getViewport({ scale: 1 }); armar(); });
    }).catch(function (e) { if (V === este) vistaDrive(); });
  }
  // Si no hay clave o Drive no deja bajarlo: su vista previa, dentro de la página
  function vistaDrive() {
    $('vCarga').hidden = true; $('vHojas').hidden = true; $('vBarra').hidden = true; $('vMarca').hidden = true;
    var f = document.createElement('iframe');
    f.className = 'v-drive'; f.allow = 'fullscreen'; f.title = V.libro.titulo;
    f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(V.libro.drive) + '/preview';
    $('vHojas').after(f);
    marcarLeido(1);
  }
  function ancho() { return Math.min($('vHojas').clientWidth - (innerWidth < 560 ? 12 : 24), 900) * V.zoom; }
  function armar() {
    var n = V.pdf.numPages, w = ancho(), h = w * V.base.height / V.base.width, caja = $('vHojas');
    $('vCarga').hidden = true; $('vBarra').hidden = false;
    caja.innerHTML = '';
    V.hojas = [];
    for (var i = 1; i <= n; i++) {
      var d = document.createElement('div'); d.className = 'v-hoja'; d.dataset.n = i;
      d.style.width = w + 'px'; d.style.height = h + 'px';
      caja.appendChild(d); V.hojas.push(d);
    }
    if (V.obs) V.obs.disconnect();
    // Se dibujan solo las páginas que se están viendo (y las de al lado)
    V.obs = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) dibujar(+e.target.dataset.n); });
    }, { root: caja, rootMargin: '600px 0px' });
    V.hojas.forEach(function (d) { V.obs.observe(d); });
    pintarMarcas();
    ir(Math.min(V.pagina, n), true);
    if (V.libro.paginas !== n) V.libro.paginas = n;
  }
  function dibujar(n) {
    var d = V.hojas[n - 1]; if (!d || d.dataset.zoom === String(V.zoom)) return;
    d.dataset.zoom = String(V.zoom);
    var este = V;
    V.pdf.getPage(n).then(function (p) {
      if (V !== este) return;
      var w = parseFloat(d.style.width), vp1 = p.getViewport({ scale: 1 }), esc = w / vp1.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = p.getViewport({ scale: esc * dpr });
      d.style.height = (vp1.height * esc) + 'px';
      var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      return p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
        var viejo = d.querySelector('canvas'); if (viejo) viejo.remove();
        d.prepend(c);
      });
    }).catch(function () { d.dataset.zoom = ''; });
  }
  function actual() {
    var caja = $('vHojas'), mitad = caja.scrollTop + caja.clientHeight * .35, n = 1;
    for (var i = 0; i < V.hojas.length; i++) { if (V.hojas[i].offsetTop <= mitad) n = i + 1; else break; }
    return n;
  }
  function ir(n, sinAnim) {
    n = Math.max(1, Math.min(V.hojas.length, n));
    var d = V.hojas[n - 1]; if (!d) return;
    $('vHojas').scrollTo({ top: d.offsetTop - 12, behavior: sinAnim ? 'auto' : 'smooth' });
    pagina(n);
  }
  function pagina(n) {
    if (!V) return;
    V.pagina = n;
    $('vPg').innerHTML = n + ' <small>/ ' + V.hojas.length + '</small>';
    $('vProg').style.width = (n / V.hojas.length * 100) + '%';
    $('vMarca').classList.toggle('on', V.marcas.indexOf(n) >= 0);
    clearTimeout(V.guardo); V.guardo = setTimeout(function () { marcarLeido(n); }, 1200);
  }
  $('vHojas').addEventListener('scroll', function () { if (V && V.hojas.length) { var n = actual(); if (n !== V.pagina) pagina(n); } }, { passive: true });

  // Dónde te quedaste: en este equipo al toque y en tu cuenta (supabase/42-biblioteca.sql)
  function marcarLeido(n) {
    if (!V) return;
    var id = V.libro.id, r = { pagina: n, marcas: V.marcas.slice(), leido: new Date().toISOString() };
    S.lectura[id] = r; guardar(CLAVE_LEC, S.lectura);
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario(); if (!u) return;
      return c.from('biblioteca_lectura').upsert({ usuario: u.id, libro: id, pagina: n, marcas: r.marcas, leido: r.leido });
    }).catch(function () {});
  }
  function pintarMarcas() {
    if (!V) return;
    V.hojas.forEach(function (d, i) { var m = d.querySelector('.marca'), on = V.marcas.indexOf(i + 1) >= 0; if (on && !m) d.insertAdjacentHTML('beforeend', '<span class="marca"></span>'); if (!on && m) m.remove(); });
    $('vMarcas').innerHTML = V.marcas.length ? V.marcas.slice().sort(function (a, b) { return a - b; }).map(function (n) { return '<button type="button" data-ir="' + n + '">' + svg('i-marcador') + 'Pág. ' + n + '</button>'; }).join('')
      : '<p>Toca el marcador de arriba para guardar una página.</p>';
  }
  $('vMarca').addEventListener('click', function () {
    if (!V || !V.hojas.length) return;
    var i = V.marcas.indexOf(V.pagina);
    if (i >= 0) V.marcas.splice(i, 1); else V.marcas.push(V.pagina);
    pintarMarcas(); pagina(V.pagina); marcarLeido(V.pagina);
  });
  $('vAnt').addEventListener('click', function () { ir(V.pagina - 1); });
  $('vSig').addEventListener('click', function () { ir(V.pagina + 1); });
  function zoom(f) {
    var n = V.pagina; V.zoom = Math.max(.6, Math.min(2.6, Math.round(V.zoom * f * 10) / 10));
    var w = ancho();
    V.hojas.forEach(function (d) { var k = w / parseFloat(d.style.width); d.style.width = w + 'px'; d.style.height = parseFloat(d.style.height) * k + 'px'; d.dataset.zoom = ''; });
    ir(n, true);
    V.hojas.forEach(function (d) { V.obs.unobserve(d); V.obs.observe(d); });
  }
  $('vMas').addEventListener('click', function () { zoom(1.25); });
  $('vMenos').addEventListener('click', function () { zoom(.8); });
  $('vPg').addEventListener('click', function () { $('vIr').hidden = !$('vIr').hidden; if (!$('vIr').hidden) { $('vIrN').value = V.pagina; $('vIrN').max = V.hojas.length; $('vIrN').select(); } });
  function irA() { var n = parseInt($('vIrN').value, 10); if (n) { ir(n); $('vIr').hidden = true; } }
  $('vIrOk').addEventListener('click', irA);
  $('vIrN').addEventListener('keydown', function (e) { if (e.key === 'Enter') irA(); });
  $('vMarcas').addEventListener('click', function (e) { var b = e.target.closest('[data-ir]'); if (b) { ir(+b.dataset.ir); $('vIr').hidden = true; } });
  $('vFull').addEventListener('click', function () {
    var v = $('visor');
    if (document.fullscreenElement) document.exitFullscreen(); else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (!V || $('visor').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { ir(V.pagina + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { ir(V.pagina - 1); e.preventDefault(); }
    if (e.key === 'Escape' && !document.fullscreenElement) history.back();
  });
  var redim; addEventListener('resize', function () { if (!V || !V.hojas.length) return; clearTimeout(redim); redim = setTimeout(function () { zoom(1); }, 250); });

  function cerrarVisor(sinPintar) {
    if (!V) return;
    if (V.hojas.length) marcarLeido(V.pagina);
    clearTimeout(V.guardo);
    if (V.obs) V.obs.disconnect();
    if (V.tarea) V.tarea.destroy();
    V = null;
    $('visor').hidden = true; document.body.classList.remove('leyendo');
    $('vHojas').innerHTML = '';
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    if (!sinPintar) pintar();
  }
  $('vCerrar').addEventListener('click', function () { if (history.state && history.state.libro) history.back(); else { cerrarVisor(); history.replaceState(null, '', location.pathname + location.search); } });
  addEventListener('popstate', function () { var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true); else cerrarVisor(); });
  addEventListener('pagehide', function () { if (V && V.hojas.length) marcarLeido(V.pagina); });

  cargar();
})();
</script>
