<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0818">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Modo Cachimbo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="assets/app.js" defer></script>
<title>Biblioteca · Modo Cachimbo</title>
<!--
  Biblioteca: libros en PDF que viven en el Google Drive de Modo Cachimbo.
  - La lista sale de supabase/42-biblioteca.sql (el panel → Biblioteca guarda el id de Drive).
  - El visor es propio (PDF.js): baja el PDF con la API de Google Drive (MC_CONFIG.DRIVE_KEY),
    dibuja las páginas a medida que llegas a ellas y guarda en qué página te quedaste.
  - Si falta la clave o Drive no responde, abre la vista previa de Drive dentro de la página.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: Nunito, sans-serif; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 20px 70px; }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); text-decoration: none; font-weight: 800; font-size: 14px; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }
  .cab { display: flex; align-items: center; gap: 14px; margin: 14px 0 16px; flex-wrap: wrap; }
  .cab .ic { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; background: rgba(206,130,255,.14); color: #CE82FF; }
  .cab .ic svg { width: 26px; height: 26px; }
  .cab .tt { flex: 1; min-width: 160px; }
  .cab h1 { font: 1000 clamp(26px, 6vw, 34px)/1.05 Nunito, sans-serif; }
  .cab p { color: var(--text-dim); font-weight: 800; font-size: 14.5px; margin-top: 3px; }
  .buscar { position: relative; flex: 0 1 420px; min-width: 0; }
  .buscar svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 19px; height: 19px; color: var(--text-faint); }
  .buscar input { width: 100%; padding: 14px 16px 14px 46px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: 800 15px Nunito, sans-serif; outline: none; }
  .buscar input:focus { border-color: #CE82FF; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 13px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); font-weight: 900; font-size: 13.5px; cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip small { color: var(--text-faint); font-weight: 900; }
  .chip.on { background: #EEEAF7; color: #151127; border-color: #A99FC8; }
  .chip.on small { color: #6F6690; }

  /* Estantes: una fila que se desliza de costado */
  .estante { margin-top: 30px; }
  .est-cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .est-cab h2 { font: 1000 21px Nunito, sans-serif; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .est-cab h2 small { color: var(--text-dim); font-size: 14px; font-weight: 800; white-space: nowrap; }
  .est-cab .gi { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 15%, transparent); }
  .est-cab .gi i { width: 20px; height: 20px; background: var(--c); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .est-cab .ver { margin-left: auto; flex: none; background: none; border: 0; color: #CE82FF; font-weight: 900; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .est-cab .fl { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
  .est-cab .fl svg { width: 16px; height: 16px; }
  .fila { display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; padding: 4px 20px 10px; margin: 0 -20px; scrollbar-width: none; }
  .fila::-webkit-scrollbar { display: none; }
  .fila > * { scroll-snap-align: start; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; margin-top: 18px; }

  /* Libro: portada + título */
  .libro { display: block; text-align: left; background: none; border: 0; cursor: pointer; min-width: 0; }
  .libro > b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 1000; margin-top: 9px; line-height: 1.25; }
  .libro > small { display: block; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 3px; }
  .libro > .lp { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 7px; overflow: hidden; }
  .libro > .lp i { display: block; height: 100%; background: var(--c); }
  .portada { position: relative; display: block; aspect-ratio: 5 / 7; border-radius: 6px 12px 12px 6px; overflow: hidden; background: #1D1834; box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 5px 0 0 rgba(0,0,0,.2); transition: transform .14s, box-shadow .14s; }
  .portada::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.08) 4%, transparent 9%); pointer-events: none; }
  .libro:hover .portada, .libro:focus-visible .portada { transform: translateY(-4px); box-shadow: 0 14px 24px rgba(0,0,0,.5); }
  .portada img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .portada .et { position: absolute; z-index: 1; left: 8px; bottom: 8px; padding: 3px 7px; border-radius: 7px; background: rgba(11,8,24,.82); color: #fff; font: 1000 9.5px Nunito, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .portada .nuevo { position: absolute; z-index: 1; right: 8px; top: 8px; padding: 3px 7px; border-radius: 7px; background: #FF4B4B; color: #fff; font: 1000 9.5px Nunito, sans-serif; letter-spacing: .08em; }
  .portada .cand { position: absolute; z-index: 1; right: 8px; bottom: 8px; width: 24px; height: 24px; border-radius: 7px; background: rgba(11,8,24,.82); display: grid; place-items: center; }
  .portada .cand svg { width: 13px; height: 13px; color: #FFC800; }
  /* Portada dibujada (cuando no subiste foto): color del curso, título grande e ícono */
  .gen { position: absolute; inset: 0; padding: 16% 11% 0 15%; color: #0b0818; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 88%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 72%, #000)); }
  .gen b { display: block; font: 1000 17px/1.1 Nunito, sans-serif; text-transform: uppercase; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .gen em { display: block; font: 900 10.5px/1.2 Nunito, sans-serif; font-style: normal; text-transform: uppercase; letter-spacing: .08em; opacity: .62; margin-top: 7px; }
  .gen i { position: absolute; right: -14%; bottom: 6%; width: 64%; aspect-ratio: 1; background: rgba(0,0,0,.2); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .gen u { position: absolute; left: 15%; top: 7%; text-decoration: none; font: 1000 8px Nunito, sans-serif; letter-spacing: .2em; opacity: .5; }

  /* Destacados: banner grande arriba */
  .heroes { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 24px; margin-top: 18px; }
  .heroes::-webkit-scrollbar { display: none; }
  .hero { position: relative; scroll-snap-align: start; display: flex; align-items: center; gap: 28px; padding: 28px 32px; min-height: 280px; border-radius: 24px; overflow: hidden; border: 2px solid var(--border); background: #151127; text-align: left; cursor: pointer; }
  .hero .fx { position: absolute; inset: -40px; background: var(--fondo) center / cover; filter: blur(40px) saturate(1.3); opacity: .55; }
  .hero .fx2 { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,8,24,.25), rgba(11,8,24,.85) 55%); }
  .hero .portada { position: relative; flex: none; width: 168px; }
  .hero .tx { position: relative; min-width: 0; max-width: 560px; }
  .hero .tag { display: inline-block; padding: 4px 9px; border-radius: 8px; background: var(--accent); color: #1a1f00; font: 1000 11px Nunito, sans-serif; letter-spacing: .1em; }
  .hero h2 { font: 1000 clamp(24px, 3.4vw, 36px)/1.08 Nunito, sans-serif; margin-top: 10px; }
  .hero .meta { color: var(--text-dim); font-weight: 800; font-size: 14px; margin-top: 6px; }
  .hero p { color: #d6d0ea; font-weight: 700; font-size: 14.5px; line-height: 1.5; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .bt { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: #1a1f00; font-weight: 1000; text-transform: uppercase; letter-spacing: .5px; font-size: 14px; box-shadow: 0 4px 0 #8fa300; }
  .puntos { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .puntos i { width: 8px; height: 8px; border-radius: 50%; background: #3A3260; transition: width .2s; }
  .puntos i.on { width: 22px; border-radius: 6px; background: var(--accent); }

  /* Seguir leyendo: tarjetas anchas con avance */
  .fila.anchas { grid-auto-columns: 300px; }
  .lee { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); text-align: left; cursor: pointer; min-width: 0; }
  .lee .portada { flex: none; width: 58px; border-radius: 4px 8px 8px 4px; }
  .lee .portada .gen b { font-size: 7.5px; } .lee .portada .gen em, .lee .portada .gen u, .lee .portada .et, .lee .portada .nuevo { display: none; }
  .lee .tx { flex: 1; min-width: 0; }
  .lee b { display: block; font-size: 14.5px; font-weight: 1000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lee small { display: block; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 2px; }
  .lee .bar { display: block; height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
  .lee .bar i { display: block; height: 100%; background: var(--c); border-radius: 6px; }

  /* Colecciones: tres portadas en abanico */
  .fila.cols { grid-auto-columns: 250px; }
  .col { position: relative; display: block; padding: 16px 16px 14px; border-radius: 20px; border: 2px solid color-mix(in srgb, var(--c) 45%, transparent); border-bottom-width: 5px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, #151127), #151127 70%); text-align: left; cursor: pointer; overflow: hidden; }
  .col .abanico { position: relative; display: block; height: 128px; margin-bottom: 12px; }
  .col .abanico .portada { position: absolute; bottom: 0; width: 82px; border-radius: 4px 8px 8px 4px; }
  .col .abanico .portada .gen b { font-size: 9px; } .col .abanico .portada .gen em, .col .abanico .portada .gen u, .col .abanico .portada .et, .col .abanico .portada .nuevo { display: none; }
  .col .abanico .portada:nth-child(1) { left: 50%; translate: -50% 0; z-index: 3; }
  .col .abanico .portada:nth-child(2) { left: 50%; translate: -105% 6px; rotate: -10deg; z-index: 2; filter: brightness(.8); }
  .col .abanico .portada:nth-child(3) { left: 50%; translate: 5% 6px; rotate: 10deg; z-index: 1; filter: brightness(.7); }
  .col b { display: block; font-size: 16px; font-weight: 1000; }
  .col small { display: block; color: var(--text-dim); font-weight: 800; font-size: 12.5px; margin-top: 2px; }

  /* Cabecera al filtrar (un curso o una colección) */
  .filtro-cab { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 16px 18px; border-radius: 20px; background: linear-gradient(120deg, color-mix(in srgb, var(--c) 20%, #151127), #151127 70%); border: 2px solid var(--border); }
  .filtro-cab b { display: block; font-size: 20px; font-weight: 1000; }
  .filtro-cab small { display: block; color: var(--text-dim); font-weight: 800; font-size: 13.5px; margin-top: 2px; }
  .filtro-cab button { margin-left: auto; flex: none; padding: 9px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 900; cursor: pointer; }

  .vacio { margin-top: 26px; padding: 26px 18px; border-radius: 20px; border: 2px dashed var(--border); text-align: center; color: var(--text-dim); font-weight: 800; line-height: 1.5; }
  .vacio b { display: block; color: var(--text); font-size: 18px; font-weight: 1000; margin-bottom: 4px; }

  /* Ficha del libro */
  .ficha-fondo { position: fixed; inset: 0; z-index: 40; background: rgba(6,4,14,.72); display: grid; place-items: center; padding: 20px; opacity: 0; transition: opacity .2s; }
  .ficha-fondo.ver { opacity: 1; }
  .ficha { position: relative; width: min(720px, 100%); max-height: calc(100vh - 40px); overflow: auto; border-radius: 26px; background: #151127; border: 2px solid var(--border); padding: 26px; display: grid; grid-template-columns: 200px 1fr; grid-template-areas: 'por info' 'por cuerpo' 'mas mas'; gap: 0 24px; align-content: start; transform: translateY(14px); transition: transform .2s; }
  .ficha-fondo.ver .ficha { transform: none; }
  .ficha .x { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--border); background: #0b0818; cursor: pointer; display: grid; place-items: center; }
  .ficha .x svg { width: 16px; height: 16px; }
  .ficha .chs { display: flex; gap: 6px; flex-wrap: wrap; }
  .ficha .ch { padding: 4px 9px; border-radius: 8px; font: 1000 11px Nunito, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
  .ficha h2 { font: 1000 26px/1.1 Nunito, sans-serif; margin-top: 10px; padding-right: 36px; }
  .ficha .sub { color: var(--text-dim); font-weight: 800; font-size: 15px; margin-top: 4px; }
  .ficha .datos { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
  .ficha .datos span { color: var(--text-dim); font-weight: 800; font-size: 12.5px; }
  .ficha .datos b { display: block; color: var(--text); font-size: 16px; font-weight: 1000; }
  .ficha p.d { color: #d6d0ea; font-weight: 700; font-size: 14.5px; line-height: 1.55; margin-top: 14px; }
  .ficha .etq { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .ficha .etq span { padding: 4px 9px; border-radius: 999px; border: 1.5px solid #3A3260; color: var(--text-dim); font-weight: 800; font-size: 12px; }
  .ficha .bts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .ficha .leer { padding: 13px 24px; border-radius: 15px; border: 0; background: var(--accent); color: #1a1f00; font-weight: 1000; text-transform: uppercase; letter-spacing: .5px; font-size: 15px; box-shadow: 0 4px 0 #8fa300; cursor: pointer; }
  .ficha .sec { padding: 12px 18px; border-radius: 15px; border: 2px solid var(--border); background: none; color: var(--text); font-weight: 900; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .ficha .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin-top: 14px; overflow: hidden; }
  .ficha .bar i { display: block; height: 100%; background: var(--c); }
  .ficha > .portada { grid-area: por; align-self: start; }
  .ficha .info { grid-area: info; }
  .ficha .cuerpo { grid-area: cuerpo; }
  .ficha .mas { grid-area: mas; margin-top: 22px; }
  .ficha .mas h3 { font: 1000 15px Nunito, sans-serif; color: var(--text-dim); margin-bottom: 10px; }
  .ficha .mas .fila { grid-auto-columns: 104px; margin: 0; padding: 4px 0 6px; gap: 12px; }
  .ficha .mas .gen b { font-size: 11px; } .ficha .mas .gen em, .ficha .mas .gen u { display: none; }
  .ficha .mas .libro > b { font-size: 12.5px; }

  @media (max-width: 760px) {
    .wrap { padding: 18px 16px 60px; }
    .buscar { flex-basis: 100%; }
    .fila { grid-auto-columns: 116px; gap: 12px; scroll-padding: 0 16px; padding: 4px 16px 10px; margin: 0 -16px; }
    .fila.anchas { grid-auto-columns: 270px; } .fila.cols { grid-auto-columns: 210px; }
    .rejilla { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 12px; }
    .gen b { font-size: 12px; } .gen em { font-size: 8.5px; } .gen u { display: none; }
    .libro > b { font-size: 13px; } .libro > small { font-size: 11.5px; }
    .est-cab h2 { font-size: 18px; } .est-cab .fl { display: none; }
    .hero { gap: 16px; padding: 20px; min-height: 0; }
    .hero .portada { width: 112px; } .hero p { -webkit-line-clamp: 2; }
    .hero { display: grid; grid-template-columns: 104px 1fr; align-items: center; }
    .hero .tx h2 { font-size: 21px; } .hero .bt { padding: 10px 16px; font-size: 13px; }
    .ficha-fondo { place-items: end center; padding: 0; }
    .ficha { grid-template-columns: 104px 1fr; grid-template-areas: 'por info' 'cuerpo cuerpo' 'mas mas'; gap: 0 16px; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; max-height: 92vh; }
    .ficha h2 { font-size: 20px; } .ficha .info { align-self: center; }
    .ficha .bts .leer { flex: 1; white-space: nowrap; }
  }

  /* ---------- Visor ---------- */
  body.leyendo { overflow: hidden; }
  .visor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #2b2838; }
  .v-cab { display: flex; align-items: center; gap: 12px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); background: #0b0818; border-bottom: 1px solid #000; }
  .v-bt { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; border: 2px solid #2F284E; background: #151127; cursor: pointer; }
  .v-bt svg { width: 20px; height: 20px; }
  .v-bt.on { color: var(--accent); border-color: var(--accent); }
  .v-bt.on svg { fill: currentColor; }
  .v-tit { flex: 1; min-width: 0; }
  .v-tit b { display: block; font-weight: 1000; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-tit small { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-weight: 800; font-size: 13px; }
  .v-tit small i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .v-hojas { flex: 1; overflow: auto; padding: 18px 12px 110px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .v-hoja { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.4); border-radius: 3px; }
  .v-hoja canvas { display: block; width: 100%; height: 100%; border-radius: 3px; }
  .v-hoja .marca { position: absolute; right: 14px; top: -4px; width: 22px; height: 30px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
  .v-barra { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 20px; background: rgba(11,8,24,.94); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .v-barra button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; }
  .v-barra button:hover { background: rgba(255,255,255,.07); }
  .v-barra button svg { width: 22px; height: 22px; }
  .v-barra .pg { width: auto; display: flex; align-items: baseline; gap: 5px; padding: 0 10px; font-weight: 1000; font-size: 16px; white-space: nowrap; }
  .v-barra .pg small { color: var(--text-dim); font-weight: 800; }
  .v-barra hr { width: 1px; height: 26px; border: 0; background: #2F284E; margin: 0 4px; }
  .v-carga { position: absolute; inset: 70px 0 0; display: grid; place-items: center; text-align: center; color: var(--text-dim); font-weight: 800; padding: 20px; }
  .v-carga .ring { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%; border: 4px solid #3A3260; border-top-color: var(--accent); animation: gira 1s linear infinite; }
  .v-carga .bar { width: 200px; height: 6px; border-radius: 6px; background: #3A3260; margin: 10px auto 0; overflow: hidden; }
  .v-carga .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  @media (max-width: 560px) {

<script src="assets/mc-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/acceso.js"></script>
<script src="assets/candado.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var CFG = window.MC_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  var COLOR = { 'ciencia-tecnologia': '#C6E000', matematica: '#1CB0F6', comunicacion: '#CE82FF', 'ciencias-sociales': '#FF9600' };
  var TIPOS = { libro: 'Libro', formulario: 'Formulario', solucionario: 'Solucionario', fichas: 'Fichas', resumen: 'Resumen', examenes: 'Exámenes', separata: 'Separata' };
  var S = { libros: [], colecciones: [], lectura: {}, cursos: {}, areas: [], orden: [], filtro: null, q: '' };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function sinAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function leer(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var CLAVE_LEC = 'mc_biblioteca_lectura';
  var CANDADO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var FLECHA = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="' + (d < 0 ? '15 18 9 12 15 6' : '9 18 15 12 9 6') + '"/></svg>'; };

  function curso(id) { return S.cursos[id] || { nombre: id, area: '', icono: '' }; }
  function color(id) { return COLOR[curso(id).area] || '#C6E000'; }
  function ico(id) { var c = curso(id); return c.icono ? 'url(' + c.icono + ')' : 'none'; }
  function libro(id) { return S.libros.filter(function (x) { return x.id === id; })[0]; }
  function coleccion(id) { return S.colecciones.filter(function (x) { return x.id === id; })[0]; }
  function nombre(l) { return l.titulo + (l.subtitulo ? ' · ' + l.subtitulo : ''); }
  function esNuevo(l) { return Date.now() - new Date(l.creado) < 21 * 864e5 && !S.lectura[l.id]; }
  function porOrden(a, b) { return (S.orden.indexOf(a.curso) + 1 || 99) - (S.orden.indexOf(b.curso) + 1 || 99) || (a.orden || 0) - (b.orden || 0); }
  function hace(iso) {
    var d = (Date.now() - new Date(iso)) / 864e5;
    return d < 1 ? 'hoy' : d < 2 ? 'ayer' : 'hace ' + Math.floor(d) + ' días';
  }
  function avance(l) { var r = S.lectura[l.id]; return r && l.paginas ? Math.min(1, r.pagina / l.paginas) : 0; }

  /* ---------- Piezas ---------- */
  // Portada: la foto que subiste o, si no hay, una dibujada con el color y el ícono del curso
  function portada(l, op) {
    op = op || {};
    var dentro = l.portada ? '<img src="' + esc(l.portada) + '" alt="" loading="lazy">'
      : '<span class="gen" style="--ico:' + ico(l.curso) + '"><u>MODO CACHIMBO</u><b>' + esc(l.titulo) + '</b>' + (l.subtitulo ? '<em>' + esc(l.subtitulo) + '</em>' : '') + '<i></i></span>';
    return '<span class="portada" style="--c:' + color(l.curso) + '">' + dentro +
      (!op.limpia && l.tipo && l.tipo !== 'libro' ? '<span class="et">' + esc(TIPOS[l.tipo] || l.tipo) + '</span>' : '') +
      (!op.limpia && esNuevo(l) ? '<span class="nuevo">NUEVO</span>' : '') +
      (!op.limpia && l.acceso === 'codigo' ? '<span class="cand" title="Con código de alumno">' + CANDADO + '</span>' : '') + '</span>';
  }
  function tarjeta(l) {
    var r = S.lectura[l.id], p = avance(l);
    return '<button class="libro" type="button" data-libro="' + esc(l.id) + '" style="--c:' + color(l.curso) + '">' + portada(l) +
      '<b>' + esc(nombre(l)) + '</b><small>' + esc(curso(l.curso).nombre) + (l.paginas ? ' · ' + l.paginas + ' págs' : '') + '</small>' +
      (p ? '<span class="lp"><i style="width:' + Math.max(4, Math.round(p * 100)) + '%"></i></span>' : '') + '</button>';
  }
  function estante(titulo, n, libros, op) {
    op = op || {};
    if (!libros.length) return '';
    return '<section class="estante"' + (op.c ? ' style="--c:' + op.c + ';--ico:' + (op.ico || 'none') + '"' : '') + '><div class="est-cab"><h2>' + (op.ico ? '<span class="gi"><i></i></span>' : '') + esc(titulo) +
      (n != null ? ' <small>' + n + (n === 1 ? ' libro' : ' libros') + '</small>' : '') + '</h2>' +
      (op.ver ? '<button class="ver" type="button" data-ver="' + esc(op.ver) + '">Ver todo ›</button>' : '<span style="margin-left:auto"></span>') +
      '<button class="fl" type="button" data-fl="-1" aria-label="Anterior">' + FLECHA(-1) + '</button><button class="fl" type="button" data-fl="1" aria-label="Siguiente">' + FLECHA(1) + '</button></div>' +
      '<div class="fila' + (op.cls ? ' ' + op.cls : '') + '">' + (op.html || libros.map(tarjeta).join('')) + '</div></section>';
  }
  function heroes(lista) {
    if (!lista.length) return '';
    return '<div class="heroes" id="heroes">' + lista.map(function (l) {
      var r = S.lectura[l.id];
      return '<button class="hero" type="button" data-libro="' + esc(l.id) + '" style="--c:' + color(l.curso) + ';--fondo:' + (l.portada ? 'url(&quot;' + esc(l.portada) + '&quot;)' : color(l.curso)) + '">' +
        '<span class="fx"></span><span class="fx2"></span>' + portada(l, { limpia: true }) +
        '<span class="tx"><span class="tag">DESTACADO</span><h2>' + esc(nombre(l)) + '</h2>' +
        '<div class="meta">' + [curso(l.curso).nombre, l.autor, l.paginas ? l.paginas + ' págs' : ''].filter(Boolean).map(esc).join(' · ') + '</div>' +
        (l.descr ? '<p>' + esc(l.descr) + '</p>' : '') +
        '<span class="bt">' + (r ? 'Seguir en la pág. ' + r.pagina : 'Leer ahora') + '</span></span></button>';
    }).join('') + '</div>' + (lista.length > 1 ? '<div class="puntos" id="puntos">' + lista.map(function (x, i) { return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('') + '</div>' : '');
  }
  function seguir() {
    var l = Object.keys(S.lectura).map(function (id) { var x = libro(id); return x && { l: x, r: S.lectura[id] }; }).filter(Boolean)
      .filter(function (x) { return !x.l.paginas || x.r.pagina < x.l.paginas; })
      .sort(function (a, b) { return new Date(b.r.leido) - new Date(a.r.leido); }).slice(0, 8);
    return estante('Seguir leyendo', null, l, { cls: 'anchas', html: l.map(function (x) {
      var p = avance(x.l);
      return '<button class="lee" type="button" data-libro="' + esc(x.l.id) + '" style="--c:' + color(x.l.curso) + '">' + portada(x.l) +
        '<span class="tx"><b>' + esc(nombre(x.l)) + '</b><small>Pág. ' + x.r.pagina + (x.l.paginas ? ' de ' + x.l.paginas : '') + ' · ' + hace(x.r.leido) + '</small>' +
        '<span class="bar"><i style="width:' + Math.max(4, Math.round(p * 100)) + '%"></i></span></span></button>';
    }).join('') });
  }
  function colecciones() {
    var cs = S.colecciones.map(function (c) { return { c: c, l: S.libros.filter(function (l) { return l.coleccion === c.id; }).sort(porOrden) }; }).filter(function (x) { return x.l.length; });
    return estante('Colecciones', null, cs, { cls: 'cols', html: cs.map(function (x) {
      return '<button class="col" type="button" data-ver="col:' + esc(x.c.id) + '" style="--c:' + esc(x.c.color || '#CE82FF') + '"><span class="abanico">' +
        x.l.slice(0, 3).map(function (l) { return portada(l, { limpia: true }); }).join('') + '</span>' +
        '<b>' + esc(x.c.nombre) + '</b><small>' + x.l.length + (x.l.length === 1 ? ' libro' : ' libros') + (x.c.descripcion ? ' · ' + esc(x.c.descripcion) : '') + '</small></button>';
    }).join('') });
  }

  /* ---------- Lista ---------- */
  function pintar() {
    var q = sinAcento(S.q), html = '';
    if (!S.libros.length) html = '<div class="vacio"><b>Muy pronto</b>Estamos subiendo los primeros libros.</div>';
    else if (q || S.filtro) {
      // Un curso, una colección o lo que buscas: todo en rejilla
      var f = S.filtro || '', col = /^col:/.test(f) ? coleccion(f.slice(4)) : null, area = /^area:/.test(f) ? f.slice(5) : '';
      var areaNom = area ? (S.areas.filter(function (a) { return a.id === area; })[0] || { nombre: area }).nombre : '';
      var lista = S.libros.filter(function (l) {
        if (col && l.coleccion !== col.id) return false;
        if (area && curso(l.curso).area !== area) return false;
        if (f && !col && !area && l.curso !== f) return false;
        return !q || sinAcento([l.titulo, l.subtitulo, l.autor, curso(l.curso).nombre, TIPOS[l.tipo], (l.etiquetas || []).join(' '), (coleccion(l.coleccion) || {}).nombre].join(' ')).indexOf(q) >= 0;
      }).sort(porOrden);
      if (f) html += '<div class="filtro-cab" style="--c:' + (col ? esc(col.color) : area ? (COLOR[area] || '#C6E000') : color(f)) + '"><div><b>' + esc(col ? col.nombre : area ? areaNom : curso(f).nombre) + '</b><small>' +
        (col && col.descripcion ? esc(col.descripcion) + ' · ' : '') + lista.length + (lista.length === 1 ? ' libro' : ' libros') + '</small></div><button type="button" data-ver="">‹ Todo</button></div>';
      html += lista.length ? '<div class="rejilla">' + lista.map(tarjeta).join('') + '</div>'
        : '<div class="vacio"><b>No encontramos ese libro</b>Prueba con otra palabra' + (f ? ' o mira toda la biblioteca' : '') + '.</div>';
    } else {
      // Inicio de la biblioteca: destacados, seguir leyendo, colecciones, nuevos y un estante por curso
      var dest = S.libros.filter(function (l) { return l.destacado; }).sort(porOrden);
      var nuevos = S.libros.filter(esNuevo).sort(function (a, b) { return new Date(b.creado) - new Date(a.creado); });
      html += heroes(dest) + seguir() + colecciones();
      if (nuevos.length >= 2) html += estante('Nuevos en la biblioteca', null, nuevos.slice(0, 12));
      // Un estante por área (Matemática, Ciencia y Tecnología…), con sus cursos en orden
      var grupos = {}; S.libros.forEach(function (l) { var a = curso(l.curso).area || 'otros'; (grupos[a] = grupos[a] || []).push(l); });
      var areas = S.areas.map(function (a) { return a.id; }).filter(function (a) { return grupos[a]; }).concat(grupos.otros ? ['otros'] : []);
      areas.forEach(function (a) {
        var nom = (S.areas.filter(function (x) { return x.id === a; })[0] || { nombre: 'Otros' }).nombre;
        html += estante(nom, grupos[a].length, grupos[a].sort(porOrden), { c: COLOR[a] || '#C6E000', ico: a === 'otros' ? '' : 'url(assets/icons/' + a + '.svg)', ver: 'area:' + a });
      });
    }
    $('grupos').innerHTML = html;
    // Chips: Todo y un chip por curso que tiene libros
    var porCurso = {}; S.libros.forEach(function (l) { porCurso[l.curso] = (porCurso[l.curso] || 0) + 1; });
    var cs = Object.keys(porCurso).sort(function (a, b) { return (S.orden.indexOf(a) + 1 || 99) - (S.orden.indexOf(b) + 1 || 99); });
    $('chips').hidden = cs.length < 2;
    $('chips').innerHTML = '<button class="chip' + (S.filtro ? '' : ' on') + '" type="button" data-ver="">Todo <small>' + S.libros.length + '</small></button>' +
      cs.map(function (id) { return '<button class="chip' + (S.filtro === id ? ' on' : '') + '" type="button" data-ver="' + id + '" style="--c:' + color(id) + '"><i></i>' + esc(curso(id).nombre) + ' <small>' + porCurso[id] + '</small></button>'; }).join('');
    $('cuenta').textContent = S.libros.length ? S.libros.length + (S.libros.length === 1 ? ' libro' : ' libros') + ' para leer aquí mismo' : 'Libros en PDF para estudiar';
    // Las flechas solo salen si el estante tiene más libros de los que caben
    document.querySelectorAll('#grupos .estante').forEach(function (e) {
      var f = e.querySelector('.fila'), sobra = f.scrollWidth > f.clientWidth + 4;
      e.querySelectorAll('.fl').forEach(function (b) { b.hidden = !sobra; });
    });
    var h = $('heroes');
    if (h && $('puntos')) h.addEventListener('scroll', function () {
      var i = Math.round(h.scrollLeft / h.clientWidth);
      $('puntos').querySelectorAll('i').forEach(function (p, k) { p.classList.toggle('on', k === i); });
    }, { passive: true });
  }
  // Los destacados pasan solos cada 7 segundos (si no estás leyendo ni con la ficha abierta)
  setInterval(function () {
    var h = $('heroes'); if (!h || V || $('ficha') || h.matches(':hover')) return;
    var n = h.children.length; if (n < 2) return;
    var i = (Math.round(h.scrollLeft / h.clientWidth) + 1) % n;
    h.scrollTo({ left: i * h.clientWidth, behavior: 'smooth' });
  }, 7000);

  $('q').addEventListener('input', function () { S.q = this.value.trim(); pintar(); });
  document.addEventListener('click', function (e) {
    var t = e.target;
    var fl = t.closest('#lista [data-fl]');
    if (fl) { var f = fl.closest('.estante').querySelector('.fila'); f.scrollBy({ left: +fl.dataset.fl * f.clientWidth * .85, behavior: 'smooth' }); return; }
    var v = t.closest('[data-ver]');
    if (v && !t.closest('#visor')) { S.filtro = v.dataset.ver || null; cerrarFicha(); pintar(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    var b = t.closest('[data-libro]');
    if (b && !t.closest('#visor')) ficha(b.dataset.libro);
  });

  /* ---------- Ficha del libro ---------- */
  function ficha(id) {
    var l = libro(id); if (!l) return;
    cerrarFicha(true);
    var r = S.lectura[id], p = avance(l), col = coleccion(l.coleccion);
    var mas = S.libros.filter(function (x) { return x.id !== l.id && (col ? x.coleccion === col.id : x.curso === l.curso); }).sort(porOrden).slice(0, 10);
    var d = document.createElement('div'); d.className = 'ficha-fondo'; d.id = 'ficha';
    d.innerHTML = '<div class="ficha" role="dialog" aria-modal="true" aria-label="' + esc(nombre(l)) + '" style="--c:' + color(l.curso) + '">' +
      '<button class="x" type="button" data-cerrar aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
      portada(l) +
      '<div class="info"><div class="chs"><span class="ch">' + esc(curso(l.curso).nombre) + '</span><span class="ch" style="--c:#A99FC8">' + esc(TIPOS[l.tipo] || 'Libro') + '</span>' +
        (col ? '<span class="ch" style="--c:' + esc(col.color) + '">' + esc(col.nombre) + '</span>' : '') + '</div>' +
        '<h2>' + esc(l.titulo) + '</h2>' + (l.subtitulo ? '<div class="sub">' + esc(l.subtitulo) + '</div>' : '') + '</div>' +
      '<div class="cuerpo"><div class="datos">' + (l.paginas ? '<span><b>' + l.paginas + '</b>páginas</span>' : '') + (l.autor ? '<span><b>' + esc(l.autor) + '</b>autor</span>' : '') +
        (r ? '<span><b>Pág. ' + r.pagina + '</b>' + hace(r.leido) + '</span>' : '') + (r && r.marcas && r.marcas.length ? '<span><b>' + r.marcas.length + '</b>marcadores</span>' : '') + '</div>' +
        (p ? '<div class="bar"><i style="width:' + Math.max(4, Math.round(p * 100)) + '%"></i></div>' : '') +
        (l.descr ? '<p class="d">' + esc(l.descr) + '</p>' : '') +
        (l.etiquetas && l.etiquetas.length ? '<div class="etq">' + l.etiquetas.map(function (e) { return '<span>#' + esc(e) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="bts"><button class="leer" type="button" id="fLeer">' + (r ? 'Seguir · pág. ' + r.pagina : 'Leer') + '</button>' +
        (r && r.pagina > 1 ? '<button class="sec" type="button" id="fInicio">Desde el inicio</button>' : '') +
        (l.descarga ? '<a class="sec" href="https://drive.google.com/uc?export=download&id=' + encodeURIComponent(l.drive) + '" target="_blank" rel="noopener">Descargar</a>' : '') + '</div></div>' +
      (mas.length ? '<div class="mas"><h3>' + (col ? 'Más de ' + esc(col.nombre) : 'Más de ' + esc(curso(l.curso).nombre)) + '</h3><div class="fila">' + mas.map(tarjeta).join('') + '</div></div>' : '') +
      '</div>';
    document.body.appendChild(d);
    requestAnimationFrame(function () { d.classList.add('ver'); });
    d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-cerrar]')) cerrarFicha(); });
    var leer = function (desde) { if (desde) { S.lectura[id] = Object.assign({}, S.lectura[id] || {}, { pagina: 1 }); } cerrarFicha(true); abrir(id); };
    $('fLeer').addEventListener('click', function () { leer(false); });
    if ($('fInicio')) $('fInicio').addEventListener('click', function () { leer(true); });
    // Con código de alumno: el botón Leer lleva el candado del curso (assets/candado.js)
    if (l.acceso === 'codigo' && window.MCCandado) MCCandado.marcar($('fLeer'), 'curso-' + l.curso, { nombre: curso(l.curso).nombre });
    $('fLeer').focus();
  }
  function cerrarFicha(ya) {
    var d = $('ficha'); if (!d) return;
    d.id = '';
    if (ya) { d.remove(); return; }
    d.classList.remove('ver'); setTimeout(function () { d.remove(); }, 200);
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('ficha')) cerrarFicha(); });

  function cargar() {
    S.lectura = leer(CLAVE_LEC) || {};
    var reg = fetch('assets/cursos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
      (d.cursos || []).forEach(function (c) { S.cursos[c.id] = { nombre: c.nombre, area: c.area, icono: c.icono || '' }; S.orden.push(c.id); });
      S.areas = d.areas || [];
    }).catch(function () {});
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario();
      return Promise.all([reg,
        c.from('biblioteca_libro').select('id,titulo,subtitulo,curso,drive,paginas,orden,creado,portada,tipo,autor,descr,coleccion,destacado,etiquetas,descarga,acceso').eq('visible', true).order('orden').order('creado'),
        u ? c.from('biblioteca_lectura').select('libro,pagina,marcas,leido').eq('usuario', u.id) : Promise.resolve({ data: [] }),
        c.from('biblioteca_coleccion').select('id,nombre,descripcion,color,orden').eq('visible', true).order('orden')
      ]);
    }).then(function (r) {
      if (r[1].error) throw r[1].error;
      S.libros = r[1].data || [];
      S.colecciones = (r[3] && !r[3].error && r[3].data) || [];
      (r[2].data || []).forEach(function (x) {
        var loc = S.lectura[x.libro];
        if (!loc || new Date(x.leido) > new Date(loc.leido)) S.lectura[x.libro] = { pagina: x.pagina, marcas: x.marcas || [], leido: x.leido };
      });
      guardar(CLAVE_LEC, S.lectura);
      pintar();
      var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true);
    }).catch(function () {
      $('grupos').innerHTML = '<div class="vacio"><b>No se pudo cargar la biblioteca</b>Revisa tu internet y vuelve a intentarlo.</div>';
    });
  }

  /* ---------- Visor ---------- */
  var V = null;
  function abrir(id, sinHistorial) {
    var l = S.libros.filter(function (x) { return x.id === id; })[0]; if (!l) return;
    cerrarVisor(true);
    var r = S.lectura[id] || { pagina: 1, marcas: [] };
    V = { libro: l, pdf: null, zoom: 1, pagina: r.pagina || 1, marcas: (r.marcas || []).slice(), hojas: [], obs: null, guardo: null, tarea: null };
    if (!sinHistorial) history.pushState({ libro: id }, '', '#libro=' + encodeURIComponent(id));
    $('visor').style.setProperty('--c', color(l.curso));
    $('vTit').textContent = l.titulo + (l.subtitulo ? ' · ' + l.subtitulo : '');
    $('vSub').textContent = curso(l.curso).nombre + (l.paginas ? ' · ' + l.paginas + ' págs' : '');
    $('visor').hidden = false; document.body.classList.add('leyendo');
    $('vHojas').innerHTML = ''; $('vHojas').hidden = false; $('vBarra').hidden = true; $('vIr').hidden = true; $('vMarca').hidden = false;
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    $('vCarga').hidden = false;
    $('vCarga').innerHTML = '<div><div class="ring"></div>Abriendo el libro…<div class="bar"><i id="vCargaBar"></i></div></div>';
    if (!CFG.DRIVE_KEY || !window.pdfjsLib) { vistaDrive(); return; }
    var url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(l.drive) + '?alt=media&key=' + encodeURIComponent(CFG.DRIVE_KEY);
    var t = pdfjsLib.getDocument({ url: url, disableAutoFetch: true, disableStream: false, rangeChunkSize: 262144, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' });
    V.tarea = t;
    var este = V;
    t.onProgress = function (p) { var b = $('vCargaBar'); if (b && p.total) b.style.width = Math.round(p.loaded / p.total * 100) + '%'; };
    t.promise.then(function (pdf) {
      if (V !== este) return;
      V.pdf = pdf;
      return pdf.getPage(1).then(function (p1) { if (V !== este) return; V.base = p1.getViewport({ scale: 1 }); armar(); });
    }).catch(function (e) { if (V === este) vistaDrive(); });
  }
  // Si no hay clave o Drive no deja bajarlo: su vista previa, dentro de la página
  function vistaDrive() {
    $('vCarga').hidden = true; $('vHojas').hidden = true; $('vBarra').hidden = true; $('vMarca').hidden = true;
    var f = document.createElement('iframe');
    f.className = 'v-drive'; f.allow = 'fullscreen'; f.title = V.libro.titulo;
    f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(V.libro.drive) + '/preview';
    $('vHojas').after(f);
    marcarLeido(1);
  }
  function ancho() { return Math.min($('vHojas').clientWidth - (innerWidth < 560 ? 12 : 24), 900) * V.zoom; }
  function armar() {
    var n = V.pdf.numPages, w = ancho(), h = w * V.base.height / V.base.width, caja = $('vHojas');
    $('vCarga').hidden = true; $('vBarra').hidden = false;
    caja.innerHTML = '';
    V.hojas = [];
    for (var i = 1; i <= n; i++) {
      var d = document.createElement('div'); d.className = 'v-hoja'; d.dataset.n = i;
      d.style.width = w + 'px'; d.style.height = h + 'px';
      caja.appendChild(d); V.hojas.push(d);
    }
    if (V.obs) V.obs.disconnect();
    // Se dibujan solo las páginas que se están viendo (y las de al lado)
    V.obs = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) dibujar(+e.target.dataset.n); });
    }, { root: caja, rootMargin: '600px 0px' });
    V.hojas.forEach(function (d) { V.obs.observe(d); });
    pintarMarcas();
    ir(Math.min(V.pagina, n), true);
    if (V.libro.paginas !== n) V.libro.paginas = n;
  }
  function dibujar(n) {
    var d = V.hojas[n - 1]; if (!d || d.dataset.zoom === String(V.zoom)) return;
    d.dataset.zoom = String(V.zoom);
    var este = V;
    V.pdf.getPage(n).then(function (p) {
      if (V !== este) return;
      var w = parseFloat(d.style.width), vp1 = p.getViewport({ scale: 1 }), esc = w / vp1.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = p.getViewport({ scale: esc * dpr });
      d.style.height = (vp1.height * esc) + 'px';
      var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      return p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
        var viejo = d.querySelector('canvas'); if (viejo) viejo.remove();
        d.prepend(c);
      });
    }).catch(function () { d.dataset.zoom = ''; });
  }
  function actual() {
    var caja = $('vHojas'), mitad = caja.scrollTop + caja.clientHeight * .35, n = 1;
    for (var i = 0; i < V.hojas.length; i++) { if (V.hojas[i].offsetTop <= mitad) n = i + 1; else break; }
    return n;
  }
  function ir(n, sinAnim) {
    n = Math.max(1, Math.min(V.hojas.length, n));
    var d = V.hojas[n - 1]; if (!d) return;
    $('vHojas').scrollTo({ top: d.offsetTop - 12, behavior: sinAnim ? 'auto' : 'smooth' });
    pagina(n);
  }
  function pagina(n) {
    if (!V) return;
    V.pagina = n;
    $('vPg').innerHTML = n + ' <small>/ ' + V.hojas.length + '</small>';
    $('vMarca').classList.toggle('on', V.marcas.indexOf(n) >= 0);
    clearTimeout(V.guardo); V.guardo = setTimeout(function () { marcarLeido(n); }, 1200);
  }
  $('vHojas').addEventListener('scroll', function () { if (V && V.hojas.length) { var n = actual(); if (n !== V.pagina) pagina(n); } }, { passive: true });

  // Dónde te quedaste: en este equipo al toque y en tu cuenta (supabase/42-biblioteca.sql)
  function marcarLeido(n) {
    if (!V) return;
    var id = V.libro.id, r = { pagina: n, marcas: V.marcas.slice(), leido: new Date().toISOString() };
    S.lectura[id] = r; guardar(CLAVE_LEC, S.lectura);
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario(); if (!u) return;
      return c.from('biblioteca_lectura').upsert({ usuario: u.id, libro: id, pagina: n, marcas: r.marcas, leido: r.leido });
    }).catch(function () {});
  }
  function pintarMarcas() {
    if (!V) return;
    V.hojas.forEach(function (d, i) { var m = d.querySelector('.marca'), on = V.marcas.indexOf(i + 1) >= 0; if (on && !m) d.insertAdjacentHTML('beforeend', '<span class="marca"></span>'); if (!on && m) m.remove(); });
    $('vMarcas').innerHTML = V.marcas.length ? V.marcas.slice().sort(function (a, b) { return a - b; }).map(function (n) { return '<button type="button" data-ir="' + n + '">Pág. ' + n + '</button>'; }).join('')
      : '<p>Toca el marcador de arriba para guardar una página.</p>';
  }
  $('vMarca').addEventListener('click', function () {
    if (!V || !V.hojas.length) return;
    var i = V.marcas.indexOf(V.pagina);
    if (i >= 0) V.marcas.splice(i, 1); else V.marcas.push(V.pagina);
    pintarMarcas(); pagina(V.pagina); marcarLeido(V.pagina);
  });
  $('vAnt').addEventListener('click', function () { ir(V.pagina - 1); });
  $('vSig').addEventListener('click', function () { ir(V.pagina + 1); });
  function zoom(f) {
    var n = V.pagina; V.zoom = Math.max(.6, Math.min(2.6, Math.round(V.zoom * f * 10) / 10));
    var w = ancho();
    V.hojas.forEach(function (d) { var k = w / parseFloat(d.style.width); d.style.width = w + 'px'; d.style.height = parseFloat(d.style.height) * k + 'px'; d.dataset.zoom = ''; });
    ir(n, true);
    V.hojas.forEach(function (d) { V.obs.unobserve(d); V.obs.observe(d); });
  }
  $('vMas').addEventListener('click', function () { zoom(1.25); });
  $('vMenos').addEventListener('click', function () { zoom(.8); });
  $('vPg').addEventListener('click', function () { $('vIr').hidden = !$('vIr').hidden; if (!$('vIr').hidden) { $('vIrN').value = V.pagina; $('vIrN').max = V.hojas.length; $('vIrN').select(); } });
  function irA() { var n = parseInt($('vIrN').value, 10); if (n) { ir(n); $('vIr').hidden = true; } }
  $('vIrOk').addEventListener('click', irA);
  $('vIrN').addEventListener('keydown', function (e) { if (e.key === 'Enter') irA(); });
  $('vMarcas').addEventListener('click', function (e) { var b = e.target.closest('[data-ir]'); if (b) { ir(+b.dataset.ir); $('vIr').hidden = true; } });
  $('vFull').addEventListener('click', function () {
    var v = $('visor');
    if (document.fullscreenElement) document.exitFullscreen(); else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (!V || $('visor').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { ir(V.pagina + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { ir(V.pagina - 1); e.preventDefault(); }
    if (e.key === 'Escape' && !document.fullscreenElement) history.back();
  });
  var redim; addEventListener('resize', function () { if (!V || !V.hojas.length) return; clearTimeout(redim); redim = setTimeout(function () { zoom(1); }, 250); });

  function cerrarVisor(sinPintar) {
    if (!V) return;
    if (V.hojas.length) marcarLeido(V.pagina);
    clearTimeout(V.guardo);
    if (V.obs) V.obs.disconnect();
    if (V.tarea) V.tarea.destroy();
    V = null;
    $('visor').hidden = true; document.body.classList.remove('leyendo');
    $('vHojas').innerHTML = '';
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    if (!sinPintar) pintar();
  }
  $('vCerrar').addEventListener('click', function () { if (history.state && history.state.libro) history.back(); else { cerrarVisor(); history.replaceState(null, '', location.pathname); } });
  addEventListener('popstate', function () { var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true); else cerrarVisor(); });
  addEventListener('pagehide', function () { if (V && V.hojas.length) marcarLeido(V.pagina); });

  cargar();
})();
</script>
<script src="assets/alertas.js" defer></script>
</body>
