<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0818">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Modo Cachimbo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="assets/app.js" defer></script>
<title>Biblioteca · Modo Cachimbo</title>
<!--
  Biblioteca: libros en PDF que viven en el Google Drive de Modo Cachimbo.
  - La lista sale de supabase/42-biblioteca.sql (el panel → Biblioteca guarda el id de Drive).
  - El visor es propio (PDF.js): baja el PDF con la API de Google Drive (MC_CONFIG.DRIVE_KEY),
    dibuja las páginas a medida que llegas a ellas y guarda en qué página te quedaste.
  - Si falta la clave o Drive no responde, abre la vista previa de Drive dentro de la página.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
  }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: Nunito, sans-serif; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 22px 16px 60px; }

  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); text-decoration: none; font-weight: 800; font-size: 14px; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }
  .cab { display: flex; align-items: center; gap: 14px; margin: 16px 0 18px; }
  .cab .ic { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; background: rgba(206,130,255,.14); color: #CE82FF; }
  .cab .ic svg { width: 28px; height: 28px; }
  .cab h1 { font: 1000 clamp(26px, 6vw, 34px)/1.05 Nunito, sans-serif; }
  .cab p { color: var(--text-dim); font-weight: 800; font-size: 14.5px; margin-top: 3px; }

  .buscar { position: relative; }
  .buscar svg { position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 19px; height: 19px; color: var(--text-faint); }
  .buscar input { width: 100%; padding: 15px 16px 15px 46px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: 800 15px Nunito, sans-serif; outline: none; }
  .buscar input:focus { border-color: #CE82FF; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 14px; border: 2px solid var(--border); border-bottom-width: 4px; background: var(--surface); font-weight: 900; font-size: 14px; cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip small { color: var(--text-faint); font-weight: 900; }
  .chip.on { background: #EEEAF7; color: #151127; border-color: #A99FC8; }

  .seguir { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px; border-radius: 20px; border: 2px solid var(--border); border-bottom-width: 5px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
  .seguir .mini { flex: none; width: 58px; }
  .seguir .tx { flex: 1; min-width: 0; }
  .seguir small { display: block; font-size: 11.5px; font-weight: 1000; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
  .seguir b { display: block; font-size: 17px; font-weight: 1000; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seguir span.pg { display: block; color: var(--text-dim); font-size: 13.5px; font-weight: 800; margin-top: 2px; }
  .seguir .bar { display: block; height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin-top: 7px; overflow: hidden; }
  .seguir .bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .seguir .ir { flex: none; padding: 11px 18px; border-radius: 14px; background: var(--accent); color: #1a1f00; font-weight: 1000; text-transform: uppercase; letter-spacing: .5px; font-size: 14px; box-shadow: 0 4px 0 #8fa300; }

  .grupos { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 34px; margin-top: 26px; }
  .grupo h2 { display: flex; align-items: center; gap: 10px; font: 1000 22px Nunito, sans-serif; margin-bottom: 12px; }
  .grupo h2 .gi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); }
  .grupo h2 .gi i { width: 20px; height: 20px; background: var(--c); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .grupo h2 small { color: var(--text-dim); font-size: 14.5px; font-weight: 800; }
  .libros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .libro { display: block; align-self: start; text-align: left; background: none; border: 0; cursor: pointer; min-width: 0; }
  .libro > b { display: block; font-size: 14.5px; font-weight: 1000; margin-top: 8px; line-height: 1.25; }
  .libro > small { display: block; color: var(--text-dim); font-size: 12.5px; font-weight: 800; margin-top: 2px; }
  .libro > .lp { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
  .libro > .lp i { display: block; height: 100%; background: var(--c); }

  /* Portada: se dibuja con el color del área y el ícono del curso */
  .tapa { position: relative; display: block; aspect-ratio: 5 / 7; border-radius: 6px 12px 12px 6px; overflow: hidden; padding: 14% 10% 0 14%;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 78%, #000));
    color: #0b0818; box-shadow: inset 6px 0 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.35); transition: transform .12s; }
  .libro:hover .tapa { transform: translateY(-3px); }
  .tapa b { display: block; font: 1000 clamp(11px, 1.45vw, 16px)/1.12 Nunito, sans-serif; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .tapa em { display: block; font: 900 clamp(9px, 1.1vw, 11.5px)/1.2 Nunito, sans-serif; font-style: normal; text-transform: uppercase; letter-spacing: .08em; opacity: .62; margin-top: 6px; }
  .tapa i.fi { position: absolute; right: -14%; bottom: 4%; width: 62%; aspect-ratio: 1; background: rgba(0,0,0,.2); -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; }
  .tapa u { position: absolute; left: 14%; bottom: 7%; text-decoration: none; font: 1000 clamp(7px, .8vw, 9px) Nunito, sans-serif; letter-spacing: .18em; opacity: .55; }
  .tapa.con-nuevo { padding-top: 24%; }
  .tapa .nuevo { position: absolute; right: 8px; top: 8px; padding: 3px 8px; border-radius: 8px; background: #0b0818; color: var(--c); font: 1000 9.5px Nunito, sans-serif; letter-spacing: .1em; }
  .mini .tapa { padding: 12% 8% 0 14%; border-radius: 4px 8px 8px 4px; }
  .mini .tapa b { font-size: 7px; }
  .mini .tapa em, .mini .tapa u { display: none; }

  .vacio { margin-top: 26px; padding: 26px 18px; border-radius: 20px; border: 2px dashed var(--border); text-align: center; color: var(--text-dim); font-weight: 800; line-height: 1.5; }
  .vacio b { display: block; color: var(--text); font-size: 18px; font-weight: 1000; margin-bottom: 4px; }

  @media (max-width: 760px) {
    .grupos { grid-template-columns: 1fr; gap: 24px; }
    .libros { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .tapa b { font-size: 11px; } .tapa em { font-size: 8px; } .tapa u { display: none; }
    .libro > b { font-size: 13px; } .libro > small { font-size: 11.5px; }
    .seguir { flex-wrap: wrap; } .seguir .ir { width: 100%; text-align: center; }
  }

  /* ---------- Visor ---------- */
  body.leyendo { overflow: hidden; }
  .visor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #2b2838; }
  .v-cab { display: flex; align-items: center; gap: 12px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); background: #0b0818; border-bottom: 1px solid #000; }
  .v-bt { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; border: 2px solid #2F284E; background: #151127; cursor: pointer; }
  .v-bt svg { width: 20px; height: 20px; }
  .v-bt.on { color: var(--accent); border-color: var(--accent); }
  .v-bt.on svg { fill: currentColor; }
  .v-tit { flex: 1; min-width: 0; }
  .v-tit b { display: block; font-weight: 1000; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-tit small { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-weight: 800; font-size: 13px; }
  .v-tit small i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .v-hojas { flex: 1; overflow: auto; padding: 18px 12px 110px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .v-hoja { position: relative; margin: 0 auto 14px; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.4); border-radius: 3px; }
  .v-hoja canvas { display: block; width: 100%; height: 100%; border-radius: 3px; }
  .v-hoja .marca { position: absolute; right: 14px; top: -4px; width: 22px; height: 30px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
  .v-barra { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 20px; background: rgba(11,8,24,.94); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .v-barra button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; }
  .v-barra button:hover { background: rgba(255,255,255,.07); }
  .v-barra button svg { width: 22px; height: 22px; }
  .v-barra .pg { width: auto; display: flex; align-items: baseline; gap: 5px; padding: 0 10px; font-weight: 1000; font-size: 16px; white-space: nowrap; }
  .v-barra .pg small { color: var(--text-dim); font-weight: 800; }
  .v-barra hr { width: 1px; height: 26px; border: 0; background: #2F284E; margin: 0 4px; }
  .v-carga { position: absolute; inset: 70px 0 0; display: grid; place-items: center; text-align: center; color: var(--text-dim); font-weight: 800; padding: 20px; }
  .v-carga .ring { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%; border: 4px solid #3A3260; border-top-color: var(--accent); animation: gira 1s linear infinite; }
  .v-carga .bar { width: 200px; height: 6px; border-radius: 6px; background: #3A3260; margin: 10px auto 0; overflow: hidden; }
  .v-carga .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .v-drive { flex: 1; width: 100%; border: 0; background: #2b2838; }
  .v-ir { position: absolute; left: 50%; bottom: 92px; translate: -50% 0; width: min(320px, calc(100% - 24px)); padding: 14px; border-radius: 18px; background: #151127; border: 2px solid #2F284E; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .v-ir label { display: block; font-weight: 900; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .v-ir .fila { display: flex; gap: 8px; }
  .v-ir input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 2px solid #2F284E; background: #0b0818; color: var(--text); font: 900 15px Nunito, sans-serif; }
  .v-ir .fila button { padding: 0 14px; border-radius: 12px; border: 0; background: var(--accent); color: #1a1f00; font-weight: 1000; cursor: pointer; }
  .v-ir .marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .v-ir .marcas button { padding: 6px 10px; border-radius: 10px; border: 2px solid #2F284E; background: none; font-weight: 900; font-size: 13px; cursor: pointer; }
  .v-ir .marcas p { color: var(--text-faint); font-size: 12.5px; font-weight: 700; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    .v-cab { gap: 8px; padding: 8px 10px; } .v-bt { width: 40px; height: 40px; border-radius: 12px; }
    .v-tit b { font-size: 15px; } .v-hojas { padding: 10px 6px 100px; }
    .v-barra button { width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<div class="wrap" id="lista">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Inicio</a>
  <div class="cab">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6"/></svg></span>
    <div><h1>Biblioteca</h1><p id="cuenta">Libros en PDF para estudiar</p></div>
  </div>
  <label class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar un libro o tema…" autocomplete="off"></label>
  <div class="chips" id="chips"></div>
  <div id="seguirC"></div>
  <div id="grupos"><div class="vacio">Cargando la biblioteca…</div></div>
</div>

<div class="visor" id="visor" hidden>
  <div class="v-cab">
    <button class="v-bt" type="button" id="vCerrar" aria-label="Volver a la biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="v-tit"><b id="vTit"></b><small><i></i><span id="vSub"></span></small></div>
    <button class="v-bt" type="button" id="vMarca" aria-label="Marcar esta página"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button>
    <button class="v-bt" type="button" id="vFull" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  </div>
  <div class="v-hojas" id="vHojas"></div>
  <div class="v-carga" id="vCarga"></div>
  <div class="v-ir" id="vIr" hidden>
    <label for="vIrN">Ir a la página</label>
    <div class="fila"><input id="vIrN" type="number" min="1" inputmode="numeric"><button type="button" id="vIrOk">Ir</button></div>
    <div class="marcas" id="vMarcas"></div>
  </div>
  <div class="v-barra" id="vBarra" hidden>
    <button type="button" id="vAnt" aria-label="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button type="button" class="pg" id="vPg" aria-label="Ir a una página">1 <small>/ 1</small></button>
    <button type="button" id="vSig" aria-label="Página siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    <hr>
    <button type="button" id="vMenos" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button type="button" id="vMas" aria-label="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div>

<script src="assets/mc-config.js"></script>
<script src="assets/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var CFG = window.MC_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  var COLOR = { 'ciencia-tecnologia': '#C6E000', matematica: '#1CB0F6', comunicacion: '#CE82FF', 'ciencias-sociales': '#FF9600' };
  var S = { libros: [], lectura: {}, cursos: {}, orden: [], filtro: '', q: '' };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function sinAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function leer(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var CLAVE_LEC = 'mc_biblioteca_lectura';

  function curso(id) { return S.cursos[id] || { nombre: id, area: '', icono: '' }; }
  function color(id) { return COLOR[curso(id).area] || '#C6E000'; }
  function ico(id) { var c = curso(id); return c.icono ? 'url(' + c.icono + ')' : 'none'; }
  function hace(iso) {
    var d = (Date.now() - new Date(iso)) / 864e5;
    return d < 1 ? 'hoy' : d < 2 ? 'ayer' : 'hace ' + Math.floor(d) + ' días';
  }

  /* ---------- Lista ---------- */
  function tapa(l) {
    var nuevo = Date.now() - new Date(l.creado) < 14 * 864e5 && !S.lectura[l.id];
    return '<span class="tapa' + (nuevo ? ' con-nuevo' : '') + '" style="--c:' + color(l.curso) + ';--ico:' + ico(l.curso) + '">' + (nuevo ? '<span class="nuevo">NUEVO</span>' : '') +
      '<b>' + esc(l.titulo) + '</b>' + (l.subtitulo ? '<em>' + esc(l.subtitulo) + '</em>' : '') + '<i class="fi"></i><u>MODO CACHIMBO</u></span>';
  }
  function libroHtml(l) {
    var r = S.lectura[l.id], p = r && l.paginas ? Math.min(1, r.pagina / l.paginas) : 0;
    return '<button class="libro" type="button" data-id="' + esc(l.id) + '" style="--c:' + color(l.curso) + '">' + tapa(l) +
      '<b>' + esc(l.titulo) + (l.subtitulo ? ' · ' + esc(l.subtitulo) : '') + '</b><small>' + (l.paginas ? l.paginas + ' págs' : 'PDF') + (r ? ' · vas en la ' + r.pagina : '') + '</small>' +
      (p ? '<span class="lp"><i style="width:' + Math.round(p * 100) + '%"></i></span>' : '') + '</button>';
  }
  function pintar() {
    var q = sinAcento(S.q);
    var lista = S.libros.filter(function (l) {
      if (S.filtro && l.curso !== S.filtro) return false;
      return !q || sinAcento(l.titulo + ' ' + (l.subtitulo || '') + ' ' + curso(l.curso).nombre).indexOf(q) >= 0;
    });
    // Cursos en el orden de assets/cursos.json
    var grupos = {}; lista.forEach(function (l) { (grupos[l.curso] = grupos[l.curso] || []).push(l); });
    var ids = Object.keys(grupos).sort(function (a, b) { return (S.orden.indexOf(a) + 1 || 99) - (S.orden.indexOf(b) + 1 || 99); });
    $('grupos').innerHTML = !S.libros.length ? '<div class="vacio"><b>Muy pronto</b>Estamos subiendo los primeros libros.</div>'
      : !lista.length ? '<div class="vacio"><b>No encontramos ese libro</b>Prueba con otra palabra o elige «Todos».</div>'
      : '<div class="grupos">' + ids.map(function (id) {
        var n = grupos[id].length;
        return '<section class="grupo" style="--c:' + color(id) + ';--ico:' + ico(id) + '"><h2><span class="gi"><i></i></span>' + esc(curso(id).nombre) + ' <small>' + n + (n === 1 ? ' libro' : ' libros') + '</small></h2>' +
          '<div class="libros">' + grupos[id].map(libroHtml).join('') + '</div></section>';
      }).join('') + '</div>';
    // Chips
    var porCurso = {}; S.libros.forEach(function (l) { porCurso[l.curso] = (porCurso[l.curso] || 0) + 1; });
    var cs = Object.keys(porCurso).sort(function (a, b) { return (S.orden.indexOf(a) + 1 || 99) - (S.orden.indexOf(b) + 1 || 99); });
    $('chips').hidden = cs.length < 2;
    $('chips').innerHTML = '<button class="chip' + (S.filtro ? '' : ' on') + '" type="button" data-f="">Todos <small>' + S.libros.length + '</small></button>' +
      cs.map(function (id) { return '<button class="chip' + (S.filtro === id ? ' on' : '') + '" type="button" data-f="' + id + '" style="--c:' + color(id) + '"><i></i>' + esc(curso(id).nombre) + ' <small>' + porCurso[id] + '</small></button>'; }).join('');
    $('cuenta').textContent = S.libros.length ? S.libros.length + (S.libros.length === 1 ? ' libro' : ' libros') + ' en PDF para estudiar' : 'Libros en PDF para estudiar';
    // Seguir leyendo: el último que abriste
    var ult = Object.keys(S.lectura).map(function (id) { return Object.assign({ id: id }, S.lectura[id]); })
      .filter(function (r) { return S.libros.some(function (l) { return l.id === r.id; }); })
      .sort(function (a, b) { return new Date(b.leido) - new Date(a.leido); })[0];
    var l = ult && S.libros.filter(function (x) { return x.id === ult.id; })[0];
    $('seguirC').innerHTML = l && !S.q && !S.filtro ? '<button class="seguir" type="button" data-id="' + esc(l.id) + '" style="--c:' + color(l.curso) + '"><span class="mini">' + tapa(l) + '</span>' +
      '<span class="tx"><small>Seguir leyendo</small><b>' + esc(l.titulo) + (l.subtitulo ? ' · ' + esc(l.subtitulo) : ' · ' + esc(curso(l.curso).nombre)) + '</b><span class="pg">Página ' + ult.pagina + (l.paginas ? ' de ' + l.paginas : '') + ' · ' + hace(ult.leido) + '</span>' +
      (l.paginas ? '<span class="bar"><i style="width:' + Math.round(Math.min(1, ult.pagina / l.paginas) * 100) + '%"></i></span>' : '') + '</span><span class="ir">Seguir</span></button>' : '';
  }
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { S.filtro = b.dataset.f; pintar(); } });
  $('q').addEventListener('input', function () { S.q = this.value.trim(); pintar(); });
  document.addEventListener('click', function (e) { var b = e.target.closest('#lista [data-id]'); if (b) abrir(b.dataset.id); });

  function cargar() {
    S.lectura = leer(CLAVE_LEC) || {};
    var reg = fetch('assets/cursos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
      (d.cursos || []).forEach(function (c) { S.cursos[c.id] = { nombre: c.nombre, area: c.area, icono: c.icono || '' }; S.orden.push(c.id); });
    }).catch(function () {});
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario();
      return Promise.all([reg,
        c.from('biblioteca_libro').select('id,titulo,subtitulo,curso,drive,paginas,orden,creado').eq('visible', true).order('orden').order('creado'),
        u ? c.from('biblioteca_lectura').select('libro,pagina,marcas,leido').eq('usuario', u.id) : Promise.resolve({ data: [] })
      ]);
    }).then(function (r) {
      if (r[1].error) throw r[1].error;
      S.libros = r[1].data || [];
      (r[2].data || []).forEach(function (x) {
        var loc = S.lectura[x.libro];
        if (!loc || new Date(x.leido) > new Date(loc.leido)) S.lectura[x.libro] = { pagina: x.pagina, marcas: x.marcas || [], leido: x.leido };
      });
      guardar(CLAVE_LEC, S.lectura);
      pintar();
      var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true);
    }).catch(function () {
      $('grupos').innerHTML = '<div class="vacio"><b>No se pudo cargar la biblioteca</b>Revisa tu internet y vuelve a intentarlo.</div>';
    });
  }

  /* ---------- Visor ---------- */
  var V = null;
  function abrir(id, sinHistorial) {
    var l = S.libros.filter(function (x) { return x.id === id; })[0]; if (!l) return;
    cerrarVisor(true);
    var r = S.lectura[id] || { pagina: 1, marcas: [] };
    V = { libro: l, pdf: null, zoom: 1, pagina: r.pagina || 1, marcas: (r.marcas || []).slice(), hojas: [], obs: null, guardo: null, tarea: null };
    if (!sinHistorial) history.pushState({ libro: id }, '', '#libro=' + encodeURIComponent(id));
    $('visor').style.setProperty('--c', color(l.curso));
    $('vTit').textContent = l.titulo + (l.subtitulo ? ' · ' + l.subtitulo : '');
    $('vSub').textContent = curso(l.curso).nombre + (l.paginas ? ' · ' + l.paginas + ' págs' : '');
    $('visor').hidden = false; document.body.classList.add('leyendo');
    $('vHojas').innerHTML = ''; $('vHojas').hidden = false; $('vBarra').hidden = true; $('vIr').hidden = true; $('vMarca').hidden = false;
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    $('vCarga').hidden = false;
    $('vCarga').innerHTML = '<div><div class="ring"></div>Abriendo el libro…<div class="bar"><i id="vCargaBar"></i></div></div>';
    if (!CFG.DRIVE_KEY || !window.pdfjsLib) { vistaDrive(); return; }
    var url = 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(l.drive) + '?alt=media&key=' + encodeURIComponent(CFG.DRIVE_KEY);
    var t = pdfjsLib.getDocument({ url: url, disableAutoFetch: true, disableStream: false, rangeChunkSize: 262144, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' });
    V.tarea = t;
    var este = V;
    t.onProgress = function (p) { var b = $('vCargaBar'); if (b && p.total) b.style.width = Math.round(p.loaded / p.total * 100) + '%'; };
    t.promise.then(function (pdf) {
      if (V !== este) return;
      V.pdf = pdf;
      return pdf.getPage(1).then(function (p1) { if (V !== este) return; V.base = p1.getViewport({ scale: 1 }); armar(); });
    }).catch(function (e) { if (V === este) vistaDrive(); });
  }
  // Si no hay clave o Drive no deja bajarlo: su vista previa, dentro de la página
  function vistaDrive() {
    $('vCarga').hidden = true; $('vHojas').hidden = true; $('vBarra').hidden = true; $('vMarca').hidden = true;
    var f = document.createElement('iframe');
    f.className = 'v-drive'; f.allow = 'fullscreen'; f.title = V.libro.titulo;
    f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(V.libro.drive) + '/preview';
    $('vHojas').after(f);
    marcarLeido(1);
  }
  function ancho() { return Math.min($('vHojas').clientWidth - (innerWidth < 560 ? 12 : 24), 900) * V.zoom; }
  function armar() {
    var n = V.pdf.numPages, w = ancho(), h = w * V.base.height / V.base.width, caja = $('vHojas');
    $('vCarga').hidden = true; $('vBarra').hidden = false;
    caja.innerHTML = '';
    V.hojas = [];
    for (var i = 1; i <= n; i++) {
      var d = document.createElement('div'); d.className = 'v-hoja'; d.dataset.n = i;
      d.style.width = w + 'px'; d.style.height = h + 'px';
      caja.appendChild(d); V.hojas.push(d);
    }
    if (V.obs) V.obs.disconnect();
    // Se dibujan solo las páginas que se están viendo (y las de al lado)
    V.obs = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) dibujar(+e.target.dataset.n); });
    }, { root: caja, rootMargin: '600px 0px' });
    V.hojas.forEach(function (d) { V.obs.observe(d); });
    pintarMarcas();
    ir(Math.min(V.pagina, n), true);
    if (V.libro.paginas !== n) V.libro.paginas = n;
  }
  function dibujar(n) {
    var d = V.hojas[n - 1]; if (!d || d.dataset.zoom === String(V.zoom)) return;
    d.dataset.zoom = String(V.zoom);
    var este = V;
    V.pdf.getPage(n).then(function (p) {
      if (V !== este) return;
      var w = parseFloat(d.style.width), vp1 = p.getViewport({ scale: 1 }), esc = w / vp1.width, dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = p.getViewport({ scale: esc * dpr });
      d.style.height = (vp1.height * esc) + 'px';
      var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      return p.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
        var viejo = d.querySelector('canvas'); if (viejo) viejo.remove();
        d.prepend(c);
      });
    }).catch(function () { d.dataset.zoom = ''; });
  }
  function actual() {
    var caja = $('vHojas'), mitad = caja.scrollTop + caja.clientHeight * .35, n = 1;
    for (var i = 0; i < V.hojas.length; i++) { if (V.hojas[i].offsetTop <= mitad) n = i + 1; else break; }
    return n;
  }
  function ir(n, sinAnim) {
    n = Math.max(1, Math.min(V.hojas.length, n));
    var d = V.hojas[n - 1]; if (!d) return;
    $('vHojas').scrollTo({ top: d.offsetTop - 12, behavior: sinAnim ? 'auto' : 'smooth' });
    pagina(n);
  }
  function pagina(n) {
    if (!V) return;
    V.pagina = n;
    $('vPg').innerHTML = n + ' <small>/ ' + V.hojas.length + '</small>';
    $('vMarca').classList.toggle('on', V.marcas.indexOf(n) >= 0);
    clearTimeout(V.guardo); V.guardo = setTimeout(function () { marcarLeido(n); }, 1200);
  }
  $('vHojas').addEventListener('scroll', function () { if (V && V.hojas.length) { var n = actual(); if (n !== V.pagina) pagina(n); } }, { passive: true });

  // Dónde te quedaste: en este equipo al toque y en tu cuenta (supabase/42-biblioteca.sql)
  function marcarLeido(n) {
    if (!V) return;
    var id = V.libro.id, r = { pagina: n, marcas: V.marcas.slice(), leido: new Date().toISOString() };
    S.lectura[id] = r; guardar(CLAVE_LEC, S.lectura);
    MCAuth.listo.then(function (c) {
      var u = MCAuth.usuario(); if (!u) return;
      return c.from('biblioteca_lectura').upsert({ usuario: u.id, libro: id, pagina: n, marcas: r.marcas, leido: r.leido });
    }).catch(function () {});
  }
  function pintarMarcas() {
    if (!V) return;
    V.hojas.forEach(function (d, i) { var m = d.querySelector('.marca'), on = V.marcas.indexOf(i + 1) >= 0; if (on && !m) d.insertAdjacentHTML('beforeend', '<span class="marca"></span>'); if (!on && m) m.remove(); });
    $('vMarcas').innerHTML = V.marcas.length ? V.marcas.slice().sort(function (a, b) { return a - b; }).map(function (n) { return '<button type="button" data-ir="' + n + '">Pág. ' + n + '</button>'; }).join('')
      : '<p>Toca el marcador de arriba para guardar una página.</p>';
  }
  $('vMarca').addEventListener('click', function () {
    if (!V || !V.hojas.length) return;
    var i = V.marcas.indexOf(V.pagina);
    if (i >= 0) V.marcas.splice(i, 1); else V.marcas.push(V.pagina);
    pintarMarcas(); pagina(V.pagina); marcarLeido(V.pagina);
  });
  $('vAnt').addEventListener('click', function () { ir(V.pagina - 1); });
  $('vSig').addEventListener('click', function () { ir(V.pagina + 1); });
  function zoom(f) {
    var n = V.pagina; V.zoom = Math.max(.6, Math.min(2.6, Math.round(V.zoom * f * 10) / 10));
    var w = ancho();
    V.hojas.forEach(function (d) { var k = w / parseFloat(d.style.width); d.style.width = w + 'px'; d.style.height = parseFloat(d.style.height) * k + 'px'; d.dataset.zoom = ''; });
    ir(n, true);
    V.hojas.forEach(function (d) { V.obs.unobserve(d); V.obs.observe(d); });
  }
  $('vMas').addEventListener('click', function () { zoom(1.25); });
  $('vMenos').addEventListener('click', function () { zoom(.8); });
  $('vPg').addEventListener('click', function () { $('vIr').hidden = !$('vIr').hidden; if (!$('vIr').hidden) { $('vIrN').value = V.pagina; $('vIrN').max = V.hojas.length; $('vIrN').select(); } });
  function irA() { var n = parseInt($('vIrN').value, 10); if (n) { ir(n); $('vIr').hidden = true; } }
  $('vIrOk').addEventListener('click', irA);
  $('vIrN').addEventListener('keydown', function (e) { if (e.key === 'Enter') irA(); });
  $('vMarcas').addEventListener('click', function (e) { var b = e.target.closest('[data-ir]'); if (b) { ir(+b.dataset.ir); $('vIr').hidden = true; } });
  $('vFull').addEventListener('click', function () {
    var v = $('visor');
    if (document.fullscreenElement) document.exitFullscreen(); else if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  });
  document.addEventListener('keydown', function (e) {
    if (!V || $('visor').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { ir(V.pagina + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { ir(V.pagina - 1); e.preventDefault(); }
    if (e.key === 'Escape' && !document.fullscreenElement) history.back();
  });
  var redim; addEventListener('resize', function () { if (!V || !V.hojas.length) return; clearTimeout(redim); redim = setTimeout(function () { zoom(1); }, 250); });

  function cerrarVisor(sinPintar) {
    if (!V) return;
    if (V.hojas.length) marcarLeido(V.pagina);
    clearTimeout(V.guardo);
    if (V.obs) V.obs.disconnect();
    if (V.tarea) V.tarea.destroy();
    V = null;
    $('visor').hidden = true; document.body.classList.remove('leyendo');
    $('vHojas').innerHTML = '';
    var dr = $('visor').querySelector('.v-drive'); if (dr) dr.remove();
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    if (!sinPintar) pintar();
  }
  $('vCerrar').addEventListener('click', function () { if (history.state && history.state.libro) history.back(); else { cerrarVisor(); history.replaceState(null, '', location.pathname); } });
  addEventListener('popstate', function () { var h = location.hash.match(/^#libro=(.+)$/); if (h) abrir(decodeURIComponent(h[1]), true); else cerrarVisor(); });
  addEventListener('pagehide', function () { if (V && V.hojas.length) marcarLeido(V.pagina); });

  cargar();
})();
</script>
<script src="assets/alertas.js" defer></script>
