<html lang="es">
<head>

<title>Clanes · Modo Cachimbo</title>
<link rel="stylesheet" href="assets/buho/buho.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800;1,900&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0818; --surface: #151127; --surface-2: #1D1834; --border: #2A2346; --borde: #2C2549;
    --accent: #C6E000; --text: #EEEAF7; --text-dim: #A99FC8; --text-faint: #6F6690;
    --oro: #FFC800; --rojo: #FF4B4B; --azul: #1CB0F6; --nar: #FF9600; --ok: #58CC02;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; min-height: 100vh; }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 60px; }
  @media (min-width: 900px) { .wrap { padding: 0 32px 60px; } }
  header.top { display: flex; align-items: center; gap: 14px; padding: 22px 0 18px; }
  header.top h1 { flex: 1; display: flex; align-items: center; gap: 18px; min-width: 0; font: italic 900 46px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; color: var(--accent); padding-top: 4px; text-shadow: 0 3px 0 rgba(0,0,0,.45); white-space: nowrap; }
  header.top h1::after { content: ""; flex: 1; height: 2px; min-width: 20px; background: linear-gradient(90deg, rgba(198,224,0,.45), rgba(198,224,0,0)); }
  .top-tarj { flex: none; }
  @media (max-width: 700px) {
    header.top { gap: 10px; padding: 16px 0 14px; }
    header.top h1 { font-size: 32px; gap: 10px; }
    .top-tarj { display: none !important; }
  }
  .c-volver { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 46px; padding: 0 16px 0 10px; border-radius: 10px; background: var(--surface-2); border: 2px solid #352E58; border-bottom-width: 5px; color: var(--text); font-weight: 900; font-size: 15px; text-decoration: none; transform: skewX(-10deg); }
  .c-volver > * { transform: skewX(10deg); }
  .c-volver svg { display: block; flex: none; width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
  .c-volver:hover { border-color: var(--accent); color: var(--accent); }
  .estado { color: var(--text-dim); text-align: center; padding: 40px 10px; }
  .d { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .panel { background: var(--surface); border: 2px solid var(--borde); border-bottom-width: 5px; border-radius: 22px; padding: 22px; }
  .vacio { text-align: center; padding: 50px 24px; }
  .vacio h1 { font: italic 900 30px/1 var(--display); text-transform: uppercase; margin-bottom: 10px; }
  .vacio p { color: var(--text-dim); font-size: 14px; line-height: 1.6; max-width: 420px; margin: 0 auto 20px; }

  /* Botones */
  .cb { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 46px; padding: 0 18px; border-radius: 12px; font: italic 900 19px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; cursor: pointer; border: 0; border-bottom: 4px solid rgba(0,0,0,.35); text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .cb:active { transform: translateY(2px); border-bottom-width: 2px; }
  .cb:disabled { opacity: .55; cursor: default; }
  .cb.l { background: linear-gradient(180deg, #e2f75a, #C6E000); color: #14101f; }
  .cb.g { background: #241d44; color: #fff; border: 2px solid #352E58; border-bottom-width: 4px; }
  .cb.r { background: #3a1528; color: #ff9a9a; border: 2px solid #5a2338; border-bottom-width: 4px; }
  .cb.w { width: 100%; }
  .cb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  /* Tarjetas */
  .card { background: linear-gradient(180deg, #1b1533, #141027); border: 1.5px solid #2a2346; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .h2 { font: italic 900 24px/1 var(--display); text-transform: uppercase; color: #fff; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .h2 em { font-style: normal; color: var(--text-dim); font-size: 18px; }
  .h2 .sp { flex: 1; }
  .h2 .lado { font: 800 13px Nunito, sans-serif; color: var(--text-dim); text-transform: none; font-style: normal; }
  .small { font-size: 12.5px; color: var(--text-dim); }

  /* Menú (como Amigos) */
  .cl-lay { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start; }
  .cl-rail { position: sticky; top: 16px; display: grid; gap: 10px; }
  .cl-rail .r { position: relative; display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 16px; border-radius: 10px; cursor: pointer; width: 100%; text-align: left;
    background: linear-gradient(180deg, #1f1938, #15112a); border: 2px solid #2f2852; border-bottom-width: 5px; color: #d9d3ef; font: italic 900 21px/1 var(--display); text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
  .cl-rail .r:hover { border-color: #4a3f78; color: #fff; }
  .cl-rail .r svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .cl-rail .r.on { background: linear-gradient(180deg, #e2f75a, #C6E000); border-color: #8fa300; color: #14101f; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .cl-rail .mi { margin-top: 10px; padding: 12px 14px; border-radius: 14px; border: 2px dashed #352E58; color: var(--text-dim); font-size: 12.5px; }
  .cl-rail .mi b { display: block; color: var(--accent); font: 900 26px/1.1 Nunito, sans-serif; letter-spacing: .22em; margin: 4px 0 10px; }
  .cl-rail .mi .cb { height: 36px; font-size: 15px; width: 100%; }
  @media (max-width: 899px) {
    .cl-lay { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .cl-rail { position: static; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
    .cl-rail .r { height: 50px; padding: 0 8px; justify-content: center; font-size: 18px; gap: 6px; }
    .cl-rail .mi { display: none; }
  }
  @media (max-width: 420px) { .cl-rail .r { font-size: 16px; } .cl-rail .r svg { width: 18px; height: 18px; } }

  /* Escudo */
  .esc { display: block; flex: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); }
  .esc svg { display: block; width: 100%; height: 100%; }

  /* Héroe del clan */
  .hero { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; border: 2px solid #3a2f6b; margin-bottom: 12px;
    background: radial-gradient(120% 90% at 15% 0%, #2a1f63 0%, #160f36 55%, #0f0b22 100%); }
  .hero::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background-image: radial-gradient(1.2px 1.2px at 12% 20%, #fff, transparent), radial-gradient(1px 1px at 70% 30%, #fff, transparent), radial-gradient(1.4px 1.4px at 85% 75%, #fff, transparent), radial-gradient(1px 1px at 40% 85%, #fff, transparent), radial-gradient(1px 1px at 55% 12%, #fff, transparent), radial-gradient(1.2px 1.2px at 25% 60%, #fff, transparent); }
  .hero .row { position: relative; display: flex; gap: 14px; align-items: center; padding-right: 54px; }
  .hero .esc { width: 92px; height: 104px; }
  .hero .nm { font: italic 900 34px/.95 var(--display); text-transform: uppercase; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.5); overflow-wrap: anywhere; }
  .tag { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 4px 9px; border-radius: 8px; background: rgba(198,224,0,.14); border: 1px solid rgba(198,224,0,.4); color: var(--accent); font: 900 12px/1 Nunito, sans-serif; letter-spacing: .08em; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: #d9d3ef; }
  .hero .meta b { color: #fff; font-weight: 900; }
  .hero .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .hero .meta svg { width: 16px; height: 16px; }
  .nivel { position: absolute; right: 14px; top: 14px; text-align: center; z-index: 1; }
  .nivel .n { width: 46px; height: 50px; display: grid; place-items: center; font: italic 900 22px/1 var(--display); color: #14101f; background: var(--oro); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .nivel small { display: block; font: 900 10px/1 Nunito, sans-serif; color: var(--oro); margin-top: 3px; letter-spacing: .08em; }
  @media (min-width: 900px) { .hero .esc { width: 120px; height: 136px; } .hero .nm { font-size: 46px; } }

  /* Meta semanal */
  .bar { height: 22px; border-radius: 12px; background: #0f0b1e; border: 2px solid #352E58; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #8fa300, #C6E000); border-radius: 10px; box-shadow: 0 0 16px rgba(198,224,0,.4); min-width: 4px; }
  .bar i::after { content: ""; position: absolute; inset: 3px 6px auto; height: 5px; border-radius: 9px; background: rgba(255,255,255,.35); }
  .bar b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 12px/1 Nunito, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
  .meta-lr { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
  .meta-ok { color: var(--accent); font-weight: 900; font-size: 13px; }

  /* Hoy estudiaron */
  .hoy { display: flex; gap: 6px; flex-wrap: wrap; }
  .hoy .p { position: relative; display: block; padding-bottom: 6px; }
  .hoy .p .ft { width: 40px; height: 40px; pointer-events: none; }
  .hoy .p .mcj-nv, .hoy .p .mcj-pin { display: none !important; }
  .hoy .p::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 18px; height: 4px; margin-left: -9px; border-radius: 3px; background: var(--ok); }
  .hoy .p.no { filter: grayscale(1) brightness(.5); }
  .hoy .p.no::after { background: #3a3360; }

  /* Miembros */
  .mbs { display: grid; gap: 6px; }
  .mb { display: grid; grid-template-columns: 24px auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: #120e24; border: 1px solid #2a2346; position: relative; }
  .mb.yo { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mb .pos { font: italic 900 20px/1 var(--display); color: var(--text-dim); text-align: center; }
  .mb .ft { width: 46px; height: 46px; }
  .mb .nm { font: italic 900 19px/1.05 var(--display); text-transform: uppercase; color: #fff; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .mb .nm span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rol { font: 900 9.5px/1 Nunito, sans-serif; letter-spacing: .08em; padding: 3px 6px; border-radius: 6px; font-style: normal; display: inline-flex; align-items: center; gap: 3px; flex: none; }
  .rol.lider { background: var(--oro); color: #3a2a00; }
  .rol.sub { background: #CE82FF; color: #2a0f40; }
  .rol svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linejoin: round; }
  .mb .s2 { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 4px 8px; margin-top: 4px; flex-wrap: wrap; white-space: nowrap; }
  .mb .s2 .hoyok { color: #7fe03a; font-weight: 900; }
  .fl { display: inline-flex; align-items: center; gap: 2px; color: var(--nar); font-weight: 900; }
  .fl svg { width: 13px; height: 13px; }
  .xp { display: flex; align-items: center; gap: 5px; font: 900 15px/1 Nunito, sans-serif; color: #fff; white-space: nowrap; }
  .xp svg { width: 20px; height: 20px; }
  .mb .der { display: flex; align-items: center; gap: 6px; }
  .mas { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid #352E58; background: #1D1834; color: var(--text-dim); display: grid; place-items: center; cursor: pointer; }
  .mas svg { width: 18px; height: 18px; fill: currentColor; }
  .acc { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
  .acc button { height: 34px; padding: 0 12px; border-radius: 9px; border: 1.5px solid #352E58; background: #241d44; color: #d9d3ef; font: 800 13px Nunito, sans-serif; cursor: pointer; }
  .acc button.rj { color: #ff9a9a; border-color: #5a2338; background: #2a1222; }
  .acc button.seguro { background: var(--rojo); color: #fff; border-color: #a71d1d; }

  /* Invitar */
  .inv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .inv .cod { font: 900 30px/1 Nunito, sans-serif; letter-spacing: .25em; color: var(--accent); }
  .inv .sp { flex: 1; }
  .inv .cb { height: 40px; font-size: 16px; padding: 0 12px; }
  .cb.wa { background: #22C55E; color: #fff; }

  /* Top */
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .cuenta { display: flex; align-items: center; justify-content: center; gap: 6px; font: 900 12px/1 Nunito, sans-serif; color: var(--text-dim); margin-bottom: 10px; }
  .cuenta svg { width: 15px; height: 15px; }
  .pod { display: grid; grid-template-columns: 1fr 1.15fr 1fr; align-items: end; gap: 8px; margin: 6px 0 14px; max-width: 560px; margin-inline: auto; }
  .pod .c { text-align: center; min-width: 0; }
  .pod .c .esc { width: 70px; height: 80px; margin: 0 auto; }
  .pod .c.p1 .esc { width: 88px; height: 100px; }
  .pod .c .d { font-size: 17px; line-height: 1; margin-top: 4px; color: #fff; overflow-wrap: anywhere; }
  .pod .c .x { font: 900 12px/1 Nunito, sans-serif; color: var(--text-dim); margin-top: 3px; }
  .pod .c .tu { font: 900 11px/1 Nunito, sans-serif; color: var(--accent); margin-bottom: 3px; letter-spacing: .06em; }
  .pod .ped { margin-top: 8px; border-radius: 10px 10px 0 0; display: grid; place-items: center; font: italic 900 28px/1 var(--display); color: #14101f; }
  .pod .p1 .ped { height: 74px; background: linear-gradient(180deg, #ffe066, #FFC800); }
  .pod .p2 .ped { height: 54px; background: linear-gradient(180deg, #eef0f6, #b9bfd0); }
  .pod .p3 .ped { height: 42px; background: linear-gradient(180deg, #f0b27a, #c47a3c); }
  .pod .vac .ped { background: #1D1834 !important; color: #3a3360; }
  .copa { width: 34px; height: 34px; margin: 0 auto -4px; display: block; }
  .lt { display: grid; grid-template-columns: 28px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; background: #120e24; border: 1px solid #2a2346; margin-bottom: 6px; }
  .lt .esc { width: 36px; height: 41px; }
  .lt .pos { font: italic 900 20px/1 var(--display); color: var(--text-dim); text-align: center; }
  .lt .d { font-size: 18px; color: #fff; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lt.mio { border-color: var(--accent); background: linear-gradient(90deg, rgba(198,224,0,.12), #120e24); }
  .lt .small { margin-top: 2px; }
  .sep { text-align: center; color: var(--text-dim); margin: 2px 0 6px; letter-spacing: .3em; }
  .nota { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #d9d3ef; }
  .nota svg { flex: none; }

  /* Crear / unirse */
  .campo { margin-bottom: 14px; }
  .campo label, .campo .lb { display: block; font: 900 11.5px/1 Nunito, sans-serif; letter-spacing: .1em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 7px; }
  .inp { width: 100%; height: 46px; border-radius: 12px; background: #0f0b1e; border: 2px solid #352E58; padding: 0 12px; color: #fff; font: 800 16px Nunito, sans-serif; outline: none; }
  .inp:focus { border-color: var(--accent); }
  .inp.code { font: 900 26px/1 Nunito, sans-serif; letter-spacing: .3em; text-align: center; color: var(--accent); text-transform: uppercase; }
  .inp.tag { text-transform: uppercase; letter-spacing: .1em; }
  .fila2 { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; }
  .picks { display: flex; gap: 8px; flex-wrap: wrap; }
  .pk { width: 54px; height: 58px; border-radius: 12px; background: #120e24; border: 2px solid #352E58; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .pk.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(198,224,0,.35); }
  .pk .esc { width: 38px; height: 44px; filter: none; }
  .pk > svg { width: 28px; height: 28px; }
  .col-pk { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
  .col-pk.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .prev { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 2px dashed #352E58; margin-bottom: 14px; }
  .prev .esc { width: 70px; height: 80px; }
  .prev .d { font-size: 26px; line-height: 1; color: #fff; overflow-wrap: anywhere; }
  .o { display: flex; align-items: center; gap: 8px; margin: 16px 0; color: var(--text-dim); font: 900 12px Nunito, sans-serif; letter-spacing: .1em; }
  .o::before, .o::after { content: ""; flex: 1; height: 1.5px; background: #352E58; }
  .err { color: #ff8a8a; font-size: 13px; margin-top: 8px; min-height: 1em; }
  .aviso { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #5a3a10; background: rgba(255,150,0,.08); margin-bottom: 12px; font-size: 13.5px; }
  .aviso svg { color: var(--nar); width: 22px; height: 22px; }
  .vista { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: #120e24; border: 1.5px solid var(--accent); margin-top: 10px; }
  .vista .esc { width: 58px; height: 66px; }
  .vista .d { font-size: 22px; color: #fff; line-height: 1; }
  .dos { display: grid; gap: 12px; }
  @media (min-width: 900px) { .dos { grid-template-columns: 1fr 1fr; align-items: start; } }
  /* Parte 2: muro, guerra, oficiales */
  .cl-rail .r .vivo { width: 9px; height: 9px; border-radius: 50%; background: var(--rojo); box-shadow: 0 0 0 3px rgba(255,75,75,.25); margin-left: auto; flex: none; }
  @media (max-width: 899px) { .cl-rail .r .vivo { position: absolute; top: 6px; right: 6px; margin: 0; } }
  @media (max-width: 480px) { .cl-rail .r { font-size: 15px; gap: 4px; padding: 0 4px; } .cl-rail .r svg { width: 16px; height: 16px; } }
  .ofi { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; color: var(--azul); font: 900 11px/1 Nunito, sans-serif; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; }
  .ofi svg { width: 15px; height: 15px; }
  .ofc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #120e24; border: 1px solid #2a2346; margin-bottom: 6px; }
  .ofc .esc { width: 38px; height: 44px; }
  .ofc .d { font-size: 18px; color: #fff; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ofc .ofi { margin-top: 3px; }
  .muro { display: grid; gap: 7px; margin-top: 12px; }
  .ev { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: #120e24; border: 1px solid #2a2346; }
  .ev .ft { width: 40px; height: 40px; flex: none; }
  .ev .mcj-nv, .ev .mcj-pin { display: none !important; }
  .ev .t { flex: 1; min-width: 0; font-size: 13px; color: #d9d3ef; }
  .ev .t b { color: #fff; }
  .ev .t small { display: block; color: var(--text-dim); font-size: 11.5px; margin-top: 1px; }
  .ev .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .ev .ic.ok { background: rgba(198,224,0,.15); color: var(--accent); }
  .ev .ic.na { background: rgba(255,150,0,.15); }

  // Cuenta regresiva de las guerras
  function relojes() {

        var ms = Math.max(0, new Date(el.getAttribute('data-reloj')) - Date.now()), d = Math.floor(ms / 864e5), hh = Math.floor(ms / 36e5) % 24, mm = Math.floor(ms / 6e4) % 60, ss = Math.floor(ms / 1e3) % 60;

    return '<div class="dos">' + h + '</div>';
  }

  /* ---------- Pintar ---------- */
  function pintar() {
    var cuerpo = vista === 'top' ? top() : !D.clan ? sinClan() : vista === 'ajustes' ? ajustes() : vista === 'guerra' ? guerraVista() : miClan();
    var clave = vista + !!D.clan + (vista === 'guerra' ? !!G : ''); app.classList.toggle('quieto', pintar.ult === clave); pintar.ult = clave;
    app.innerHTML = '<div class="cl-lay">' + rail() + '<div>' + cuerpo + '</div></div>';
    relojes();
  }
  function cargar() {
    return K.rpc('mi_clan').then(function (d) {
      D = d || { clan: null };
      if (D.clan) { F = { nombre: D.clan.nombre, tag: D.clan.tag, forma: D.clan.forma, simbolo: D.clan.simbolo, color: D.clan.color }; }
      pintar();
    });
  }
  function refrescar() { K.olvidar(); TOP = null; G = null; RIV = null; seguro = ''; abierto = null; return cargar(); }

  function leerForm() {
    var n = document.getElementById('fNom'), t = document.getElementById('fTag');
    if (n) F.nombre = n.value; if (t) F.tag = t.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  }
  function errForm(m) { var e = document.getElementById('fErr'); if (e) e.textContent = m; }
  function buscarCodigo(cod) {
    previaCod = cod; previa = null;
    if (cod.length < 4) { var p = document.getElementById('cPrev'); if (p) p.innerHTML = ''; return; }
    K.rpc('clan_por_codigo', { p_codigo: cod }).then(function (c) {
      if (previaCod !== cod) return;
      previa = c || false;
      var p = document.getElementById('cPrev'); if (p) p.innerHTML = c ? vistaPrevia(c) : '<p class="err">No hay ningún clan con ese código.</p>';
    }, function (e) { var x = document.getElementById('cErr'); if (x) x.textContent = K.error(e); });
  }

  app.addEventListener('input', function (e) {
    if (e.target.id === 'cCod') { var v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); e.target.value = v; buscarCodigo(v); return; }
    if (e.target.id === 'fNom' || e.target.id === 'fTag') {
      leerForm();
      if (e.target.id === 'fTag') e.target.value = F.tag;
      document.getElementById('pvNom').textContent = F.nombre || 'Tu clan';
      document.getElementById('pvTag').textContent = '#' + (F.tag || 'TAG');
    }
  });
  app.addEventListener('click', function (e) {
    var el;
    if ((el = e.target.closest('[data-vista]'))) { vista = el.getAttribute('data-vista'); seguro = ''; abierto = null; if (vista === 'top') TOP = null; if (vista === 'guerra') { G = null; RIV = null; } pintar(); return; }
    if ((el = e.target.closest('[data-forma],[data-simbolo],[data-color]'))) {
      leerForm();
      if (el.dataset.forma) F.forma = el.dataset.forma; if (el.dataset.simbolo) F.simbolo = el.dataset.simbolo; if (el.dataset.color) F.color = el.dataset.color;
      pintar(); return;
    }
    if ((el = e.target.closest('[data-inv]'))) {
      var c = D.clan, l = enlace(c.codigo), txt = 'Únete a mi clan «' + c.nombre + '» en Modo Cachimbo. Código: ' + c.codigo + ' ' + l;
      if (el.dataset.inv === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
      else A.copiar(l, 'Enlace copiado');
      return;
    }
    if ((el = e.target.closest('[data-empujar]'))) {
      el.disabled = true; var ec = +el.dataset.empujar;
      K.rpc('clan_empujar', { p_jugador: ec }).then(function () {
        D.miembros.forEach(function (m) { if (m.codigo === ec) { m.empujado = true; m.empujones = (+m.empujones || 0) + 1; } });
        recien = ec; toast('¡Empujón enviado! Le saldrá un aviso en su clan'); pintar(); recien = 0;
      }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-horas]'))) { horasReto = +el.dataset.horas; pintar(); return; }
    if ((el = e.target.closest('[data-retar]'))) {
      el.disabled = true;
      K.rpc('clan_retar', { p_clan: +el.dataset.retar, p_horas: horasReto }).then(function () { toast('¡Reto enviado! Tienen 24 horas para aceptar'); vista = 'guerra'; refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; RIV = null; pintar(); });
      return;
    }
    if ((el = e.target.closest('[data-aceptar],[data-rechazar]'))) {
      var si = el.hasAttribute('data-aceptar'); el.disabled = true;
      K.rpc('clan_responder_reto', { p_guerra: +(el.dataset.aceptar || el.dataset.rechazar), p_aceptar: si }).then(function () { toast(si ? '¡Empezó la guerra!' : 'Reto rechazado'); vista = 'guerra'; refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-cancelar]'))) {
      el.disabled = true;
      K.rpc('clan_cancelar_reto', { p_guerra: +el.dataset.cancelar }).then(function () { toast('Reto cancelado'); vista = 'guerra'; refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-abrir]'))) { var cod = +el.dataset.abrir; abierto = abierto === cod ? null : cod; seguro = ''; pintar(); return; }
    if ((el = e.target.closest('[data-rol]'))) {
      var r = el.dataset.rol, jc = +el.closest('[data-cod]').dataset.cod;
      if (r === 'lider' && seguro !== 'lider') { seguro = 'lider'; pintar(); return; }
      el.disabled = true;
      K.rpc('clan_rol', { p_jugador: jc, p_rol: r }).then(function () { toast(r === 'lider' ? 'Ahora es el líder del clan' : r === 'sub' ? 'Ahora es sublíder' : 'Ya no es sublíder'); refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-sacar]'))) {
      if (seguro !== 'sacar') { seguro = 'sacar'; pintar(); return; }
      el.disabled = true;
      K.rpc('clan_expulsar', { p_jugador: +el.closest('[data-cod]').dataset.cod }).then(function () { toast('Lo sacaste del clan'); refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if (e.target.closest('[data-unirse]')) {
      el = e.target.closest('[data-unirse]'); el.disabled = true;
      K.rpc('clan_unirse', { p_codigo: previaCod }).then(function (r) { toast('¡Ya eres parte de ' + r.nombre + '!'); vista = 'clan'; history.replaceState(null, '', 'clanes.html'); refrescar(); },
        function (x) { el.disabled = false; var m = document.getElementById('cErr'); if (m) m.textContent = K.error(x); });
      return;
    }
    if ((el = e.target.closest('[data-crear],[data-guardar]'))) {
      leerForm();
      if (F.nombre.trim().length < 3) { errForm('Ponle un nombre de al menos 3 letras.'); return; }
      if (F.tag.length < 2) { errForm('Ponle una sigla de 2 a 5 letras.'); return; }
      el.disabled = true;
      var crear = el.hasAttribute('data-crear');
      K.rpc(crear ? 'clan_crear' : 'clan_editar', { p_nombre: F.nombre.trim(), p_tag: F.tag, p_forma: F.forma, p_simbolo: F.simbolo, p_color: F.color }).then(function () {
        toast(crear ? '¡Clan creado! Invita a tus compañeros' : 'Cambios guardados'); vista = 'clan'; refrescar();
      }, function (x) { el.disabled = false; errForm(K.error(x)); });
      return;
    }
    if ((el = e.target.closest('[data-nuevocod]'))) {
      el.disabled = true;
      K.rpc('clan_nuevo_codigo').then(function (c) { toast('Código nuevo: ' + c); refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
      return;
    }
    if ((el = e.target.closest('[data-salir]'))) {
      if (seguro !== 'salir') { seguro = 'salir'; pintar(); return; }
      el.disabled = true;
      K.rpc('clan_salir').then(function () { toast('Saliste del clan'); vista = 'clan'; F = { nombre: '', tag: '', forma: 'punta', simbolo: 'rayo', color: '#C6E000' }; refrescar(); }, function (x) { toast(K.error(x)); el.disabled = false; });
    }
  });

  /* ---------- Arranque ---------- */
  if (window.MCColeccion) MCColeccion.css();
  var empezado = false;
  function empezar(u) {
    if (!u || empezado) return;
    empezado = true;
    if (location.hash === '#top') vista = 'top'; else if (location.hash === '#guerra') vista = 'guerra';
    cargar().then(function () {
      if (UNIRSE && !D.clan) { previaCod = UNIRSE; pintar(); buscarCodigo(UNIRSE); }
      else if (UNIRSE && D.clan) toast('Ya estás en un clan');
    }, fallo);
  }
  MCAuth.listo.then(function () { empezar(MCAuth.usuario()); MCAuth.alCambiar(empezar); }, fallo);
})();
</script>
