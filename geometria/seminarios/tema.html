<title>Seminario · Geometría · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 60px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(5,5,5,0.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid #161616;
  }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .course-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .course-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  .page-head { padding: 30px 0 6px; }
  .page-head .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-head h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(24px, 5vw, 32px); margin-top: 8px; text-transform: lowercase; }
  .page-head p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }
  .page-head .credito { color: var(--accent); font-size: 12.5px; font-weight: 600; letter-spacing: .3px; margin-top: 6px; }

  .quiz-cta {
    margin: 22px 0 34px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .quiz-cta span { font-size: 13.5px; color: var(--text-dim); }
  .quiz-cta .cta-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .quiz-cta a.alt { background: transparent; color: var(--accent); border: 1px solid rgba(198,224,0,0.4); }
  .quiz-cta a {
    background: var(--accent); color: #0e0e0e; text-decoration: none;
    padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .qcard { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 16px; }
  .qcard .qnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
    margin-bottom: 14px;
  }
  .qcard .qtext { font-size: 14.5px; line-height: 1.7; color: #ececec; white-space: pre-line; margin-bottom: 16px; }

  .opt-row { display: flex; align-items: center; gap: 12px; padding: 10px 4px; font-size: 13.5px; color: var(--text-dim); border-top: 1px solid #1a1a1a; }
  .opt-row:first-of-type { border-top: none; }
  .opt-row .letter { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--text-dim); flex-shrink: 0; }
  .opt-row.correct { color: #f5ffcc; font-weight: 600; }
  .opt-row.correct .letter { background: var(--accent); color: #0e0e0e; }
  .opt-row.correct svg { margin-left: auto; width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }
  .q-graphic { margin: 4px 0 14px; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 12px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('mc:katex'))"></script>
<script src="../../assets/mc-config.js"></script>
<script src="../../assets/pregunta.js"></script>
<script src="../../assets/auth.js"></script>
<script src="../../assets/acceso.js"></script>
<script src="../../assets/candado.js" data-producto="seminario-geometria" data-nombre="Seminarios" data-curso="Geometría"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" id="backLink" href="temario.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="backLabel">Temario</span></a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
      </div>
      <div class="course-badge"><div class="dot"></div><span id="badgeYear">Geometría</span></div>
    </header>

    <div class="page-head">
      <div class="eyebrow" id="eyebrowTema">tema · modo estudio</div>
      <h1 id="temaTitle">Cargando…</h1>
      <p id="countLabel"></p>
      <p id="creditoLabel" class="credito" style="display:none"></p>
    </div>

    <div class="quiz-cta">
      <span>¿Ya las repasaste? Practícalas en modo quiz.</span>
      <div class="cta-btns">
        <a id="tarjetasLink" class="alt" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="7" y="3" width="14" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h11"/></svg> Flashcards</a>
        <a id="practicarLink" href="#">Practicar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>
    </div>

    <div id="qlist"></div>
  </div>

<script>
  function renderMath(el) {
    // KaTeX carga sin bloquear la página: si aún no llegó, se dibuja apenas llegue
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', () => renderMath(el), { once: true }); return; }
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }


  // Escapa HTML y convierte *texto* en cursiva (para nombres científicos, etc.)
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function formatQText(str) {
    let esc = escapeHtml(str);
    esc = esc.replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g, '<u>$1</u>');
    esc = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    esc = esc.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return esc;
  }

  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const temaNum = params.get('tema');
  const qlistEl = document.getElementById("qlist");

  document.getElementById('backLink').href = 'temario.html?year=' + encodeURIComponent(year || '');
  document.getElementById('backLabel').textContent = 'Temario ' + (year || '');

  if (!year || !temaNum) {
    qlistEl.innerHTML = '<div class="state-msg">Falta indicar año y tema. Vuelve al temario.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Geometría · ' + year;
    document.getElementById('practicarLink').href = `quiz.html?year=${encodeURIComponent(year)}&tema=${encodeURIComponent(temaNum)}`;
    // Flashcards de este tema (tarjetas.html, en la raíz): curso y sección salen de la ruta de esta página
    const rutaMc = location.pathname.split('/').filter(Boolean);
    document.getElementById('tarjetasLink').href = `../../tarjetas.html?curso=${encodeURIComponent(rutaMc[rutaMc.length - 3] || '')}&sec=${encodeURIComponent(rutaMc[rutaMc.length - 2] || '')}&year=${encodeURIComponent(year)}&tema=${encodeURIComponent(temaNum)}`;

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(temas => {
        const tema = temas.find(t => t.num === temaNum);
        if (!tema) throw new Error('tema no encontrado');

        document.getElementById('eyebrowTema').textContent = `tema ${tema.num} · modo estudio`;
        document.getElementById('temaTitle').textContent = tema.name;
        if (tema.credito) { const cr = document.getElementById('creditoLabel'); cr.textContent = 'Crédito: ' + tema.credito; cr.style.display = ''; }
        document.getElementById('countLabel').textContent = `${tema.questions.length} preguntas con respuesta marcada.`;

        if (window.MCPregunta && MCPregunta.rangos) MCPregunta.rangos(tema.questions);
        tema.questions.forEach((q, idx) => {
          const div = document.createElement('div');
          div.className = 'qcard';
          div.id = 'q' + (idx + 1);
          let optsHtml = '';
          q.options.forEach((o, i) => {
            const isCorrect = i === q.correct;
            optsHtml += `<div class="opt-row ${isCorrect ? 'correct' : ''}">
              <div class="letter">${o.letter}</div>
              <span>${formatQText(o.text)}</span>
              ${isCorrect ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
            </div>`;
          });
          // Imágenes en medio del texto, tablas y columnas: assets/pregunta.js
          const mcq = window.MCPregunta ? MCPregunta.armar(q.text, { lecPos: q.lecPos, lecSigue: q.lecSigue }) : { html: formatQText(q.text).replace(/\n/g,'<br>'), derecha: '' };
          const cortas = window.MCPregunta && !mcq.derecha && MCPregunta.cortas(q.options);
          optsHtml = `<div class="${cortas ? 'mcq-cortas' : ''}" style="${cortas ? 'gap:8px;' : ''}">${optsHtml}</div>`;
          if (mcq.derecha) optsHtml = `<div class="mcq-con-der">${optsHtml}<div class="mcq-der" style="margin:0;">${mcq.derecha}</div></div>`;
          div.innerHTML = `<div class="qnum">${idx + 1}</div><div class="qtext">${mcq.html}</div>${q.graphic ? `<div class="q-graphic">${q.graphic}</div>` : ''}${optsHtml}<div class="rep-row"><button class="rep-btn" type="button" data-idx="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg> ¿Error en la clave?</button></div>`;
          renderMath(div);
          qlistEl.appendChild(div);
        });

        window.MC_TEMA = { curso: 'Geometría', carpeta: 'geometria--seminarios', year: year, num: tema.num, name: tema.name, questions: tema.questions };
        document.dispatchEvent(new CustomEvent('mc:tema-listo'));
      })
      .catch(() => {
        qlistEl.innerHTML = '<div class="state-msg">No se pudo cargar este tema.</div>';
      });
  }
</script>
<script src="../../assets/mc-config.js"></script>
