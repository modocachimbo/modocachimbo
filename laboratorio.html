<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script src="assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06040F">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/app/icono-32.png">
<link rel="apple-touch-icon" href="assets/app/icono-180.png">
<title>Laboratorio · Modo Cachimbo</title>
<script src="assets/app.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Sora:wght@700;800&family=Lilita+One&display=swap">
<style>
:root{--bg:#06040F;--card:#151127;--card2:#1D1834;--borde:#2A2346;--lima:#C6E000;--lima-osc:#8fa300;--tx:#EEEAF7;--dim:#A99FC8;--faint:#6F6690;--oro:#FFC800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,#1A1040 0%,#08051A 55%,#06040F 100%) no-repeat #06040F;color:var(--tx);font:700 15px/1.45 "Nunito",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px 60px}
/* top */
.top{display:flex;align-items:center;gap:12px}
.bt{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(21,17,39,.8);border:1px solid var(--borde)}
.ttl small{display:block;font:800 12px/1 "Barlow Condensed";letter-spacing:.16em;text-transform:uppercase;color:var(--lima)}
.ttl b{display:block;font:800 26px/1.1 "Sora";letter-spacing:-.02em}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.xp{display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;border-radius:14px;background:rgba(21,17,39,.8);border:1px solid var(--borde);font:800 15px "Barlow Condensed";letter-spacing:.06em}
.xp i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--lima) 0 18%,#2A2346 0);display:grid;place-items:center;font-style:normal}
.xp i:after{content:"";width:14px;height:14px;border-radius:50%;background:#151127}
.son{color:var(--lima);border-color:rgba(198,224,0,.45)}
/* hero */
.hero .img.dos img{position:static;width:100%;transform:none;animation:none;filter:drop-shadow(0 24px 40px rgba(0,0,0,.6))}
.hero .dos a{position:absolute;display:block;transition:transform .25s}
.hero .dos a span{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:rgba(21,17,39,.82);border:1px solid rgba(255,255,255,.12);font:800 12px "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;color:var(--lima);white-space:nowrap}
.hero .dos .c-veg{right:-3%;top:12%;width:58%;transform:rotate(5deg);animation:flotaV 8s ease-in-out infinite}
.hero .dos .c-ani{left:-4%;bottom:6%;width:60%;transform:rotate(-5deg);animation:flotaA 7s ease-in-out infinite;z-index:2}
.hero .dos a:hover{z-index:3}
.hbts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn2{display:inline-flex;align-items:center;height:52px;padding:0 20px;border-radius:16px;border:1.5px solid rgba(198,224,0,.5);color:var(--lima);font:800 15px "Sora"}
.sim .art .dos-m{position:relative;width:100%;height:100%}
.sim .art .dos-m img{position:absolute;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.sim .art .dos-m .m-veg{width:58%;right:-3%;top:12%;transform:rotate(5deg)}
.sim .art .dos-m .m-ani{width:62%;left:-5%;bottom:2%;transform:rotate(-5deg)}

.hero{margin-top:20px;position:relative;border-radius:28px;overflow:hidden;min-height:330px;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;background:linear-gradient(135deg,#1B1240,#0D0926 60%);border:1px solid var(--borde)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 75% 50%,rgba(198,224,0,.16),transparent 70%)}
.hero .tx{position:relative;padding:34px 36px;z-index:2}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;font:800 12px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;background:rgba(198,224,0,.12);color:var(--lima);border:1px solid rgba(198,224,0,.35)}
.hero h1{margin:14px 0 8px;font:800 44px/1.02 "Sora";letter-spacing:-.03em}
.hero p{margin:0 0 20px;color:var(--dim);font-weight:700;max-width:430px}
.hero .meta{display:flex;gap:16px;margin-bottom:22px;color:var(--dim);font:800 13px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase}
.hero .meta b{color:var(--tx);font-size:18px;display:block;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:16px;background:var(--lima);color:#151A03;font:800 17px "Sora";box-shadow:0 5px 0 var(--lima-osc)}
.hero .img{position:relative;height:100%;min-height:330px}
.hero .img img{position:absolute;right:-30px;top:50%;width:118%;transform:translateY(-50%) rotate(-4deg);filter:drop-shadow(0 30px 50px rgba(0,0,0,.6));animation:flota 7s ease-in-out infinite}
@keyframes flotaA{50%{transform:translateY(-8px) rotate(-4deg)}}@keyframes flotaV{50%{transform:translateY(6px) rotate(6deg)}}
@keyframes flota{50%{transform:translateY(-53%) rotate(-3deg)}}
.prog{height:6px;border-radius:6px;background:#2A2346;overflow:hidden;max-width:330px;margin:-6px 0 22px}
.prog i{display:block;height:100%;width:57%;background:var(--lima);border-radius:6px}
/* cursos */
.cursos{display:flex;gap:8px;margin:26px 0 6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cursos::-webkit-scrollbar{display:none}
.cur{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:13px;background:rgba(21,17,39,.8);border:1px solid var(--borde);font:800 14px "Nunito";color:var(--dim)}
.cur i{width:9px;height:9px;border-radius:50%}
.cur.on{background:var(--lima);color:#151A03;border-color:var(--lima)}
.cur em{font:800 12px "Barlow Condensed";font-style:normal;opacity:.7}
/* secciones */
.sec{margin-top:26px}
.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:800 15px "Barlow Condensed";letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sec h2 i{width:10px;height:10px;border-radius:3px}
.sec h2 span{margin-left:auto;font-size:13px;color:var(--faint)}
.fila{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sim{position:relative;border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--borde);display:flex;flex-direction:column;transition:transform .2s}
.sim:hover{transform:translateY(-3px)}
.sim .art{position:relative;aspect-ratio:16/10;display:grid;place-items:center;background:radial-gradient(70% 80% at 50% 55%,var(--g,rgba(198,224,0,.18)),transparent 70%),#0E0A22;overflow:hidden}
.sim .art svg{width:62%;height:72%}
.sim .art svg.rico{width:100%;height:100%}
.sim .art img{width:112%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.sim .inf{padding:12px 14px 14px}
.sim b{display:block;font:800 16px/1.2 "Nunito"}
.sim small{display:block;color:var(--dim);font:700 12.5px/1.35 "Nunito";margin-top:3px}
.sim .pie{display:flex;align-items:center;gap:8px;margin-top:10px;font:800 12px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sim .pie .barra{flex:1;height:5px;border-radius:5px;background:#2A2346;overflow:hidden}.sim .pie .barra i{display:block;height:100%;background:var(--lima)}
.sim .esq{position:absolute;top:10px;left:10px;z-index:2}
.sim.pronto .art>svg{opacity:.55;filter:saturate(.6)}.sim.pronto b{color:#C9C2DE}
.sim.pronto .art:after{content:"";position:absolute;inset:0;background:rgba(6,4,15,.35)}
.lock{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;background:rgba(6,4,15,.75);border:1px solid var(--borde);font:800 11px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.nuevo{background:var(--lima);color:#151A03;border-color:var(--lima)}
@media (max-width:1000px){.fila{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .wrap{padding:max(12px,env(safe-area-inset-top)) 0 40px}
  .top,.cursos,.sec h2{margin-left:16px;margin-right:16px}
  .ttl b{font-size:21px}.xp b{display:none}
  .hero{margin:16px 16px 0;grid-template-columns:1fr;min-height:0}
  .hero .img{min-height:190px;order:-1}
  .hero .img{min-height:0}.hero .img img{position:static;display:block;width:100%;transform:rotate(-4deg);animation:none;margin:-10px 0 -6px}
  .hbts{flex-wrap:nowrap}.hbts .btn{flex:1.3;width:auto;min-width:0}.btn2{flex:1;justify-content:center;height:56px}
  .hero .img.dos{height:62vw;max-height:330px;margin-top:8px}.hero .img.dos img{margin:0;transform:none}
  .hero .dos .c-veg{width:56%;right:-2%;top:6%}.hero .dos .c-ani{width:60%;left:-3%;bottom:4%}
  .hero .meta{font-size:11px}.hero .meta b{font-size:16px}
  .hero .tx{padding:4px 20px 22px}
  .hero h1{font-size:32px;margin-top:10px}
  .hero .meta{gap:12px}
  .btn{width:100%;justify-content:center}
  .fila{display:flex;overflow-x:auto;gap:12px;padding:0 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .fila::-webkit-scrollbar{display:none}
  .sim{flex:0 0 68%;scroll-snap-align:start}
}

.son.off{color:var(--faint);border-color:var(--borde)}
.son.off .on-l{display:none}.son:not(.off) .off-l{display:none}
.tipos{display:flex;gap:6px;margin-top:8px}
.tipos span{padding:3px 8px;border-radius:7px;font:800 11px/1.2 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;background:rgba(198,224,0,.12);color:var(--lima)}
.tipos span.no{background:rgba(255,255,255,.06);color:var(--faint)}
.sec.oculta{display:none}
/* Rayos (supabase/97-laboratorio-rayos.sql · assets/lab-rayos.js) */
.ray{position:relative;display:flex;align-items:center;justify-content:center;width:124px;height:38px;margin-left:16px;padding:0 32px 0 24px;border-radius:9px;color:#fff;background:linear-gradient(180deg,#2A2158,#140D36);border:2px solid #0A0620;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.35),0 3px 0 rgba(10,6,32,.6)}
.ray:active{transform:translateY(2px)}
.ray .ri{position:absolute;left:-20px;top:50%;width:46px;height:46px;margin-top:-24px;filter:drop-shadow(0 0 8px #2FA8FF);animation:rayoA 2.4s ease-in-out infinite}
.ray b{font:400 19px/1 "Lilita One","Sora",sans-serif;letter-spacing:.03em;text-shadow:0 2px 0 #000;white-space:nowrap}
.ray i{position:absolute;right:3px;top:50%;width:26px;height:26px;margin-top:-13px;display:grid;place-items:center;border-radius:6px;font:400 21px/1 "Lilita One","Sora",sans-serif;font-style:normal;color:#0B3C8C;background:linear-gradient(180deg,#9BD4FF,#2FA8FF 55%,#1060E0);border:2px solid #0B3C8C;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.ray.lab b{font-size:13px}
@keyframes rayoA{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg) scale(1.1)}92%{transform:rotate(8deg)}}
.prc{display:inline-flex;align-items:center;gap:3px;font:800 13px/1 "Sora";color:#9BE4FF}
.prc svg{width:20px;height:20px;margin:-4px -2px -4px -4px}
.prc.gratis{color:var(--lima);font:800 12px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase}
.sim .pie.prcs{justify-content:space-between}
.fondo{position:fixed;inset:0;z-index:20;background:rgba(3,2,10,.72);display:none;align-items:flex-end;justify-content:center}
.fondo.on{display:flex}
.hoja{position:relative;width:min(460px,100%);max-height:92vh;overflow:auto;background:#120E26;border:1px solid var(--borde);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));animation:sube .25s ease-out}
@media (min-width:700px){.fondo{align-items:center}.hoja{border-radius:26px;border-bottom:1px solid var(--borde)}}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.hoja .cerrar{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2)}
.hoja .grande{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.hoja .grande svg{width:58px;height:58px;filter:drop-shadow(0 0 14px #2FA8FF)}
.hoja .grande b{font:800 44px/1 "Sora"}
.hoja h3{margin:0;padding-right:44px;font:800 22px/1.2 "Sora"}
.hoja p{margin:4px 0 0;color:var(--dim);font-weight:700}
.hoja .lista{margin:16px 0;display:grid;gap:8px}
.hoja .fila2{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--borde)}
.hoja .fila2 .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.hoja .fila2 div{flex:1;min-width:0}
.hoja .fila2 b{display:block;font:800 14.5px/1.25 "Nunito"}.hoja .fila2 small{color:var(--dim);font-size:12.5px}
.hoja .fila2 .prc{font-size:15px}
.hoja .cod{margin-top:6px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(198,224,0,.12),rgba(21,17,39,.6));border:1px solid rgba(198,224,0,.3)}
.hoja .cod b{display:flex;align-items:center;gap:8px;font:800 15px "Nunito";color:var(--lima)}
.hoja .cod b svg{width:20px;height:20px}
.hoja .cod form{display:flex;gap:8px;margin-top:10px}
.hoja .cod input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--borde);background:#0A0718;color:var(--tx);padding:0 12px;font:800 15px "Sora";text-transform:uppercase;letter-spacing:.06em}
.hoja .cod button{height:46px;padding:0 16px;border-radius:12px;background:var(--lima);color:#151A03;font:800 14px "Sora"}
.hoja .msg{min-height:18px;margin-top:8px;font:800 13px "Nunito";color:#FF7A85}
.hoja .msg.ok{color:var(--lima)}
.hoja .usar{width:100%;margin-top:14px;justify-content:center;border:0}
.hoja .usar[disabled]{background:#2A2346;color:var(--faint);box-shadow:0 5px 0 #1a1530;cursor:default}
.hoja .falta{margin-top:10px;text-align:center;color:var(--dim);font:800 13px "Nunito"}
/* Descargas (assets/lab-paquetes.js): la tira y la cajita con un paquete por curso */
.paq{position:relative;margin-top:16px;width:100%;display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:22px;text-align:left;background:linear-gradient(100deg,rgba(198,224,0,.13),rgba(58,180,240,.08) 45%,rgba(21,17,39,.85));border:1px solid rgba(198,224,0,.32);transition:transform .2s}
.paq:hover{transform:translateY(-2px)}
.paq .caja{width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:18px;background:radial-gradient(circle at 50% 40%,rgba(198,224,0,.22),rgba(198,224,0,.04) 70%)}
.paq .caja svg{width:58px;height:58px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:cajaA 3.2s ease-in-out infinite}
@keyframes cajaA{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-4px) rotate(-3deg)}90%{transform:translateY(0) rotate(2deg)}}
.paq .tx{flex:1;min-width:0}
.paq b{display:flex;align-items:center;gap:8px;font:800 18px/1.2 "Sora"}
.paq b em{font:800 11px/1 "Barlow Condensed";font-style:normal;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:7px;background:rgba(58,180,240,.16);color:#7FD0FF}
.paq small{display:block;margin-top:3px;color:var(--dim);font:700 13.5px/1.35 "Nunito"}
.paq .sb{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:14px;background:var(--lima);color:#151A03;font:800 14px "Sora";box-shadow:0 4px 0 var(--lima-osc)}
.paq .sb svg{width:18px;height:18px;stroke-width:2.6}
.hoja.ancha{width:min(560px,100%)}
.pk-cab{display:flex;align-items:center;gap:14px;padding-right:44px}
.pk-cab svg{width:58px;height:58px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.pk-todo{width:100%;margin:16px 0 4px;justify-content:center;border:0}
.pk-todo[disabled]{background:#2A2346;color:var(--faint);box-shadow:0 5px 0 #1a1530;cursor:default}
.pk-lista{display:grid;gap:10px;margin:14px 0}
.pk{padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--borde);border-left:4px solid var(--c)}
.pk.listo{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 12%,transparent),var(--card) 60%)}
.pk-f{display:flex;align-items:center;gap:12px}
.pk-ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.pk-ic svg{width:26px;height:26px}
.pk-t{flex:1;min-width:0}
.pk-t b{display:block;font:800 16px/1.2 "Nunito"}
.pk-t small{display:block;margin-top:2px;color:var(--dim);font:700 12.5px/1.3 "Nunito"}
.pk-t .okt{color:var(--lima);font-weight:800}
.pk-b{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;font:800 13.5px "Sora";background:var(--lima);color:#151A03;box-shadow:0 3px 0 var(--lima-osc)}
.pk-b svg{width:17px;height:17px;stroke-width:2.6}
.pk-b.act{background:#3AB4F0;color:#04223A;box-shadow:0 3px 0 #1F7DB0}
.pk-b.no{background:#221C3E;color:var(--faint);box-shadow:none;cursor:default}
.pk-b.ya{background:transparent;color:var(--lima);box-shadow:none;border:1.5px solid rgba(198,224,0,.45);cursor:default}
.pk-x{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--dim)}
.pk-x svg{width:18px;height:18px}
.pk-sims{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 58px}
.pk-sims span{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font:800 11.5px/1.2 "Nunito";background:rgba(255,255,255,.05);color:var(--dim)}
.pk-sims span.si{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tx)}
.pk-sims span.ce{color:var(--faint)}
.pk-sims svg{width:12px;height:12px;stroke-width:2.4}
.pk-bar{height:8px;margin:10px 0 0 58px;border-radius:8px;background:#2A2346;overflow:hidden}
.pk-bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--lima),#E6FF4D);transition:width .25s}
.pk-uso{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#0D0A1F;border:1px solid var(--borde)}
.pk-uso svg{width:22px;height:22px;color:var(--dim);flex:none}
.pk-uso div{flex:1;min-width:0;font:700 13px/1.35 "Nunito";color:var(--dim)}.pk-uso b{color:var(--tx)}
.pk-uso button{flex:none;height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,122,133,.45);color:#FF7A85;font:800 13px "Nunito"}
.pk-nota{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(58,180,240,.08);border:1px solid rgba(58,180,240,.22);font:700 12.5px/1.4 "Nunito";color:var(--dim)}
.pk-nota svg{width:18px;height:18px;flex:none;color:#7FD0FF;margin-top:1px}
/* Simulador descargado: marca en la tarjeta. Sin internet, los no descargados se ven apagados */
.desc-ok{position:absolute;top:10px;right:10px;z-index:2;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(6,4,15,.78);border:1px solid rgba(198,224,0,.5);color:var(--lima)}
.desc-ok svg{width:16px;height:16px;stroke-width:2.6}
html.sin-red .sim.no-desc{opacity:.45}
@media (max-width:760px){

/* ===== Descargas: un paquete por curso (assets/lab-paquetes.js) ===== */
var ICUR={'Biología':'cu-bio','Química':'cu-qui','Física':'cu-fis','Anatomía':'cu-ana','Matemática':'cu-mat'};
// Tamaño aproximado (KB) antes de descargar; después se muestra el real
var TAM={celula:3900,mitosis:60,punnett:30,tabla:50,atomo:35,balanceo:30,parabolico:30,plano:25,mru:30,circuito:30,optica:25,funcion:20,trigo:20,geo:15}, TAMBASE=1400;
var NUEVO={}, BAJA=null;
function mb(b){ return b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB'; }
function hace(t){ var d=Math.floor((Date.now()-t)/86400000); return d<=0?'hoy':d===1?'ayer':'hace '+d+' días'; }
function enHoja(){ return fondo.classList.contains('on')&&H.classList.contains('ancha'); }
function paqDe(c){
  var listos=c[3].filter(function(s){ return s[3]!=='pronto'; });
  var ab=listos.filter(function(s){ return abierto(s[0]); });
  var inf=P?P.info().cursos[P.id(c[0])]:null;
  var faltan=inf?ab.filter(function(s){ return (inf.sims||[]).indexOf(s[0])<0; }).length:0;
  return {c:c,listos:listos,ab:ab,inf:inf,faltan:faltan,nuevo:!!NUEVO[c[0]]};
}
function pintarPaq(){
  var t=document.getElementById('paqTx'); if(!t) return;
  document.documentElement.classList.toggle('sin-red',navigator.onLine===false);
  if(!P) return;
  var n=Object.keys(P.info().cursos).length;
  t.textContent=n?n+(n===1?' paquete descargado':' paquetes descargados')+' · '+mb(P.uso())+' en tu celular':'Descarga los simuladores de cada curso y estudia sin datos.';
}
function filaPaq(k){
  var c=k.c, id=P.id(c[0]), baja=BAJA&&BAJA.c===c[0], est, bt, h;
  if(!k.listos.length){ est='Llega pronto'; bt='<span class="pk-b no">Pronto</span>'; }
  else if(baja){ est='Descargando… '+BAJA.pct+'%'; bt='<span class="pk-b no">'+BAJA.pct+'%</span>'; }
  else if(k.inf&&(k.faltan||k.nuevo)){
    est=k.faltan?(k.faltan===1?'1 simulador nuevo para agregar':k.faltan+' simuladores nuevos para agregar'):'Hay una versión nueva';
    bt=navigator.onLine===false?'<span class="pk-b no">Sin internet</span>':'<button class="pk-b act" data-p="'+id+'"><svg class="i"><use href="#ic-act"/></svg>Actualizar</button>'; }
  else if(k.inf){ est='<span class="okt">Listo sin internet</span> · '+mb(k.inf.bytes)+' · '+hace(k.inf.t); bt='<span class="pk-b ya"><svg class="i"><use href="#ic-ok"/></svg>Listo</span>'; }
  else if(!k.ab.length){ est='Ábrelos con energía para descargarlos'; bt='<span class="pk-b no"><svg class="i"><use href="#ic-cand"/></svg>Cerrado</span>'; }
  else {
    var kb=k.ab.reduce(function(a,s){ return a+(TAM[s[0]]||40); },0)+(P.info().base?0:TAMBASE);
    est=k.ab.length+(k.ab.length===1?' simulador':' simuladores')+' · aprox. '+mb(kb*1024);
    bt=navigator.onLine===false?'<span class="pk-b no">Sin internet</span>':'<button class="pk-b" data-p="'+id+'"><svg class="i"><use href="#ic-desc"/></svg>Descargar</button>';
  }
  h='<div class="pk'+(k.inf&&!k.faltan&&!k.nuevo?' listo':'')+'" style="--c:'+c[1]+'"><div class="pk-f"><div class="pk-ic"><svg class="i"><use href="#'+ICUR[c[0]]+'"/></svg></div><div class="pk-t"><b>'+c[0]+'</b><small>'+est+'</small></div>'+bt+
    (k.inf&&!baja?'<button class="pk-x" data-b="'+id+'" aria-label="Borrar '+c[0]+'"><svg class="i"><use href="#ic-bote"/></svg></button>':'')+'</div>';
  if(baja) h+='<div class="pk-bar"><i style="width:'+BAJA.pct+'%"></i></div>';
  h+='<div class="pk-sims">'+c[3].map(function(s){
    var pr=s[3]==='pronto', en=k.inf&&(k.inf.sims||[]).indexOf(s[0])>=0, ab=!pr&&abierto(s[0]);
    return '<span class="'+(en?'si':!ab?'ce':'')+'">'+(en?'<svg class="i"><use href="#ic-ok"/></svg>':!ab?'<svg class="i"><use href="#ic-cand"/></svg>':'')+esc(s[1])+'</span>';
  }).join('')+'</div></div>';
  return h;
}
function hojaPaq(){
  var h='<button class="cerrar" id="hX" aria-label="Cerrar"><svg class="i"><use href="#ic-x"/></svg></button>'+
    '<div class="pk-cab"><svg viewBox="0 0 64 64"><use href="#r-caja"/></svg><div><h3>Descargas</h3><p>Guarda los simuladores de cada curso en tu celular y úsalos sin internet.</p></div></div>';
  H.classList.add('ancha'); fondo.classList.add('on');
  if(!P){
    H.innerHTML=h+'<div class="pk-nota" style="margin-top:16px"><svg class="i"><use href="#ic-nube"/></svg><div>Este navegador no permite descargas. Ábrelo en Chrome o usa la app de Modo Cachimbo.</div></div>';
    document.getElementById('hX').onclick=cerrar; return;
  }
  var ks=CUR.map(paqDe), pend=ks.filter(function(k){ return k.ab.length&&(!k.inf||k.faltan||k.nuevo); }), off=navigator.onLine===false;
  h+='<button class="btn pk-todo" id="pkTodo"'+(!pend.length||BAJA||off?' disabled':'')+'><svg class="i"><use href="#ic-desc"/></svg>'+(off?'Sin internet':BAJA?'Descargando…':pend.length?'Descargar todo lo abierto':'Todo descargado')+'</button>';
  h+='<div class="pk-lista">'+ks.map(filaPaq).join('')+'</div>';
  var uso=P.uso(), base=P.info().base;
  h+='<div class="pk-uso"><svg class="i"><use href="#ic-mem"/></svg><div>En tu celular: <b>'+(uso?mb(uso):'nada todavía')+'</b>'+(base?'<br>Incluye lo común del Laboratorio ('+mb(base.bytes)+')':'')+'</div>'+(uso&&!BAJA?'<button id="pkBorrar">Borrar todo</button>':'')+'</div>';
  h+='<div class="pk-nota"><svg class="i"><use href="#ic-nube"/></svg><div>Sin internet puedes usar los simuladores y practicar el Modo Reto. La <b style="color:#9BE4FF">energía</b> solo se gana con internet.</div></div>';
  H.innerHTML=h;
  document.getElementById('hX').onclick=cerrar;
  H.querySelectorAll('[data-p]').forEach(function(b){ b.onclick=function(){ bajarCurso(b.dataset.p); }; });
  H.querySelectorAll('[data-b]').forEach(function(b){ b.onclick=function(){
    var c=CUR.filter(function(x){ return P.id(x[0])===b.dataset.b; })[0];
    if(b.dataset.seguro!=='1'){ b.dataset.seguro='1'; b.style.cssText='width:auto;padding:0 10px;color:#FF7A85;font:800 12.5px Nunito'; b.textContent='¿Borrar?'; if(SN) SN.tocar('tic'); return; }
    P.borrar(c[0]).then(function(){ delete NUEVO[c[0]]; if(SN) SN.tocar('tic'); pintar(); hojaPaq(); aviso('Borraste el paquete de '+c[0]); });
  }; });
  var bb=document.getElementById('pkBorrar');
  if(bb) bb.onclick=function(){
    if(bb.dataset.seguro!=='1'){ bb.dataset.seguro='1'; bb.textContent='¿Seguro? Toca otra vez'; if(SN) SN.tocar('tic'); return; }
    P.borrarTodo().then(function(){ NUEVO={}; pintar(); hojaPaq(); aviso('Borraste todas las descargas'); });
  };
  var bt=document.getElementById('pkTodo');
  if(bt) bt.onclick=function(){
    var cola=pend.map(function(k){ return P.id(k.c[0]); });
    (function sig(){ if(cola.length) bajarCurso(cola.shift(),!!cola.length).then(function(ok){ if(ok) sig(); }); })();
  };
}
function bajarCurso(id,callado){
  var c=CUR.filter(function(x){ return P.id(x[0])===id; })[0]; if(!c||BAJA) return Promise.resolve(false);
  var sims=c[3].filter(function(s){ return s[3]!=='pronto'&&abierto(s[0]); }).map(function(s){ return {sim:s[0],url:s[4]}; });
  if(!sims.length) return Promise.resolve(false);
  if(SN) SN.tocar('abrir');
  BAJA={c:c[0],pct:0}; if(enHoja()) hojaPaq();
  return P.bajar(c[0],sims,function(hc,tot,fase){
    BAJA.pct=Math.min(99,Math.round(fase==='base'?hc/tot*35:35+hc/tot*65));
    var bar=H.querySelector('.pk-bar i'); if(!bar) return;
    var pk=bar.closest('.pk'), sm=pk.querySelector('.pk-t small'), b2=pk.querySelector('.pk-b');
    bar.style.width=BAJA.pct+'%'; if(sm) sm.textContent='Descargando… '+BAJA.pct+'%'; if(b2) b2.textContent=BAJA.pct+'%';
  }).then(function(){
    BAJA=null; delete NUEVO[c[0]]; pintar(); if(enHoja()) hojaPaq();
    if(!callado){ if(SN) SN.tocar('bien'); aviso('¡Listo! <b>'+esc(c[0])+'</b> ya funciona sin internet'); }
    return true;
  },function(e){
    BAJA=null; if(enHoja()) hojaPaq(); if(SN) SN.tocar('mal');
    aviso(esc(e&&e.message||'No se pudo descargar.')+' Inténtalo otra vez.'); return false;
  });
}

// Con internet: ¿algún paquete tiene versión nueva? (solo cabeceras, casi sin datos)
var revisado=0;
function revisarPaq(){
  if(!P||navigator.onLine===false||Date.now()-revisado<600000) return;
  revisado=Date.now();
  var cs=P.info().cursos;
  Object.keys(cs).forEach(function(id){
    var nom=cs[id].curso;
    P.revisar(nom).then(function(si){ if(si&&!NUEVO[nom]){ NUEVO[nom]=1; if(enHoja()&&!BAJA) hojaPaq(); } });
  });
}
['online','offline'].forEach(function(ev){ window.addEventListener(ev,function(){ pintar(); if(enHoja()&&!BAJA) hojaPaq(); }); });

/* Volver desde un simulador cerrado: laboratorio.html?abrir=<sim> abre su ventana */
var qAb=new URLSearchParams(location.search).get('abrir');
function verAbrir(){ if(qAb&&NOMBRE[qAb]&&!abierto(qAb)&&!fondo.classList.contains('on')) hoja(qAb); qAb=null; }
if(qAb&&!R) verAbrir();

/* Trae los rayos (y cobra lo ganado estudiando) */
if(R) R.estado().then(function(s){
  if(!s||s.error) return;
  ST=s; pintar(); verAbrir();
  if(s.nuevos>0) setTimeout(function(){ if(SN) SN.tocar('bien'); aviso('Ganaste <b>+'+s.nuevos+' de energía</b> estudiando'); },600);
});
</script>
