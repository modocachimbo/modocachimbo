<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
    --red: #E03C3C;
  }

  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; padding: 24px;
  }

  .card {
    width: 100%; max-width: 400px;
    background: var(--surface); border-radius: 24px; overflow: hidden;
    border: 1px solid #1f1f1f; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    transition: max-width .2s ease;
  }

  @media (min-width: 640px) {
    .card { max-width: 520px; }
    .title { font-size: 23px !important; }
    .question p { font-size: 15.5px !important; }
    .option span.text { font-size: 15px !important; }
    .option { padding: 14px 16px !important; }
  }
  @media (min-width: 900px) {
    .card { max-width: 640px; }
    body { padding: 48px 24px; }
    .title { font-size: 27px !important; }
    .question p { font-size: 17px !important; }
    .option span.text { font-size: 16px !important; }
    .option { padding: 17px 19px !important; }
    .letter { width: 32px !important; height: 32px !important; font-size: 14px !important; }
    .header { padding: 28px 28px 18px !important; }
    .badge { margin: 16px 28px 0 !important; font-size: 12px !important; padding: 6px 12px !important; }
    .question { margin: 12px 28px 22px !important; padding: 22px !important; }
    .options { padding: 0 28px 8px !important; gap: 11px !important; }
    .navrow { padding: 22px 28px 0 !important; }
    .footer { padding: 20px 28px 26px !important; }
  }
  @media (min-width: 1280px) {
    .card { max-width: 720px; }
    .title { font-size: 30px !important; }
    .question p { font-size: 18px !important; }
    .option span.text { font-size: 17px !important; }
    .option { padding: 19px 21px !important; }
    .letter { width: 34px !important; height: 34px !important; font-size: 15px !important; }
  }

  .backlink { padding: 16px 22px 0; display: flex; align-items: center; }
  .backlink a { display: inline-flex; align-items: center; gap: 6px; color: #777; text-decoration: none; font-size: 12.5px; font-weight: 500; }
  .backlink svg { width: 14px; height: 14px; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--border); color: #777;
    text-decoration: none; margin-left: 10px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 13px; height: 13px; }

  .header { padding: 22px 22px 14px; }
  .title { font-family: 'Sora', sans-serif; font-size: 19px; font-weight: 800; color: #f5f5f5; line-height: 1.25; }
  .title .accent { color: var(--accent); }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .lives { display: flex; gap: 4px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); }

  .progress-track { height: 4px; background: #1c1c1c; border-radius: 100px; margin-top: 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 100px; transition: width .3s ease; }
  .progress-label { margin-top: 8px; font-size: 11px; color: #666; letter-spacing: .5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500;
    padding: 5px 10px; border-radius: 100px; background: var(--accent-soft); color: #D6F23A;
    margin: 14px 22px 0;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .question { margin: 10px 22px 18px; background: var(--surface-2); border-radius: 16px; padding: 17px; border-left: 3px solid var(--accent); }
  .question p { color: #ececec; font-size: 13.5px; line-height: 1.65; white-space: pre-line; }

  .options { padding: 0 22px 6px; display: flex; flex-direction: column; gap: 9px; }
  .option {
    display: flex; align-items: center; gap: 12px; background: #141414; border: 1px solid #232323;
    border-radius: 13px; padding: 12px 14px; cursor: pointer; transition: border-color .15s ease, background .15s ease;
  }
  .option:hover:not(.locked) { border-color: #3a3a3a; }
  .letter {
    width: 25px; height: 25px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: 'Sora', sans-serif; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
    background: rgba(198,224,0,0.08); border: 1px solid rgba(198,224,0,0.25); color: var(--accent);
  }
  .option span.text { color: #d8d8d8; font-size: 13px; font-weight: 400; }
  .option.correct { background: rgba(198,224,0,0.1); border-color: var(--accent); }
  .option.correct .letter { background: var(--accent); border-color: var(--accent); color: #0e0e0e; }
  .option.correct span.text { color: #f5ffcc; font-weight: 500; }
  .option.wrong { background: rgba(224,60,60,0.08); border-color: var(--red); }
  .option.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }
  .option.wrong span.text { color: #ffd6d6; }
  .icon { margin-left: auto; width: 16px; height: 16px; flex-shrink: 0; }
  .icon.ok { color: var(--accent); }
  .icon.bad { color: var(--red); }

  .feedback { margin: 12px 22px 0; font-size: 12px; line-height: 1.5; padding: 10px 12px; border-radius: 10px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(198,224,0,0.08); color: #D6F23A; }
  .feedback.bad { background: rgba(224,60,60,0.08); color: #ffb3b3; }

  .navrow { display: flex; gap: 10px; padding: 18px 22px 0; }
  .btn {
    flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #262626; background: #141414; color: #aaa;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s ease;
  }
  .btn.primary { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }

  .footer { padding: 16px 22px 22px; margin-top: 12px; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
  .footer .label { font-size: 11px; color: #666; letter-spacing: .5px; }
  .footer .mark { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: var(--accent); }

  .startscreen, .endscreen { display: none; padding: 34px 24px; text-align: center; }
  .startscreen.show, .endscreen.show { display: block; }

  .start-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500;
    padding: 5px 10px; border-radius: 100px; background: var(--accent-soft); color: #D6F23A; margin-bottom: 16px;
  }
  .start-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .startscreen h1 { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; color: #f5f5f5; line-height: 1.3; margin-bottom: 10px; }
  .startscreen h1 .accent { color: var(--accent); }
  .startscreen p { font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 20px; }
  .start-info { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
  .start-stat { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #d8d8d8; font-weight: 500; }

  .endscreen h2 { font-family: 'Sora', sans-serif; font-size: 20px; color: #f5f5f5; margin-bottom: 6px; }
  .endscreen p { font-size: 13px; color: #999; margin-bottom: 20px; }
  .endscreen .score { font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 800; color: var(--accent); margin: 14px 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13px; padding: 40px 24px; }
  .q-graphic { margin: 4px 0 16px; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 12px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }

  /* Casita con estilo grueso: se hunde al tocarla */
  .home-btn { border: 2px solid #2e2e2e; border-bottom-width: 4px; border-radius: 12px; background: #141414; width: 36px; height: 36px; color: #e6e6e6;

  /* Práctica con estilo grueso tipo Duolingo: claves y botones que se hunden al tocarlos */
  .card { border: 2px solid #232323; }

  .startscreen h1 { font-size: 26px; }
  .startscreen p, .lockscreen p, .endscreen p { font: 700 14px/1.6 'Nunito', 'Inter', sans-serif; }
  .start-badge, .badge { font: 800 12px 'Nunito', 'Inter', sans-serif; border: 2px solid rgba(198,224,0,.25); }
  .start-info { gap: 10px; flex-wrap: wrap; }

  .stat { font: 900 14px 'Nunito', 'Inter', sans-serif; }

  .progress-fill { position: relative; min-width: 12px; }

  .progress-label { font: 800 12px 'Nunito', 'Inter', sans-serif; color: #7a7a7a; }
  .question { border: 2px solid #262626; border-bottom-width: 5px; border-radius: 20px; background: #101010; }
  .question p { font-family: 'Nunito', 'Inter', sans-serif; font-weight: 800; font-size: 17px !important; line-height: 1.55; color: #f2f2f2; }

  .options { gap: 11px; padding-bottom: 8px; }
  .option { border: 2px solid #2a2a2a; border-bottom-width: 5px; border-radius: 16px; background: #151515; -webkit-tap-highlight-color: transparent;

  .option:active:not(.locked) { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
  .option span.text { font: 800 15px 'Nunito', 'Inter', sans-serif; color: #dcdcdc; }
  .letter { width: 30px; height: 30px; border-radius: 10px; border: 2px solid #3a3a3a; background: transparent; color: #cfcfcf; font: 900 13px 'Nunito', sans-serif; }
  .option.correct { background: rgba(198,224,0,.12); border-color: var(--accent); border-bottom-color: #8fa300; }
  .option.correct span.text { color: #f5ffcc; font-weight: 900; }
  .option.wrong { background: rgba(224,60,60,.1); border-color: var(--red); border-bottom-color: #9e2525; }
  .option.wrong span.text { font-weight: 900; }

  .feedback { border: 2px solid transparent; border-radius: 14px; font: 800 13.5px/1.5 'Nunito', 'Inter', sans-serif; padding: 12px 14px; }
  .feedback.ok { border-color: rgba(198,224,0,.35); }
  .feedback.bad { border-color: rgba(224,60,60,.4); }
  .navrow { gap: 12px; padding-bottom: 6px; }
  .btn { border: 2px solid #2e2e2e; border-bottom-width: 5px; border-radius: 16px; background: #161616; color: #cfcfcf; padding: 13px 12px;
    font: 900 14px 'Nunito', 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .6px; -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, box-shadow .08s ease, opacity .15s ease; }
  .btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
  .btn.primary { border: 2px solid var(--accent); color: #2b3300; box-shadow: 0 5px 0 #8fa300; margin-bottom: 5px; }
  .btn.primary:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 transparent; border-bottom-width: 2px; margin-bottom: 5px; }

  .endscreen h2 { font: 900 24px 'Nunito', 'Sora', sans-serif; }
  .endscreen .score { font-family: 'Nunito', 'Sora', sans-serif; font-weight: 900; font-size: 48px; }
  #lockInput { border: 2px solid #2e2e2e; border-bottom-width: 4px; border-radius: 14px; font: 800 15px 'Nunito', 'Inter', sans-serif; letter-spacing: 1px; }

  .footer .label { font: 800 12px 'Nunito', 'Inter', sans-serif; }

  @media (min-width: 900px) { .feedback { margin: 14px 28px 0; } }

  /* Letra gruesita en toda la web (Nunito); las fórmulas y el código conservan su letra */
  body, body :not(.katex):not(.katex *):not(code):not(pre):not(kbd):not(samp):not(.formato):not(.ta.big):not(.cdnuevos code) { font-family: 'Nunito', 'Inter', system-ui, sans-serif !important; }
  body { font-weight: 600; }

<script>
  function renderMath(el) {
    // KaTeX carga sin bloquear la página: si aún no llegó, se dibuja apenas llegue
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', () => renderMath(el), { once: true }); return; }
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }


  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const params = new URLSearchParams(window.location.search);
  const requestedYears = (params.get('years') || '').split(',').map(s => s.trim()).filter(Boolean);

  const startScreen = document.getElementById('startScreen');
  const quizHeader = document.getElementById('quizHeader');
  const quizBody = document.getElementById('quizBody');
  const endScreen = document.getElementById('endScreen');
  const finalScore = document.getElementById('finalScore');
  const endMessage = document.getElementById('endMessage');
  const btnStart = document.getElementById('btnStart');

  let questions = [];
  let activeQuestions = [];
  let current = 0, score = 0, lives = 5, answered = false;
  const MAX_LIVES = 5;
  const answers = [];

  async function loadQuestions() {
    if (requestedYears.length === 0) {
      startScreen.innerHTML = '<div class="state-msg">No se indicó ningún año. Vuelve a la lista de exámenes.</div>';
      startScreen.classList.add('show');
      return;
    }
    const results = await Promise.allSettled(
      requestedYears.map(y => fetch('data/' + y + '.json').then(r => { if (!r.ok) throw 0; return r.json(); }))
    );
    results.forEach((r, k) => {
      if (r.status !== 'fulfilled') return;
      // Origen de cada pregunta, para "Repasar mis falladas"
      r.value.forEach((q, i) => { q._ref = 'examenes/cpu/data/' + requestedYears[k] + '.json##' + i; q._tit = 'Examen CPU ' + requestedYears[k]; });
      questions = questions.concat(r.value);
    });

    if (questions.length === 0) {
      startScreen.innerHTML = '<div class="state-msg">Todavía no hay preguntas cargadas para ' + requestedYears.join(', ') + '.</div>';
      startScreen.classList.add('show');
      return;
    }

    const yearsLabel = requestedYears.join(', ');
    document.getElementById('startBadgeText').textContent = 'CPU · ' + yearsLabel;
    document.getElementById('startDesc').textContent = `Preguntas de ${yearsLabel}, mezcladas al azar. Tienes 5 vidas, ¡a ver cuánto sabes!`;
    document.getElementById('startCount').textContent = `${questions.length} preguntas`;
    btnStart.disabled = false;
    startScreen.classList.add('show');

    activeQuestions = (window.MCPregunta ? q => MCPregunta.mezclar(q, { alternativas: false }) : shuffle)(questions);
    setupHeaderAndBody();
  }

  function setupHeaderAndBody() {
    quizHeader.innerHTML = `
      <div class="title">Simulacro <span class="accent">Admisión</span></div>
      <div class="topbar">
        <div class="lives" id="lives"></div>
        <div class="stat"><span id="score">0 pts</span><button class="mc-son" type="button" data-mc-son></button></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">Pregunta 1 de ${activeQuestions.length}</div>
    `;
    quizBody.innerHTML = `
      <div class="badge" id="topicBadge"><span class="dot"></span><span id="topicText"></span></div>
      <div class="question"><p id="questionText"></p></div>
      <div class="q-graphic" id="qGraphic" style="display:none;"></div>
      <div class="options" id="optionsList"></div>
      <div class="feedback" id="feedback"></div>
      <div class="navrow">
        <button class="btn" id="btnBack">Atrás</button>
        <button class="btn primary" id="btnNext" disabled>Siguiente</button>
      </div>
    `;
    bindQuizEvents();
  }

  function heartSVG(filled) {
    return `<svg width="16" height="16" viewBox="0 0 24 24" fill="${filled ? '#C6E000' : 'none'}" stroke="${filled ? '#C6E000' : '#3a3a3a'}" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.3C1.1 10.1 1.6 6.6 4.4 5.1c2.2-1.2 4.7-.4 6 1.4l1.6 2.1 1.6-2.1c1.3-1.8 3.8-2.6 6-1.4 2.8 1.5 3.3 5 1.7 7.6C18.7 16.65 12 21 12 21z"/></svg>`;
  }

  let livesEl, scoreEl, progressFill, progressLabel, topicText, questionText, optionsList, feedback, btnBack, btnNext;

  function bindQuizEvents() {
    livesEl = document.getElementById('lives');
    scoreEl = document.getElementById('score');
    progressFill = document.getElementById('progress-fill');
    progressLabel = document.getElementById('progress-label');
    topicText = document.getElementById('topicText');
    questionText = document.getElementById('questionText');
    optionsList = document.getElementById('optionsList');
    feedback = document.getElementById('feedback');
    btnBack = document.getElementById('btnBack');
    btnNext = document.getElementById('btnNext');

    btnNext.addEventListener('click', () => {
      if (current === activeQuestions.length - 1) {
        progressFill.style.width = '100%';
        showEnd();
        return;
      }
      current += 1;
      renderQuestion();
    });

    btnBack.addEventListener('click', () => {
      if (current === 0) return;
      current -= 1;
      renderQuestion();
    });
  }

  function renderLives() {
    livesEl.innerHTML = Array.from({length: MAX_LIVES}, (_, i) => heartSVG(i < lives)).join('');
  }

  function renderQuestion() {
    answered = false;
    const q = activeQuestions[current];
    topicText.textContent = q.asignatura || q.topic || 'CPU';
    const qGraphic = document.getElementById('qGraphic');
    // Imágenes en medio del texto, tablas, lecturas: assets/pregunta.js
    const mcq = window.MCPregunta ? MCPregunta.pintar({ texto: questionText, grafico: qGraphic }, q) : null;
    if (!mcq) {
      questionText.textContent = q.text;
      if (q.graphic) { qGraphic.innerHTML = q.graphic; qGraphic.style.display = 'block'; }
      else { qGraphic.innerHTML = ''; qGraphic.style.display = 'none'; }
    }
    optionsList.innerHTML = '';
    feedback.className = 'feedback';
    feedback.textContent = '';

    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<div class="letter">${opt.letter}</div><span class="text">${window.MCPregunta ? MCPregunta.formato(opt.text) : opt.text}</span>`;
      div.addEventListener('click', () => selectAnswer(i, div));
      optionsList.appendChild(div);
    });
    if (mcq) MCPregunta.alternativas(optionsList, q, mcq);

    renderMath(questionText.parentElement.parentElement || document.body);

    const prevAnswer = answers[current];
    if (prevAnswer !== undefined) lockOptions(prevAnswer);

    btnBack.disabled = current === 0;
    btnNext.disabled = prevAnswer === undefined;
    btnNext.textContent = current === activeQuestions.length - 1 ? 'Finalizar' : 'Siguiente';

    progressFill.style.width = (current / activeQuestions.length * 100) + '%';
    progressLabel.textContent = `Pregunta ${current + 1} de ${activeQuestions.length}`;
    scoreEl.textContent = `${score} pts`;
    renderLives();
  }

  function lockOptions(selectedIndex) {
    const q = activeQuestions[current];
    const opts = optionsList.querySelectorAll('.option');
    opts.forEach((div, i) => {
      div.classList.add('locked');
      div.style.cursor = 'default';
      if (i === q.correct) {
        div.classList.add('correct');
        div.insertAdjacentHTML('beforeend', '<svg class="icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>');
      } else if (i === selectedIndex) {
        div.classList.add('wrong');
        div.insertAdjacentHTML('beforeend', '<svg class="icon bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>');
      }
    });
    const wasCorrect = selectedIndex === q.correct;
    const correctLetter = q.options[q.correct].letter;
    feedback.textContent = wasCorrect ? '¡Correcto!' : `Incorrecto. La respuesta correcta era la ${correctLetter}.`;
    feedback.className = 'feedback show ' + (wasCorrect ? 'ok' : 'bad');
  }

  function selectAnswer(index, el) {
    if (answered) return;
    answered = true;
    // Cuenta para la racha de estudio (assets/racha.js)
    window.MCRacha ? MCRacha.respondio() : (window.mcRachaPend = (window.mcRachaPend || 0) + 1);
    answers[current] = index;
    const q = activeQuestions[current];
    const isCorrect = index === q.correct;
    if (isCorrect) score += 10; else lives -= 1;
    if (window.MCSonido) MCSonido[isCorrect ? 'bien' : 'mal']();

    lockOptions(index);
    renderLives();
    scoreEl.textContent = `${score} pts`;
    btnNext.disabled = false;

    if (lives <= 0) setTimeout(showEnd, 900);
  }

  function showEnd() {
    quizHeader.style.display = 'none';
    quizBody.style.display = 'none';
    endScreen.classList.add('show');
    finalScore.textContent = `${score} pts`;
    endMessage.textContent = lives <= 0 ? 'Se acabaron tus vidas. ¡Sigue practicando!' : 'Así te fue en esta práctica';
    // Progreso del estudiante (assets/progreso.js), una sola vez por ronda
    if (showEnd.ronda === activeQuestions) return;
    showEnd.ronda = activeQuestions;
    if (window.MCSonido) lives <= 0 ? MCSonido.perder() : MCSonido.fin(Math.round(answers.filter((a, i) => activeQuestions[i] && a === activeQuestions[i].correct).length / activeQuestions.length * 100));
    const prog = { tipo: 'examen', carpeta: 'cpu', anio: requestedYears.join(','), titulo: 'Examen CPU · ' + requestedYears.join(', '), preguntas: activeQuestions, respuestas: answers };
    window.MCProgreso ? MCProgreso.terminar(prog) : (window.mcProgresoPend = (window.mcProgresoPend || []).concat([prog]));
  }

  document.getElementById('btnRestart').addEventListener('click', () => {
    activeQuestions = (window.MCPregunta ? q => MCPregunta.mezclar(q, { alternativas: false }) : shuffle)(questions);
    current = 0; score = 0; lives = MAX_LIVES; answers.length = 0;
    quizHeader.style.display = 'block';
    quizBody.style.display = 'block';
    endScreen.classList.remove('show');
    renderQuestion();
  });

  btnStart.addEventListener('click', () => {
    if (window.MCSonido) MCSonido.empezar();
    startScreen.classList.remove('show');
    quizHeader.style.display = 'block';
    quizBody.style.display = 'block';
    renderQuestion();
  });

  loadQuestions();
</script>
</body>
</html>
