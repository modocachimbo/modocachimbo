<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="../../assets/guardia.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/app/icono-32.png">
<link rel="apple-touch-icon" href="../../assets/app/icono-180.png">
<meta name="apple-mobile-web-app-title" content="Modo Cachimbo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="../../assets/app.js" defer></script>
<title>Examen Ordinario · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 60px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(5,5,5,0.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid #161616;
  }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }

  .course-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .course-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  .page-head { padding: 30px 0 6px; }
  .page-head .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-head h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(26px, 5vw, 36px); margin-top: 8px; }
  .page-head p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }

  .quiz-cta {
    margin: 22px 0 34px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .quiz-cta span { font-size: 13.5px; color: var(--text-dim); }
  .quiz-cta a {
    background: var(--accent); color: #0e0e0e; text-decoration: none;
    padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .qcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .qcard .qnum-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }

  .qcard .qnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
  }

  .qcard .qtema {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 100px;
  }

  .qcard .qtext { font-size: 14.5px; line-height: 1.7; color: #ececec; white-space: pre-line; margin-bottom: 16px; }

  .opt-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px;
    font-size: 13.5px; color: var(--text-dim);
    border-top: 1px solid #1a1a1a;
  }
  .opt-row:first-of-type { border-top: none; }
  .opt-row .letter {
    width: 24px; height: 24px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--text-dim);
    flex-shrink: 0;
  }
  .opt-row.correct { color: #f5ffcc; font-weight: 600; }
  .opt-row.correct .letter { background: var(--accent); color: #0e0e0e; }
  .opt-row.correct svg { margin-left: auto; width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }

  .solution-toggle {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .solution-toggle:hover { border-color: var(--accent); }
  .solution-toggle svg { width: 13px; height: 13px; transition: transform .2s ease; }
  .solution-toggle.open svg { transform: rotate(180deg); }

  .solution-box {
    display: none;
    margin-top: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 13px;
    line-height: 1.7;
    color: #dcdcdc;
  }
  .solution-box.show { display: block; }
  .solution-box p { margin-bottom: 8px; }
  .solution-box p:last-child { margin-bottom: 0; }

  table.punnett {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 12.5px;
  }
  table.punnett th, table.punnett td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: center;
  }
  table.punnett th { background: rgba(198,224,0,0.08); color: var(--accent); font-weight: 700; }
  table.punnett td { color: #e8e8e8; }


  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filter-pill {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 100px; cursor: pointer; user-select: none;
  }
  .filter-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .q-graphic { margin: 12px 0; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 12px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }
  /* Estilo grueso tipo Duolingo con sombrita verde */
  .quiz-cta { border: 2px solid #2e2e2e; border-bottom-width: 5px; border-radius: 20px; background: #101010; }
  .quiz-cta span { font: 700 14px 'Nunito', 'Inter', sans-serif; }
  .quiz-cta a { border: 2px solid var(--accent); border-radius: 14px; padding: 11px 18px; color: #2b3300; box-shadow: 0 5px 0 #8fa300; margin-bottom: 5px;
    font: 900 14px 'Nunito', 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .6px;
    transition: transform .08s ease, box-shadow .08s ease; -webkit-tap-highlight-color: transparent; }
  .quiz-cta a.alt { background: #161616; color: var(--accent); border: 2px solid #3a4a00; box-shadow: 0 5px 0 #3a4a00; }
  .quiz-cta a:active { transform: translateY(5px); box-shadow: 0 0 0 transparent; }
  .qcard { border: 2px solid #262626; border-bottom-width: 5px; border-radius: 22px; background: #0f0f0f; }
  .qcard .qnum { width: 34px; height: 34px; border-radius: 11px; border: 2px solid rgba(198,224,0,.35); font: 900 15px 'Nunito', 'Sora', sans-serif; }
  .qcard .qtext { font: 800 17px/1.55 'Nunito', 'Inter', sans-serif; color: #f2f2f2; }
  .qcard .qtext .katex { font-size: 1.07em; }
  .opt-row, .opt-row:first-of-type { border: 2px solid #2a2a2a; border-bottom-width: 4px; border-radius: 14px; background: #151515; padding: 9px 12px; margin-bottom: 8px;
    font: 800 15px 'Nunito', 'Inter', sans-serif; color: #dcdcdc; }
  .mcq-cortas .opt-row { margin-bottom: 0; }
  .opt-row .letter { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #3a3a3a; background: transparent; font: 900 12px 'Nunito', sans-serif; }
  .opt-row.correct { background: rgba(198,224,0,.1); border-color: var(--accent); border-bottom-color: #8fa300; color: #f5ffcc; font-weight: 900; box-shadow: 0 0 18px rgba(198,224,0,.08); }
  .opt-row.correct .letter { border-color: var(--accent); }

  /* Casita con estilo grueso: se hunde al tocarla */
  .home-btn { border: 2px solid #2e2e2e; border-bottom-width: 4px; border-radius: 12px; background: #141414; width: 36px; height: 36px; color: #e6e6e6;
    transition: transform .08s ease, border-color .15s ease, color .15s ease; -webkit-tap-highlight-color: transparent; }
  .home-btn:hover { border-color: var(--accent, #C6E000); border-bottom-color: #8fa300; color: var(--accent, #C6E000); }
  .home-btn:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('mc:katex'))"></script>
<script src="../../assets/mc-config.js"></script>
<script src="../../assets/pregunta.js"></script>
<script src="../../assets/auth.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Exámenes</a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24.66 24.65" fill="currentColor" aria-hidden="true"><path d="M11.88,0h.87a2.91,2.91,0,0,1,1.39.84l9.64,9.65a3.33,3.33,0,0,1,.36.39,2.2,2.2,0,0,1,.31,2.35,2.14,2.14,0,0,1-1.82,1.35c-.68.08-.6,0-.61.67,0,2.28,0,4.57,0,6.85a2.63,2.63,0,0,1-2.65,2.54H15.57c-.65,0-.92-.26-.92-.91V18.19a1.16,1.16,0,0,0-1.24-1.25c-.71,0-1.43,0-2.14,0A1.17,1.17,0,0,0,10,18.25v5.56a.74.74,0,0,1-.83.83H5.27A2.6,2.6,0,0,1,3,23.39a3,3,0,0,1-.42-1.71V14.86a.23.23,0,0,0-.23-.25,2.64,2.64,0,0,1-.74-.1A2.32,2.32,0,0,1,0,12.75v-.87a2.91,2.91,0,0,1,.86-1.42Q5.66,5.67,10.45.88A2.86,2.86,0,0,1,11.88,0Z"/></svg></a>
      </div>
      <div class="course-badge"><div class="dot"></div><span id="badgeYear">Ordinario</span></div>
    </header>

    <div class="page-head">
      <div class="eyebrow">Modo estudio</div>
      <h1 id="pageTitleH1">Ordinario</h1>
      <p id="countLabel">Cargando…</p>
    </div>

    <div class="quiz-cta">
      <span>¿Ya las repasaste? Practícalas en modo quiz.</span>
      <a id="practicarLink" href="#">Practicar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
    </div>

    <div class="filter-row" id="filterRow"></div>
    <div id="qlist"></div>
  </div>

<script>
  function renderMath(el) {
    // KaTeX carga sin bloquear la página: si aún no llegó, se dibuja apenas llegue
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', () => renderMath(el), { once: true }); return; }
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }


  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const qlistEl = document.getElementById("qlist");

  if (!year) {
    qlistEl.innerHTML = '<div class="state-msg">No se indicó ningún año. Vuelve a la lista de exámenes.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Ordinario · ' + year;
    document.getElementById('pageTitleH1').textContent = 'Ordinario — Examen ' + year;
    document.getElementById('practicarLink').href = 'quiz.html?years=' + encodeURIComponent(year);

    let allQuestions = [];
    let activeFilter = 'Todas';

    function renderQuestions() {
      qlistEl.innerHTML = '';
      const questions = activeFilter === 'Todas'
        ? allQuestions
        : allQuestions.filter(q => (q.asignatura || 'General') === activeFilter);

      document.getElementById('countLabel').textContent = `${questions.length} preguntas con clave marcada`;

      // Preguntas seguidas del mismo TEXTO: la lectura se abre en la primera ("preguntas 41 a 43")
      if (window.MCPregunta && MCPregunta.rangos) {
        MCPregunta.rangos(questions);
        questions.forEach((q, i) => {
          if (!q.lecPos || q.lecSigue) return;
          let j = i; while (questions[j + 1] && questions[j + 1].lecSigue) j++;
          q.lecPos = j > i ? 'preguntas ' + (q.num || i + 1) + ' a ' + (questions[j].num || j + 1) : 'pregunta ' + (q.num || i + 1);
          for (let k = i + 1; k <= j; k++) questions[k].lecPos = q.lecPos;
        });
      }
      questions.forEach((q) => {
          const div = document.createElement('div');
          div.className = 'qcard';
          let optsHtml = '';
          q.options.forEach((o, i) => {
            const isCorrect = i === q.correct;
            optsHtml += `<div class="opt-row ${isCorrect ? 'correct' : ''}">
              <div class="letter">${o.letter}</div>
              <span>${window.MCPregunta ? MCPregunta.formato(o.text) : o.text}</span>
              ${isCorrect ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
            </div>`;
          });
          const temaTag = q.asignatura ? `<div class="qtema">${q.asignatura}</div>` : (q.tema ? `<div class="qtema">${q.tema}</div>` : '');
          const mcq = window.MCPregunta ? MCPregunta.armar(q.text, { lecPos: q.lecPos, lecSigue: q.lecSigue }) : { html: q.text.replace(/\n/g,'<br>'), derecha: '' };
          const cortas = window.MCPregunta && !mcq.derecha && MCPregunta.cortas(q.options);
          optsHtml = `<div class="${cortas ? 'mcq-cortas' : ''}" style="${cortas ? 'gap:8px;' : ''}">${optsHtml}</div>`;
          if (mcq.derecha) optsHtml = `<div class="mcq-con-der">${optsHtml}<div class="mcq-der" style="margin:0;">${mcq.derecha}</div></div>`;
          div.innerHTML = `<div class="qnum-row"><div class="qnum">${q.num || ''}</div>${temaTag}</div><div class="qtext">${mcq.html}</div>${q.graphic ? `<div class="q-graphic">${q.graphic}</div>` : ''}${optsHtml}`;

          if (q.solution_html) {
            const btn = document.createElement('button');
            btn.className = 'solution-toggle';
            btn.innerHTML = 'Ver resolución <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

            const box = document.createElement('div');
            box.className = 'solution-box';
            box.innerHTML = q.solution_html;

            btn.addEventListener('click', () => {
              box.classList.toggle('show');
              btn.classList.toggle('open');
            });

            div.appendChild(btn);
            div.appendChild(box);
          }

          qlistEl.appendChild(div);
          renderMath(div);
        });
    }

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(questions => {
        allQuestions = questions;

        const asignaturas = [...new Set(questions.map(q => q.asignatura || 'General'))];
        const filterRow = document.getElementById('filterRow');
        if (asignaturas.length > 1) {
          const labels = ['Todas', ...asignaturas];
          labels.forEach(label => {
            const pill = document.createElement('div');
            pill.className = 'filter-pill' + (label === 'Todas' ? ' active' : '');
            pill.textContent = label;
            pill.addEventListener('click', () => {
              activeFilter = label;
              filterRow.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
              pill.classList.add('active');
              renderQuestions();
            });
            filterRow.appendChild(pill);
          });
        }

        renderQuestions();
      })
      .catch(() => {
        qlistEl.innerHTML = '<div class="state-msg">Todavía no hay preguntas cargadas para ' + year + '.</div>';
      });
  }
</script>
<script src="../../assets/sonido.js"></script>
</body>
</html>
