<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen Ordinario · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505; --surface: #0e0e0e; --surface-2: #141414;
    --border: #232323; --accent: #C6E000; --accent-soft: rgba(198,224,0,0.1);
    --text: #f2f2f2; --text-dim: #9a9a9a; --text-faint: #5f5f5f;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 60px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(5,5,5,0.9); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 1px solid #161616;
  }
  .back { display: flex; align-items: center; gap: 8px; color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 9px;
    border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; margin-left: 12px; flex-shrink: 0;
  }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .home-btn svg { width: 15px; height: 15px; }
  .back-row { display: flex; align-items: center; }
  .back:hover { color: var(--accent); }
  .back svg { width: 16px; height: 16px; }

  .course-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  .course-badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  .page-head { padding: 30px 0 6px; }
  .page-head .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .page-head h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(26px, 5vw, 36px); margin-top: 8px; }
  .page-head p { color: var(--text-dim); font-size: 13.5px; margin-top: 8px; }

  .quiz-cta {
    margin: 22px 0 34px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .quiz-cta span { font-size: 13.5px; color: var(--text-dim); }
  .quiz-cta a {
    background: var(--accent); color: #0e0e0e; text-decoration: none;
    padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .qcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .qcard .qnum-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }

  .qcard .qnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
  }

  .qcard .qtema {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 100px;
  }

  .qcard .qtext { font-size: 14.5px; line-height: 1.7; color: #ececec; white-space: pre-line; margin-bottom: 16px; }

  .opt-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px;
    font-size: 13.5px; color: var(--text-dim);
    border-top: 1px solid #1a1a1a;
  }
  .opt-row:first-of-type { border-top: none; }
  .opt-row .letter {
    width: 24px; height: 24px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--text-dim);
    flex-shrink: 0;
  }
  .opt-row.correct { color: #f5ffcc; font-weight: 600; }
  .opt-row.correct .letter { background: var(--accent); color: #0e0e0e; }
  .opt-row.correct svg { margin-left: auto; width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }

  .state-msg { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 60px 20px; }

  .solution-toggle {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .solution-toggle:hover { border-color: var(--accent); }
  .solution-toggle svg { width: 13px; height: 13px; transition: transform .2s ease; }
  .solution-toggle.open svg { transform: rotate(180deg); }

  .solution-box {
    display: none;
    margin-top: 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 13px;
    line-height: 1.7;
    color: #dcdcdc;
  }
  .solution-box.show { display: block; }
  .solution-box p { margin-bottom: 8px; }
  .solution-box p:last-child { margin-bottom: 0; }

  table.punnett {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 12.5px;
  }
  table.punnett th, table.punnett td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: center;
  }
  table.punnett th { background: rgba(198,224,0,0.08); color: var(--accent); font-weight: 700; }
  table.punnett td { color: #e8e8e8; }


  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filter-pill {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
    padding: 7px 14px; border-radius: 100px; cursor: pointer; user-select: none;
  }
  .filter-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .q-graphic { margin: 12px 0; display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 12px; }
  .q-graphic svg { max-width: 100%; height: auto; display: block; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row">
        <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Exámenes</a>
        <a class="home-btn" href="../../index.html" title="Ir al inicio" aria-label="Ir al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
      </div>
      <div class="course-badge"><div class="dot"></div><span id="badgeYear">Ordinario</span></div>
    </header>

    <div class="page-head">
      <div class="eyebrow">Modo estudio</div>
      <h1 id="pageTitleH1">Ordinario</h1>
      <p id="countLabel">Cargando…</p>
    </div>

    <div class="quiz-cta">
      <span>¿Ya las repasaste? Practícalas en modo quiz.</span>
      <a id="practicarLink" href="#">Practicar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
    </div>

    <div class="filter-row" id="filterRow"></div>
    <div id="qlist"></div>
  </div>

<script>
  function renderMath(el) {
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }


  const params = new URLSearchParams(window.location.search);
  const year = params.get('year');
  const qlistEl = document.getElementById("qlist");

  if (!year) {
    qlistEl.innerHTML = '<div class="state-msg">No se indicó ningún año. Vuelve a la lista de exámenes.</div>';
  } else {
    document.getElementById('badgeYear').textContent = 'Ordinario · ' + year;
    document.getElementById('pageTitleH1').textContent = 'Ordinario — Examen ' + year;
    document.getElementById('practicarLink').href = 'quiz.html?years=' + encodeURIComponent(year);

    let allQuestions = [];
    let activeFilter = 'Todas';

    function renderQuestions() {
      qlistEl.innerHTML = '';
      const questions = activeFilter === 'Todas'
        ? allQuestions
        : allQuestions.filter(q => (q.asignatura || 'General') === activeFilter);

      document.getElementById('countLabel').textContent = `${questions.length} preguntas con clave marcada`;

      questions.forEach((q) => {
          const div = document.createElement('div');
          div.className = 'qcard';
          let optsHtml = '';
          q.options.forEach((o, i) => {
            const isCorrect = i === q.correct;
            optsHtml += `<div class="opt-row ${isCorrect ? 'correct' : ''}">
              <div class="letter">${o.letter}</div>
              <span>${o.text}</span>
              ${isCorrect ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
            </div>`;
          });
          const temaTag = q.asignatura ? `<div class="qtema">${q.asignatura}</div>` : (q.tema ? `<div class="qtema">${q.tema}</div>` : '');
          div.innerHTML = `<div class="qnum-row"><div class="qnum">${q.num || ''}</div>${temaTag}</div>${q.graphic ? `<div class="q-graphic">${q.graphic}</div>` : ''}<div class="qtext">${q.text.replace(/\n/g,'<br>')}</div>${optsHtml}`;

          if (q.solution_html) {
            const btn = document.createElement('button');
            btn.className = 'solution-toggle';
            btn.innerHTML = 'Ver resolución <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

            const box = document.createElement('div');
            box.className = 'solution-box';
            box.innerHTML = q.solution_html;

            btn.addEventListener('click', () => {
              box.classList.toggle('show');
              btn.classList.toggle('open');
            });

            div.appendChild(btn);
            div.appendChild(box);
          }

          qlistEl.appendChild(div);
        });
    }

    fetch('data/' + year + '.json')
      .then(r => { if (!r.ok) throw new Error('no data'); return r.json(); })
      .then(questions => {
        allQuestions = questions;

        const asignaturas = [...new Set(questions.map(q => q.asignatura || 'General'))];
        const filterRow = document.getElementById('filterRow');
        if (asignaturas.length > 1) {
          const labels = ['Todas', ...asignaturas];
          labels.forEach(label => {
            const pill = document.createElement('div');
            pill.className = 'filter-pill' + (label === 'Todas' ? ' active' : '');
            pill.textContent = label;
            pill.addEventListener('click', () => {
              activeFilter = label;
              filterRow.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
              pill.classList.add('active');
              renderQuestions();
            });
            filterRow.appendChild(pill);
          });
        }

        renderQuestions();
      })
      .catch(() => {
        qlistEl.innerHTML = '<div class="state-msg">Todavía no hay preguntas cargadas para ' + year + '.</div>';
      });
  }
</script>
</body>
</html>
