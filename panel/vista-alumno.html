<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista del alumno</title>
<!--
  Modo Cachimbo · Panel · Vista del alumno (modo estudio)
  Se abre dentro del panel (Subir tema / Subir examen) y dibuja las preguntas tal como
  las ve el alumno en el modo estudio: copia los estilos de la página real
  (geometria/libros/tema.html o examenes/cpu/ver.html) y usa el mismo assets/pregunta.js.
  El panel le manda las preguntas con postMessage({ tipo: 'mc-vista', preguntas, i, ... }).
-->
<link rel="stylesheet" href="../assets/areas.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('mc:katex'))"></script>
<script src="../assets/pregunta.js"></script>
<style id="estiloBase">
  .vacia { color: #A99FC8; font: 700 15px/1.5 Nunito, system-ui, sans-serif; text-align: center; padding: 60px 20px; }
  .mc-img-falta { display: grid; place-items: center; min-height: 110px; margin: 10px 0; border: 2px dashed #4A4170; border-radius: 14px; color: #A99FC8; font: 700 13px/1.4 Nunito, system-ui, sans-serif; text-align: center; padding: 10px; }
  .vista-sol { margin-top: 6px; padding: 12px 14px; border-radius: 14px; background: rgba(88,204,2,.1); border: 2px solid rgba(88,204,2,.4); color: #CFF5B0; font: 700 14px/1.45 Nunito, system-ui, sans-serif; }
  .qcard.foco { outline: 3px solid rgba(198,224,0,.55); outline-offset: 3px; }
  .back-row a, .quiz-cta a { pointer-events: none; }
  .rep-row { pointer-events: none; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="back-row"><a class="back" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> <span id="backLabel">Temas</span></a>
        <a class="home-btn" href="#" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></a></div>
      <div class="course-badge"><div class="dot"></div><span id="badge">Curso</span></div>
    </header>
    <div class="page-head">
      <div class="eyebrow" id="eyebrow">tema · modo estudio</div>
      <h1 id="titulo">Tema</h1>
      <p id="cuenta"></p>
    </div>
    <div class="quiz-cta" id="cta">
      <span>¿Ya las repasaste? Practícalas en modo quiz.</span>
      <div class="cta-btns">
        <a class="alt" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg> PDF</a>
        <a class="alt" href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><rect x="7" y="3" width="14" height="16" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h11"/></svg> Flashcards</a>
        <a href="#">Practicar <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      </div>
    </div>
    <div id="qlist"></div>
  </div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var datos = { preguntas: [], i: 0 }, modo = null;

  // Copia los estilos de la página real de modo estudio
  var fuente = null;
  function estilos(m, carpeta) {
    var url = m === 'examen' ? '../examenes/cpu/ver.html' : '../' + (carpeta || 'geometria') + '/libros/tema.html';
    modo = m;
    if (url === fuente) return; fuente = url;
    fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).catch(function () { return fetch('../geometria/libros/tema.html').then(function (r) { return r.text(); }); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      document.querySelectorAll('style.copiado').forEach(function (s) { s.remove(); });
      var area = doc.documentElement.getAttribute('data-area');
      if (area) document.documentElement.setAttribute('data-area', area); else document.documentElement.removeAttribute('data-area');
      doc.querySelectorAll('style').forEach(function (st) { var s = document.createElement('style'); s.className = 'copiado'; s.textContent = st.textContent; document.head.insertBefore(s, $('estiloBase')); });
    }).catch(function () {});
  }
  function formatQText(str) {
    var esc = String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    for (var k = 0; k < 3; k++) esc = esc.replace(/&lt;(u|i|b|em|strong|sub|sup)&gt;([\s\S]*?)&lt;\/\1&gt;/gi, function (x, t, d) { return '<' + t.toLowerCase() + '>' + d + '</' + t.toLowerCase() + '>'; });
    return esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  }
  function renderMath(el) {
    if (!window.renderMathInElement) { document.addEventListener('mc:katex', function () { renderMath(el); }, { once: true }); return; }
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function tarjeta(q, idx) {
    var div = document.createElement('div'); div.className = 'qcard'; div.id = 'q' + (idx + 1);
    var k = 0, imgs = q._imgs || {};
    var r = MCPregunta.armar(q.text || '', { lecPos: q.lecPos, lecSigue: q.lecSigue, marca: function () {
      var src = imgs[k++]; return src ? '<img class="mc-img" src="' + src + '" alt="">' : '<div class="mc-img-falta">Aquí irá la imagen<br>(pégala en la lista de la izquierda)</div>';
    } });
    var graf = imgs.g ? '<img class="mc-img" src="' + imgs.g + '" alt="">' : (q.graphic || '');
    var ops;
    if (q.abierta || q.tipo) ops = '<div class="vista-sol">' + (q.tipo ? MCPregunta.nombreTipo(q) + ' · ' + MCPregunta.solucion(q) : 'Respuesta: ' + (q.respuestas || []).map(formatQText).join(' o ')) + '</div>';
    else {
      var cortas = !r.derecha && MCPregunta.cortas(q.options);
      ops = '<div class="opts ' + (cortas ? 'mcq-cortas' : '') + '" style="' + (cortas ? 'gap:8px;' : '') + '">' + (q.options || []).map(function (o, i) {
        var ok = i === q.correct;
        return '<div class="opt-row ' + (ok ? 'correct' : '') + '"><div class="letter">' + o.letter + '</div><span class="opt-text">' + formatQText(o.text) + '</span>' + (ok ? CHECK : '') + '</div>';
      }).join('') + '</div>';
      if (r.derecha) ops = '<div class="mcq-con-der">' + ops + '<div class="mcq-der" style="margin:0;">' + r.derecha + '</div></div>';
    }
    var tag = modo === 'examen' && q.asignatura ? (q.tema ? '<div class="qtema con-t"><span class="qtema-x"><span>' + q.asignatura + '</span><small class="qtema-t">' + q.tema + '</small></span></div>' : '<div class="qtema">' + q.asignatura + '</div>') : '';
    div.innerHTML = tag + '<div class="qnum">' + (q.num || idx + 1) + '</div><div class="qtext">' + r.html + '</div>' + (graf ? '<div class="q-graphic">' + graf + '</div>' : '') + ops;
    var op = div.querySelector('.opts'); if (op) try { MCPregunta.analogias(op, q); } catch (e) {}
    try { MCPregunta.llenarHuecos(div.querySelector('.qtext'), q); } catch (e) {}
    return div;
  }

  function pintar(saltar) {
    var ps = datos.preguntas, n = ps.length, lista = $('qlist');
    estilos(datos.modo, datos.carpeta);
    $('badge').textContent = datos.badge || '';
    $('backLabel').textContent = datos.modo === 'examen' ? 'Exámenes' : 'Temas';
    $('cta').hidden = datos.modo === 'examen';
    $('eyebrow').textContent = datos.modo === 'examen' ? 'examen · modo estudio' : 'tema ' + (datos.num || '') + ' · modo estudio';
    $('titulo').textContent = datos.titulo || (datos.modo === 'examen' ? 'Examen' : 'Tema');
    $('cuenta').textContent = n ? n + ' preguntas con respuesta marcada.' : '';
    lista.innerHTML = '';
    if (!n) { lista.innerHTML = '<div class="vacia">Aquí verás las preguntas como en el modo estudio.</div>'; return; }
    ps.forEach(function (q, i) { var c = tarjeta(q, i); if (i === datos.i) c.classList.add('foco'); lista.appendChild(c); });
    renderMath(lista);
    if (saltar) { var f = $('q' + (datos.i + 1)); if (f) f.scrollIntoView({ block: 'start' }); }
  }
  window.addEventListener('message', function (e) {
    var m = e.data; if (!m || m.tipo !== 'mc-vista') return;
    var salta = m.i !== datos.i || !datos.preguntas.length;
    datos = Object.assign(datos, m);
    var y = window.scrollY; pintar(salta); if (!salta) window.scrollTo(0, y);
  });
  parent.postMessage({ tipo: 'mc-vista-lista' }, '*');
})();
</script>
</body>
</html>
