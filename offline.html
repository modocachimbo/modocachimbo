<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Sin conexión · Modo Cachimbo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;0,1000;1,600;1,700;1,800;1,900;1,1000&display=swap');
  :root { --bg: #050505; --surface: #0e0e0e; --border: #232323; --accent: #C6E000; --text: #f2f2f2; --text-dim: #9a9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .caja { max-width: 380px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 32px 24px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin: 0 0 22px; }
  .botones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a { font: inherit; font-weight: 700; font-size: 14px; border-radius: 12px; padding: 11px 18px; text-decoration: none; cursor: pointer; }
  button { background: var(--accent); color: #050505; border: 0; }
  a { color: var(--text); border: 1px solid var(--border); }

  /* Letra gruesita en toda la web (Nunito); las fórmulas y el código conservan su letra */
  body, body :not(.katex):not(.katex *):not(code):not(pre):not(kbd):not(samp):not(.formato):not(.ta.big):not(.cdnuevos code) { font-family: 'Nunito', 'Inter', system-ui, sans-serif !important; }
  body { font-weight: 600; }
</style>
</head>
<body>
  <div class="caja">
    <img src="assets/app/icono-192.png" alt="">
    <h1>Estás sin internet</h1>
    <p>Esta página todavía no la abriste con conexión. Las que ya viste se pueden repasar sin internet; esta se guardará la próxima vez que la abras con señal.</p>
    <div class="botones">
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="./">Ir al inicio</a>
    </div>
  </div>
</body>
</html>
