<script>
MCLabPuerta('atomo');
var son=MCLabComun('atomo');
var SIM='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'.split(' ');
var NOM='Hidrógeno Helio Litio Berilio Boro Carbono Nitrógeno Oxígeno Flúor Neón Sodio Magnesio Aluminio Silicio Fósforo Azufre Cloro Argón Potasio Calcio Escandio Titanio Vanadio Cromo Manganeso Hierro Cobalto Níquel Cobre Zinc Galio Germanio Arsénico Selenio Bromo Kriptón Rubidio Estroncio Itrio Circonio Niobio Molibdeno Tecnecio Rutenio Rodio Paladio Plata Cadmio Indio Estaño Antimonio Telurio Yodo Xenón Cesio Bario Lantano Cerio Praseodimio Neodimio Prometio Samario Europio Gadolinio Terbio Disprosio Holmio Erbio Tulio Iterbio Lutecio Hafnio Tantalio Wolframio Renio Osmio Iridio Platino Oro Mercurio Talio Plomo Bismuto Polonio Astato Radón Francio Radio Actinio Torio Protactinio Uranio Neptunio Plutonio Americio Curio Berkelio Californio Einstenio Fermio Mendelevio Nobelio Laurencio Rutherfordio Dubnio Seaborgio Bohrio Hasio Meitnerio Darmstatio Roentgenio Copernicio Nihonio Flerovio Moscovio Livermorio Teneso Oganesón'.split(' ');
/* Regla de Moeller (serrucho): orden de llenado [n, l] */
var ORD=[[1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],[4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]];
var LET='spdf', CAP=[2,6,10,14], CAPA='KLMNOPQ', GAS={2:0,10:2,18:4,36:7,54:10,86:14,118:18};
var ANOM=[24,29,42,47,79]; /* Cr, Cu, Mo, Ag, Au: terminan en d⁴ o d⁹ y "saltan" */
var COL={s:'#FF5C8A',p:'#C6E000',d:'#3AB4F0',f:'#B99CFF',up:'#C6E000',dn:'#FFC800'};
var S={Z:26,q:0,k:-1}, VER={atomo:1,serrucho:1,orbitales:1}, OCULTA=false, FIJO={}, CAJ=null;
function sup(n){ return String(n).split('').map(function(c){ return '⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)]||c; }).join(''); }
function carga(q){ return q?sup(Math.abs(q)===1?'':Math.abs(q))+(q>0?'⁺':'⁻'):''; }
function nomSub(i){ return ORD[i][0]+LET[ORD[i][1]]; }
function moeller(N){ var c=ORD.map(function(){ return 0; }); for(var i=0;i<ORD.length&&N>0;i++){ var t=Math.min(N,CAP[ORD[i][1]]); c[i]=t; N-=t; } return c; }
function idx(n,l){ for(var i=0;i<ORD.length;i++) if(ORD[i][0]===n&&ORD[i][1]===l) return i; return -1; }

/* Pasos: llenado por Moeller, salto (Cr, Cu…), y quitar electrones en los cationes */
function pasos(Z,q){
  var L=[{c:moeller(0),t:'Átomo sin electrones: solo el núcleo con '+Z+' protones.',u:-1}], N=Z-Math.min(q,0)*1, i;
  if(q<0) N=Z-q;
  for(var e=1;e<=(q<0?Z-q:Z);e++){ var c=moeller(e), u=0; for(i=ORD.length-1;i>=0;i--) if(c[i]){ u=i; break; } L.push({c:c,u:u,t:'Electrón '+e+' entra en <b>'+nomSub(u)+'</b>'+(c[u]===CAP[ORD[u][1]]?' (se llena)':'')+'.'}); }
  var fin=L[L.length-1].c.slice();
  if(ANOM.indexOf(Z)>=0&&q>=0){ var n=ORD[(function(){ for(i=ORD.length-1;i>=0;i--) if(fin[i]&&ORD[i][1]===2) return i; })()][0], is=idx(n+1,0), id=idx(n,2);
    fin[is]--; fin[id]++; L.push({c:fin.slice(),u:id,salto:[is,id],t:'<b>Salto:</b> un electrón de '+nomSub(is)+' pasa a '+nomSub(id)+'. Queda d'+sup(fin[id])+(fin[id]===5?' (semilleno)':' (lleno)')+', que es más estable.'}); }
  for(var r=0;r<q;r++){ var nm=0,j=-1; for(i=0;i<ORD.length;i++) if(fin[i]){ var nn=ORD[i][0]*10+ORD[i][1]; if(nn>nm){ nm=nn; j=i; } }
    if(j<0) break; fin[j]--; L.push({c:fin.slice(),u:j,quita:1,t:'Catión: se quita un electrón del último nivel, de <b>'+nomSub(j)+'</b>.'}); }
  return L;
}
var P=[], C=null;
function total(c){ return c.reduce(function(s,x){ return s+x; },0); }
function texto(c,html){ var out=[]; c.forEach(function(x,i){ if(x) out.push(html?nomSub(i)+'<sup>'+x+'</sup>':nomSub(i)+sup(x)); }); return out.join(' '); }
function kernel(c){ var last=-1,i; for(i=0;i<c.length;i++) if(c[i]) last=i; var best=null;
  [2,10,18,36,54,86].forEach(function(z){ var e=GAS[z]; if(e>=last) return; for(var k=0;k<=e;k++) if(c[k]!==CAP[ORD[k][1]]) return; best=z; });
  return best; }
function kerTexto(c,html){ var g=kernel(c); if(!g) return texto(c,html); var r=c.slice(); for(var k=0;k<=GAS[g];k++) r[k]=0; return (html?'<span class="k">['+SIM[g-1]+']</span> ':'['+SIM[g-1]+'] ')+texto(r,html); }
function capas(c){ var n=[0,0,0,0,0,0,0]; c.forEach(function(x,i){ n[ORD[i][0]-1]+=x; }); while(n.length&&!n[n.length-1]) n.pop(); return n; }
function desap(c){ var u=0; c.forEach(function(x,i){ var m=2*ORD[i][1]+1; u+=x<=m?x:2*m-x; }); return u; }
function ultimo(c){ for(var i=ORD.length-1;i>=0;i--) if(c[i]){ var l=ORD[i][1], m=2*l+1, x=c[i], b=x<=m?x-1:x-m-1; return {i:i,n:ORD[i][0],l:l,ml:-l+b,ms:x<=m?'+1/2':'−1/2'}; } return null; }
var ROM=['','I','II','III','IV','V','VI','VII','VIII'];
function grupo(Z){ var c=pasos(Z,0), r=c[c.length-1].c, m=moeller(Z), last=0, i; for(i=ORD.length-1;i>=0;i--) if(m[i]){ last=i; break; }
  var per=0; r.forEach(function(x,k){ if(x) per=Math.max(per,ORD[k][0]); });
  var l=ORD[last][1], ns=r[idx(per,0)]||0, g, iu;
  if(Z===2){ g='VIIIA'; iu=18; }
  else if(l===0){ g=ROM[ns]+'A'; iu=ns; }
  else if(l===1){ var np=r[idx(per,1)]; g=ROM[2+np]+'A'; iu=12+np; }
  else if(l===2){ var nd=r[idx(per-1,2)], sm=ns+nd; iu=sm; g=sm<=7?ROM[sm]+'B':sm<=10?'VIIIB':sm===11?'IB':'IIB'; }
  else { g='IIIB'; iu=3; }
  return {per:per,g:g,iu:iu,bloque:LET[l],f:l===3}; }
function nq(u){ return u?'('+u.n+', '+u.l+', '+(u.ml>0?'+':u.ml<0?'−':'')+Math.abs(u.ml)+', '+u.ms+')':'—'; }

/* ===== Controles ===== */
var bVer=[['atomo','Átomo de Bohr','#FF9600'],['serrucho','Serrucho (Moeller)','#3AB4F0'],['orbitales','Orbitales (cajitas)','#C6E000']];
function pintarVer(){ document.getElementById('ver').innerHTML=bVer.map(function(b){ return '<button data-k="'+b[0]+'" class="'+(VER[b[0]]?'on':'')+'"><i style="background:'+b[2]+'"></i>'+b[1]+'</button>'; }).join('');
  document.querySelectorAll('#ver button').forEach(function(b){ b.onclick=function(){ var k=b.dataset.k; VER[k]=!VER[k]; if(!VER.atomo&&!VER.serrucho&&!VER.orbitales) VER[k]=1; son('tic'); pintarVer(); dibujar(); }; }); }
var EJ=[[8,0],[11,0],[17,0],[26,0],[24,0],[29,0],[35,0],[47,0],[26,3],[8,-2],[11,1],[20,2]];
document.getElementById('chips').innerHTML=EJ.map(function(e,i){ return '<button data-i="'+i+'">'+SIM[e[0]-1]+carga(e[1])+'</button>'; }).join('');
document.querySelectorAll('#chips button').forEach(function(b){ b.onclick=function(){ var e=EJ[+b.dataset.i]; son('tic'); poner(e[0],e[1]); lanzar(); }; });
var iZ=document.getElementById('iz'), iQ=document.getElementById('iq'), iB=document.getElementById('iBus');
iZ.oninput=function(){ poner(+iZ.value,S.q); };
iQ.oninput=function(){ poner(S.Z,+iQ.value); };
document.getElementById('bMenos').onclick=function(){ son('tic'); poner(Math.max(1,S.Z-1),S.q); };
document.getElementById('bMas').onclick=function(){ son('tic'); poner(Math.min(118,S.Z+1),S.q); };
function quitaTildes(t){ return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
iB.oninput=function(){ var t=iB.value.trim(); if(!t) return; var z=0;
  if(/^\d+$/.test(t)) z=+t; else { var k=SIM.indexOf(t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()); if(k>=0) z=k+1; else { var tq=quitaTildes(t); for(var i=0;i<NOM.length;i++) if(quitaTildes(NOM[i]).indexOf(tq)===0){ z=i+1; break; } } }
  if(z>=1&&z<=118&&z!==S.Z) poner(z,S.q); };
function rango(i,v){ i.style.setProperty('--p',((v-i.min)/(i.max-i.min)*100)+'%'); }
function poner(Z,q){ parar(); S.Z=Z; S.q=Math.max(-3,Math.min(q,Z)); P=pasos(S.Z,S.q); S.k=P.length-1; actualizar(); }

/* Llenar paso a paso */
var VEL=[['Lento',.55],['Normal',.28],['Rápido',.1]], vi=1, anim=null, bPlay=document.getElementById('bPlay'), bVel=document.getElementById('bVel');
function pintarPlay(){ var fin=S.k>=P.length-1; bPlay.classList.toggle('on',!!anim); bPlay.innerHTML='<svg class="i"><use href="#i-'+(anim?'pausa':'play')+'"/></svg><span>'+(anim?'Pausar':fin?'Llenar paso a paso':'Seguir')+'</span>'; }
function lanzar(){ parar(); if(S.k>=P.length-1) S.k=0; son('lanzar'); anim=setTimeout(paso1,320); pintarPlay(); actualizar(); }
function paso1(){ S.k++; var p=P[S.k]; son(p.salto?'bien':p.quita?'caer':'tic'); if(S.k>=P.length-1){ anim=null; actualizar(); if(alFin){ var fc=alFin; alFin=null; fc(); } return; }
  actualizar(); anim=setTimeout(paso1,(p.salto||(p.c[p.u]===CAP[ORD[p.u][1]])?1.8:1)*VEL[vi][1]*1000); }
var alFin=null;
function parar(){ if(!anim) return; clearTimeout(anim); anim=null; pintarPlay(); }
bPlay.onclick=function(){ if(anim){ son('tic'); return parar(); } lanzar(); };
bVel.onclick=function(){ son('tic'); vi=(vi+1)%VEL.length; bVel.textContent=VEL[vi][0]; };

function actualizar(){
  iZ.value=S.Z; iQ.value=S.q; rango(iZ,S.Z); rango(iQ,S.q);
  document.getElementById('izO').textContent=SIM[S.Z-1]+' · '+S.Z; document.getElementById('iqO').textContent=S.q?(S.q>0?'+':'−')+Math.abs(S.q)+(S.q>0?' catión':' anión'):'neutro';
  if(document.activeElement!==iB) iB.value='';
  C=P[S.k].c; var fin=P[P.length-1].c, g=grupo(S.Z), u=ultimo(fin), ne=total(fin), cp=capas(fin), d=desap(fin);
  document.getElementById('paso').innerHTML=S.k<P.length-1||anim?P[S.k].t:'';
  document.getElementById('tDat').textContent=NOM[S.Z-1]+' ('+SIM[S.Z-1]+carga(S.q)+') · '+ne+' electrones';
  var dd=[['Configuración','<span class="conf">'+texto(fin,1)+'</span>','#3AB4F0',1],['Con kernel (gas noble)','<span class="conf">'+kerTexto(fin,1)+'</span>','#B99CFF',1],
    ['Por niveles',cp.map(function(x,i){ return CAPA[i]+'='+x; }).join('  '),'#FF9600',1],
    ['Último nivel','n = '+cp.length+' · '+cp[cp.length-1]+' e⁻',null],['Desapareados',d+' · '+(d?'paramagnético':'diamagnético'),null],
    ['Último electrón (n, ℓ, mℓ, ms)',nq(u),'#C6E000',1],
    ['Periodo y grupo',S.q?'<em style="font-style:normal;color:var(--faint)">del átomo neutro:</em> ':'',null],['Bloque',g.bloque+(g.f?' (tierras raras)':''),null]];
  dd[6][1]+=g.per+' · '+g.g+' ('+g.iu+')';
  document.getElementById('datos').innerHTML=dd.map(function(x){ return '<div class="dato'+(x[3]?' ancho':'')+'"><small>'+(x[2]?'<i style="background:'+x[2]+'"></i>':'')+x[0]+'</small><b>'+x[1]+'</b></div>'; }).join('');
  /* Cae en el examen */
  var cl=[], neu=pasos(S.Z,0); neu=neu[neu.length-1].c;
  cl.push('Regla del serrucho (Moeller): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p. Se llena por energía relativa n + ℓ: 4s (4+0) va antes que 3d (3+2).');
  cl.push('Capacidad: s = 2, p = 6, d = 10, f = 14. Pauli: en un orbital caben 2 electrones con espín opuesto. Hund: en un subnivel primero va un electrón en cada orbital (todos ↑) y luego se aparean.');
  if(ANOM.indexOf(S.Z)>=0) cl.push(NOM[S.Z-1]+' es una excepción: por Moeller terminaría en '+texto(moeller(S.Z)).split(' ').slice(-2).join(' ')+', pero un electrón de s salta a d para quedar d⁵ o d¹⁰. Así: '+kerTexto(neu)+'. Pasa con Cr, Cu, Mo, Ag y Au.');
  if(S.q>0) cl.push('En un catión se quitan primero los electrones del último nivel (el n más alto), aunque se hayan llenado antes: '+SIM[S.Z-1]+' = '+kerTexto(neu)+' → '+SIM[S.Z-1]+carga(S.q)+' = '+kerTexto(fin)+'.');
  if(S.q<0) cl.push('Un anión gana electrones y se siguen llenando por Moeller: '+SIM[S.Z-1]+carga(S.q)+' tiene '+ne+' e⁻ = '+kerTexto(fin)+(GAS[ne]!==undefined?' (isoelectrónico con el '+NOM[ne-1].toLowerCase()+').':'.'));
  if(u) cl.push('Último electrón en '+nomSub(u.i)+': n = '+u.n+' (nivel), ℓ = '+u.l+' ('+LET[u.l]+'), mℓ = '+u.ml+' (su cajita, de −ℓ a +ℓ), ms = '+u.ms+' ('+(u.ms==='+1/2'?'flecha ↑':'flecha ↓')+').');
  cl.push('Periodo = mayor nivel ('+g.per+'). Grupo A si termina en s o p (los electrones del último nivel); grupo B si termina en d: se suman ns + (n−1)d. '+NOM[S.Z-1]+': grupo '+g.g+'.');
  document.getElementById('clave').innerHTML='<b><svg><use href="#i-rayo"/></svg>Cae en el examen</b>'+cl.map(function(c){ return '<p>'+c+'</p>'; }).join('');
  pintarPlay(); dibujar();
}

/* ===== Dibujo ===== */
var pl=document.getElementById('plano'), svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); pl.appendChild(svg);
var W=0,H=0, HIT=[], t0=performance.now();
function tx(x,y,t,c,an,sz,w,fam){ return '<text x="'+x+'" y="'+y+'" fill="'+c+'" text-anchor="'+(an||'middle')+'" style="font:'+(w||800)+' '+(sz||12)+'px '+(fam||'Sora')+',sans-serif;paint-order:stroke;stroke:#0B0820;stroke-width:4px">'+t+'</text>'; }
function flechaE(x,y,h,up,col){ var a=up?-1:1, y1=y-a*h/2, y2=y+a*h/2;
  return '<path d="M'+x+' '+y1+'V'+(y2+a*h*.08)+'" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round"/><path d="M'+x+' '+(y2+a*1)+'l'+(-h*.22)+' '+(-a*h*.3)+'M'+x+' '+(y2+a*1)+'l'+(h*.22)+' '+(-a*h*.3)+'" stroke="'+col+'" stroke-width="2.6" stroke-linecap="round" fill="none"/>'; }
/* cajitas que caben en un ancho; devuelve el alto */
function medirCajas(ws,b,subs){ var x=0, filas=1, gap=b*.55; subs.forEach(function(i){ var w=(2*ORD[i][1]+1)*b; if(x&&x+w>ws){ filas++; x=0; } x+=w+gap; }); return filas*(b+30)+(FIJO.cajas?0:18); }
function subsVer(c){ var s=[]; c.forEach(function(x,i){ if(x) s.push(i); }); return s; }
function plan(){
