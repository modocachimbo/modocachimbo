# =========================================================
# Modo Cachimbo · Vigilante de publicación
# Cada 10 minutos revisa si GitHub Pages publicó el último cambio de main.
# Si la última publicación falló o quedó atrasada (por ejemplo, cuando el panel
# guarda dos correcciones en el mismo segundo), pide una publicación nueva.
# También se puede correr a mano: Actions → Vigilante de publicación → Run workflow.
# =========================================================
name: Vigilante de publicación

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: vigilante-publicacion
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar y republicar si hace falta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          cabeza=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          fecha=$(gh api "repos/$REPO/commits/main" --jq '.commit.committer.date')
          edad=$(( $(date +%s) - $(date -d "$fecha" +%s) ))
          dep=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0] | "\(.id) \(.sha)"' 2>/dev/null || echo "? ?")
          dep_id=${dep%% *}; dep_sha=${dep##* }
          estado=$(gh api "repos/$REPO/deployments/$dep_id/statuses?per_page=1" --jq '.[0].state' 2>/dev/null || echo "?")
          echo "main: $cabeza (hace ${edad}s) · última publicación: $dep_sha ($estado)"
          case "$estado" in waiting|queued|in_progress|pending) echo "Publicando, se espera."; exit 0;; esac
          if [ "$dep_sha" = "$cabeza" ] && [ "$estado" = "success" ]; then echo "Al día."; exit 0; fi
          # Se da margen a que GitHub publique solo (5 min) antes de reintentar, salvo que haya fallado
          if [ "$estado" != "failure" ] && [ "$estado" != "error" ] && [ "$edad" -lt 300 ]; then echo "Cambio reciente, se espera."; exit 0; fi
          echo "La web quedó atrasada o la publicación falló: se pide una publicación nueva."
          gh api -X POST "repos/$REPO/pages/builds" --jq '.status' || echo "::warning::No se pudo pedir la publicación."
