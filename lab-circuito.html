<div class="app">

      <div class="tipos" id="ver"></div>

<script>
MCLabPuerta('circuito');
var f=MCfmt, son=MCLabComun('circuito');
var C={I:'#3AB4F0',V:'#FFC800',P:'#FF9600',R:'#EEEAF7',lima:'#C6E000',rosa:'#FF5C8A'};
var S={tipo:'serie', n:3, V:12, R:[2,4,6], on:true, fun:[0,0,0]};
var VER={focos:1,medidas:1,corriente:1}, OCULTA=false, FIJO={}, ELIGE=null;
function n(){ return S.tipo==='mixto'?3:S.n; }

/* ===== Física: Req, corriente y voltaje de cada resistencia ===== */
function calc(){
  var N=n(), R=S.R.slice(0,N).map(function(r,k){ return S.fun[k]?Infinity:r; }), V=S.on?S.V:0, o={R:R,I:[],U:[],Req:0,It:0};
  function par(a,b){ if(a===Infinity) return b; if(b===Infinity) return a; return a*b/(a+b); }
  if(S.tipo==='serie'){ o.Req=R.reduce(function(s,r){ return s+r; },0); o.It=o.Req===Infinity?0:V/o.Req; R.forEach(function(r,k){ o.I[k]=o.It; o.U[k]=r===Infinity?(o.It?0:V*(S.fun.slice(0,N).filter(Boolean).length===1?1:0)):o.It*r; }); }
  else if(S.tipo==='paralelo'){ var g=R.reduce(function(s,r){ return s+(r===Infinity?0:1/r); },0); o.Req=g?1/g:Infinity; R.forEach(function(r,k){ o.U[k]=V; o.I[k]=r===Infinity?0:V/r; }); o.It=o.I.reduce(function(s,x){ return s+x; },0); }
  else { var Rp=par(R[1],R[2]); if(R[1]===Infinity&&R[2]===Infinity) Rp=Infinity; o.Rp=Rp; o.Req=R[0]+Rp; o.It=o.Req===Infinity?0:V/o.Req;
    var Vp=Rp===Infinity?0:o.It*Rp; o.I[0]=o.It; o.U[0]=R[0]===Infinity?0:o.It*R[0]; o.U[1]=o.U[2]=Vp; o.I[1]=R[1]===Infinity?0:Vp/R[1]; o.I[2]=R[2]===Infinity?0:Vp/R[2]; }
  o.P=o.I.map(function(i,k){ return i*o.U[k]; }); o.Pt=o.It*V; return o;
}
/* Req sin fundidos ni interruptor (lo que se pregunta en el examen) */
function reqIdeal(){ var R=S.R; if(S.tipo==='serie') return R.slice(0,S.n).reduce(function(s,r){ return s+r; },0);
  if(S.tipo==='paralelo') return 1/R.slice(0,S.n).reduce(function(s,r){ return s+1/r; },0); return R[0]+R[1]*R[2]/(R[1]+R[2]); }
function ohm(x){ return f(x)+' Ω'; } function amp(x){ return f(x)+' A'; } function vol(x){ return f(x)+' V'; } function wat(x){ return f(x)+' W'; }

/* ===== Controles ===== */
function pintarTipo(){ document.querySelectorAll('#tipo button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===S.tipo); });
  document.getElementById('cant').style.display=S.tipo==='mixto'||FIJO.solo?'none':'';
  document.querySelectorAll('#cant button').forEach(function(b){ b.classList.toggle('on',+b.dataset.n===S.n); });
  if(!FIJO.solo) document.getElementById('rowR3').style.display=n()<3?'none':''; }
document.querySelectorAll('#tipo button').forEach(function(b){ b.onclick=function(){ if(FIJO.reto) return; son('tic'); S.tipo=b.dataset.t; S.fun=[0,0,0]; pintarTipo(); cambio(); }; });
document.querySelectorAll('#cant button').forEach(function(b){ b.onclick=function(){ son('tic'); S.n=+b.dataset.n; S.fun=[0,0,0]; pintarTipo(); cambio(); }; });
var bVer=[['focos','Focos',C.P],['medidas','Corriente y voltaje',C.I],['corriente','Ver la corriente',C.lima]];
function pintarVer(){ document.getElementById('ver').innerHTML=bVer.map(function(b){ return '<button data-k="'+b[0]+'" class="'+(VER[b[0]]?'on':'')+'"><i style="background:'+b[2]+'"></i>'+b[1]+'</button>'; }).join('');
  document.querySelectorAll('#ver button').forEach(function(b){ b.onclick=function(){ VER[b.dataset.k]=!VER[b.dataset.k]; son('tic'); pintarVer(); dibujar(); }; }); }
var EJ=[['3 focos iguales','serie',3,12,[4,4,4]],['Serie 2 + 4 + 6','serie',3,24,[2,4,6]],['Paralelo 3 y 6','paralelo',2,12,[3,6,6]],['Paralelo 3 iguales','paralelo',3,12,[6,6,6]],['Mixto 4 + (6 ∥ 3)','mixto',3,12,[4,6,3]]];
document.getElementById('chips').innerHTML=EJ.map(function(e,i){ return '<button data-i="'+i+'">'+e[0]+'</button>'; }).join('');
document.querySelectorAll('#chips button').forEach(function(b){ b.onclick=function(){ var e=EJ[+b.dataset.i]; son('tic'); S.tipo=e[1]; S.n=e[2]; S.V=e[3]; S.R=e[4].slice(); S.fun=[0,0,0]; S.on=true; pintarTipo(); cambio(); }; });
var iV=document.getElementById('iV'), iR=[1,2,3].map(function(k){ return document.getElementById('iR'+k); });
iV.oninput=function(){ S.V=+iV.value; cambio(); };
iR.forEach(function(el,k){ el.oninput=function(){ S.R[k]=+el.value; cambio(); }; });
var bPow=document.getElementById('bPow'), bRe=document.getElementById('bRe');
bPow.onclick=function(){ interruptor(); };
bRe.onclick=function(){ son('tic'); S.fun=[0,0,0]; cambio(); };
function interruptor(){ if(FIJO.reto&&!FIJO.pow) return; S.on=!S.on; son(S.on?'abrir':'cerrar'); cambio(); }
function rango(i,v){ i.style.setProperty('--p',((v-i.min)/(i.max-i.min)*100)+'%'); }

function cambio(){ actualizar(); }
function actualizar(){
  var o=calc(), N=n();
  iV.value=S.V; rango(iV,S.V); document.getElementById('iVO').textContent=vol(S.V);
  iR.forEach(function(el,k){ el.value=S.R[k]; rango(el,S.R[k]); document.getElementById('iR'+(k+1)+'O').textContent=ohm(S.R[k]); });
  bPow.classList.toggle('off',!S.on); bPow.innerHTML='<svg class="i"><use href="#i-pow"/></svg><span>'+(S.on?'Apagar':'Encender')+'</span>';
  bRe.style.display=S.fun.some(Boolean)?'':'none';
  var nm=VER.focos?'Foco ':'R';
  var dd=[['Resistencia equivalente',ohm(reqIdeal()),C.R],['Corriente total',amp(o.It),C.I],['Voltaje de la pila',vol(S.V),C.V],['Potencia total',wat(o.Pt),C.P]];
  for(var k=0;k<N;k++) dd.push(['R'+(k+1)+' = '+ohm(S.R[k]),S.fun[k]?'Fundido <em>· no pasa corriente</em>':amp(o.I[k])+' <em>·</em> '+vol(o.U[k])+' <em>·</em> '+wat(o.P[k]),null,1]);
  document.getElementById('datos').innerHTML=dd.map(function(x){ return '<div class="dato'+(x[3]?' ancho':'')+'"><small>'+(x[2]?'<i style="background:'+x[2]+'"></i>':'')+x[0]+'</small><b>'+x[1]+'</b></div>'; }).join('');
  /* Cae en el examen */
  var cl=[], R=S.R, rq=reqIdeal(), I=S.V/rq;
  if(S.tipo==='serie'){ var lista=R.slice(0,N);
    cl.push('En serie las resistencias se suman: Req = '+lista.join(' + ')+' = '+ohm(rq)+'. Por todas pasa la misma corriente: I = V / Req = '+S.V+' / '+f(rq)+' = '+amp(I)+'.');
    cl.push('El voltaje se reparte: '+lista.map(function(r,k){ return 'V'+(k+1)+' = I·R'+(k+1)+' = '+vol(I*r); }).join(', ')+'. Suman '+vol(S.V)+'. La resistencia mayor se lleva más voltaje y su foco brilla más.');
    cl.push('Si un foco se funde, el circuito se abre y se apagan todos (como las luces navideñas antiguas).');
  } else if(S.tipo==='paralelo'){ var l2=R.slice(0,N);
    cl.push('En paralelo: 1 / Req = '+l2.map(function(r){ return '1/'+r; }).join(' + ')+' → Req = '+ohm(rq)+'. Req siempre es menor que la menor resistencia.'+(N===2?' Para dos: Req = R1·R2 / (R1 + R2) = '+(l2[0]*l2[1])+' / '+(l2[0]+l2[1])+'.':''));
    cl.push('Todas tienen el mismo voltaje ('+vol(S.V)+'). La corriente se reparte: '+l2.map(function(r,k){ return 'I'+(k+1)+' = '+S.V+' / '+r+' = '+amp(S.V/r); }).join(', ')+'; la total es la suma: '+amp(I)+'.');
    cl.push('La resistencia menor deja pasar más corriente y su foco brilla más. Si uno se funde, los demás siguen igual: así están conectadas las casas.');
  } else { var Rp=R[1]*R[2]/(R[1]+R[2]), Vp=I*Rp;
    cl.push('Primero el paralelo: R2 ∥ R3 = '+R[1]+'·'+R[2]+' / ('+R[1]+' + '+R[2]+') = '+ohm(Rp)+'. Luego en serie con R1: Req = '+R[0]+' + '+f(Rp)+' = '+ohm(rq)+'.');
    cl.push('I = V / Req = '+S.V+' / '+f(rq)+' = '+amp(I)+' (pasa toda por R1). V1 = '+vol(I*R[0])+' y el paralelo recibe '+vol(Vp)+': I2 = '+amp(Vp/R[1])+', I3 = '+amp(Vp/R[2])+'.');
    cl.push('Si se funde R2, toda la corriente del paralelo va por R3: R3 brilla más y R1 brilla menos.');
  }
  cl.push('Ley de Ohm: V = I·R. Potencia: P = V·I = I²·R = V² / R. La energía que gasta un foco es E = P·t.');
  document.getElementById('clave').innerHTML='<b><svg><use href="#i-rayo"/></svg>Cae en el examen</b>'+cl.map(function(c){ return '<p>'+c+'</p>'; }).join('');
  O=o; dibujar();
}

/* ===== Dibujo ===== */
var pl=document.getElementById('plano'), svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); pl.appendChild(svg);
svg.innerHTML='<g id="gFijo"></g>'; var W=0,H=0,SC=1, O=null, SEG=[], HIT=[], gPuntos=null, gFrente=null;
function tx(x,y,t,c,an,sz,w){ return '<text x="'+x+'" y="'+y+'" fill="'+c+'" text-anchor="'+(an||'middle')+'" style="font:'+(w||800)+' '+(sz||12)+'px Sora,sans-serif;paint-order:stroke;stroke:#0B0820;stroke-width:4px">'+t+'</text>'; }
function cable(pts,vivo){ var d=pts.map(function(p,i){ return (i?'L':'M')+p[0]+' '+p[1]; }).join('');
  return '<path d="'+d+'" fill="none" stroke="#2E2650" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+(vivo?'#7A6CB0':'#4A4170')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'; }
/* Resistencia (zigzag) o foco, centrado en (x,y); vertical u horizontal */
function elemento(k,x,y,vert){
  var fun=S.fun[k], p=O.P[k]||0, b=fun?0:1-Math.exp(-p/10), s='', h=VER.focos?20:28;
  /* hueco del cable */
  s+=vert?'<rect x="'+(x-9)+'" y="'+(y-h)+'" width="18" height="'+(2*h)+'" fill="#0B0820"/>':'<rect x="'+(x-h)+'" y="'+(y-9)+'" width="'+(2*h)+'" height="18" fill="#0B0820"/>';
  if(VER.focos){
    var r=17;
    if(b>.02) s+='<circle cx="'+x+'" cy="'+y+'" r="'+(r+8+b*30)+'" fill="url(#gBrillo)" opacity="'+(.25+.75*b).toFixed(2)+'"/>';
    s+=vert?'<path d="M'+x+' '+(y-h)+'V'+(y-r+2)+'M'+x+' '+(y+h)+'V'+(y+r-2)+'" stroke="#7A6CB0" stroke-width="3"/>':'<path d="M'+(x-h)+' '+y+'H'+(x-r+2)+'M'+(x+h)+' '+y+'H'+(x+r-2)+'" stroke="#7A6CB0" stroke-width="3"/>';
    var vidrio=fun?'#2A2346':'rgb('+Math.round(40+215*b)+','+Math.round(34+186*b)+','+Math.round(70+20*b)+')';
    s+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+vidrio+'" stroke="'+(fun?'#6F6690':b>.05?'#FFE48A':'#8A80B0')+'" stroke-width="2.5"/>';
    /* filamento */
    var rot=vert?'':' transform="rotate(90 '+x+' '+y+')"';
    if(fun) s+='<path d="M'+(x-6)+' '+(y+9)+'L'+(x-3)+' '+(y-1)+'M'+(x+6)+' '+(y+9)+'L'+(x+3)+' '+(y+2)+'" stroke="#8A80B0" stroke-width="2" fill="none"'+rot+'/><path d="M'+(x-9)+' '+(y-9)+'L'+(x+9)+' '+(y+9)+'M'+(x+9)+' '+(y-9)+'L'+(x-9)+' '+(y+9)+'" stroke="'+C.rosa+'" stroke-width="2.5" stroke-linecap="round"/>';
    else s+='<path d="M'+(x-6)+' '+(y+10)+'L'+(x-5)+' '+(y-2)+'Q'+(x-3)+' '+(y-8)+' '+(x-1)+' '+(y-2)+'Q'+(x+1)+' '+(y-8)+' '+(x+3)+' '+(y-2)+'Q'+(x+5)+' '+(y-8)+' '+(x+5)+' '+(y-2)+'L'+(x+6)+' '+(y+10)+'" stroke="'+(b>.05?'#FFFFFF':'#A99FC8')+'" stroke-width="2" fill="none"'+rot+'/>';
  } else {
    var z='', m=6, L=2*h-16, col=fun?'#6F6690':'rgb('+Math.round(200+55*b)+','+Math.round(190-90*b)+','+Math.round(220-180*b)+')';
    for(var i=0;i<=m;i++){ var t=-h+8+L*i/m, w=i===0||i===m?0:(i%2?9:-9); z+=(i?'L':'M')+(vert?(x+w)+' '+(y+t):(x+t)+' '+(y+w)); }
    var ex=vert?'M'+x+' '+(y-h)+'V'+(y-h+8)+'M'+x+' '+(y+h-8)+'V'+(y+h):'M'+(x-h)+' '+y+'H'+(x-h+8)+'M'+(x+h-8)+' '+y+'H'+(x+h);
    if(b>.05) s+='<path d="'+z+'" stroke="#FF9600" stroke-width="10" opacity="'+(.15+.4*b).toFixed(2)+'" fill="none" stroke-linejoin="round" style="filter:blur(4px)"/>';
    s+='<path d="'+ex+'" stroke="#7A6CB0" stroke-width="3"/><path d="'+z+'" stroke="'+col+'" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>';
    if(fun) s+='<path d="M'+(x-9)+' '+(y-9)+'L'+(x+9)+' '+(y+9)+'M'+(x+9)+' '+(y-9)+'L'+(x-9)+' '+(y+9)+'" stroke="'+C.rosa+'" stroke-width="3" stroke-linecap="round"/>';
  }
  if(ELIGE&&ELIGE.sel===k) s+='<circle cx="'+x+'" cy="'+y+'" r="27" fill="none" stroke="'+C.lima+'" stroke-width="3" stroke-dasharray="6 4"/>';
  HIT.push({k:k,x:x,y:y});
  return s;
}
/* etiquetas de cada resistencia: nombre y valor, y debajo I y V */
function etiqueta(k,x,y,an,arriba){
  var med=VER.medidas&&!OCULTA; if(arriba&&med) y-=S.fun[k]?16:31;
  var ch=W<520, s=tx(x,y,'R'+(k+1)+(ch?'=':' = ')+ohm(S.R[k]),C.R,an,ch?11.5:12.5);
  if(med){ if(S.fun[k]) s+=tx(x,y+16,'fundido',C.rosa,an,11.5,700);
    else { s+=tx(x,y+16,amp(O.I[k]),C.I,an,11.5); s+=tx(x,y+31,vol(O.U[k]),C.V,an,11.5); } }
  return s;
}
function dibujar(){
  var bx=pl.getBoundingClientRect(); W=bx.width; H=bx.height; if(!W||!O) return; svg.setAttribute('viewBox','0 0 '+W+' '+H);
  /* en pantallas grandes el circuito se agranda entero */
  SC=W>=640?Math.min(1.75,Math.max(1,Math.min(W/600,H/420))):1; W/=SC; H/=SC;
  HIT=[]; SEG=[];
  var chico=W<520, x0=chico?58:Math.max(96,W*.14), x1=W-(chico?74:Math.max(90,W*.14)), y0=chico?(VER.medidas?96:66):Math.max(80,H*.17), y1=H-(chico?58:Math.max(70,H*.15)), ym=(y0+y1)/2, ww=x1-x0, vivo=O.It>1e-9;

/* puntos de corriente: cada tramo con su propia rapidez (más corriente, más rápido) */
var FASE=[], tAnt=0;

      L+=l; } });

}
function cuadro(t){ var dt=Math.min(.05,(t-tAnt)/1000); tAnt=t; SEG.forEach(function(g,i){ FASE[i]=((FASE[i]||0)+rapidez(g.I)*dt)%2600; }); puntos(); requestAnimationFrame(cuadro); }
requestAnimationFrame(function(t){ tAnt=t; cuadro(t); });

  alEntrar:function(){ GUARDA={S:JSON.parse(JSON.stringify(S)),VER:JSON.parse(JSON.stringify(VER))}; },
